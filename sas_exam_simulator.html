q data=orders;\n    tables Qty;\nrun;","options":[],"answer":"5","accepted":["5"],"numeric":true,"explanation":"Các giá trị Qty không missing gồm 1, 2, 3, 4, 5, tức 5 dòng. Mặc định giá trị missing **không** nằm trong bảng mà chỉ hiện ở dòng \"Frequency Missing = 1\" bên dưới. Thêm option MISSING (`tables Qty / missing;`) thì missing thành một dòng riêng và được tính vào tỉ lệ phần trăm.","solution":"","solutionCode":"","courseSource":""},{"id":"set2-q52","set":"set2","number":52,"domain":"D4","topic":"ORDER=FREQ","format":"Predict Output","difficulty":"","type":"sa","stem":"Which Country is listed first?","code":"proc freq data=orders order=freq;\n    tables Country / nocum;\nrun;","options":[],"answer":"US","accepted":["US"],"numeric":false,"explanation":"ORDER=FREQ sắp theo tần số giảm dần: US 3 đơn, rồi DE và KR mỗi nước 2 đơn, NG 1 đơn. NOCUM ẩn các cột tích lũy.","solution":"","solutionCode":"","courseSource":""},{"id":"set2-q53","set":"set2","number":53,"domain":"D4","topic":"Two-way table options","format":"Concept","difficulty":"","type":"mc","stem":"What does each cell of the table contain?","code":"proc freq data=orders;\n    tables Country*Customer / norow nocol nopercent;\nrun;","options":["Frequency, Percent, Row Pct and Col Pct","Frequency only","Percent only","Row Pct only"],"answer":1,"accepted":[],"numeric":false,"explanation":"Bảng chéo mặc định có 4 con số mỗi ô. NOROW ẩn Row Pct, NOCOL ẩn Col Pct, NOPERCENT ẩn Percent, nên chỉ còn Frequency. NOCUM chỉ áp dụng cho bảng một chiều.","solution":"","solutionCode":"","courseSource":""},{"id":"set2-q54","set":"set2","number":54,"domain":"D4","topic":"PROC MEANS N and NMISS","format":"Predict Output","difficulty":"","type":"sa","stem":"What values of N and NMISS are shown?","code":"proc means data=orders n nmiss;\n    var Qty;\nrun;","options":[],"answer":"7 / 1","accepted":["7/1"],"numeric":false,"explanation":"N đếm các giá trị **không missing** (7), NMISS đếm các giá trị missing (1). Thống kê mặc định của PROC MEANS là N, MEAN, STD, MIN, MAX; khi liệt kê thống kê trên câu lệnh PROC thì chỉ những thống kê đó được hiển thị.","solution":"","solutionCode":"","courseSource":""},{"id":"set2-q55","set":"set2","number":55,"domain":"D4","topic":"PROC MEANS with CLASS","format":"Predict Output","difficulty":"","type":"sa","stem":"What mean Price is shown for **KR**?","code":"proc means data=orders mean maxdec=2;\n    class Country;\n    var Price;\nrun;","options":[],"answer":"71.00","accepted":["71.00"],"numeric":true,"explanation":"KR có hai giá 120 và 22: (120 + 22) / 2 = 71. MAXDEC=2 hiển thị 2 chữ số thập phân, nên ra 71.00. CLASS cho một dòng thống kê mỗi giá trị Country mà không cần sort trước.","solution":"","solutionCode":"","courseSource":""},{"id":"set2-q56","set":"set2","number":56,"domain":"D4","topic":"OUTPUT table columns","format":"Concept","difficulty":"","type":"mc","stem":"Besides Country and AvgPrice, which columns does SAS add automatically to `ctry_stats`?","code":"proc means data=orders noprint;\n    class Country;\n    var Price;\n    output out=ctry_stats mean=AvgPrice;\nrun;","options":["_N_ and _ERROR_","_NAME_ and COL1","_TYPE_ and _FREQ_","None"],"answer":2,"accepted":[],"numeric":false,"explanation":"`_TYPE_` cho biết tổ hợp CLASS của dòng: 0 là dòng tổng chung, 1 là dòng theo Country. `_FREQ_` là số dòng đầu vào của nhóm. Bảng có 5 dòng: 1 dòng tổng chung và 4 dòng cho các nước. Dùng `ways 1` hoặc option NWAY để bỏ dòng tổng chung. B là các cột của PROC TRANSPOSE.","solution":"","solutionCode":"","courseSource":""},{"id":"set2-q57","set":"set2","number":57,"domain":"D4","topic":"Character format with OTHER","format":"Predict Output","difficulty":"","type":"sa","stem":"What frequency is shown for **Other**?","code":"proc format;\n    value $ctry 'US'='United States'\n                'KR'='Korea'\n                other='Other';\nrun;\n\nproc freq data=orders;\n    tables Country;\n    format Country $ctry.;\nrun;","options":[],"answer":"3","accepted":["3"],"numeric":true,"explanation":"OTHER gom mọi giá trị không khớp với các mục khác: DE (2) và NG (1), tổng 3. Format dùng để **nhóm** giá trị ngay trong báo cáo mà không cần tạo cột mới. Format ký tự bắt đầu bằng `$`; khi dùng thì phải có dấu chấm (`$ctry.`).","solution":"","solutionCode":"","courseSource":""},{"id":"set2-q58","set":"set2","number":58,"domain":"D4","topic":"PROC UNIVARIATE median","format":"Predict Output","difficulty":"","type":"sa","stem":"What median Price is reported?","code":"proc univariate data=orders;\n    var Price;\nrun;","options":[],"answer":"31","accepted":["31"],"numeric":true,"explanation":"Giá sau khi sắp xếp: 8, 15.5, 15.5, 22, 40, 40, 99, 120. Có 8 giá trị, một số chẵn, nên median là trung bình của giá trị thứ 4 và thứ 5: (22 + 40) / 2 = 31. PROC UNIVARIATE còn in các bảng Moments, Quantiles và Extreme Observations.","solution":"","solutionCode":"","courseSource":""},{"id":"set2-q59","set":"set2","number":59,"domain":"D4","topic":"Several ODS destinations at once","format":"Concept","difficulty":"","type":"mc","stem":"What is the result?","code":"ods pdf file=\"&outpath/orders.pdf\" style=journal;\nods rtf file=\"&outpath/orders.rtf\";\n\nproc print data=orders;\nrun;\n\nods _all_ close;","options":["Both orders.pdf (Journal style) and orders.rtf contain the report, and `ODS _ALL_ CLOSE` closes every open destination.","Only the PDF is created.","An ERROR occurs because only one destination can be open at a time.","The RTF file replaces the PDF file."],"answer":0,"accepted":[],"numeric":false,"explanation":"Nhiều destination có thể mở cùng lúc, và mỗi báo cáo được gửi tới tất cả các destination đang mở. `STYLE=` chỉ áp dụng cho destination có option đó (ở đây là PDF). `ODS _ALL_ CLOSE` đóng mọi destination; cũng có thể đóng từng cái bằng `ods pdf close;` và `ods rtf close;`.","solution":"","solutionCode":"","courseSource":""},{"id":"set2-q60","set":"set2","number":60,"domain":"D4","topic":"PROC EXPORT tab-delimited","format":"Complete the Code","difficulty":"","type":"sa","stem":"Complete the code to write `orders` to a tab-delimited file, overwriting it if it exists:","code":"proc export data=orders outfile=\"&outpath/orders.txt\"\n            dbms=______ ______;\nrun;","options":[],"answer":"tab / replace","accepted":["tab/replace","tab replace","tab,replace"],"numeric":false,"explanation":"`DBMS=TAB` tạo file phân cách bằng tab; `REPLACE` ghi đè file nếu đã tồn tại (không có REPLACE thì export bị hủy khi file đã có). PROC EXPORT chỉ cần RUN để kết thúc, không cần QUIT.","solution":"","solutionCode":"","courseSource":""},{"id":"cr1-1.1-q1","set":"crreview","number":1,"domain":"D3","topic":"Program output (log)","format":"Course quiz","difficulty":"","type":"mc","stem":"A SAS program always creates which of the following?","code":"","options":["log","output","results","all of the above"],"answer":0,"accepted":[],"numeric":false,"explanation":"Mọi chương trình SAS khi chạy đều tạo log (ghi NOTE/WARNING/ERROR). Output/results chỉ có khi step tạo báo cáo hoặc bảng, nên \"all of the above\" sai.","solution":"","solutionCode":"","courseSource":"raw/CR_01_L1_P1_review.md – Review Quiz: Essentials Q1","answerSource":"derived","confidence":"high"},{"id":"cr1-1.1-q2","set":"crreview","number":2,"domain":"D3","topic":"SAS syntax rules","format":"Course quiz","difficulty":"","type":"mc","stem":"Which of the following is a SAS syntax requirement?","code":"","options":["Begin each statement in column one.","Put only one statement on each line.","Separate each step with a line space.","End each statement with a semicolon."],"answer":3,"accepted":[],"numeric":false,"explanation":"SAS là free-format: không cần bắt đầu ở cột 1, có thể nhiều statement trên một dòng, dòng trống chỉ để dễ đọc. Yêu cầu bắt buộc duy nhất ở đây là mỗi statement kết thúc bằng dấu chấm phẩy.","solution":"","solutionCode":"","courseSource":"raw/CR_01_L1_P1_review.md – Review Quiz: Essentials Q2","answerSource":"derived","confidence":"high"},{"id":"cr1-1.1-q3","set":"crreview","number":3,"domain":"D1","topic":"Program structure (steps)","format":"Course quiz","difficulty":"","type":"mc","stem":"How many steps are in this program?","code":"libname orion \"c:/mydata\";\n\ndata work.sales;\n    set orion.employee;\n    where Job_Title like \"%Sales%\";\n    Bonus=Salary*.02;\n    format Bonus euro8.;\nrun;\n\ntitle \"Sales Listing\";\n\nproc print data=work.sales;\nrun;","options":["one","two","three","four"],"answer":1,"accepted":[],"numeric":false,"explanation":"Chỉ có 2 step: DATA step và PROC PRINT step. LIBNAME và TITLE là global statement, nằm ngoài step nên không được tính.","solution":"","solutionCode":"","courseSource":"raw/CR_01_L1_P1_review.md – Review Quiz: Essentials Q3","answerSource":"derived","confidence":"high"},{"id":"cr1-1.1-q4","set":"crreview","number":4,"domain":"D1","topic":"Program structure (statements)","format":"Course quiz","difficulty":"","type":"mc","stem":"How many statements does the first step contain? (same program as the previous question)","code":"libname orion \"c:/mydata\";\n\ndata work.sales;\n    set orion.employee;\n    where Job_Title like \"%Sales%\";\n    Bonus=Salary*.02;\n    format Bonus euro8.;\nrun;\n\ntitle \"Sales Listing\";\n\nproc print data=work.sales;\nrun;","options":["1","2","6","10"],"answer":2,"accepted":[],"numeric":false,"explanation":"Step đầu tiên là DATA step gồm: DATA, SET, WHERE, assignment Bonus=, FORMAT và RUN = 6 statement. LIBNAME đứng trước và là global statement, không thuộc step.","solution":"","solutionCode":"","courseSource":"raw/CR_01_L1_P1_review.md – Review Quiz: Essentials Q4","answerSource":"derived","confidence":"high"},{"id":"cr1-1.1-q5","set":"crreview","number":5,"domain":"D3","topic":"Step boundaries","format":"Course quiz","difficulty":"","type":"mc","stem":"Which of the following statements are considered step boundaries (the end of one step and the beginning of another)?","code":"","options":["RUN, QUIT, and END","RUN, EXIT, and QUIT","RUN, END, DATA, and PROC","RUN, QUIT, DATA, and PROC"],"answer":3,"accepted":[],"numeric":false,"explanation":"RUN và QUIT kết thúc một step; DATA và PROC bắt đầu step mới nên cũng ngầm kết thúc step trước. END chỉ đóng DO group/SELECT, EXIT không phải step boundary.","solution":"","solutionCode":"","courseSource":"raw/CR_01_L1_P1_review.md – Review Quiz: Essentials Q5","answerSource":"derived","confidence":"high"},{"id":"cr1-1.1-q6","set":"crreview","number":6,"domain":"D3","topic":"Missing RUN statement","format":"Course quiz","difficulty":"","type":"mc","stem":"True/False: \"If this program is submitted, the DATA step will not execute because it does not conclude with a RUN statement.\"","code":"libname orion \"c:/mydata\";\n\ndata work.sales;\n    set orion.employee;\n    where Job_Title like \"%Sales%\";\n    Bonus=Salary*.02;\n    format Bonus euro8.;\n\ntitle \"Sales Listing\";\nproc print data=work.sales;\nrun;","options":["True","False","It depends on the interface."],"answer":1,"accepted":[],"numeric":false,"explanation":"Sai (False): statement PROC là step boundary nên DATA step vẫn được kết thúc và thực thi khi gặp PROC PRINT. Thiếu RUN chỉ là thói quen xấu; chỉ step cuối cùng thiếu RUN mới có thể không chạy.","solution":"","solutionCode":"","courseSource":"raw/CR_01_L1_P1_review.md – Review Quiz: Essentials Q6","answerSource":"derived","confidence":"high"},{"id":"cr1-1.1-q7","set":"crreview","number":7,"domain":"D3","topic":"Syntax error handling","format":"Course quiz","difficulty":"","type":"mc","stem":"What generally happens when SAS detects a syntax error?","code":"","options":["SAS stops processing the entire program.","SAS continues to process the step, and the SAS log displays messages about the error.","SAS stops processing the step in which the error occurred, and the SAS log displays messages about the error.","SAS stops processing the step in which the error occurred, and the Results tab displays messages about the error."],"answer":2,"accepted":[],"numeric":false,"explanation":"Khi gặp syntax error, SAS dừng step chứa lỗi (các step khác vẫn chạy) và ghi thông báo ERROR vào log, không phải vào Results.","solution":"","solutionCode":"","courseSource":"raw/CR_01_L1_P1_review.md – Review Quiz: Essentials Q7","answerSource":"derived","confidence":"high"},{"id":"cr1-1.1-q8","set":"crreview","number":8,"domain":"D3","topic":"Comments","format":"Course quiz","difficulty":"","type":"mc","stem":"Does this comment contain syntax errors?","code":"*******************************\nReport created for budget\npresentation; revised October 15.\n*******************************;\nproc print data=sales;\nrun;","options":["No. The comment is correctly specified.","Yes. Every comment line must end with a semicolon.","Yes. The comment is on more than one line.","Yes. There is a semicolon in the middle of the comment."],"answer":3,"accepted":[],"numeric":false,"explanation":"Comment dạng `*...;` kết thúc ở dấu chấm phẩy đầu tiên, tức sau \"presentation\". Phần \"revised October 15. ****;\" bị coi là statement và gây lỗi. Comment `*` được phép trải nhiều dòng, nên c sai.","solution":"","solutionCode":"","courseSource":"raw/CR_01_L1_P1_review.md – Review Quiz: Essentials Q8","answerSource":"derived","confidence":"high"},{"id":"cr1-1.1-q9","set":"crreview","number":9,"domain":"D3","topic":"Case sensitivity in WHERE","format":"Course quiz","difficulty":"","type":"mc","stem":"Based on the program and data shown below, which of the following is true?\n\nTable cities:\n```text\nState  City\nCA     Sacramento\nOR     Eugene\nUT     Provo\nCA     Pasadena\nNV     Reno\nCA     Palo Alto\n```","code":"proc print data=cities;\n    where STATE='ca';\nrun;","options":["A syntax error is generated because STATE is uppercase in the program.","A syntax error is generated because single quotation marks are used in the WHERE statement.","There are no syntax errors, and three rows are printed.","There are no syntax errors, but no rows are printed."],"answer":3,"accepted":[],"numeric":false,"explanation":"Tên cột không phân biệt hoa thường và nháy đơn hợp lệ, nên không có lỗi cú pháp. Nhưng giá trị dữ liệu phân biệt hoa thường: \"ca\" không khớp \"CA\" nên không in dòng nào.","solution":"","solutionCode":"","courseSource":"raw/CR_01_L1_P1_review.md – Review Quiz: Essentials Q9","answerSource":"derived","confidence":"high"},{"id":"cr1-1.1-q10","set":"crreview","number":10,"domain":"D1","topic":"Global statements","format":"Course quiz","difficulty":"","type":"mc","stem":"Which statement is true regarding global SAS statements?","code":"","options":["A SAS global statement can be used anywhere in a SAS program.","A RUN statement must follow each global statement.","A QUIT statement must follow each global statement.","A SAS program must include at least one global statement."],"answer":0,"accepted":[],"numeric":false,"explanation":"Global statement (TITLE, OPTIONS, LIBNAME...) có thể đặt ở bất kỳ đâu và có hiệu lực ngay, không cần RUN/QUIT. Chương trình cũng không bắt buộc phải có global statement.","solution":"","solutionCode":"","courseSource":"raw/CR_01_L1_P1_review.md – Review Quiz: Essentials Q10","answerSource":"derived","confidence":"high"},{"id":"cr1-1.2-q1","set":"crreview","number":11,"domain":"D1","topic":"LIBNAME engines","format":"Course quiz","difficulty":"","type":"mc","stem":"Which data source could be read using a library?","code":"","options":["Microsoft Excel Workbook","tab-delimited file","comma-delimited file","all of the above"],"answer":0,"accepted":[],"numeric":false,"explanation":"Workbook Excel là dữ liệu có cấu trúc, đọc trực tiếp bằng LIBNAME với engine XLSX. File tab-/comma-delimited là dữ liệu không cấu trúc, phải dùng PROC IMPORT (hoặc DATA step), nên \"all of the above\" sai.","solution":"","solutionCode":"","courseSource":"raw/CR_01_L1_P1_review.md – Review Quiz: Accessing Data Q1","answerSource":"derived","confidence":"high"},{"id":"cr1-1. ourse quiz","difficulty":"","type":"mc","stem":"When you specify an engine for a library, what are you specifying?","code":"","options":["the file format for files that are stored in the library","the name of a folder or directory where files are stored","credentials to access protected files","instructions for creating temporary SAS files"],"answer":0,"accepted":[],"numeric":false,"explanation":"Engine cho SAS biết định dạng file trong thư viện (SAS, XLSX, Oracle...) để đọc/ghi. Thư mục là phần path, không phải engine.","solution":"","solutionCode":"","courseSource":"raw/CR_01_L1_P1_review.md – Review Quiz: Accessing Data Q7","answerSource":"derived","confidence":"high"},{"id":"cr1-1.2-q8","set":"crreview","number":18,"domain":"D1","topic":"PROC IMPORT DBMS=","format":"Course quiz","difficulty":"","type":"mc","stem":"Which option must be added to the PROC IMPORT statement to read a tab-delimited file?","code":"proc import datafile=\"d:/mydata/tourism.tab\"\n            out=tourism replace;\nrun;","options":["TAB","DBMS=TAB","DLM=TAB","DLM=\" \""],"answer":1,"accepted":[],"numeric":false,"explanation":"Phần mở rộng .tab không được PROC IMPORT nhận diện, nên phải chỉ DBMS=TAB để khai báo loại file. DLM= không phải option của PROC IMPORT statement (DELIMITER= là statement riêng dùng với DBMS=DLM).","solution":"","solutionCode":"","courseSource":"raw/CR_01_L1_P1_review.md – Review Quiz: Accessing Data Q8","answerSource":"derived","confidence":"high"},{"id":"cr1-1.2-q9","set":"crreview","number":19,"domain":"D1","topic":"PROC CONTENTS","format":"Course quiz","difficulty":"","type":"mc","stem":"Which statement about the CONTENTS procedure is false?","code":"","options":["PROC CONTENTS can be used to list all tables in a library.","The PROC CONTENTS report includes the engine used to read the data.","The PROC CONTENTS report displays all column attributes.","PROC CONTENTS lists a sample of the first five rows from the data."],"answer":3,"accepted":[],"numeric":false,"explanation":"PROC CONTENTS chỉ hiển thị descriptor portion (metadata: engine, số dòng, thuộc tính cột), không in dữ liệu. Muốn xem dòng dữ liệu phải dùng PROC PRINT.","solution":"","solutionCode":"","courseSource":"raw/CR_01_L1_P1_review.md – Review Quiz: Accessing Data Q9","answerSource":"derived","confidence":"high"},{"id":"cr1-1.2-q10","set":"crreview","number":20,"domain":"D1","topic":"PROC CONTENTS _ALL_ NODS","format":"Course quiz","difficulty":"","type":"mc","stem":"Which of the following statements lists the contents of the orion library in a report and suppresses the full detailed report for each individual table?","code":"","options":["proc contents data=orion;","proc contents data=orion._all_;","proc contents data=orion._all_ nods;","proc contents data=orion / _all_ nods;"],"answer":2,"accepted":[],"numeric":false,"explanation":"Dùng libref._ALL_ để liệt kê mọi bảng trong thư viện, thêm NODS để bỏ descriptor chi tiết của từng bảng. NODS là option của PROC CONTENTS, không đặt sau dấu \"/\".","solution":"","solutionCode":"","courseSource":"raw/CR_01_L1_P1_review.md – Review Quiz: Accessing Data Q10","answerSource":"derived","confidence":"high"},{"id":"cr1-1.3-q1","set":"crreview","number":21,"domain":"D4","topic":"PROC PRINT defaults","format":"Course quiz","difficulty":"","type":"mc","stem":"What does a PROC PRINT report display by default?","code":"","options":["PROC PRINT does not create a default report; you must specify rows and columns.","All rows and columns; a row-number column can be requested.","Columns in this order: row numbers, all character columns, all numeric columns.","All rows and columns, a row-number column on the far left, and columns in the order they occur in the table."],"answer":3,"accepted":[],"numeric":false,"explanation":"Mặc định PROC PRINT in tất cả dòng và cột, cột Obs ở bên trái và các cột theo thứ tự trong bảng. Cột Obs có sẵn mặc định (tắt bằng NOOBS), không cần yêu cầu thêm.","solution":"","solutionCode":"","courseSource":"raw/CR_01_L1_P1_review.md – Review Quiz: Exploring Data Q1","answerSource":"derived","confidence":"high"},{"id":"cr1-1.3-q2","set":"crreview","number":22,"domain":"D4","topic":"PROC FREQ","format":"Course quiz","difficulty":"","type":"mc","stem":"Which procedure produces a report that lists the number of rows for each distinct value in a selected column?","code":"","options":["CONTENTS","MEANS","FREQ","PRINT"],"answer":2,"accepted":[],"numeric":false,"explanation":"PROC FREQ đếm số dòng (frequency) cho từng giá trị riêng biệt của cột. MEANS tính thống kê số, CONTENTS cho metadata, PRINT liệt kê dữ liệu.","solution":"","solutionCode":"","courseSource":"raw/CR_01_L1_P1_review.md – Review Quiz: Exploring Data Q2","answerSource":"derived","confidence":"high"},{"id":"cr1-1.3-q3","set":"crreview","number":23,"domain":"D4","topic":"Formats (DDMMYY, DOLLAR)","format":"Course quiz","difficulty":"","type":"mc","stem":"Which FORMAT statement produces the following results? (Order_Date e.g. 29/08/2018, 17/08/2018, 24/07/2018; Cost_Price e.g. $1,266.00, $1,449.75; Quantity 5, 5, 2; Retail_Price e.g. $2,596.50, $2,840.50)","code":"","options":["format Order_Date ddmmyyyy. Cost_Price Retail_Price dollar10.2;","format Order_Date ddmmyy10. Cost_Price Retail_Price dollar10.2;","format Order_Date date10. Cost_Price Retail_Price $10.2;","format Order_Date dmy10. Cost_Price Retail_Price dollar10.2;"],"answer":1,"accepted":[],"numeric":false,"explanation":"DDMMYY10. hiển thị ngày dạng dd/mm/yyyy và DOLLAR10.2 thêm dấu $, dấu phẩy, 2 số lẻ. ddmmyyyy. và dmy10. không phải format hợp lệ; $10.2 là format character, DATE10. cho dạng 29AUG2018.","solution":"","solutionCode":"","courseSource":"raw/CR_01_L1_P1_review.md – Review Quiz: Exploring Data Q3","answerSource":"derived","confidence":"high"},{"id":"cr1-1.3-q4","set":"crreview","number":24,"domain":"D4","topic":"PROC MEANS VAR","format":"Course quiz","difficulty":"","type":"mc","stem":"Which statement in PROC MEANS specifies the numeric columns to summarize?","code":"","options":["COL","VAR","MEANS","TABLES"],"answer":1,"accepted":[],"numeric":false,"explanation":"Statement VAR chọn các cột numeric để PROC MEANS tính thống kê. TABLES thuộc PROC FREQ; COL và MEANS không phải statement của PROC MEANS.","solution":"","solutionCode":"","courseSource":"raw/CR_01_L1_P1_review.md – Review Quiz: Exploring Data Q4","answerSource":"derived","confidence":"high"},{"id":"cr1-1.3-q5","set":"crreview","number":25,"domain":"D1","topic":"Date constants in WHERE","format":"Course quiz","difficulty":"","type":"mc","stem":"Which statement selects rows with BirthDate on or after January 1, 1980?","code":"","options":["where BirthDate ge 1/1/1980;","where BirthDate >= '1/1/1980'd;","where Birthdate >= \"01JAN1980\";","where BirthDate ge \"01JAN1980\"d;"],"answer":3,"accepted":[],"numeric":false,"explanation":"Hằng số ngày phải viết dạng \"ddMONyyyy\"d (ví dụ \"01JAN1980\"d); GE tương đương >=. 1/1/1980 là phép chia, \"1/1/1980\"d sai định dạng, còn thiếu chữ d thì chỉ là chuỗi ký tự.","solution":"","solutionCode":"","courseSource":"raw/CR_01_L1_P1_review.md – Review Quiz: Exploring Data Q5","answerSource":"derived","confidence":"high"},{"id":"cr1-1.3-q6","set":"crreview","number":26,"domain":"D1","topic":"WHERE LIKE wildcards","format":"Course quiz","difficulty":"","type":"mc","stem":"Which statement selects ProductID values with CX as the second and third letters in the string?","code":"","options":["where ProductID like \"_CX%\";","where ProductID like \"%CX%\"","where ProductID like \"*CX*\";","where ProductID like \"_CX*\";"],"answer":0,"accepted":[],"numeric":false,"explanation":"Trong LIKE, \"_\" thay đúng một ký tự và \"%\" thay chuỗi bất kỳ, nên \"_CX%\" bắt CX ở vị trí 2-3. \"%CX%\" khớp CX ở bất kỳ đâu; dấu * không phải wildcard của LIKE.","solution":"","solutionCode":"","courseSource":"raw/CR_01_L1_P1_review.md – Review Quiz: Exploring Data Q6","answerSource":"derived","confidence":"high"},{"id":"cr1-1.3-q7","set":"crreview","number":27,"domain":"D1","topic":"WHERE with OR / IN","format":"Course quiz","difficulty":"","type":"mc","stem":"Which statement selects rows where Country is either Argentina or Brazil?","code":"","options":["where Country=\"Argentina\" or Country=\"Brazil\";","where Country in(\"Argentina\", \"Brazil\");","where Country in(\"Argentina\" \"Brazil\");","all of the above"],"answer":3,"accepted":[],"numeric":false,"explanation":"Cả ba đều hợp lệ: dùng OR, hoặc toán tử IN với danh sách giá trị cách nhau bằng dấu phẩy hoặc khoảng trắng.","solution":"","solutionCode":"","courseSource":"raw/CR_01_L1_P1_review.md – Review Quiz: Exploring Data Q7","answerSource":"derived","confidence":"high"},{"id":"cr1-1.3-q8","set":"crreview","number":28,"domain":"D2","topic":"Macro variables in quotes","format":"Course quiz","difficulty":"","type":"mc","stem":"True or False: This PROC PRINT step creates a report that lists only those rows where Location is Maui.","code":"%let island=Maui;\n\nproc print data=tourism;\n    where Location='&island';\nrun;","options":["True","False"],"answer":1,"accepted":[],"numeric":false,"explanation":"Sai: macro variable không được resolve trong nháy đơn, nên SAS so sánh Location với chuỗi \"&island\" và không ra dòng nào. Phải dùng nháy kép \"&island\".","solution":"","solutionCode":"","courseSource":"raw/CR_01_L1_P1_review.md – Review Quiz: Exploring Data Q8","answerSource":"derived","confidence":"high"},{"id":"cr1-1.3-q9","set":"crreview","number":29,"domain":"D2","topic":"PROC SORT OUT=","format":"Course quiz","difficulty":"","type":"mc","stem":"Which step creates a new, temporary sorted table named calc?","code":"","options":["proc sort data=work.calc out=finance.dividend; run;","proc sort dividend out=calc; by account; run;","proc sort data=finance.dividend out=work.calc; by account; run;","proc sort from finance.dividend to calc; by account; run;"],"answer":2,"accepted":[],"numeric":false,"explanation":"PROC SORT cần DATA= (bảng nguồn), OUT= (bảng kết quả) và BY statement. Đáp án c ghi ra work.calc (tạm thời). a thiếu BY và ghi sai chiều; b thiếu DATA=; d dùng cú pháp không tồn tại.","solution":"","solutionCode":"","courseSource":"raw/CR_01_L1_P1_review.md – Review Quiz: Exploring Data Q9","answerSource":"derived","confidence":"high"},{"id":"cr1-1.3-q10","set":"crreview","number":30,"domain":"D2","topic":"NODUPKEY / DUPOUT=","format":"Course quiz","difficulty":"","type":"mc","stem":"Given the following program and data, how many rows will be in the quizdups table?\n\nTable quiz:\n```text\nName       Score\nScott      8\nScott      8\nCharlotte  10\nTrevor     7\nTrevor     6\nTrevor     6\nDrew       9\n```","code":"proc sort data=quiz nodupkey dupout=quizdups;\n    by Name;\nrun;","options":["zero","one","three","four"],"answer":2,"accepted":[],"numeric":false,"explanation":"NODUPKEY giữ dòng đầu tiên cho mỗi giá trị BY (Name) và chuyển các dòng trùng key vào DUPOUT=. Scott có 1 dòng trùng, Trevor có 2 dòng trùng → quizdups có 3 dòng (trùng key, không cần trùng toàn dòng).","solution":"","solutionCode":"","courseSource":"raw/CR_01_L1_P1_review.md – Review Quiz: Exploring Data Q10","answerSource":"derived","confidence":"high"},{"id":"cr1-1.4-q1","set":"crreview","number":31,"domain":"D3","topic":"DATA step compile vs execution","format":"Course quiz","difficulty":"","type":"mc","stem":"In which phase does the DATA step read rows from the input table?","code":"","options":["compilation","execution"],"answer":1,"accepted":[],"numeric":false,"explanation":"Trong compilation, SAS chỉ kiểm tra cú pháp và tạo PDV/descriptor; việc đọc từng dòng dữ liệu diễn ra trong execution phase.","solution":"","solutionCode":"","courseSource":"raw/CR_01_L1_P1_review.md – Review Quiz: Preparing Data Q1","answerSource":"derived","confidence":"high"},{"id":"cr1-1.4-q2","set":"crreview","number":32,"domain":"D1","topic":"Temporary vs permanent tables","format":"Course quiz","difficulty":"","type":"mc","stem":"Which statement about the following program is true?","code":"data australia;\n    set orion.sales;\n    where Country='AU';\nrun;","options":["The program does not execute because of syntax errors.","The program reads a temporary table and creates a permanent table.","The program reads a permanent table and creates a temporary table"],"answer":2,"accepted":[],"numeric":false,"explanation":"SET đọc orion.sales (thư viện orion → permanent), DATA tạo australia không có libref nên lưu vào Work (temporary). Cú pháp không có lỗi.","solution":"","solutionCode":"","courseSource":"raw/CR_01_L1_P1_review.md – Review Quiz: Preparing Data Q2","answerSource":"derived","confidence":"high"},{"id":"cr1-1.4-q3","set":"crreview","number":33,"domain":"D2","topic":"MEAN function and missing values","format":"Course quiz","difficulty":"","type":"mc","stem":"In the assignment statement below, what is the value of AvgQ for the row that is shown? (row: Q1=3, Q2=. , Q3=4, Q4=5)","code":"AvgQ=mean(Q1, Q2, Q3, Q4);","options":["3","4",". (missing value)","The statement generates a syntax error."],"answer":1,"accepted":[],"numeric":false,"explanation":"Hàm MEAN bỏ qua missing value: (3+4+5)/3 = 4. Nếu dùng toán tử (Q1+Q2+Q3+Q4)/4 thì kết quả mới là missing.","solution":"","solutionCode":"","courseSource":"raw/CR_01_L1_P1_review.md – Review Quiz: Preparing Data Q3","answerSource":"derived","confidence":"high"},{"id":"cr1-1.4-q4","set":"crreview","number":34,"domain":"D2","topic":"SUBSTR function","format":"Course quiz","difficulty":"","type":"mc","stem":"Which expression extracts the first five positions from PostalCode? (values 95602-6485, 84604-9134, 07090-5839, 91001-6733, 27513-4402)","code":"","options":["PostalCode5=substr(PostalCode, 5);","PostalCode5=substr(PostalCode, 1, '-');","PostalCode5=substr(PostalCode,1-5);","PostalCode5=substr(PostalCode, 1, 5);"],"answer":3,"accepted":[],"numeric":false,"explanation":"SUBSTR(string, start, length): bắt đầu ở vị trí 1, lấy 5 ký tự. Phương án a lấy từ vị trí 5 đến hết; 1-5 = -4 là một số; tham số thứ ba phải là số chứ không phải ký tự \"-\".","solution":"","solutionCode":"","courseSource":"raw/CR_01_L1_P1_review.md – Review Quiz: Preparing Data Q4","answerSource":"derived","confidence":"high"},{"id":"cr1-1.4-q5","set":"crreview","number":35,"domain":"D2","topic":"YRDIF and DROP","format":"Course quiz","difficulty":"","type":"mc","stem":"Which statement about the following program is true?","code":"data customer_age;\n    set orion.customers;\n    drop BirthDate;\n    Age=yrdif(BirthDate, today(),\"AGE\");\nrun;","options":["Age is calculated as a precise number of years (including decimal values).","Age is calculated and rounded to the nearest whole number.","Age is not calculated because the DROP statement is before the assignment statement.","Age is not calculated because the TODAY function does not include any arguments."],"answer":0,"accepted":[],"numeric":false,"explanation":"DROP là compile-time statement, chỉ loại cột khỏi bảng output nên BirthDate vẫn dùng được trong tính toán. YRDIF trả về số năm có phần thập phân (không làm tròn); TODAY() không cần đối số.","solution":"","solutionCode":"","courseSource":"raw/CR_01_L1_P1_review.md – Review Quiz: Preparing Data Q5","answerSource":"derived","confidence":"high"},{"id":"cr1-1.4-q6","set":"crreview","number":36,"domain":"D2","topic":"Setting variable length","format":"Course quiz","difficulty":"","type":"mc","stem":"Which of the following is a way that the length of a new variable can be set in the DATA step?","code":"","options":["by the length of the variable the first time it is referenced in the DATA step","in an assignment statement","using a LENGTH statement","all of the above"],"answer":3,"accepted":[],"numeric":false,"explanation":"Length của biến mới được xác định ở lần đầu tiên SAS gặp biến khi compile: có thể qua LENGTH statement, hoặc qua assignment statement đầu tiên (length theo giá trị gán). Cả ba cách đều đúng.","solution":"","solutionCode":"","courseSource":"raw/CR_01_L1_P1_review.md – Review Quiz: Preparing Data Q6","answerSource":"derived","confidence":"high"},{"id":"cr1-1.4-q7","set":"crreview","number":37,"domain":"D2","topic":"LENGTH statement placement","format":"Course quiz","difficulty":"","type":"mc","stem":"What is the length of the variable Type that is created in the DATA step below?","code":"/* --- Bắt đầu: Dữ liệu mẫu tự động tạo --- */\noptions dlcreatedir;\nlibname cert \"%sysfunc(pathname(work))/cert\";\n\ndata cert.records;\n    infile datalines dlm=\"|\" dsd;\n    length Code $ 1 Amount 8;\n    input Code $ Amount;\n    datalines;\n1|150000\n2|98000\n1|210000\n;\nrun;\n/* --- Kết thúc: Dữ liệu mẫu --- */\n\ndata work.newloan;\n    set cert.records;\n    if code='1' then Type='Fixed';\n    else Type='Variable';\n    length type $ 10;\nrun;","options":["5","8","10","It depends on the first value of Type in the cert.recrds table [sic]."],"answer":0,"accepted":[],"numeric":false,"explanation":"Length được chốt khi compile ở lần đầu biến xuất hiện: Type=\"Fixed\" → $5. LENGTH đặt sau đó không còn tác dụng (log có WARNING), nên \"Variable\" bị cắt thành \"Varia\".","solution":"","solutionCode":"","courseSource":"raw/CR_01_L1_P1_review.md – Review Quiz: Preparing Data Q7","answerSource":"derived","confidence":"high","courseOriginal":{"stem":"What is the length of the variable Type that is created in the DATA step below?","code":"data work.newloan;\n    set cert.records;\n    if code='1' then Type='Fixed';\n    else Type='Variable';\n    length type $ 10;\nrun;","answer":0,"accepted":[],"explanation":"Length được chốt khi compile ở lần đầu biến xuất hiện: Type=\"Fixed\" → $5. LENGTH đặt sau đó không còn tác dụng (log có WARNING), nên \"Variable\" bị cắt thành \"Varia\"."}},{"id":"cr1-1.4-q8","set":"crreview","number":38,"domain":"D2","topic":"IF-THEN/ELSE and case","format":"Course quiz","difficulty":"","type":"mc","stem":"In the program below, what is the value of Region if Area is nw?","code":"data work.bonus;\n    set orion.sales;\n        length Region $ 5;\n    if Area in('NW', 'SW') then Region='West';\n    else if Area in('NE', 'SE') then Region='East';\n    else Region='Other';\nrun;","options":["West","East","Other","missing"],"answer":2,"accepted":[],"numeric":false,"explanation":"So sánh chuỗi phân biệt hoa thường: \"nw\" không bằng \"NW\" nên cả hai điều kiện đều sai và nhánh ELSE gán Region=\"Other\".","solution":"","solutionCode":"","courseSource":"raw/CR_01_L1_P1_review.md – Review Quiz: Preparing Data Q8","answerSource":"derived","confidence":"high"},{"id":"cr1-1.4-q9","set":"crreview","number":39,"domain":"D2","topic":"IF-THEN without ELSE IF","format":"Course quiz","difficulty":"","type":"mc","stem":"In the program below, what is the value of Region if Area is SW?","code":"data work.bonus;\n    set orion.sales;\n        length Region $ 5;\n    if Area in('NW', 'SW') then Region='West';\n    if Area in('NE', 'SE') then Region='East';\n    else Region='Other';\nrun;","options":["West","East","Other","missing"],"answer":2,"accepted":[],"numeric":false,"explanation":"IF thứ nhất gán \"West\", nhưng IF thứ hai là statement độc lập (không phải ELSE IF): điều kiện sai nên ELSE của nó ghi đè Region=\"Other\".","solution":"","solutionCode":"","courseSource":"raw/CR_01_L1_P1_review.md – Review Quiz: Preparing Data Q9","answerSource":"derived","confidence":"high"},{"id":"cr1-1.4-q10","set":"crreview","number":40,"domain":"D3","topic":"DO groups and syntax errors","format":"Course quiz","difficulty":"","type":"mc","stem":"True or False: This program will successfully create two tables, east and west. (as shown: no END statements, and no semicolon after Region='East')","code":"data west east;\n    set orion.sales;\n    if Area in('NW', 'SW') then do;\n        Region='West';\n        output west;\n    if Area in('NE', 'SE') then do;\n        Region='East'\n        output east;\nrun;","options":["True","False"],"answer":1,"accepted":[],"numeric":false,"explanation":"Sai: mỗi DO cần một END tương ứng và thiếu dấu chấm phẩy sau Region=\"East\", nên có syntax error và DATA step không tạo được bảng như mong muốn.","solution":"","solutionCode":"","courseSource":"raw/CR_01_L1_P1_review.md – Review Quiz: Preparing Data Q10","answerSource":"derived","confidence":"high"},{"id":"cr1-1.5-q1","set":"crreview","number":41,"domain":"D4","topic":"TITLE statements","format":"Course quiz","difficulty":"","type":"mc","stem":"If you run this program, which title or titles appear in the final PROC PRINT results?","code":"title 'ABC Company';\ntitle2 'Sales Report';\nproc print data=sales;\nrun;\n\ntitle2 'Inventory Report';\nproc print data=inventory;\nrun;","options":["Inventory Report","\u003cblank line> / Inventory Report","ABC Company / Sales Report","ABC Company / Inventory Report"],"answer":3,"accepted":[],"numeric":false,"explanation":"TITLE là global statement, giữ hiệu lực đến khi bị thay. TITLE2 mới chỉ thay dòng 2 (và xóa các dòng cao hơn), TITLE1 \"ABC Company\" vẫn giữ nguyên.","solution":"","solutionCode":"","courseSource":"raw/CR_01_L1_P1_review.md – Review Quiz: Analyzing Data Q1","answerSource":"derived","confidence":"high"},{"id":"cr1-1.5-q2","set":"crreview","number":42,"domain":"D4","topic":"Labels in PRINT vs FREQ","format":"Course quiz","difficulty":"","type":"mc","stem":"Which statement is true based on the given program?","code":"data pressure;\n    set data.health;\n    BP=cats(Systolic, \"/\", Diastolic);\n    label BP_Status=\n        \"Blood Pressure Status\";\nrun;\n\nproc print data=pressure(obs=10);\n    var BP BP_Status;\nrun;\n\nproc freq data=pressure;\n    tables BP_Status;\nrun;","options":["The column BP_Status has a permanent label in the data.health table.","The label for BP_Status appears in the PRINT report.","The label for BP_Status appears in the FREQ report.","The label for BP_Status appears in both reports."],"answer":2,"accepted":[],"numeric":false,"explanation":"LABEL trong DATA step gắn nhãn vào bảng pressure (không phải data.health). Hầu hết procedure như FREQ tự hiển thị label, nhưng PROC PRINT cần option LABEL mới hiển thị, nên chỉ FREQ có nhãn.","solution":"","solutionCode":"","courseSource":"raw/CR_01_L1_P1_review.md – Review Quiz: Analyzing Data Q2","answerSource":"derived","confidence":"high"},{"id":"cr1-1.5-q3","set":"crreview","number":43,"domain":"D4","topic":"BY statement in procedures","format":"Course quiz","difficulty":"","type":"mc","stem":"Which of the following statements about the BY statement in a reporting procedure is false?","code":"","options":["The input data must be sorted by the BY variables.","The procedure results are grouped by the unique values of the BY variables.","The BY statement can be used in the PRINT, MEANS, FREQ, and UNIVARIATE procedures.","First./Last. variables are created for each BY variable."],"answer":3,"accepted":[],"numeric":false,"explanation":"Biến FIRST./LAST. chỉ được tạo khi dùng BY trong DATA step, không phải trong procedure báo cáo. Các ý còn lại đúng: dữ liệu phải sort trước và kết quả được chia theo nhóm BY.","solution":"","solutionCode":"","courseSource":"raw/CR_01_L1_P1_review.md – Review Quiz: Analyzing Data Q3","answerSource":"derived","confidence":"high"},{"id":"cr1-1.5-q4","set":"crreview","number":44,"domain":"D4","topic":"PROC PRINT ID and SUM","format":"Course quiz","difficulty":"","type":"mc","stem":"Which statements must be added to this program to create the following report? Report shown: Employee_ID in the leftmost (ID) position, Job_Title, Salary — 120259 Chief Executive Officer $433,800; 120260 Chief Marketing Officer $207,885; 120261 Chief Sales Officer $243,190; 120262 Chief Financial Officer $268,455; total row $1,153,330 (no Obs column).","code":"proc print data=employee;\n    where Department=\"Executives\";\n    var Job_Title Salary;\n    format Salary dollar10.;\nrun;","options":["id Employee_ID;","sum Salary;","keep Employee_ID Job_Title Salary;","a and b","b and c"],"answer":3,"accepted":[],"numeric":false,"explanation":"ID Employee_ID thay cột Obs bằng Employee_ID ở bên trái, SUM Salary tạo dòng tổng. KEEP không phải statement của PROC PRINT.","solution":"","solutionCode":"","courseSource":"raw/CR_01_L1_P1_review.md – Review Quiz: Analyzing Data Q4","answerSource":"derived","confidence":"high"},{"id":"cr1-1.5-q5","set":"crreview","number":45,"domain":"D4","topic":"PROC FREQ defaults","format":"Course quiz","difficulty":"","type":"mc","stem":"By default, PROC FREQ creates a table of frequencies and percentages for which column types?","code":"","options":["character columns","numeric columns","both character and numeric columns","None. Columns must always be specified."],"answer":2,"accepted":[],"numeric":false,"explanation":"Không có TABLES statement, PROC FREQ tạo bảng one-way cho mọi cột trong bảng, cả character lẫn numeric. TABLES là tùy chọn.","solution":"","solutionCode":"","courseSource":"raw/CR_01_L1_P1_review.md – Review Quiz: Analyzing Data Q5","answerSource":"derived","confidence":"high"},{"id":"cr1-1.5-q6","set":"crreview","number":46,"domain":"D4","topic":"Two-way tables NOROW NOCOL","format":"Course quiz","difficulty":"","type":"mc","stem":"Which TABLES statement can be used to create the following output? (two-way \"Table of Department by City\" with only Frequency and Percent in each cell; Departments Administration, Engineering, Sales, Sales Management, Stock & Shipping; Cities Melbourne, Sydney)","code":"","options":["tables Department*City;","tables Department*City / norow nocol","tables Department City / crosslist;","tables Department City / freq percent;"],"answer":1,"accepted":[],"numeric":false,"explanation":"Dấu * tạo crosstab; mặc định mỗi ô có Frequency, Percent, Row Pct, Col Pct, nên NOROW NOCOL bỏ hai phần trăm hàng/cột. Phương án c, d không có dấu * nên chỉ tạo bảng one-way.","solution":"","solutionCode":"","courseSource":"raw/CR_01_L1_P1_review.md – Review Quiz: Analyzing Data Q6","answerSource":"derived","confidence":"high"},{"id":"cr1-1.5-q7","set":"crreview","number":47,"domain":"D4","topic":"PROC FREQ options","format":"Course quiz","difficulty":"","type":"mc","stem":"Which option is not required in the PROC FREQ step to produce this output? (title \"Employees by Department\"; \"Number of Variable Levels\" table: Department 17; one-way table with Frequency and Percent only (no cumulative columns), rows in descending frequency: Sales 122, Administration 31, IS 20, ... Strategy 1)","code":"","options":["LIST","NLEVELS","NOCUM","ORDER=FREQ"],"answer":0,"accepted":[],"numeric":false,"explanation":"NLEVELS tạo bảng số level, NOCUM bỏ cột cumulative, ORDER=FREQ sắp giảm dần theo tần suất. LIST chỉ dùng để hiển thị crosstab dạng danh sách nên không cần.","solution":"","solutionCode":"","courseSource":"raw/CR_01_L1_P1_review.md – Review Quiz: Analyzing Data Q7","answerSource":"derived","confidence":"high"},{"id":"cr1-1.5-q8","set":"crreview","number":48,"domain":"D4","topic":"PROC MEANS defaults","format":"Course quiz","difficulty":"","type":"mc","stem":"Which statement about the MEANS procedure is true?","code":"","options":["The input table must be sorted by the column(s) in the CLASS statement.","Default statistics include N, SUM, MEAN, MIN, and MAX.","The default output is a table.","Without a VAR statement, PROC MEANS summarizes all numeric columns from the input table."],"answer":3,"accepted":[],"numeric":false,"explanation":"Không có VAR, PROC MEANS tính cho mọi cột numeric. CLASS không cần sort (BY mới cần); thống kê mặc định là N, MEAN, STD, MIN, MAX (không có SUM); output mặc định là báo cáo, không phải bảng.","solution":"","solutionCode":"","courseSource":"raw/CR_01_L1_P1_review.md – Review Quiz: Analyzing Data Q8","answerSource":"derived","confidence":"high"},{"id":"cr1-1.5-q9","set":"crreview","number":49,"domain":"D4","topic":"WAYS statement","format":"Course quiz","difficulty":"","type":"mc","stem":"Which WAYS statement creates the following report? (three tables for Analysis Variable Salary: overall (N Obs 308), by City, by Country; no Country x City table)","code":"proc means data=employee;\n    var Salary;\n    class Country City;\nrun;","options":["ways 1, 2, 3;","ways _all_;","ways 2;","ways 0 1;"],"answer":3,"accepted":[],"numeric":false,"explanation":"WAYS 0 tạo bảng tổng thể (không phân nhóm), WAYS 1 tạo bảng theo từng biến CLASS riêng lẻ (City, Country). WAYS 2 mới tạo Country×City nên không cần.","solution":"","solutionCode":"","courseSource":"raw/CR_01_L1_P1_review.md – Review Quiz: Analyzing Data Q9","answerSource":"derived","confidence":"high"},{"id":"cr1-1.5-q10","set":"crreview","number":50,"domain":"D4","topic":"PROC MEANS OUTPUT statement","format":"Course quiz","difficulty":"","type":"mc","stem":"True or False: To create the SumSalary and MedianSalary columns in the SalSum table, you must add the SUM and MEDIAN options to the PROC MEANS statement. (table shown: Country, City, _TYPE_ (3), _FREQ_, SumSalary, MedianSalary)","code":"proc means data=employee noprint;\n    var Salary;\n    class Country City;\n    output out=SalSum;\n    ways 2;\nrun;","options":["True","False"],"answer":1,"accepted":[],"numeric":false,"explanation":"Sai: option thống kê trên PROC MEANS chỉ ảnh hưởng báo cáo. Để tạo cột trong bảng output phải khai báo trong OUTPUT statement, ví dụ output out=SalSum sum=SumSalary median=MedianSalary.","solution":"","solutionCode":"","courseSource":"raw/CR_01_L1_P1_review.md – Review Quiz: Analyzing Data Q10","answerSource":"derived","confidence":"high"},{"id":"cr1-1.6-q1","set":"crreview","number":51,"domain":"D4","topic":"PROC EXPORT options","format":"Course quiz","difficulty":"","type":"mc","stem":"Which statement is false concerning the options for the PROC EXPORT statement?","code":"","options":["The INFILE= option identifies the input SAS table.","The REPLACE option specifies to overwrite an existing file.","The DBMS= option specifies the database identifier for the type of file being created.","The OUTFILE= option specifies the path and file name of the external data file being created."],"answer":0,"accepted":[],"numeric":false,"explanation":"Bảng SAS đầu vào của PROC EXPORT được chỉ bằng DATA=, không có option INFILE= (INFILE là statement của DATA step). Các ý còn lại đúng.","solution":"","solutionCode":"","courseSource":"raw/CR_01_L1_P1_review.md – Review Quiz: Exporting Data Q1","answerSource":"derived","confidence":"high"},{"id":"cr1-1.6-q2","set":"crreview","number":52,"domain":"D4","topic":"PROC EXPORT syntax","format":"Course quiz","difficulty":"","type":"mc","stem":"Which PROC EXPORT step contains valid syntax?","code":"/* a */\nproc export outfile=\"c:\\temp\\sales.txt\" tab\n            data=orion.sales replace;\nrun;\n/* b */\nproc export data=orion.sales dbms=csv\n            outfile=\"c:\\temp\\cars.csv\";\nrun;\n/* c */\nproc export data=orion.sales; dlm=',';\n            outfile=\"c:\\temp\\cars.csv\";\nrun;\n/* d */\nproc export dbms=tab data=orion.sales replace=yes\n            outfile=\"c:\\temp\\cars.txt\";\nrun;","options":["a","b","c","d"],"answer":1,"accepted":[],"numeric":false,"explanation":"Phương án b có DATA=, DBMS=, OUTFILE= đúng cú pháp (REPLACE không bắt buộc). a viết \"tab\" thay vì DBMS=TAB; c có dấu chấm phẩy ngắt PROC statement; d viết REPLACE=YES trong khi REPLACE là từ khóa đơn.","solution":"","solutionCode":"","courseSource":"raw/CR_01_L1_P1_review.md – Review Quiz: Exporting Data Q2","answerSource":"derived","confidence":"high"},{"id":"cr1-1.6-q3","set":"crreview","number":53,"domain":"D1","topic":"XLSX LIBNAME engine","format":"Course quiz","difficulty":"","type":"mc","stem":"True or False: This LIBNAME statement creates the midyear.xlsx file if it does not exist.","code":"libname sales xlsx 'c:\\mydata\\midyear.xlsx';","options":["True","False"],"answer":1,"accepted":[],"numeric":false,"explanation":"[VERIFY] Hai lần giải độc lập cho kết quả khác nhau. Đáp án đang chọn: False – câu LIBNAME ch   Harbinger  33900   06FEB17\n776-84-5391  Phillipon  29750   06JUN16\n929-75-0218  Gunter     27500   06JUN16\n```","code":"data fin2;\n    set finance;\n    keep Name Raise NewSalary Date;\n    if Salary>25000 then Raise=0.03;\n    else Raise=0.05;\n    NewSalary=(Salary*Raise)+Salary;\nrun;","options":["Name, Raise, NewSalary, Date","SSN, Name, Salary, Date, Raise, NewSalary","Name, Date, Raise, NewSalary","Salary, NewSalary, Name, Raise"],"answer":2,"accepted":[],"numeric":false,"explanation":"Thứ tự column theo thứ tự được thêm vào PDV lúc compile: SSN, Name, Salary, Date (từ SET), rồi Raise, NewSalary. KEEP chỉ chọn column, không đổi thứ tự, nên còn Name, Date, Raise, NewSalary.","solution":"","solutionCode":"","courseSource":"raw/CR_03_L3_P2_review.md – Review Quiz: Controlling DATA Step Processing Q7","answerSource":"derived","confidence":"high"},{"id":"cr3-3.1-q8","set":"crreview","number":117,"domain":"D3","topic":"PUTLOG","format":"Course quiz","difficulty":"","type":"mc","stem":"If the input table contains five columns, which PUTLOG statements create the following results in the SAS log?\nNOTE: Begin DATA Step\nName=Alfred Sex=M Age=14 Height=69 Weight=112.5 _ERROR_=0 _N_=1","code":"","options":["putlog \"NOTE: Begin DATA Step\";\nputlog _all_;","putlog NOTE=\"Begin DATA Step\";\nputlog _all_;","putlog \"NOTE: Begin DATA Step\";\nputlog Name Sex Age Height Weight _ERROR_ _N_;","putlog NOTE(Begin DATA Step);\nputlog all;"],"answer":0,"accepted":[],"numeric":false,"explanation":"Chuỗi trong dấu nháy được ghi nguyên văn; PUTLOG _ALL_ ghi mọi column dạng name=value kèm _ERROR_ và _N_. Option c liệt kê tên column không có \"=\" nên chỉ in giá trị (Alfred M 14 ...), không in \"Name=\".","solution":"","solutionCode":"","courseSource":"raw/CR_03_L3_P2_review.md – Review Quiz: Controlling DATA Step Processing Q8","answerSource":"derived","confidence":"high"},{"id":"cr3-3.1-q9","set":"crreview","number":118,"domain":"D1","topic":"Explicit OUTPUT","format":"Course
