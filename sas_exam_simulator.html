4 × 12 = 48.","solution":"Pass 1: O5 Qty 4 × Price 12 = 48.\nPass 2: 48 / 12 = 4 = Qty ✔. (The DATA step runs even before the fix – DAAT is only a warning – so the value is the same either way.)","solutionCode":"data orders2;\n    set orders;\n    Amount=Qty*Price;\nrun;\n\ntitle \"East Orders\";\nproc print data=orders2;\n    var OrderID Amount;\n    where Region=\"East\";\nrun;\n\nproc means data=orders2 mean maxdec=1;\n    var Amount;\n    class Region;\nrun;\ntitle;","courseSource":"P1_L01_essentials.md – Page 6/13 (assignment statement), Page 10/13"},{"id":"mock1-q33","set":"mock1","number":33,"domain":"D1","topic":"","format":"Short answer","difficulty":"easy","type":"sa","stem":"How many rows does the sample table SASHELP.CLASS contain? Enter a number.","code":"","options":[],"answer":"19","accepted":["19"],"numeric":true,"explanation":"19 học sinh.","solution":"Both demos state SASHELP.CLASS has 19 rows (one per student).\nPass 2: you can confirm with `proc contents data=sashelp.class; run;` or the PROC PRINT listing. ✔","solutionCode":"","courseSource":"P1_L01_essentials.md – Page 3/13 and 4/13 demos"},{"id":"mock1-q34","set":"mock1","number":34,"domain":"D2","topic":"","format":"Multiple choice","difficulty":"easy","type":"mc","stem":"How do the tables created by Program A and Program B compare?","code":"/* Program A */\ndata copy1;set sashelp.class;run;\n\n/* Program B */\ndata copy2;\n    set sashelp.class;\nrun;","options":["They are identical; spacing and line breaks do not matter to SAS.","Program A fails because each statement must be on its own line.","Program A creates a table with no rows because of the missing line breaks.","Program B fails because statements must start in column one."],"answer":0,"accepted":[],"numeric":false,"explanation":"Khoảng trắng không quan trọng → các bảng giống hệt nhau.\n\nB: Được phép viết nhiều câu lệnh trên một dòng.\nC: Xuống dòng không làm thay đổi dữ liệu được đọc.\nD: Không có yêu cầu phải bắt đầu ở cột một.","solution":"The course shows the same program with and without line breaks and says the two \"have exactly the same code\" – spacing doesn't matter to SAS.\nPass 2: the Lesson Review repeats \"Spacing doesn't matter in a SAS program.\" ✔","solutionCode":"","courseSource":"P1_L01_essentials.md – Page 8/13 SAS Program Syntax"},{"id":"mock1-q35","set":"mock1","number":35,"domain":"D3","topic":"","format":"Performance","difficulty":"hard","type":"sa","stem":"Fix all syntax errors in this program and run it.\n\nIn work.seniors, what is WeightLb for Name = Luna? Enter the value as displayed.","code":"data pets;\n    input Name $ Species $ Age Weight;\n    datalines;\nMax Dog 5 30\nBella Cat 3 9\nRocky Dog 8 35\nLuna Cat 10 11\nCoco Bird 2 1\nDuke Dog 1 20\nMilo Cat 6 12\n;\nrun;\n\ndata seniors set pets;\n    where Age>=6;\n    WeightLb=Weight*2.2;\nrun;\n\ntitle \"Senior Pets;\nprc print data=seniors;\nrun;\ntitle;","options":[],"answer":"24.2","accepted":["24.2"],"numeric":true,"explanation":"11 × 2.2 = 24.2.","solution":"Luna: Age 10 ≥ 6 → kept. WeightLb = 11 × 2.2.\nPass 1: 11 × 2.2 = 22 + 2.2 = 24.2.\nPass 2: 10 × 2.2 = 22; + 2.2 = 24.2 ✔.","solutionCode":"data seniors;\n    set pets;\n    where Age>=6;\n    WeightLb=Weight*2.2;\nrun;\n\ntitle \"Senior Pets\";\nproc print data=seniors;\nrun;\ntitle;","courseSource":"P1_L01_essentials.md – Page 11/13 Activity (fix missing semicolon, unbalanced quote, misspelled PROC)"},{"id":"mock1-q36","set":"mock1","number":36,"domain":"D4","topic":"","format":"Performance","difficulty":"medium","type":"sa","stem":"Fix the syntax errors in this program and run it.\n\nHow many rows does the corrected PROC PRINT report list?","code":"data orders;\n    input OrderID $ Region $ Qty Price;\n    datalines;\nO1 East 2 15\nO2 West 1 40\nO3 East 5 8\nO4 North 3 20\nO5 West 4 12\nO6 East 1 30\n;\nrun;\n\ndaat orders2;\n    set orders;\n    Amount=Qty*Price;\nrun;\n\ntitle \"East Orders\";\nproc print data=orders2\n    var OrderID Amount;\n    where Region=\"East\";\nrun;\n\nproc means data=orders2 average maxdec=1;\n    var Amount;\n    class Region;\nrun;\ntitle;","options":[],"answer":"3","accepted":["3"],"numeric":true,"explanation":"Các dòng East là O1, O3, O6 → 3.","solution":"After adding the semicolon, the WHERE keeps Region=\"East\": O1, O3, O6 → 3 rows.\nPass 2: Regions = East×3, West×2, North×1 → 3. ✔","solutionCode":"data orders2;\n    set orders;\n    Amount=Qty*Price;\nrun;\n\ntitle \"East Orders\";\nproc print data=orders2;\n    var OrderID Amount;\n    where Region=\"East\";\nrun;\n\nproc means data=orders2 mean maxdec=1;\n    var Amount;\n    class Region;\nrun;\ntitle;","courseSource":"P1_L01_essentials.md – Page 10/13 Demo (fixing the PROC PRINT semicolon)"},{"id":"mock1-q37","set":"mock1","number":37,"domain":"D2","topic":"","format":"Performance","difficulty":"medium","type":"sa","stem":"Using work.staff, create work.hr containing only Dept = HR rows and a new column Raise = Salary * 0.1.\n\nWhat is Raise for EmpID E08?","code":"data staff;\n    input EmpID $ Dept $ Salary Bonus;\n    datalines;\nE01 Sales 52000 3000\nE02 Sales 48000 2000\nE03 IT 61000 4000\nE04 IT 57000 1000\nE05 HR 45000 2500\nE06 Sales 50000 5000\nE07 IT 65000 3000\nE08 HR 47000 1500\n;\nrun;","options":[],"answer":"4700","accepted":["4700"],"numeric":true,"explanation":"47000 × 0.1 = 4700.","solution":"Pass 1: E08 is HR; 47000 × 0.1 = 4700.\nPass 2: 4700 × 10 = 47000 ✔.","solutionCode":"data hr;\n    set staff;\n    where Dept=\"HR\";\n    Raise=Salary*0.1;\nrun;","courseSource":"P1_L01_essentials.md – Page 6/13 (assignment statement), Page 11/13 (WHERE region=…)"},{"id":"mock1-q38","set":"mock1","number":38,"domain":"D1","topic":"","format":"Performance","difficulty":"medium","type":"sa","stem":"Using work.staff, create work.staff2 as a copy of work.staff with one new column Total = Salary + Bonus.\n\nHow many columns does work.staff2 have?","code":"data staff;\n    input EmpID $ Dept $ Salary Bonus;\n    datalines;\nE01 Sales 52000 3000\nE02 Sales 48000 2000\nE03 IT 61000 4000\nE04 IT 57000 1000\nE05 HR 45000 2500\nE06 Sales 50000 5000\nE07 IT 65000 3000\nE08 HR 47000 1500\n;\nrun;","options":[],"answer":"5","accepted":["5"],"numeric":true,"explanation":"4 cột input + Total = 5.","solution":"work.staff has 4 columns (EmpID, Dept, Salary, Bonus from the INPUT statement); the assignment adds Total → 5.\nPass 2: list them: EmpID, Dept, Salary, Bonus, Total = 5 ✔.","solutionCode":"data staff2;\n    set staff;\n    Total=Salary+Bonus;\nrun;","courseSource":"P1_L01_essentials.md – Page 6/13 (DATA step creates an output table and adds a new column)"},{"id":"mock1-q39","set":"mock1","number":39,"domain":"D2","topic":"","format":"Performance","difficulty":"hard","type":"sa","stem":"Using work.scores, create work.drop2 that keeps only rows where Test2 is less than Test1.\n\nHow many rows are in work.drop2?","code":"data scores;\n    input Student $ Test1 Test2 HeightIn;\n    datalines;\nAna 80 90 60\nBen 72 75 65\nCy 95 88 70\nDee 60 71 62\nEli 88 88 68\nFay 79 84 55\n;\nrun;","options":[],"answer":"1","accepted":["1"],"numeric":true,"explanation":"Chỉ có Cy (88 \u003c 95); Eli bằng 95 → 1.","solution":"Pass 1 – Test2 \u003c Test1? Ana 90\u003c80 no; Ben 75\u003c72 no; Cy 88\u003c95 yes; Dee 71\u003c60 no; Eli 88\u003c88 no (equal); Fay 84\u003c79 no → 1 (Cy).\nPass 2 – Test1 − Test2: −10, −3, +7, −11, 0, −5 → only one positive → 1. ✔\nTrap: \u003c= would add Eli → 2.","solutionCode":"data drop2;\n    set scores;\n    where Test2 \u003c Test1;\nrun;","courseSource":"P1_L01_essentials.md – Page 8/13 (where Age\u003c13 comparison)"},{"id":"mock1-q40","set":"mock1","number":40,"domain":"D1","topic":"","format":"Multiple choice","difficulty":"medium","type":"mc","stem":"You replace FILEPATH in setup.sas with the path to your EPG1V2/data folder and run it. Which log note confirms the setup worked?","code":"","options":["Libref PG1 was successfully assigned, followed by the engine and physical name","Table PG1 was successfully created","WARNING: Libref PG1 is not assigned","No note is written when a library is assigned"],"answer":0,"accepted":[],"numeric":false,"explanation":"\"Libref PG1 was successfully assigned\" + engine + physical name.\n\nB: setup.sas gán một library (libref), không tạo bảng tên PG1.\nC: Đó là dấu hiệu thất bại, không phải thành công.\nD: Hướng dẫn nói rằng một note sẽ được ghi ra.","solution":"Setup instructions: \"Check the log for the note Libref PG1 was successfully assigned, followed by the engine and physical name specification.\"\nPass 2: the same note is given in both the SAS Studio and Windowing Environment instructions. ✔","solutionCode":"","courseSource":"P1_L00_setup.md – Pop-up 3 (SAS Studio) Task 2 step 7; Pop-up 5 (Windowing Environment) Task 2 step 5"},{"id":"mock1-q41","set":"mock1","number":41,"domain":"D4","topic":"","format":"Short answer","difficulty":"easy","type":"sa","stem":"In SAS Studio, after you run a PROC PRINT step, which tab of the program window shows the report? Enter the tab name.","code":"","options":[],"answer":"results","accepted":["results","results tab"],"numeric":false,"explanation":"Results.","solution":"Demo: the program tab has Code, Log, Results, and Output Data tabs; \"Select the Results tab to view the report\".\nPass 2: step 10 – after running only PROC PRINT, \"The Results tab shows the report that was created from the PROC PRINT code.\" ✔","solutionCode":"","courseSource":"P1_L01_essentials.md – Page 3/13 Demo: Programming with SAS Studio (steps 5–7)"},{"id":"mock1-q42","set":"mock1","number":42,"domain":"D4","topic":"","format":"Multiple choice","difficulty":"easy","type":"mc","stem":"What does MAXDEC=2 do on a PROC MEANS statement?","code":"","options":["Rounds the displayed statistics to two decimal places.","Limits the analysis to the first two variables in the VAR statement.","Allows at most two values for each CLASS variable.","Permanently stores the data values in the table with two decimals."],"answer":0,"accepted":[],"numeric":false,"explanation":"Làm tròn các thống kê hiển thị đến 2 chữ số thập phân.\n\nB: VAR quyết định cột nào được phân tích.\nC: CLASS không có option giới hạn như vậy ở đây.\nD: PROC MEANS tạo báo cáo; nó không thay đổi dữ liệu đã lưu.","solution":"Practice: \"Type MAXDEC=2 to round the statistics to two decimal places.\"\nPass 2: in the demo, maxdec=1 appears with mean/min/max statistics only – it controls the report, not the data. ✔","solutionCode":"","courseSource":"P1_L01_essentials.md – Page 5/13 Practice: Exploring SAS Studio, step 8"},{"id":"mock1-q43","set":"mock1","number":43,"domain":"D2","topic":"","format":"Multiple choice","difficulty":"medium","type":"mc","stem":"Which WHERE statement keeps only the rows where the character column Region has the value East?","code":"","options":["where Region=\"East\";","where Region=East;","where Region=\"East;","where \"Region\"=\"East\";"],"answer":0,"accepted":[],"numeric":false,"explanation":"Giá trị ký tự phải đặt trong nháy: where Region=\"East\";\n\nB: Giá trị không đặt trong nháy; khóa học luôn đặt giá trị ký tự trong nháy ở WHERE. [East không có nháy sẽ bị hiểu là tên cột – hành vi chung của SAS.]\nC: Dấu nháy không khớp – phần còn lại của chương trình trở thành một phần của chuỗi.\nD: Đặt Region trong nháy biến nó thành chuỗi hằng, không phải cột.","solution":"The course compares a character column to a quoted value: `where region=\"Canada\";`. Same pattern → A.\nPass 2: C has an unmatched quotation mark (a syntax error from the course); D quotes the column name so it is a text constant, not the column; B leaves the value unquoted. ✔","solutionCode":"","courseSource":"P1_L01_essentials.md – Page 11/13 Activity (where region=\"Canada\";), Page 10/13 (unmatched quotes)"},{"id":"mock2-q1","set":"mock2","number":1,"domain":"D1","topic":"","format":"Multiple choice","difficulty":"easy","type":"mc","stem":"Which LIBNAME statement uses a valid libref?","code":"","options":["libname salesdata2024 \"s:/workshop/data\";","libname 2024data \"s:/workshop/data\";","libname sales_24 xlsx \"s:/workshop/data/sales.xlsx\";","libname sales-24 \"s:/workshop/data\";"],"answer":2,"accepted":[],"numeric":false,"explanation":"Libref: ≤ 8 ký tự, bắt đầu bằng chữ cái/dấu gạch dưới, sau đó là chữ cái, chữ số, dấu gạch dưới.\n\nA: 13 ký tự – libref tối đa 8 ký tự.\nB: Tên phải bắt đầu bằng chữ cái hoặc dấu gạch dưới, không phải chữ số.\nD: Dấu gạch ngang không được phép trong tên SAS.","solution":"Pass 1: a libref must follow SAS naming rules and be 8 characters or less. sales_24 = 8 characters, starts with a letter, letters/digits/underscore only → valid; the XLSX engine and a quoted path + file name are the documented form.\nPass 2: check each other option against the same two rules – salesdata2024 is 13 characters (too long); 2024data starts with a digit; sales-24 contains a hyphen. Only C passes both rules. ✔","solutionCode":"","courseSource":"CR_01_L1_P1_review.md – 1.2 Directly Accessing Structured Data (libref ≤ 8 characters, SAS naming conventions); 1.1 Required Column Attributes (name rules)"},{"id":"mock2-q2","set":"mock2","number":2,"domain":"D1","topic":"","format":"Multiple choice","difficulty":"medium","type":"mc","stem":"A programmer submits:\n\nlibname crb2 \"s:/workshop/ECRBM6/daat\";\n\nThe folder name is misspelled and the folder does not exist. What appears in the log?","code":"","options":["An ERROR, and the LIBNAME statement is not executed.","A WARNING that the path is invalid.","A NOTE that the libref was successfully assigned, and the library contains the course tables.","Only a NOTE saying the library does not exist – no error and no warning."],"answer":3,"accepted":[],"numeric":false,"explanation":"Thư mục không tồn tại → chỉ có NOTE \"Library … does not exist\". Luôn đọc các note.\n\nA: Demo không tạo ra error.\nB: Demo không tạo ra warning.\nC: Điều đó chỉ xảy ra sau khi sửa đường dẫn.","solution":"Pass 1: the L5 demo with the typo …/daat produced \"no warning, no error – only a NOTE 'Library CRB2 does not exist.'\" → D.\nPass 2: the lesson's point is \"No error ≠ correct code\"; A and B contradict the demo, C describes the corrected path. ✔","solutionCode":"","courseSource":"CR_05_L5_challenging_topics.md – Creating Libraries (nonexistent folder)"},{"id":"mock2-q3","set":"mock2","number":3,"domain":"D1","topic":"","format":"Multiple choice","difficulty":"easy","type":"mc","stem":"Inside a PROC IMPORT step that reads a CSV file with many missing values, which statement makes SAS use every row of the file to decide each column's type?","code":"","options":["replace;","guessingrows=max;","dbms=csv;","options validvarname=v7;"],"answer":1,"accepted":[],"numeric":false,"explanation":"GUESSINGROWS=MAX quét tất cả các dòng trước khi gán kiểu cột.\n\nA: REPLACE ghi đè bảng output nếu bảng đã tồn tại.\nC: DBMS= cho SAS biết loại file.\nD: VALIDVARNAME=V7 kiểm soát tên cột, không phải kiểu, và là global statement.","solution":"Pass 1: TSA solution: \"GUESSINGROWS=MAX statement: use every row to determine column types, because the CSV has many missing values.\" → B.\nPass 2: REPLACE only overwrites an existing output table; DBMS= names the file type (and is an option on the PROC statement); VALIDVARNAME is a global OPTIONS setting for column names. ✔","solutionCode":"","courseSource":"CR_02_L2_TSA_case_study.md – Solution for Accessing Data (GUESSINGROWS=MAX)"},{"id":"mock2-q4","set":"mock2","number":4,"domain":"D1","topic":"","format":"Multiple choice","difficulty":"easy","type":"mc","stem":"What does this step display?\n\nproc contents data=cr._all_ nods;\nrun;","code":"/* --- Bắt đầu: Dữ liệu mẫu tự động tạo --- */\noptions dlcreatedir;\nlibname cr \"%sysfunc(pathname(work))/cr\";\nlibname crb \"%sysfunc(pathname(work))/cr\";\n\ndata cr.continent_codes;\n    infile datalines dlm=\"|\" dsd;\n    length Code 8 Continent $ 15;\n    input Code Continent $;\n    datalines;\n91|North America\n92|South America\n93|Europe\n94|Africa\n95|Asia\n96|Oceania\n;\nrun;\n\ndata cr.country_info;\n    infile datalines dlm=\"|\" dsd;\n    length Country $ 12 Continent 8;\n    input Country $ Continent;\n    datalines;\nCanada|1\nBrazil|2\nFrance|3\nKenya|4\nJapan|5\nMexico|1\nPeru|2\nGermany|3\nVietnam|5\nChile|2\nEl Salvador|1\nAustralia|6\n;\nrun;\n/* --- Kết thúc: Dữ liệu mẫu --- */","options":["The descriptor portion of the first table in the CR library only.","The data rows of every table in the CR library.","A list of all tables in the CR library followed by the full descriptor portion of each table.","A list of all tables in the CR library, without the descriptor portion of each table."],"answer":3,"accepted":[],"numeric":false,"explanation":"_ALL_ = mọi bảng; NODS = chỉ liệt kê, không có descriptor portion.\n\nA: _ALL_ bao gồm mọi bảng trong library.\nB: PROC CONTENTS báo cáo thuộc tính, không phải giá trị dữ liệu.\nC: Đó là output khi không có NODS.","solution":"Pass 1: _ALL_ gives a list of all tables then the descriptor portion for each; \"Adding the NODS option after _ALL_ suppresses the descriptor portions, leaving only the list.\" → D.\nPass 2: C is _ALL_ without NODS; PROC CONTENTS never prints data rows (B); A ignores _ALL_. PQ 1.03 uses exactly this step to count tables in the library. ✔","solutionCode":"","courseSource":"CR_01_L1_P1_review.md – 1.2 Viewing Table Properties with PROC CONTENTS; PQ 1.03","courseOriginal":{"stem":"What does this step display?\n\nproc contents data=cr._all_ nods;\nrun;","code":"","answer":3,"accepted":[],"explanation":"_ALL_ = mọi bảng; NODS = chỉ liệt kê, không có descriptor portion.\n\nA: _ALL_ bao gồm mọi bảng trong library.\nB: PROC CONTENTS báo cáo thuộc tính, không phải giá trị dữ liệu.\nC: Đó là output khi không có NODS."}},{"id":"mock2-q5","set":"mock2","number":5,"domain":"D1","topic":"","format":"Performance","difficulty":"medium","type":"sa","stem":"Run the program above. Then write a DATA step that concatenates jan and feb (jan first) into work.q1 without using any data set options.\n\nHow many columns does work.q1 have?","code":"data jan;\n    input Item $ Units;\n    datalines;\nPen 5\nInk 3\nPad 7\n;\nrun;\n\ndata feb;\n    input Item $ Qty;\n    datalines;\nPen 4\nPad 6\nInk 2\nTape 9\n;\nrun;","options":[],"answer":"3","accepted":["3"],"numeric":true,"explanation":"Tên khác nhau → các cột riêng biệt: Item, Units, Qty = 3.","solution":"Pass 1: jan has Item, Units; feb has Item, Qty. SET combines the columns by name: Item, Units, Qty → 3 columns (rows from jan have missing Qty, rows from feb have missing Units).\nPass 2: same pattern as the course demo where Line/Category and Product_Line/Product_Category became separate columns until RENAME= was added. 7 rows, 3 columns. ✔","solutionCode":"data q1;\n    set jan feb;\nrun;","courseSource":"CR_03_L3_P2_review.md – 3.5 Concatenating Tables (different column names → separate columns with missing values)"},{"id":"mock2-q6","set":"mock2","number":6,"domain":"D1","topic":"","format":"Performance","difficulty":"medium","type":"sa","stem":"Modify your concatenation so that the Qty values from feb are stored in the Units column (work.q1 should then have only Item and Units).\n\nWhat is the total of Units across all rows of work.q1?","code":"data jan;\n    input Item $ Units;\n    datalines;\nPen 5\nInk 3\nPad 7\n;\nrun;\n\ndata feb;\n    input Item $ Qty;\n    datalines;\nPen 4\nPad 6\nInk 2\nTape 9\n;\nrun;","options":[],"answer":"36","accepted":["36"],"numeric":true,"explanation":"RENAME=(Qty=Units) trên feb; 15 + 21 = 36.","solution":"Pass 1: jan Units 5+3+7 = 15; feb Qty → Units 4+6+2+9 = 21; total 36.\nPass 2: list all 7 rows: Pen 5, Ink 3, Pad 7, Pen 4, Pad 6, Ink 2, Tape 9 → 5+3=8, +7=15, +4=19, +6=25, +2=27, +9=36. ✔","solutionCode":"data q1;\n    set jan feb(rename=(Qty=Units));\nrun;\n\nproc means data=q1 sum;\n    var Units;\nrun;","courseSource":"CR_03_L3_P2_review.md – 3.5 Concatenating Tables (RENAME= data set option); PQ 3.13"},{"id":"mock2-q7","set":"mock2","number":7,"domain":"D1","topic":"","format":"Performance","difficulty":"hard","type":"sa","stem":"Run the program above. Table don is not sorted and stores the employee ID in a column named ID.\n\nCreate work.donors that contains only employees who appear in BOTH emp and don, with a new column TotalDonation = the sum of Q1–Q4 (missing values ignored).\n\nHow many rows are in work.donors?","code":"data emp;\n    input EmpID $ Name $ Dept $;\n    datalines;\nE1 Ava Sales\nE2 Bo IT\nE3 Cal Sales\nE4 Di HR\nE5 Ed IT\nE6 Flo HR\n;\nrun;\n\ndata don;\n    input ID $ Q1 Q2 Q3 Q4;\n    datalines;\nE5 10 . 20 5\nE2 15 15 15 15\nE7 5 5 . .\nE1 . . 30 .\nE3 20 10 . 10\n;\nrun;","options":[],"answer":"4","accepted":["4"],"numeric":true,"explanation":"Sort don theo ID, đổi tên thành EmpID, merge với IN=, giữ dòng có cả hai = 1 → E1, E2, E3, E5.","solution":"Pass 1 (trace):\nEmpID  in emp  in don  Q1 Q2 Q3 Q4  sum(of Q1-Q4)\nE1     1       1       .  .  30 .   30\nE2     1       1       15 15 15 15  60\nE3     1       1       20 10 .  10  40\nE4     1       0\nE5     1       1       10 .  20 5   35\nE6     1       0\nE7     0       1       5  5  .  .   (not output)\nRows with both flags = 1: E1, E2, E3, E5 → 4.\nPass 2: emp IDs E1–E6; don IDs E5, E2, E7, E1, E3. Intersection = {E1, E2, E3, E5} → 4 rows. ✔","solutionCode":"proc sort data=don out=don_sort(rename=(ID=EmpID));\n    by ID;\nrun;\n\ndata donors nodonor;\n    merge emp(in=inE) don_sort(in=inD);\n    by EmpID;\n    if inE=1 and inD=1 then do;\n        TotalDonation=sum(of Q1-Q4);\n        output donors;\n    end;\n    else if inE=1 and inD=0 then output nodonor;\nrun;","courseSource":"CR_03_L3_P2_review.md – 3.5 Merging Tables (sorted inputs, same BY column, IN=); CR_05 – Finding Non-matches (RENAME= on PROC SORT output); PQ 3.15"},{"id":"mock2-q8","set":"mock2","number":8,"domain":"D1","topic":"","format":"Performance","difficulty":"medium","type":"sa","stem":"Using your work.donors table from the previous question, what is the value of TotalDonation for the employee named Cal?","code":"data emp;\n    input EmpID $ Name $ Dept $;\n    datalines;\nE1 Ava Sales\nE2 Bo IT\nE3 Cal Sales\nE4 Di HR\nE5 Ed IT\nE6 Flo HR\n;\nrun;\n\ndata don;\n    input ID $ Q1 Q2 Q3 Q4;\n    datalines;\nE5 10 . 20 5\nE2 15 15 15 15\nE7 5 5 . .\nE1 . . 30 .\nE3 20 10 . 10\n;\nrun;","options":[],"answer":"40","accepted":["40"],"numeric":true,"explanation":"sum(of Q1-Q4) của E3 = 20 + 10 + 10 = 40.","solution":"Pass 1: Cal = E3; don row E3: Q1=20, Q2=10, Q3=., Q4=10 → SUM ignores the missing value → 40.\nPass 2: if missing were not ignored the result would be missing, not a number; the SUM function skips missing → 20+10+10 = 40. ✔","solutionCode":"proc sort data=don out=don_sort(rename=(ID=EmpID));\n    by ID;\nrun;\n\ndata donors nodonor;\n    merge emp(in=inE) don_sort(in=inD);\n    by EmpID;\n    if inE=1 and inD=1 then do;\n        TotalDonation=sum(of Q1-Q4);\n        output donors;\n    end;\n    else if inE=1 and inD=0 then output nodonor;\nrun;","courseSource":"CR_03_L3_P2_review.md – 3.3 Using Numeric and Date Functions (SUM with OF list); PQ 3.15"},{"id":"mock2-q9","set":"mock2","number":9,"domain":"D1","topic":"","format":"Performance","difficulty":"medium","type":"sa","stem":"In the same DATA step, also create work.nodonor containing employees from emp that have NO matching row in don.\n\nHow many rows are in work.nodonor?","code":"data emp;\n    input EmpID $ Name $ Dept $;\n    datalines;\nE1 Ava Sales\nE2 Bo IT\nE3 Cal Sales\nE4 Di HR\nE5 Ed IT\nE6 Flo HR\n;\nrun;\n\ndata don;\n    input ID $ Q1 Q2 Q3 Q4;\n    datalines;\nE5 10 . 20 5\nE2 15 15 15 15\nE7 5 5 . .\nE1 . . 30 .\nE3 20 10 . 10\n;\nrun;","options":[],"answer":"2","accepted":["2"],"numeric":true,"explanation":"E4 và E6 không có dòng donation → 2.","solution":"Pass 1: emp-only IDs (inE=1, inD=0): E4 (Di), E6 (Flo) → 2.\nPass 2: emp has 6 rows; 4 matched (previous question) → 6 − 4 = 2. E7 is in don only and goes to neither table. ✔","solutionCode":"proc sort data=don out=don_sort(rename=(ID=EmpID));\n    by ID;\nrun;\n\ndata donors nodonor;\n    merge emp(in=inE) don_sort(in=inD);\n    by EmpID;\n    if inE=1 and inD=1 then do;\n        TotalDonation=sum(of Q1-Q4);\n        output donors;\n    end;\n    else if inE=1 and inD=0 then output nodonor;\nrun;","courseSource":"CR_03_L3_P2_review.md – 3.5 Merging Tables (non-matches: one IN= flag 1, the other 0); PQ 3.15"},{"id":"mock2-q10","set":"mock2","number":10,"domain":"D1","topic":"","format":"Performance","difficulty":"medium","type":"sa","stem":"Run the program above, then submit:\n\ndata shop3;\n    set shop;\n    if Channel=\"Web\" then Source=\"Online\";\n    else Source=\"In person\";\nrun;\n\nWhat value of Source is stored for OrderID A02? (Type the value exactly as stored.)","code":"data shop;\n    input OrderID $ Store $ Channel $ Qty Price;\n    datalines;\nA01 North Web 3 20\nA02 South Phone 1 55\nA03 North Store 4 12\nA04 West Web 2 35\nA05 South Web 5 12\nA06 North Phone 2 40\nA07 West Store 6 9\nA08 South Store 2 30\nA09 North Web 1 84\nA10 West Phone 3 25\n;\nrun;","options":[],"answer":"In per","accepted":["In per"],"numeric":false,"explanation":"Độ dài được xác định ở lần xuất hiện đầu tiên (\"Online\" = 6) → \"In person\" thành \"In per\".","solution":"Pass 1: the first appearance of Source is the assignment \"Online\" (6 characters) → length 6. A02 is Phone → \"In person\" truncated to 6 characters → \"In per\".\nPass 2: count: I-n-space-p-e-r = 6 characters. Same mechanism as the course demos (\"Retail\" → length 6; \"Known\" → \"Unkno\"). No error or warning is written. ✔","solutionCode":"data shop3;\n    set shop;\n    length Source $ 9;   /* fix: declare the length before first use */\n    if Channel=\"Web\" then Source=\"Online\";\n    else Source=\"In person\";\nrun;","courseSource":"CR_01_L1_P1_review.md – 1.4 Using the DATA Step (truncation, length set by first assigned value); CR_05 – Using the LENGTH Statement"},{"id":"mock2-q11","set":"mock2","number":11,"domain":"D2","topic":"","format":"Performance","difficulty":"medium","type":"sa","stem":"Using work.shop, create work.big with a new column Amount = Qty * Price, keeping only the rows where Amount is at least 60.\n\nHow many rows are in work.big?","code":"data shop;\n    input OrderID $ Store $ Channel $ Qty Price;\n    datalines;\nA01 North Web 3 20\nA02 South Phone 1 55\nA03 North Store 4 12\nA04 West Web 2 35\nA05 South Web 5 12\nA06 North Phone 2 40\nA07 West Store 6 9\nA08 South Store 2 30\nA09 North Web 1 84\nA10 West Phone 3 25\n;\nrun;","options":[],"answer":"7","accepted":["7"],"numeric":true,"explanation":"Subsetting IF sau khi tính Amount; 7 dòng có Amount ≥ 60.","solution":"Pass 1 (trace):\nOrderID Store Channel Qty Price  Amount=Qty*Price\nA01     North Web     3   20     60\nA02     South Phone   1   55     55\nA03     North Store   4   12     48\nA04     West  Web     2   35     70\nA05     South Web     5   12     60\nA06     North Phone   2   40     80\nA07     West  Store   6   9      54\nA08     South Store   2   30     60\nA09     North Web     1   84     84\nA10     West  Phone   3   25     75\nAmount >= 60: A01 60, A04 70, A05 60, A06 80, A08 60, A09 84, A10 75 → 7.\nPass 2: rows below 60: A02 55, A03 48, A07 54 → 3; 10 − 3 = 7. A WHERE statement cannot be used because Amount is not in the input table – a subsetting IF after the assignment is required. ✔","solutionCode":"data big;\n    set shop;\n    Amount=Qty*Price;\n    if Amount>=60;\nrun;","courseSource":"CR_05_L5_challenging_topics.md – Comparing WHERE and IF Statements (only IF filters new columns); PQ 5.02"},{"id":"mock2-q12","set":"mock2","number":12,"domain":"D2","topic":"","format":"Performance","difficulty":"easy","type":"sa","stem":"In one DATA step, read work.shop and write the rows with Channel = \"Web\" to work.web and all other rows to work.other.\n\nHow many rows are in work.other?","code":"data shop;\n    input OrderID $ Store $ Channel $ Qty Price;\n    datalines;\nA01 North Web 3 20\nA02 South Phone 1 55\nA03 North Store 4 12\nA04 West Web 2 35\nA05 South Web 5 12\nA06 North Phone 2 40\nA07 West Store 6 9\nA08 South Store 2 30\nA09 North Web 1 84\nA10 West Phone 3 25\n;\nrun;","options":[],"answer":"6","accepted":["6"],"numeric":true,"explanation":"4 dòng Web → 6 dòng trong work.other.","solution":"Pass 1: Web rows = A01, A04, A05, A09 → 4; other = 10 − 4 = 6.\nPass 2: count non-Web directly: A02 Phone, A03 Store, A06 Phone, A07 Store, A08 Store, A10 Phone → 6. ✔","solutionCode":"data web other;\n    set shop;\n    if Channel=\"Web\" then output web;\n    else output other;\nrun;","courseSource":"CR_03_L3_P2_review.md – 3.1 Directing DATA Step Output (conditional OUTPUT to multiple tables); PQ 3.01"},{"id":"mock2-q13","set":"mock2","number":13,"domain":"D2","topic":"","format":"Performance","difficulty":"hard","type":"sa","stem":"Create work.storetot with exactly one row per Store and a column StoreAmt = the total of Qty*Price for that store.\n\nWhat is StoreAmt for West?","code":"data shop;\n    input OrderID $ Store $ Channel $ Qty Price;\n    datalines;\nA01 North Web 3 20\nA02 South Phone 1 55\nA03 North Store 4 12\nA04 West Web 2 35\nA05 South Web 5 12\nA06 North Phone 2 40\nA07 West Store 6 9\nA08 South Store 2 30\nA09 North Web 1 84\nA10 West Phone 3 25\n;\nrun;","options":[],"answer":"199","accepted":["199"],"numeric":true,"explanation":"Sort theo Store; reset tại first.Store; StoreAmt+Amount; output tại last.Store → West 199.","solution":"Pass 1: West rows A04 70, A07 54, A10 75 → 70+54 = 124, +75 = 199.\nPass 2: all stores: North 60+48+80+84 = 272, South 55+60+60 = 175, West 199; 272+175+199 = 646 = total of all 10 Amounts (60+55+48+70+60+80+54+60+84+75 = 646). ✔","solutionCode":"proc sort data=shop out=shop_sort;\n    by Store;\nrun;\n\ndata storetot;\n    set shop_sort;\n    by Store;\n    if first.Store then StoreAmt=0;\n    StoreAmt+Qty*Price;\n    if last.Store;\n    keep Store StoreAmt;\nrun;","courseSource":"CR_03_L3_P2_review.md – 3.2 Summarizing Data (BY, FIRST./LAST., sum statement, subsetting IF last.); PQ 3.06, PQ 5.07"},{"id":"mock2-q14","set":"mock2","number":14,"domain":"D2","topic":"","format":"Performance","difficulty":"medium","type":"sa","stem":"Sort work.shop by Qty*Price in ascending order (create Amount first), then create a running total RunAmt that accumulates Amount from the first row to the last.\n\nWhat is RunAmt in row 4?","code":"data shop;\n    input OrderID $ Store $ Channel $ Qty Price;\n    datalines;\nA01 North Web 3 20\nA02 South Phone 1 55\nA03 North Store 4 12\nA04 West Web 2 35\nA05 South Web 5 12\nA06 North Phone 2 40\nA07 West Store 6 9\nA08 South Store 2 30\nA09 North Web 1 84\nA10 West Phone 3 25\n;\nrun;","options":[],"answer":"217","accepted":["217"],"numeric":true,"explanation":"48 + 54 + 55 + 60 = 217.","solution":"Pass 1: sorted Amounts: 48, 54, 55, 60, 60, 60, 70, 75, 80, 84. Running totals: 48, 102, 157, 217 → row 4 = 217.\nPass 2: the three tied 60s can be in any order, but row 4 is the first 60 regardless: 48+54+55+60 = 217. ✔","solutionCode":"data shop_amt;\n    set shop;\n    Amount=Qty*Price;\nrun;\n\nproc sort data=shop_amt;\n    by Amount;\nrun;\n\ndata running;\n    set shop_amt;\n    RunAmt+Amount;\nrun;","courseSource":"CR_05_L5_challenging_topics.md – Creating an Accumulating Column (RETAIN / SUM); PQ 5.06"},{"id":"mock2-q15","set":"mock2","number":15,"domain":"D2","topic":"","format":"Multiple choice","difficulty":"medium","type":"mc","stem":"shop_amt contains a numeric column Amount with no missing values. There is no RETAIN statement. What values does RunAmt contain?","code":"data running;\n    set shop_amt;\n    RunAmt=sum(RunAmt, Amount);\nrun;","options":["A running total of Amount.","Missing on every row.","The same value as Amount on every row.","The total of all Amount values on every row."],"answer":2,"accepted":[],"numeric":false,"explanation":"Bị reset về missing ở mỗi vòng lặp; SUM bỏ qua missing → RunAmt = Amount.\n\nA: Cần RETAIN (hoặc sum statement) để cộng dồn.\nB: SUM bỏ qua RunAmt bị missing, nên kết quả là Amount.\nD: Không có gì tính tổng cả bảng trên mỗi dòng.","solution":"Pass 1: RunAmt is created by an assignment, so it is reset to missing at the top of each iteration. SUM ignores missing → sum(., Amount) = Amount.\nPass 2: the L5 demo shows the same statement \"alone does not accumulate\"; adding RETAIN … 0 makes it accumulate. B ignores that SUM skips the missing argument. ✔","solutionCode":"","courseSource":"CR_05_L5_challenging_topics.md – Creating an Accumulating Column (\"alone it does not accumulate\"); CR_03 3.1 (new columns reset to missing)"},{"id":"mock2-q16","set":"mock2","number":16,"domain":"D2","topic":"","format":"Performance","difficulty":"medium","type":"sa","stem":"Create a custom numeric format AMTCAT: values below 50 = \"Low\", 50 up to (but not including) 75 = \"Mid\", 75 and above = \"High\". Compute Amount = Qty*Price for work.shop and use PROC FREQ with your format to count Amount by category.\n\nHow many rows fall in the \"Mid\" category?","code":"data shop;\n    input OrderID $ Store $ Channel $ Qty Price;\n    datalines;\nA01 North Web 3 20\nA02 South Phone 1 55\nA03 North Store 4 12\nA04 West Web 2 35\nA05 South Web 5 12\nA06 North Phone 2 40\nA07 West Store 6 9\nA08 South Store 2 30\nA09 North Web 1 84\nA10 West Phone 3 25\n;\nrun;","options":[],"answer":"6","accepted":["6"],"numeric":true,"explanation":"Mid = 55, 54, 60, 60, 60, 70 → 6.","solution":"Pass 1: Amounts 60, 55, 48, 70, 60, 80, 54, 60, 84, 75 → Low: 48 (1); Mid: 60, 55, 70, 60, 54, 60 (6); High: 80, 84, 75 (3).\nPass 2: 1 + 6 + 3 = 10 rows ✔; 75 is the boundary → \"50-\u003c75\" excludes it, \"75-high\" includes it, so 75 is High. ✔","solutionCode":"proc format;\n    value amtcat low-\u003c50=\"Low\"\n                 50-\u003c75=\"Mid\"\n                 75-high=\"High\";\nrun;\n\ndata shop_amt;\n    set shop;\n    Amount=Qty*Price;\nrun;\n\nproc freq data=shop_amt;\n    tables Amount;\n    format Amount amtcat.;\nrun;","courseSource":"CR_03_L3_P2_review.md – 3.4 Creating and Using Custom Formats; PQ 3.10 (low-\u003c ranges, FORMAT in PROC FREQ)"},{"id":"mock2-q17","set":"mock2","number":17,"domain":"D2","topic":"","format":"Multiple choice","difficulty":"easy","type":"mc","stem":"Which PROC FORMAT step correctly creates a format for the character column Channel?","code":"","options":["proc format; value chan \"Web\"=\"Online\" other=\"Offline\"; run;","proc format; value $chan \"Web\"=\"Online\" other=\"Offline\"; run;","proc format; value chan. \"Web\"=\"Online\" other=\"Offline\"; run;","proc format; value $chan. \"Web\"=\"Online\" other=\"Offline\"; run;"],"answer":1,"accepted":[],"numeric":false,"explanation":"Format ký tự: VALUE $name …; áp dụng bằng $name.\n\nA: Tên format ký tự phải bắt đầu bằng $.\nC: Thiếu $ và dấu chấm không thuộc về câu lệnh VALUE.\nD: Dấu chấm dùng khi áp dụng format, không dùng khi đặt tên.","solution":"Pass 1: \"character format names must start with $\"; the period is added only when the format is applied (\"the format name must end with a period\" when used). → B.\nPass 2: PQ 3.12 creates `value $statfmt \"S\"=\"Single\" …` – $ prefix, no period in the VALUE statement. A lacks $; C and D put a period in the name. ✔","solutionCode":"","courseSource":"CR_03_L3_P2_review.md – 3.4 Creating and Using Custom Formats (character format names start with $; period only when applied); PQ 3.12"},{"id":"mock2-q18","set":"mock2","number":18,"domain":"D2","topic":"","format":"Performance","difficulty":"medium","type":"sa","stem":"Run the program above. Create a column Display that shows the first name, one space, then the last name (for example, \"Jin Park\"). Hyphenated first names must stay intact.\n\nWhat is Display for row 3?","code":"data people;\n    length FullName $ 20 Joined $ 10;\n    input FullName $ Joined $;\n    datalines;\nLee,Mary-Ann 03/15/2019\nPark,Jin 11/02/2020\nOrtiz,Ana-Sofia 07/30/2018\nSmith,Tom 01/05/2021\n;\nrun;","options":[],"answer":"Ana-Sofia Ortiz","accepted":["Ana-Sofia Ortiz"],"numeric":false,"explanation":"catx(\" \", scan(FullName,2,\",\"), scan(FullName,1,\",\")) → \"Ana-Sofia Ortiz\".","solution":"Pass 1: row 3 FullName = \"Ortiz,Ana-Sofia\". scan(…, 2, \",\") = \"Ana-Sofia\" (only the comma is a delimiter, so the hyphen is kept); scan(…, 1, \",\") = \"Ortiz\"; CATX joins with one space → \"Ana-Sofia Ortiz\".\nPass 2: without the \",\" argument, the hyphen would be a delimiter and word 2 would be \"Ana\" – the stem's requirement rules that out. ✔","solutionCode":"data people2;\n    set people;\n    Display=catx(\" \", scan(FullName, 2, \",\"), scan(FullName, 1, \",\"));\nrun;","courseSource":"CR_03_L3_P2_review.md – 3.3 Using Numeric and Date Functions (SCAN with a delimiter list); PQ 3.08 (CATX + SCAN)"},{"id":"mock2-q19","set":"mock2","number":19,"domain":"D2","topic":"","format":"Multiple choice","difficulty":"medium","type":"mc","stem":"FullName has the value \"Lee,Mary-Ann\". What does scan(FullName, 2) return (no third argument)?","code":"","options":["Mary","Lee","Mary-Ann","Ann"],"answer":0,"accepted":[],"numeric":false,"explanation":"Dấu phẩy và dấu gạch ngang là delimiter mặc định → Lee | Mary | Ann.\n\nB: Đó là từ thứ 1.\nC: Chỉ đúng nếu dấu gạch ngang không phải delimiter (đối số thứ ba là \",\").\nD: Đó là từ thứ 3.","solution":"Pass 1: default delimiters include the comma and the hyphen → words: \"Lee\", \"Mary\", \"Ann\" → word 2 = \"Mary\".\nPass 2: the course example keeps hyphenated names intact only by supplying a third argument that limits the delimiters; without it the hyphen splits the name. ✔","solutionCode":"","courseSource":"CR_03_L3_P2_review.md – 3.3 Using Numeric and Date Functions (SCAN default delimiters include spaces, hyphens and other punctuation)"},{"id":"mock2-q20","set":"mock2","number":20,"domain":"D2","topic":"","format":"Performance","difficulty":"hard","type":"sa","stem":"Joined is a character column. Create a numeric SAS date column JoinDate from Joined.\n\nWhat is the stored (unformatted) value of JoinDate for Park,Jin?","code":"data people;\n    length FullName $ 20 Joined $ 10;\n    input FullName $ Joined $;\n    datalines;\nLee,Mary-Ann 03/15/2019\nPark,Jin 11/02/2020\nOrtiz,Ana-Sofia 07/30/2018\nSmith,Tom 01/05/2021\n;\nrun;","options":[],"answer":"22221","accepted":["22221"],"numeric":true,"explanation":"input(Joined, mmddyy10.) → 02NOV2020 = 22221 ngày sau 01JAN1960.","solution":"Pass 1: 11/02/2020 counted from 01JAN1960 = 22221 (computed: days between 1960-01-01 and 2020-11-02).\nPass 2: anchor from PQ 1.09: 26DEC2019 = 21909. Days 26DEC2019 → 02NOV2020: 6 (to 01JAN2020) + Jan 31 + Feb 29 + Mar 31 + Apr 30 + May 31 + Jun 30 + Jul 31 + Aug 31 + Sep 30 + Oct 31 + 1 = 312 → 21909 + 312 = 22221. ✔","solutionCode":"data people3;\n    set people;\n    JoinDate=input(Joined, mmddyy10.);\nrun;\n\nproc print data=people3;\n    format JoinDate 10.;   /* shows the raw value */\nrun;","courseSource":"CR_05_L5_challenging_topics.md – Converting Column Type (INPUT with MMDDYY10./ANYDTDTE10.); CR_01 1.1 (SAS date = days from 01JAN1960); PQ 1.09 (Boxing Day 2019 = 21909)"},{"id":"mock2-q21","set":"mock2","number":21,"domain":"D2","topic":"","format":"Performance","difficulty":"medium","type":"sa","stem":"Salary is stored as character text such as \"$42,500\". Create a numeric column SalNum from Salary, then use PROC MEANS with MAXDEC=0 to compute the mean of SalNum.\n\nWhat mean is displayed?","code":"data pay;\n    length Salary $ 10;\n    input EmpID $ Salary $;\n    datalines;\nP1 $42,500\nP2 $38,000\nP3 $51,250\n;\nrun;","options":[],"answer":"43917","accepted":["43917"],"numeric":true,"explanation":"input(Salary, dollar10.) → trung bình 43916.67 → 43917.","solution":"Pass 1: 42500 + 38000 + 51250 = 131750; /3 = 43916.67 → MAXDEC=0 → 43917.\nPass 2: 3 × 43917 = 131751 ≈ 131750 ✔; the first decimal is 6 (≥5) so it rounds up. The DOLLAR (or COMMA) informat reads the $ and comma. ✔","solutionCode":"data pay2;\n    set pay;\n    SalNum=input(Salary, dollar10.);\nrun;\n\nproc means data=pay2 mean maxdec=0;\n    var SalNum;\nrun;","courseSource":"CR_03_L3_P2_review.md – PQ 3.09 (INPUT with COMMA or DOLLAR informat); CR_05 – Converting Column Type"},{"id":"mock2-q22","set":"mock2","number":22,"domain":"D2","topic":"","format":"Performance","difficulty":"medium","type":"sa","stem":"Run the program. How many rows are written to work.growth?","code":"data growth;\n    Balance=1000;\n    do until (Balance > 2000);\n        Year+1;\n        Balance=Balance*1.10;\n        output;\n    end;\nrun;","options":[],"answer":"8","accepted":["8"],"numeric":true,"explanation":"Vượt 2000 sau năm thứ 8 → 8 dòng.","solution":"Pass 1: Balance after each pass: 1100, 1210, 1331, 1464.1, 1610.51, 1771.56, 1948.72, 2143.59 → after pass 8 the condition is true → 8 rows (one OUTPUT per pass).\nPass 2: 1.1^7 × 1000 = 1948.7 ≤ 2000 (continue); 1.1^8 × 1000 = 2143.6 > 2000 (stop) → 8. ✔","solutionCode":"","courseSource":"CR_03_L3_P2_review.md – 3.6 Iterative and Conditional DO Loops; CR_05 – Using Conditional DO Loops (UNTIL checked at the bottom); PQ 3.18"},{"id":"mock2-q23","set":"mock2","number":23,"domain":"D2","topic":"","format":"Performance","difficulty":"hard","type":"sa","stem":"Write a DATA step that creates work.savings:\n- Balance starts at 0.\n- For each Year from 1 to 3, and inside it each Month from 1 to 12: add 100 to Balance, then add one month of interest: Balance = Balance * (1 + .06/12);\n- Write one row per year.\n\nWhat is Balance in the row for Year 3, rounded to the nearest whole number?","code":"/* No input data is needed for this question. */","options":[],"answer":"3953","accepted":["3953"],"numeric":true,"explanation":"OUTPUT sau vòng lặp Month; số dư năm 3 ≈ 3953.28 → 3953.","solution":"Pass 1: simulated 36 months: end of year 1 = 1239.72, year 2 = 2555.91, year 3 = 3953.28 → 3953.\nPass 2: annuity-due formula 100 × 1.005 × (1.005^36 − 1)/0.005 = 100 × 1.005 × 39.3361 = 3953.28 → 3953. ✔","solutionCode":"data savings;\n    Balance=0;\n    do Year=1 to 3;\n        do Month=1 to 12;\n            Balance=Balance+100;\n            Balance=Balance*(1+.06/12);\n        end;\n        output;\n    end;\n    format Balance comma12.;\nrun;","courseSource":"CR_03_L3_P2_review.md – 3.6 Using Nested DO Loops; CR_05 – Using Iterative DO Loops (OUTPUT between the inner END and the outer END)"},{"id":"mock2-q24","set":"mock2","number":24,"domain":"D2","topic":"","format":"Multiple choice","difficulty":"medium","type":"mc","stem":"What does work.t contain?","code":"data t;\n    do Year=1 to 5;\n        Total+10;\n    end;\nrun;","options":["5 rows, Year = 1 to 5.","5 rows, each with Total = 10.","1 row: Year = 5, Total = 50.","1 row: Year = 6, Total = 50."],"answer":3,"accepted":[],"numeric":false,"explanation":"Không có OUTPUT → một dòng; biến chỉ số kết thúc ở 6; Total = 50.\n\nA: Muốn mỗi năm một dòng thì cần OUTPUT bên trong vòng lặp.\nB: Chỉ có một implicit output.\nC: Biến chỉ số được tăng thêm một lần nữa trước khi vòng lặp kết thúc.","solution":"Pass 1: no OUTPUT statement → only the implicit output at RUN → 1 row. The index increases at END; after the 5th pass it becomes 6 and the loop stops → Year = 6. Total is incremented 5 times → 50.\nPass 2: course demo: Month = 13 after do Month=1 to 12, and Year = 6 after do Year=1 to 5 with one row per input row. ✔","solutionCode":"","courseSource":"CR_05_L5_challenging_topics.md – Using Iterative DO Loops (index after loop = stop+1; only implicit output without OUTPUT)"},{"id":"mock2-q25","set":"mock2","number":25,"domain":"D2","topic":"","format":"Multiple choice","difficulty":"medium","type":"mc","stem":"X equals 10 before each loop below. How many times does each loop body execute?\n\nLoop 1: do while (X \u003c 5); X+1; end;\nLoop 2: do until (X >= 5); X+1; end;","code":"","options":["Loop 1: 0 times · Loop 2: 1 time","Loop 1: 1 time · Loop 2: 0 times","Both: 0 times","Both: 1 time"],"answer":0,"accepted":[],"numeric":false,"explanation":"WHILE = kiểm tra ở đầu (có thể chạy 0 lần); UNTIL = kiểm tra ở cuối (luôn chạy ≥ 1 lần).\n\nB: Bị đảo ngược: WHILE kiểm tra trước, UNTIL kiểm tra sau.\nC: UNTIL luôn thực thi ít nhất một lần.\nD: WHILE kiểm tra trước lượt chạy đầu tiên.","solution":"Pass 1: DO WHILE tests at the top: 10 \u003c 5 is false → body never runs. DO UNTIL tests at the bottom: the body runs once (X = 11), then 11 >= 5 is true → stop.\nPass 2: the course says the two give identical results only when the WHILE loop executes at least once – here it does not, so they differ (0 vs 1). ✔","solutionCode":"","courseSource":"CR_05_L5_challenging_topics.md – Using Conditional DO Loops (WHILE checked at the top, UNTIL at the bottom)"},{"id":"mock2-q26","set":"mock2","number":26,"domain":"D2","topic":"","format":"Performance","difficulty":"medium","type":"sa","stem":"Restructure don into a narrow table work.don_narrow with one row per ID per quarter column (Q1–Q4). Rows whose value is missing must still be included. Use PROC TRANSPOSE.\n\nHow many rows are in work.don_narrow?","code":"data emp;\n    input EmpID $ Name $ Dept $;\n    datalines;\nE1 Ava Sales\nE2 Bo IT\nE3 Cal Sales\nE4 Di HR\nE5 Ed IT\nE6 Flo HR\n;\nrun;\n\ndata don;\n    input ID $ Q1 Q2 Q3 Q4;\n    datalines;\nE5 10 . 20 5\nE2 15 15 15 15\nE7 5 5 . .\nE1 . . 30 .\nE3 20 10 . 10\n;\nrun;","options":[],"answer":"20","accepted":["20"],"numeric":true,"explanation":"5 ID × 4 quý = 20 dòng (sort theo ID trước).","solution":"Pass 1: 5 IDs × 4 numeric columns (Q1–Q4, transposed by default) = 20 rows; missing values still produce rows.\nPass 2: count per ID: E1 4, E2 4, E3 4, E5 4, E7 4 → 20. The input must be sorted by ID first (it is not). ✔","solutionCode":"proc sort data=don out=don_sort;\n    by ID;\nrun;\n\nproc transpose data=don_sort out=don_narrow;\n    by ID;\nrun;","courseSource":"CR_05_L5_challenging_topics.md – Restructuring Data with PROC TRANSPOSE (BY, all numeric non-BY columns by default, missing counts as a value); CR_03 3.7"},{"id":"mock2-q27","set":"mock2","number":27,"domain":"D2","topic":"","format":"Multiple choice","difficulty":"easy","type":"mc","stem":"Which statement about _N_ and _ERROR_ is true?","code":"","options":["They exist in the PDV during execution but are not written to the output table.","They are written to the output table unless dropped.","_N_ counts the rows written so far; _ERROR_ counts syntax errors.","They are created only when a BY statement is used."],"answer":0,"accepted":[],"numeric":false,"explanation":"Biến PDV tự động; không được output.\n\nB: Chúng không bao giờ được ghi vào bảng output.\nC: _N_ là số thứ tự vòng lặp; _ERROR_ đánh dấu lỗi dữ liệu (1/0).\nD: BY tạo các biến FIRST./LAST.","solution":"Pass 1: \"_N_ and _ERROR_ … are automatic: present in the PDV during execution but not written to the output table.\" → A.\nPass 2: _N_ = DATA step iteration number (not rows written); _ERROR_ = 1 if a data error occurs for the row. FIRST./LAST. (not these) come from BY. ✔","solutionCode":"","courseSource":"CR_03_L3_P2_review.md – 3.1 Understanding DATA Step Processing (automatic variables)"},{"id":"mock2-q28","set":"mock2","number":28,"domain":"D3","topic":"","format":"Performance","difficulty":"hard","type":"sa","stem":"The second step should: keep only rows where Amount (Qty*Price) is at least 60; set Source to \"Online\" for Web orders and \"Offline\" otherwise, without truncation; and display Amount with a dollar format. It contains several errors.\n\nFix the program and run it. How many rows of work.shop2 have Source = \"Offline\"?","code":"data shop;\n    input OrderID $ Store $ Channel $ Qty Price;\n    datalines;\nA01 North Web 3 20\nA02 South Phone 1 55\nA03 North Store 4 12\nA04 West Web 2 35\nA05 South Web 5 12\nA06 North Phone 2 40\nA07 West Store 6 9\nA08 South Store 2 30\nA09 North Web 1 84\nA10 West Phone 3 25\n;\nrun;\n\ndata shop2\n    set shop;\n    Amount=Qty*Price;\n    where Amount>=60;\n    if Channel=\"Web\" then Source=\"Online\";\n    else Source=\"Offline\";\n    length Source $ 7;\n    format Amount dollar8;\nrun;","options":[],"answer":"3","accepted":["3"],"numeric":true,"explanation":"Sửa: dấu chấm phẩy, IF thay cho WHERE, LENGTH đặt đầu tiên, dollar8. → 3 dòng Offline.","solution":"Errors: (1) no semicolon after DATA shop2 → syntax error; (2) WHERE uses Amount, which is not in the input table → ERROR, use IF after the assignment; (3) LENGTH after the assignments → WARNING, \"Offline\" truncated to \"Offlin\" – move LENGTH before them; (4) dollar8 without a period → treated as a column name (NOTE: uninitialized).\nPass 1: rows with Amount ≥ 60: A01 Web, A04 Web, A05 Web, A06 Phone, A08 Store, A09 Web, A10 Phone → Offline = A06, A08, A10 = 3.\nPass 2: 7 rows − 4 Web rows = 3. ✔","solutionCode":"data shop2;\n    set shop;\n    length Source $ 7;\n    Amount=Qty*Price;\n    if Amount>=60;\n    if Channel=\"Web\" then Source=\"Online\";\n    else Source=\"Offline\";\n    format Amount dollar8.;\nrun;\n\nproc freq data=shop2;\n    tables Source;\nrun;","courseSource":"CR_01_L1_P1_review.md – 1.1 Finding and Resolving Syntax Errors (missing semicolon; missing period = logic error); CR_05 – Comparing WHERE and IF; Using the LENGTH Statement"},{"id":"mock2-q29","set":"mock2","number":29,"domain":"D3","topic":"","format":"Performance","difficulty":"medium","type":"sa","stem":"The report should list OrderID and Qty grouped by Store, with a Qty subtotal for each store and the label \"Units Sold\". Fix every error and run it.\n\nWhat Qty subtotal is shown for North?","code":"data shop;\n    input OrderID $ Store $ Channel $ Qty Price;\n    datalines;\nA01 North Web 3 20\nA02 South Phone 1 55\nA03 North Store 4 12\nA04 West Web 2 35\nA05 South Web 5 12\nA06 North Phone 2 40\nA07 West Store 6 9\nA08 South Store 2 30\nA09 North Web 1 84\nA10 West Phone 3 25\n;\nrun;\n\ntitle \"Store Quantities;\nproc print data=shop label noobs\n    by Store;\n    var OrderID Qty;\n    sum Qty;\n    label Qty=\"Units Sold\";\nrun;\ntitle;","options":[],"answer":"10","accepted":["10"],"numeric":true,"explanation":"Đóng dấu nháy, thêm dấu chấm phẩy, sort theo Store → North = 10.","solution":"Errors: unmatched quotation mark in TITLE; missing semicolon after the PROC PRINT statement; shop is not sorted by Store, so BY Store needs a PROC SORT first.\nPass 1: North rows A01 3, A03 4, A06 2, A09 1 → 10.\nPass 2: all subtotals: North 10, South 1+5+2 = 8, West 2+6+3 = 11; 10+8+11 = 29 = total Qty (3+1+4+2+5+2+6+2+1+3 = 29). ✔","solutionCode":"proc sort data=shop out=shop_sort;\n    by Store;\nrun;\n\ntitle \"Store Quantities\";\nproc print data=shop_sort label noobs;\n    by Store;\n    var OrderID Qty;\n    sum Qty;\n    label Qty=\"Units Sold\";\nrun;\ntitle;","courseSource":"CR_01_L1_P1_review.md – PQ 1.12 (PROC SORT, then PROC PRINT BY/ID/SUM/LABEL); 1.1 Syntax errors; CR_05 – data must be sorted for BY processing"},{"id":"mock2-q30","set":"mock2","number":30,"domain":"D3","topic":"","format":"Multiple choice","difficulty":"medium","type":"mc","stem":"The step runs. What does the log show and what is the result?","code":"data profit2;\n    set profit;\n    format Profit dollar12;\nrun;","options":["An ERROR because the FORMAT statement is invalid; no table is created.","A WARNING; SAS adds the missing period automatically.","No error or warning, but a NOTE that dollar12 is uninitialized; Profit is not formatted as dollars.","No messages; Profit is formatted with DOLLAR12."],"answer":2,"accepted":[],"numeric":false,"explanation":"Thiếu dấu chấm → dollar12 bị hiểu là tên cột → NOTE uninitialized (lỗi logic).\n\nA: Cú pháp hợp lệ – không có error.\nB: Không có warning và không tự động sửa.\nD: Format không được áp dụng, và có một NOTE xuất hiện.","solution":"Pass 1: course demo: missing period after DOLLAR12 → \"no error or warning, results produced, but the log NOTE says 'Variable dollar12 is uninitialized'\" – SAS treats dollar12 as a column name. It is a logic error. → C.\nPass 2: the lesson: \"read notes too, not only errors and warnings\" – consistent with C only. ✔","solutionCode":"","courseSource":"CR_01_L1_P1_review.md – 1.1 Finding and Resolving Syntax Errors (missing period after DOLLAR12)"},{"id":"mock2-q31","set":"mock2","number":31,"domain":"D3","topic":"","format":"Multiple choice","difficulty":"medium","type":"mc","stem":"shop has no column named Amount. What happens, and how should it be fixed?","code":"data big;\n    set shop;\n    Amount=Qty*Price;\n    where Amount>=60;\nrun;","options":["An ERROR that Amount is not in the input table; replace WHERE with a subsetting IF placed after the assignment.","The step runs because the WHERE statement comes after the assignment.","A WARNING; SAS converts the WHERE statement into an IF statement automatically.","An ERROR; fix it by moving the WHERE statement before the SET statement."],"answer":0,"accepted":[],"numeric":false,"explanation":"WHERE chỉ nhìn thấy các cột input → ERROR; dùng IF sau khi tạo Amount.\n\nB: WHERE lọc khi các dòng được đọc vào, trước khi phép gán chạy, bất kể vị trí.\nC: Không có chuyển đổi tự động.\nD: WHERE vẫn không thể nhìn thấy cột không có trong bảng input.","solution":"Pass 1: demo: WHERE TotalDonations > 50 → \"ERROR: variable TotalDonations is not in file …\"; changed to IF placed after the assignment → works. → A.\nPass 2: WHERE acts before any other DATA step processing, so its position in the step does not matter (B and D are wrong); only IF can filter new columns. ✔","solutionCode":"","courseSource":"CR_05_L5_challenging_topics.md – Comparing WHERE and IF Statements"},{"id":"mock2-q32","set":"mock2","number":32,"domain":"D3","topic":"","format":"Multiple choice","difficulty":"medium","type":"mc","stem":"What is the result?","code":"data orders2;\n    set orders;\n    if Order_Type in (1,2,3) then Order_Source=\"Known\";\n    else Order_Source=\"Unknown\";\n    length Order_Source $ 7;\nrun;","options":["No messages; Order_Source has length 7.","An ERROR; the table is not created.","A WARNING that the length was already set; the LENGTH statement has no effect and \"Unknown\" is stored as \"Unkno\".","A NOTE only; \"Unknown\" is stored correctly."],"answer":2,"accepted":[],"numeric":false,"explanation":"LENGTH phải đứng trước lần sử dụng đầu tiên → WARNING, độ dài vẫn là 5.\n\nA: Câu lệnh LENGTH đặt muộn bị bỏ qua.\nB: Đây là warning, không phải error – bảng vẫn được tạo.\nD: Có WARNING và giá trị bị cắt bớt.","solution":"Pass 1: L5 demo: LENGTH after the conditional statements → WARNING \"Length of character variable Order_Source has already been set…\"; \"The late LENGTH has no effect – length stays 5, values truncated\" → \"Unkno\". → C.\nPass 2: length was set at the first appearance (\"Known\" = 5 characters); the fix is LENGTH before any other appearance. ✔","solutionCode":"","courseSource":"CR_05_L5_challenging_topics.md – Using the LENGTH Statement (LENGTH placed after the conditional statements)"},{"id":"mock2-q33","set":"mock2","number":33,"domain":"D3","topic":"","format":"Multiple choice","difficulty":"easy","type":"mc","stem":"What is the PUTLOG statement used for?","code":"","options":["To write the PDV to the output table at that point.","To send the log to a PDF file.","To stop the DATA step when an error occurs.","To write messages or column values to the log during DATA step execution, which helps find logic errors."],"answer":3,"accepted":[],"numeric":false,"explanation":"PUTLOG ghi ra log trong lúc thực thi – một công cụ debug.\n\nA: Đó là câu lệnh OUTPUT.\nB: ODS gửi báo cáo ra file; PUTLOG ghi ra log.\nC: PUTLOG không dừng việc xử lý.","solution":"Pass 1: \"PUTLOG statements (write messages to the log during execution – useful to understand processing and diagnose logic errors)\". → D.\nPass 2: the demo placed PUTLOG before SET, after a calculation and at the end to watch HeightCM reset to missing – diagnosis only. OUTPUT (A) writes rows. ✔","solutionCode":"","courseSource":"CR_03_L3_P2_review.md – 3.2 Summarizing Data (PUTLOG demo)"},{"id":"mock2-q34","set":"mock2","number":34,"domain":"D3","topic":"","format":"Multiple choice","difficulty":"hard","type":"mc","stem":"The programmer wants Country removed from both output tables. What is wrong and what is the fix?","code":"/* --- Bắt đầu: Dữ liệu mẫu tự động tạo --- */\noptions dlcreatedir;\nlibname cr \"%sysfunc(pathname(work))/cr\";\nlibname crb \"%sysfunc(pathname(work))/cr\";\n\ndata crb.employee;\n    infile datalines dlm=\"|\" dsd;\n    length EmpID 8 Name $ 15 JobTitle $ 22 Department $ 16 Country $ 2 City $ 12 Salary 8 HireDate 8 TermDate 8 Status $ 1;\n    format HireDate TermDate date9.;\n    input EmpID Name $ JobTitle $ Department $ Country $ City $ Salary HireDate :date9. TermDate :date9. Status $;\n    datalines;\n120101|Abbott, Ray|Administration Manager|Administration|US|San Diego|58200|01JAN1990|.|M\n120102|Baker, Lan|Office Assistant II|Administration|US|San Diego|31500|01JAN2006|.|S\n120103|Chen, Mai|Office Assistant I|Administration|AU|Sydney|28650|01JAN2014|.|O\n120104|Dang, Minh|Office Assistant III|Administration|AU|Sydney|34800|01JAN2009|20JUN2017|M\n120105|Evans, Kate|Secretary I|Administration|us|Philadelphia|30150|01JAN2011|.|S\n120106|Fischer, Tom|Engineer I|Engineering|US|San Diego|52350|01JAN2016|.|O\n120107|Garcia, Luis|Engineer II|Engineering|AU|Melbourne|61500|01JAN2004|.|M\n120108|Hoang, Thu|Engineering Manager|Engineering|US|Philadelphia|98400|01JAN1986|.|M\n120109|Ito, Ken|Accountant I|Accounts|AU|Sydney|45900|01JAN2012|.|S\n120110|Jones, Amy|Accountant II|Accounts|US|San Diego|52800|01JAN2000|03FEB2015|O\n120111|Kim, Ha|Auditor II|Group Financials|US|San Diego|64200|01JAN2003|.|S\n120112|Lopez, Ana|Auditor III|Group Financials|AU|Sydney|79650|01JAN1995|.|M\n120113|Martin, Joe|Auditor I|Group Financials|au|Melbourne|48300|01JAN2017|.|O\n120114|Nguyen, An|Sales Rep. I|Sales|AU|Sydney|26550|01JAN2018|.|S\n120115|Owen, Sue|Sales Rep. II|Sales|US|San Diego|28200|01JAN2010|.|M\n120116|Park, Jin|Sales Rep. III|Sales|US|San Diego|29700|01JAN2007|.|O\n120117|Quinn, Liz|Sales Rep. IV|Sales|US|San Diego|33450|01JAN1988|.|M\n120118|Reed, Sam|Sales Rep. IV|Sales|AU|Sydney|31950|01JAN1997|.|S\n120119|Silva, Rui|Sales Rep. II|Sales|us|Philadelphia|27300|01JAN2013|10OCT2016|O\n120120|Tran, Hoa|Sales Rep. I|Sales|AU|Melbourne|25800|01JAN2016|.|S\n;\nrun;\n/* --- Kết thúc: Dữ liệu mẫu --- */\n\ndata emp_US emp_AU;\n    set crb.employee(drop=Country);\n    if Country=\"US\" then output emp_US;\n    else output emp_AU;\nrun;","options":["Nothing is wrong; DROP= on the input table takes effect after the IF statement.","Country is never read into the PDV, so the IF condition cannot use it (errors/warnings appear). Use a DROP statement or DROP= on the output tables instead.","DROP= cannot be used in a SET statement; use KEEP= instead.","The DATA statement may list only one table; split it into two steps."],"answer":1,"accepted":[],"numeric":false,"explanation":"Drop ở phía output (câu lệnh DROP hoặc DROP= trên output), không drop ở input khi cột còn được dùng.\n\nA: Data set option ở input tác động trước khi xử lý.\nC: DROP= hợp lệ ở input; KEEP= có cùng thời điểm tác động.\nD: Câu lệnh DATA có thể đặt tên nhiều bảng output.","solution":"Pass 1: \"DROP= on the input data set → not read into the PDV, not available for processing\"; dropping a column that is used \"fails … error and warnings in the log. Use a DROP statement or DROP= on the output tables instead (takes effect after all processing).\" → B.\nPass 2: input data set options act before any other processing (A wrong); DROP= on input is valid syntax for unused columns (C wrong); multiple output tables are allowed (D wrong). ✔","solutionCode":"","courseSource":"CR_05_L5_challenging_topics.md – Using DROP and KEEP Statements","courseOriginal":{"stem":"The programmer wants Country removed from both output tables. What is wrong and what is the fix?","code":"data emp_US emp_AU;\n    set crb.employee(drop=Country);\n    if Country=\"US\" then output emp_US;\n    else output emp_AU;\nrun;","answer":1,"accepted":[],"explanation":"Drop ở phía output (câu lệnh DROP hoặc DROP= trên output), không drop ở input khi cột còn được dùng.\n\nA: Data set option ở input tác động trước khi xử lý.\nC: DROP= hợp lệ ở input; KEEP= có cùng thời điểm tác động.\nD: Câu lệnh DATA có thể đặt tên nhiều bảng output."}},{"id":"mock2-q35","set":"mock2","number":35,"domain":"D3","topic":"","format":"Multiple choice","difficulty":"medium","type":"mc","stem":"During DATA step execution, the automatic variable _ERROR_ is set to 1 for a row. What does this mean?","code":"","options":["A data error occurred while processing that row; a note with details is written to the log.","A syntax error was found during compilation.","The row was not written to the output table.","The step will stop after this row."],"answer":0,"accepted":[],"numeric":false,"explanation":"_ERROR_ = 1 → có lỗi dữ liệu ở dòng này, chi tiết nằm trong log.\n\nB: Syntax error xảy ra lúc compile, không phải cờ theo từng dòng.\nC: _ERROR_ không kiểm soát output.\nD: _ERROR_ không dừng step.","solution":"Pass 1: \"_ERROR_ = 1 if a data error occurs for the row, otherwise 0 (a note with details goes to the log).\" → A.\nPass 2: syntax errors are found at compilation, before _ERROR_ exists for any row (B); nothing in the course says the row is discarded or the step stops (C, D). ✔","solutionCode":"","courseSource":"CR_03_L3_P2_review.md – 3.1 Understanding DATA Step Processing (_ERROR_)"},{"id":"mock2-q36","set":"mock2","number":36,"domain":"D4","topic":"","format":"Performance","difficulty":"medium","type":"sa","stem":"Compute Amount = Qty*Price for work.shop, then use PROC MEANS to show the mean of Amount for each Store, rounded to 1 decimal place.\n\nWhat mean is displayed for South?","code":"data shop;\n    input OrderID $ Store $ Channel $ Qty Price;\n    datalines;\nA01 North Web 3 20\nA02 South Phone 1 55\nA03 North Store 4 12\nA04 West Web 2 35\nA05 South Web 5 12\nA06 North Phone 2 40\nA07 West Store 6 9\nA08 South Store 2 30\nA09 North Web 1 84\nA10 West Phone 3 25\n;\nrun;","options":[],"answer":"58.3","accepted":["58.3"],"numeric":true,"explanation":"175 / 3 = 58.33 → MAXDEC=1 → 58.3.","solution":"Pass 1: South rows A02 55, A05 60, A08 60 → 175 / 3 = 58.333 → 58.3.\nPass 2: 3 × 58.3 = 174.9 ≈ 175 ✔; second decimal is 3 → rounds down. (North 272/4 = 68.0, West 199/3 = 66.3.) ✔","solutionCode":"data shop_amt;\n    set shop;\n    Amount=Qty*Price;\nrun;\n\nproc means data=shop_amt mean maxdec=1;\n    var Amount;\n    class Store;\nrun;","courseSource":"CR_01_L1_P1_review.md – 1.5 Using PROC MEANS (CLASS, statistics, MAXDEC=)"},{"id":"mock2-q37","set":"mock2","number":37,"domain":"D4","topic":"","format":"Performance","difficulty":"easy","type":"sa","stem":"Create a one-way frequency report of Channel with the values listed from the highest count to the lowest and without cumulative columns.\n\nWhich Channel value is listed first?","code":"data shop;\n    input OrderID $ Store $ Channel $ Qty Price;\n    datalines;\nA01 North Web 3 20\nA02 South Phone 1 55\nA03 North Store 4 12\nA04 West Web 2 35\nA05 South Web 5 12\nA06 North Phone 2 40\nA07 West Store 6 9\nA08 South Store 2 30\nA09 North Web 1 84\nA10 West Phone 3 25\n;\nrun;","options":[],"answer":"Web","accepted":["Web"],"numeric":false,"explanation":"Web có 4 dòng (nhiều nhất) → đứng đầu với ORDER=FREQ.","solution":"Pass 1: Web: A01, A04, A05, A09 = 4; Phone: A02, A06, A10 = 3; Store: A03, A07, A08 = 3 → ORDER=FREQ lists Web first.\nPass 2: 4 + 3 + 3 = 10 rows ✔; Web is the only value with the maximum count, so the tie between Phone and Store does not matter. ✔","solutionCode":"proc freq data=shop order=freq;\n    tables Channel / nocum;\nrun;","courseSource":"CR_01_L1_P1_review.md – 1.5 Using PROC FREQ (ORDER=FREQ, NOCUM)"},{"id":"mock2-q38","set":"mock2","number":38,"domain":"D4","topic":"","format":"Performance","difficulty":"hard","type":"sa","stem":"Compute Amount = Qty*Price, then submit a PROC MEANS step with NOPRINT, CLASS Store Channel, VAR Amount, an OUTPUT statement that creates work.summ with sum=TotAmt, and a WAYS 1 statement.\n\nHow many rows are in work.summ?","code":"data shop;\n    input OrderID $ Store $ Channel $ Qty Price;\n    datalines;\nA01 North Web 3 20\nA02 South Phone 1 55\nA03 North Store 4 12\nA04 West Web 2 35\nA05 South Web 5 12\nA06 North Phone 2 40\nA07 West Store 6 9\nA08 South Store 2 30\nA09 North Web 1 84\nA10 West Phone 3 25\n;\nrun;","options":[],"answer":"6","accepted":["6"],"numeric":true,"explanation":"WAYS 1 → 3 dòng Store + 3 dòng Channel = 6.","solution":"Pass 1: WAYS 1 keeps one row per value of each CLASS column on its own: Store (North, South, West) = 3 + Channel (Phone, Store, Web) = 3 → 6.\nPass 2: WAYS 2 would instead give the Store×Channel combinations (9 present); WAYS 0 a single overall row. Only one-way rows are kept → 6. ✔","solutionCode":"data shop_amt;\n    set shop;\n    Amount=Qty*Price;\nrun;\n\nproc means data=shop_amt noprint;\n    var Amount;\n    class Store Channel;\n    output out=summ sum=TotAmt;\n    ways 1;\nrun;","courseSource":"CR_01_L1_P1_review.md – 1.5 Using PROC MEANS (OUTPUT, NOPRINT, WAYS); PQ 1.16; CR_03 PQ 3.03"},{"id":"mock2-q39","set":"mock2","number":39,"domain":"D4","topic":"","format":"Multiple choice","difficulty":"easy","type":"mc","stem":"The column heading still shows TotProfit instead of \"Total Profit\". What is the fix?","code":"proc print data=summary noobs;\n    var Age_Range TotProfit;\n    label TotProfit=\"Total Profit\";\nrun;","options":["Move the LABEL statement before the VAR statement.","Add the LABEL option to the PROC PRINT statement.","Remove the NOOBS option.","Use a FORMAT statement instead of a LABEL statement."],"answer":1,"accepted":[],"numeric":false,"explanation":"PROC PRINT cần option LABEL để hiển thị label.\n\nA: Thứ tự câu lệnh trong step không quan trọng ở đây.\nC: NOOBS chỉ bỏ cột Obs.\nD: Format thay đổi cách hiển thị giá trị, không thay đổi tiêu đề cột.","solution":"Pass 1: course: \"LABEL statement – and the LABEL option on PROC PRINT is required for labels to show\". → B.\nPass 2: PQ 1.12's answer for descriptive headings is the LABEL option (proc print data=baseball_sort label;). Statement order (A), NOOBS (C) and formats (D) do not affect headings. ✔","solutionCode":"","courseSource":"CR_01_L1_P1_review.md – 1.5 Using PROC MEANS (custom report: \"the LABEL option on PROC PRINT is required for labels to show\"); PQ 1.12"},{"id":"mock2-q40","set":"mock2","number":40,"domain":"D4","topic":"","format":"Multiple choice","difficulty":"easy","type":"mc","stem":"What does the statement ods noproctitle; do?","code":"","options":["Removes all TITLE statements for the current step only.","Closes all ODS destinations.","Removes the procedure name heading (for example \"The FREQ Procedure\") from reports for the rest of the session.","Removes the bookmarks from a PDF file."],"answer":2,"accepted":[],"numeric":false,"explanation":"Ẩn tiêu đề \"The XXX Procedure\" cho đến khi kết thúc session.\n\nA: Nội dung TITLE không bị ảnh hưởng; đây là thiết lập toàn session cho tiêu đề procedure.\nB: Destination được đóng bằng ODS \u003cdestination> CLOSE.\nD: Nội dung bookmark được kiểm soát bằng ODS PROCLABEL.","solution":"Pass 1: \"ODS NOPROCTITLE; removes 'The FREQ Procedure' heading; stays off for all reports for the rest of the SAS session.\" → C.\nPass 2: TSA export solution uses it to remove procedure names above each output; titles are cleared with title; and destinations closed with ODS … CLOSE. ✔","solutionCode":"","courseSource":"CR_01_L1_P1_review.md – 1.5 Using PROC FREQ (ODS NOPROCTITLE); CR_02 Solution for Exporting Data"},{"id":"mock2-q41","set":"mock2","number":41,"domain":"D4","topic":"","format":"Multiple choice","difficulty":"medium","type":"mc","stem":"In a PDF created with ODS PDF, each bookmark shows the procedure name. Which statement, placed before a procedure, sets custom bookmark text for that procedure?","code":"","options":["title \"Claims by Year\";","ods proclabel \"Claims by Year\";","ods pdf pdftoc=1;","label \"Claims by Year\";"],"answer":1,"accepted":[],"numeric":false,"explanation":"ODS PROCLABEL \"text\"; đặt nhãn bookmark.\n\nA: TITLE thay đổi tiêu đề báo cáo, không thay đổi bookmark.\nC: PDFTOC=1 chỉ mở rộng cấp bookmark đầu tiên.\nD: LABEL gán nhãn cho cột.","solution":"Pass 1: \"change the keyword TITLE to ODS PROCLABEL → bookmarks use report titles instead of procedure names\". → B.\nPass 2: TSA export: \"ODS PROCLABEL '…' before each procedure … bookmarks show the PROC LABELs\". PDFTOC=1 only controls how many bookmark levels are expanded. ✔","solutionCode":"","courseSource":"CR_01_L1_P1_review.md – 1.6 Using the Output Delivery System (PDFTOC=1, ODS PROCLABEL); CR_02 Solution for Exporting Data"},{"id":"mock2-q42","set":"mock2","number":42,"domain":"D4","topic":"","format":"Multiple choice","difficulty":"medium","type":"mc","stem":"Using default settings, which describes the workbook?","code":"ods excel file=\"&outpath/report.xlsx\";\ntitle \"Orders by Month\";\nproc freq data=profit; tables Order_Date; format Order_Date monname.; run;\ntitle \"Profit by Age\";\nproc means data=profit; var Profit; class Age_Range; run;\nods excel close;","options":["One worksheet containing both reports, with the titles shown.","No workbook is created, because ODS EXCEL requires STYLE=.","Two worksheets named \"Orders by Month\" and \"Profit by Age\".","Two worksheets (one per report); the titles are not shown by default."],"answer":3,"accepted":[],"numeric":false,"explanation":"Mỗi báo cáo một sheet; title bị ẩn theo mặc định.\n\nA: Mỗi báo cáo có worksheet riêng.\nB: STYLE= là tùy chọn.\nC: Tab được đặt tên theo procedure trừ khi bạn đặt tên sheet.","solution":"Pass 1: \"ODS EXCEL … one worksheet per report, tabs named after procedures, titles not shown by default.\" → D.\nPass 2: PQ 1.17 answer: titles included in the spreadsheets? \"No\". Tab names come from procedures unless sheet names are set (C wrong); STYLE= is optional (B wrong). ✔","solutionCode":"","courseSource":"CR_01_L1_P1_review.md – 1.6 Using the Output Delivery System (ODS EXCEL: one worksheet per report, titles not shown by default); PQ 1.17"},{"id":"mock2-q43","set":"mock2","number":43,"domain":"D4","topic":"","format":"Multiple choice","difficulty":"medium","type":"mc","stem":"Which statement about this step is true?","code":"/* --- Bắt đầu: Dữ liệu mẫu tự động tạo --- */\noptions dlcreatedir;\nlibname cr \"%sysfunc(pathname(work))/cr\";\nlibname crb \"%sysfunc(pathname(work))/cr\";\n%let outpath=%sysfunc(pathname(work));\n\ndata cr.employee_current;\n    infile datalines dlm=\"|\" dsd;\n    length EmpID 8 Name $ 12 JobTitle $ 22 Department $ 20 Salary 8;\n    format Salary dollar10.;\n    input EmpID Name $ JobTitle $ Department $ Salary;\n    datalines;\n120201|Abel, Tim|Accountant I|Accounts|42350\n120202|Brook, Ann|Accountant III|Accounts|61800\n120203|Cruz, Leo|Technician I|Engineering|39150\n120204|Dunn, Mia|Engineer II|Engineering|58600\n120205|Ellis, Bo|Engineering Manager|Engineering|87400\n120206|Fox, Jay|Warehouse Assistant|Logistics Management|30700\n120207|Gill, Ray|Logistics Coordinator|Logistics Management|45250\n120208|Hart, Zoe|Director|Logistics Management|112500\n120209|Ince, Uma|Strategy Analyst|Strategy|66300\n120210|Juan, Pia|Strategy Manager|Strategy|94450\n;\nrun;\n/* --- Kết thúc: Dữ liệu mẫu --- */\n\nproc export data=cr.employee_current\n    outfile=\"&outpath/emp_current.csv\" dbms=csv replace;\nrun;","options":["REPLACE overwrites emp_current.csv if it already exists; values that contain a comma are enclosed in quotation marks.","REPLACE replaces commas inside values with blanks.","The step fails because PROC EXPORT needs a QUIT statement.","DBMS=CSV creates an Excel workbook."],"answer":0,"accepted":[],"numeric":false,"explanation":"REPLACE = ghi đè file; giá trị chứa dấu phẩy được đặt trong nháy.\n\nB: REPLACE áp dụng cho file output, không phải các giá trị.\nC: Chỉ cần RUN.\nD: CSV là file text phân cách bằng dấu phẩy; Excel dùng DBMS/đuôi XLSX.","solution":"Pass 1: \"REPLACE (overwrite existing file)\"; \"values containing a comma are enclosed in quotation marks to distinguish them from delimiters\". → A.\nPass 2: PQ 1.19: fields in quotes = Name and Salary (values with commas). \"Only RUN needed after.\" DBMS=CSV writes a comma-delimited text file. ✔","solutionCode":"","courseSource":"CR_01_L1_P1_review.md – 1.6 Using PROC EXPORT; PQ 1.19","courseOriginal":{"stem":"Which statement about this step is true?","code":"proc export data=cr.employee_current\n    outfile=\"&outpath/emp_current.csv\" dbms=csv replace;\nrun;","answer":0,"accepted":[],"explanation":"REPLACE = ghi đè file; giá trị chứa dấu phẩy được đặt trong nháy.\n\nB: REPLACE áp dụng cho file output, không phải các giá trị.\nC: Chỉ cần RUN.\nD: CSV là file text phân cách bằng dấu phẩy; Excel dùng DBMS/đuôi XLSX."}},{"id":"mock2-q44","set":"mock2","number":44,"domain":"D4","topic":"","format":"Multiple choice","difficulty":"easy","type":"mc","stem":"Which TABLES statement creates a two-way frequency table of Store by Channel that suppresses the row and column percentages?","code":"","options":["tables Store Channel / norow nocol;","tables Store*Channel / nocum;","tables Store*Channel / norow nocol;","tables Store, Channel / nopercent;"],"answer":2,"accepted":[],"numeric":false,"explanation":"Store*Channel / norow nocol.\n\nA: Không có * thì đây là hai bảng one-way riêng biệt.\nB: NOCUM chỉ bỏ các cột cumulative.\nD: Dấu phẩy không phải cú pháp crosstab; NOPERCENT bỏ phần trăm tổng thể.","solution":"Pass 1: \"Crosstab: Customer_Continent*Order_Source (asterisk) … NOROW and NOCOL suppress row and column percentages.\" → C.\nPass 2: A lists two one-way tables (no asterisk); B suppresses cumulative columns, not row/column percentages; D uses a comma and NOPERCENT (overall percent). ✔","solutionCode":"","courseSource":"CR_01_L1_P1_review.md – 1.5 Using PROC FREQ (crosstab with *, NOROW, NOCOL); PQ 1.14"},{"id":"mock2-q45","set":"mock2","number":45,"domain":"D4","topic":"","format":"Multiple choice","difficulty":"medium","type":"mc","stem":"%let st=North;\n\nWhich TITLE statement displays the text Orders for North?","code":"","options":["title 'Orders for &st';","title \"Orders for &st\";","title \"Orders for st\";","title 'Orders for' &st;"],"answer":1,"accepted":[],"numeric":false,"explanation":"Dấu nháy kép: title \"Orders for &st\";\n\nA: Dấu nháy đơn ngăn việc thay thế – hiển thị \"&st\".\nC: Không có tham chiếu macro – hiển thị \"st\".\nD: Tham chiếu nằm ngoài chuỗi trong nháy.","solution":"Pass 1: \"Strings containing a macro variable reference must be in double quotation marks for SAS to substitute.\" → B.\nPass 2: A uses single quotes → the text &st is shown literally; C has no & reference; D puts the reference outside the string. ✔","solutionCode":"","courseSource":"CR_01_L1_P1_review.md – 1.5 Using PROC MEANS (macro variable in double quotation marks); 1.2 (double quotes for macro references)"},{"id":"set1-q1","set":"set1","number":1,"domain":"D1","topic":"Permanent tables and LIBNAME","format":"Multiple choice","difficulty":"","type":"mc","stem":"The following statement has been submitted:\n\n\n\nWhich DATA statement creates a **permanent** table?","code":"libname pg2 \"s:/workshop/data\";","options":["`data storm_new;`","`data work.storm_new;`","`data pg2.storm_new;`","`data pg2-storm_new;`"],"answer":2,"accepted":[],"numeric":false,"explanation":"Bảng lưu vĩnh viễn phải có tiền tố là libref trỏ tới một thư mục thật (`pg2.`). A và B đều ghi vào thư viện WORK, bị xóa khi kết thúc phiên SAS. D sai cú pháp vì phải dùng dấu chấm, không dùng gạch ngang.","solution":"","solutionCode":"","courseSource":""},{"id":"set1-q2","set":"set1","number":2,"domain":"D1","topic":"PROC CONTENTS","format":"Multiple choice","difficulty":"","type":"mc","stem":"What does the VARNUM option change in this report?","code":"/* --- Bắt đầu: Dữ liệu mẫu tự động tạo --- */\noptions dlcreatedir;\nlibname pg2 \"%sysfunc(pathname(work))/pg2\";\n\ndata pg2.storm_summary;\n    infile datalines dlm=\"|\" dsd;\n    length Season 8 Name $ 10 Basin $ 2 MaxWindMPH 8 MaxWindKM 8 StartDate 8 EndDate 8;\n    format StartDate EndDate date9.;\n    input Season Name $ Basin $ MaxWindMPH MaxWindKM StartDate :date9. EndDate :date9.;\n    datalines;\n1980|AGATHA|EP|115|185|09JUN1980|15JUN1980\n1980|ALBINE|SI|80|129|27NOV1979|06DEC1979\n1980|ALLEN|NA|190|306|31JUL1980|11AUG1980\n2016|MATTHEW|NA|167|269|28SEP2016|09OCT2016\n2016|MERANTI|WP|190|306|08SEP2016|17SEP2016\n2016|WINSTON|SP|178|286|07FEB2016|03MAR2016\n2017|MORA|NI|69|111|28MAY2017|31MAY2017\n2017|HARVEY|na|132|212|17AUG2017|01SEP2017\n;\nrun;\n/* --- Kết thúc: Dữ liệu mẫu --- */\n\nproc contents data=pg2.storm_summary varnum;\nrun;","options":["It lists only the numeric columns.","It lists the columns in their logical position (creation order) instead of alphabetical order.","It suppresses the descriptor portion of the table.","It prints the first 10 rows of data."],"answer":1,"accepted":[],"numeric":false,"explanation":"Mặc định PROC CONTENTS liệt kê cột theo thứ tự chữ cái; VARNUM liệt kê theo đúng thứ tự cột trong bảng (case study TSA dùng cách này). A sai vì VARNUM không lọc theo kiểu dữ liệu. C là việc của NODS khi dùng với `_ALL_`. D sai vì PROC CONTENTS không in dữ liệu.","solution":"","solutionCode":"","courseSource":"","courseOriginal":{"stem":"What does the VARNUM option change in this report?","code":"proc contents data=pg2.storm_summary varnum;\nrun;","answer":1,"accepted":[],"explanation":"Mặc định PROC CONTENTS liệt kê cột theo thứ tự chữ cái; VARNUM liệt kê theo đúng thứ tự cột trong bảng (case study TSA dùng cách này). A sai vì VARNUM không lọc theo kiểu dữ liệu. C là việc của NODS khi dùng với `_ALL_`. D sai vì PROC CONTENTS không in dữ liệu."}},{"id":"set1-q3","set":"set1","number":3,"domain":"D1","topic":"PROC IMPORT (CSV, GETNAMES)","format":"Multiple choice","difficulty":"","type":"mc","stem":"Which statement, placed in the blank, tells PROC IMPORT to read the column names from the first row of the CSV file?","code":"proc import datafile=\"&path/storm_damage.csv\"\n            dbms=csv out=storm_damage replace;\n    __________;\nrun;","options":["`getnames=yes`","`datarow=1`","`header=yes`","`namerow=0`"],"answer":0,"accepted":[],"numeric":false,"explanation":"`GETNAMES=YES` lấy dòng đầu tiên làm tên cột (với CSV đây là giá trị mặc định). B: `DATAROW=1` nghĩa là đọc dữ liệu ngay từ dòng 1, tức coi dòng tiêu đề là dữ liệu. C và D không phải câu lệnh hợp lệ của PROC IMPORT.","solution":"","solutionCode":"","courseSource":""},{"id":"set1-q4","set":"set1","number":4,"domain":"D1","topic":"PROC IMPORT (REPLACE, GUESSINGROWS)","format":"Multiple choice","difficulty":"","type":"mc","stem":"The table `work.storm_damage` already exists. A programmer submits:\n\n\n\nWhat happens?","code":"proc import datafile=\"&path/storm_damage.csv\"\n            dbms=csv out=storm_damage;\n    guessingrows=max;\nrun;","options":["The table is overwritten, and every row is used to determine column types.","The import is cancelled, and the log says that the output data set already exists and that REPLACE must be specified.","The new rows are appended to the existing table.","An ERROR occurs because GUESSINGROWS= requires REPLACE."],"answer":1,"accepted":[],"numeric":false,"explanation":"Thiếu REPLACE thì PROC IMPORT không ghi đè bảng đã có: log ghi NOTE \"Import cancelled… already exists. Specify REPLACE option to overwrite it.\" A chỉ đúng khi có REPLACE. C sai vì PROC IMPORT không bao giờ nối thêm dòng. D sai vì GUESSINGROWS=MAX (qu
