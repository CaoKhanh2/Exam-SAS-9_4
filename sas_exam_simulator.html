      "explanation": "[Correct - An arithmetic expression attempts to divide by zero for the current observation.]: Division by zero is a run-time arithmetic problem tied to that observation's actual values, and SAS sets _ERROR_ to 1 for it, the same way it does for invalid data.\n\n[Correct - Invalid character data is encountered while an INPUT statement tries to read it into a numeric variable.]: Invalid data encountered during execution — such as non-numeric text read into a numeric field — is a run-time condition that SAS flags by setting _ERROR_ to 1 for that observation.\n\n[Incorrect - A misspelled statement keyword prevents the DATA step from compiling at all.]: A compile-time syntax error prevents the DATA step from ever reaching execution for any observation, so there is no per-observation _ERROR_ value to set — the step simply does not run.\n\n[Incorrect - SAS logs a routine NOTE reporting how many observations were read from the input data set.]: A routine NOTE about observations read is purely informational reporting at the end of the step — it has nothing to do with _ERROR_ and doesn't affect it.\n\n[Incorrect - An automatic character-to-numeric conversion completes successfully for a value in the current observation.]: A successful automatic conversion is reported with a NOTE precisely because it completed without a problem; _ERROR_ is not set for it."

      "explanation": "[Correct - It opens PDF and RTF before PROC PRINT runs, so one step's output reaches both, each closed separately after.]: Opening ODS PDF and ODS RTF before the procedure runs means PROC PRINT's single execution is captured by both open destinations at once, and each is later closed independently with its own ODS ... CLOSE statement.\n\n[Incorrect - It sends the PROC PRINT output to only one destination, since ODS can only have one open destination active at a time.]: ODS supports multiple simultaneously open destinations; opening both PDF and RTF before the procedure runs lets one step's output reach both destinations.\n\n[Incorrect - It requires a separate PROC PRINT step for each open destination, since a single procedure cannot feed multiple destinations at once.]: A single procedure step's output is automatically routed to every currently open ODS destination; separate PROC PRINT steps per destination are not needed.\n\n[Incorrect - It writes the vendor report to a temporary WORK file first, then converts that file separately into PDF and RTF afterward.]: ODS writes directly to each open destination as the procedure runs; there is no intermediate WORK-file conversion step involved."

{"a proc print report was created with the following title: asia sports vehicle summary after the proc print report runs, a programmer would next like to produce a proc freq report with the following title: asia sports vehicle summary distribution by make which statement(s) would produce the new report titles?":{"title \"Asia Sports Vehicle Summary\";\nsubtitle \"Distribution by Make\";":"SUBTITLE không phải là câu lệnh tiêu đề hợp lệ trong SAS — các dòng tiêu đề bổ sung được thêm bằng TITLE2, TITLE3, v.v.","title \"Asia Sports Vehicle Summary\";\ntitle2 \"Distribution by Make\";":"TITLE đặt dòng tiêu đề thứ nhất và TITLE2 thêm dòng thứ hai bên dưới mà không thay thế dòng thứ nhất, tạo ra đủ cả hai dòng yêu cầu.","title \"Distribution by Make\";":"Một câu lệnh TITLE duy nhất thay thế mọi tiêu đề trước đó, nên chỉ riêng câu này sẽ mất dòng tiêu đề thứ nhất 'Asia Sports Vehicle Summary' thay vì thêm dòng thứ hai.","title \"Asia Sports Vehicle Summary\";\ntitle \"Distribution by Make\";":"Câu lệnh TITLE thứ hai (không phải TITLE2) thay thế tiêu đề thứ nhất chứ không thêm dòng bên dưới, nên chỉ ra 'Distribution by Make', không phải cả hai dòng."},"during data step execution, sas automatically sets the automatic variable _error_ to 1 for the current observation under certain conditions. which of the following, occurring while a data step is executing, set _error_ to 1 for the observation being processed? (choose two.)":{"A misspelled statement keyword prevents the DATA step from compiling at all.":"Syntax error lúc compile khiến DATA step không bao giờ được thực thi cho observation nào, nên không có giá trị _ERROR_ theo từng observation để gán — step đơn giản là không chạy.","An automatic character-to-numeric conversion completes successfully for a value in the current observation.":"Một phép chuyển đổi tự động thành công được báo bằng NOTE chính vì nó hoàn tất không có vấn đề; _ERROR_ không được gán cho trường hợp này.","An arithmetic expression attempts to divide by zero for the current observation.":"Chia cho 0 là lỗi số học lúc thực thi gắn với giá trị thực của observation đó, và SAS gán _ERROR_ = 1, giống như với dữ liệu không hợp lệ.","SAS logs a routine NOTE reporting how many observations were read from the input data set.":"NOTE thông thường về số observation đã đọc chỉ là thông tin báo cáo ở cuối step — không liên quan và không ảnh hưởng đến _ERROR_.","Invalid character data is encountered while an INPUT statement tries to read it into a numeric variable.":"Dữ liệu không hợp lệ gặp phải khi thực thi — ví dụ text không phải số được đọc vào biến numeric — là tình trạng lúc chạy mà SAS đánh dấu bằng cách gán _ERROR_ = 1 cho observation đó."},"the following sas program is submitted: data work.new; year=2011; amount=5000; do i=1 to 5; year=year+1; do qtr=1 to 4; amount=amount*1.1; end; end; run; proc print data=work.new noobs; run; which output is correct?":{"year amount i qtr\n2016 33637.50 5 5":"Biến chỉ số i của vòng lặp ngoài không dừng ở giá trị thực thi cuối (5) — chỉ số của DO loop được tăng thêm một lần thành 6 trước khi điều kiện thoát thất bại, nên i kết thúc ở 6.","year amount i qtr\n2016 33637.50 6 5":"Không có câu lệnh OUTPUT tường minh, nên implicit output duy nhất ở cuối DATA step chỉ xảy ra sau khi cả hai DO loop kết thúc. Year kết thúc ở 2011+5=2016; chỉ số ngoài i kết thúc ở 6 (giá trị làm điều kiện 1-đến-5 thất bại); chỉ số trong qtr kết thúc ở 5 vì cùng lý do; và amount = 5000*(1.1)^20 ≈ 33637.50.","year amount i qtr\n2017 33637.50 6 5":"Year được tăng một lần mỗi vòng lặp ngoài (5 lần từ 2011), nên giá trị cuối là 2016, không phải 2017.","year amount i qtr\n2016 33637.50 6 4":"Quy tắc tăng chỉ số ở cuối vòng lặp cũng áp dụng cho chỉ số trong qtr — nó kết thúc ở 5, không phải 4, vì bị tăng vượt giá trị thực thi cuối là 4 trước khi điều kiện vòng lặp thất bại."},"an analyst wants to keep only warehouse observations where a newly computed variable, days_in_stock, exceeds 30. two candidate data steps are shown: data logistics.aged; set logistics.stock; where days_in_stock > 30; days_in_stock = today() - received_date; run; data logistics.aged; set logistics.stock; days_in_stock = today() - received_date; if days_in_stock > 30; run; which two statements are true about these two approaches? (choose two.)":{"The second DATA step (using subsetting IF) filters correctly, since IF runs after days_in_stock is computed.":"Subsetting IF được đánh giá sau khi DATA step đã tính days_in_stock trong program data vector cho observation hiện tại, nên nó lọc đúng theo giá trị đã tính.","The first DATA step (using WHERE) fails to filter as intended, since days_in_stock doesn't exist yet when WHERE is evaluated.":"WHERE được áp dụng ngay lúc SAS đọc observation từ nguồn, trước cả khi phép gán days_in_stock chạy — vì logistics.stock không có biến này tại thời điểm đó, mệnh đề WHERE không thể lọc theo nó như mong muốn.","WHERE and subsetting IF are fully interchangeable in every DATA step, always producing identical results.":"Hai cách này không thể thay thế nhau trong mọi trường hợp — như ví dụ này cho thấy, WHERE không nhìn thấy biến được tính sau đó trong DATA step, còn subsetting IF thì có.","WHERE always executes after all assignment statements in the DATA step have run, ensuring any computed variable is available to it.":"WHERE được đánh giá khi bản ghi được đọc từ nguồn, trước khi các câu lệnh gán của DATA step thực thi cho observation đó — không phải sau.","Subsetting IF can filter directly on the raw input data set before SAS reads any observations into the program data vector, exactly like WHERE.":"Điều ngược lại mới đúng: WHERE hoạt động ở giai đoạn đọc dữ liệu nguồn; subsetting IF chỉ được đánh giá sau khi observation đã vào program data vector và các phép gán đã chạy."},"given the following data set: subjid ae_txt1 ae_sev1 ae_txt2 ae_sev2 ae_txt3 ae_sev3 1001 fever mild headache moderate nausea mild 1002 gout severe fever moderate headache severe a proc transpose step produced the following long-format data set from it: subjid col1 1001 fever 1001 mild 1001 headache 1001 moderate 1001 nausea 1001 mild 1002 gout 1002 severe 1002 fever 1002 moderate 1002 headache 1002 severe which type of statement in the proc transpose step lists the ae_txt/ae_sev variables so they are stacked, in this order, into the single col1 column?":{"ID":"ID cung cấp giá trị dùng để đặt tên các cột sau transpose, chứ không liệt kê các biến được xếp chồng theo dòng.","IDLABEL":"IDLABEL chỉ cung cấp label cho các giá trị của biến ID; nó không chọn biến nào được transpose.","CLASS":"CLASS trong PROC TRANSPOSE nhóm output theo một biến phân loại bổ sung; nó không phải là thứ chọn các biến để transpose vào COL1.","VAR":"Câu lệnh VAR liệt kê các biến phân tích (ae_txt1, ae_sev1, ae_txt2, ...) mà PROC TRANSPOSE xếp chồng, theo thứ tự liệt kê, vào một cột COL1 duy nhất cho mỗi subjid."},"assume that work.ds1 and work.ds2 exist and the following sas program is submitted: ods pdf file='results.pdf'; proc print data=work.ds1; run; proc freq data=work.ds1; proc freq data=work.ds2; run; ods pdf close; how many pdf files are created?":{"3 PDF files -- one per procedure request":"File PDF mới chỉ được tạo khi một câu lệnh ods pdf file= mới được thực thi; chạy ba procedure không tạo ra ba file.","2 PDF files -- one for the PRINT output and one for the FREQ output":"ODS PDF không tách output theo loại procedure thành các file riêng — mọi output giữa lúc mở và CLOSE đều đi vào một file đích.","1 PDF file with all the output combined":"Destination ODS PDF vẫn mở và hướng tới results.pdf cho đến khi gặp ods pdf close;, nên output của mọi procedure chạy ở giữa — PROC PRINT và cả hai PROC FREQ — đều được ghi nối vào một file PDF duy nhất.","2 PDF files -- one file for each data set used":"ODS PDF không mở file mới cho mỗi data set được tham chiếu — chỉ ods pdf file=/ods pdf close; quyết định số file được tạo, và ở đây chỉ có một cặp mở/đóng."},"a farm-management data step computes yield per acre: data farm.yield_summary; set farm.yield_raw; yield_per_acre = total_yield / acres; run; some observations have a missing value for acres. what happens for those observations, and what appears in the log?":{"SAS automatically drops any observation with a missing value for acres from the final output data set, without logging any message at all.":"Kết quả số học bị missing không tự động loại bỏ observation; nó vẫn được ghi vào data set output với yield_per_acre là missing trừ khi có logic loại trừ tường minh, và NOTE vẫn được ghi ra.","SAS computes yield_per_acre as missing for that observation, logs a 'Missing values were generated' NOTE, and keeps processing the rest.":"Phép tính số học với một toán hạng missing luôn cho kết quả missing; SAS báo điều này bằng NOTE 'Missing values were generated' (không gây dừng) và tiếp tục thực thi DATA step.","The DATA step terminates immediately upon encountering the first observation with a missing acres value, aborting the entire run.":"Giá trị missing trong biểu thức số học không làm dừng DATA step; đây là tình trạng mức NOTE có thể phục hồi, không phải lỗi nghiêm trọng.","SAS treats the missing acres value as though it equaled 1, allowing the division to complete without producing any missing result.":"SAS không bao giờ thay toán hạng missing bằng 1 (hay giá trị nào khác) trong phép tính — missing lan truyền qua phép tính thành missing, không bị thay thế ngầm."},"an hr analyst builds a mailing extract from the full hr master, wanting only four specific columns and a friendlier name for the zip code column. data mailing_extract; set hr_master(keep=emp_id first_name last_name mail_zip rename=(mail_zip=zip)); run; what do the keep= and rename= data set options together accomplish here?":{"Only the four listed variables are read in, with mail_zip renamed to zip as it's read.":"Data set option gắn trực tiếp vào hr_master có tác dụng ngay lúc đọc data set: KEEP= giới hạn biến nào được đưa vào program data vector ngay từ đầu, và RENAME= đổi tên mail_zip thành zip trong cùng lần đọc đó, trước mọi câu lệnh của DATA step.","RENAME= creates a duplicate variable, so mailing_extract ends up with both mail_zip and zip":"RENAME= đổi tên biến chứ không nhân bản nó — mailing_extract chỉ có zip, không có cả hai tên.","KEEP= only affects what is written to mailing_extract, while every variable in hr_master is still read into the program data vector each iteration":"Đó là mô tả của câu lệnh KEEP áp dụng cho data set output, không phải data set option KEEP= ở input — khi gắn vào hr_master như trên, nó giới hạn biến nào được đọc vào ngay từ đầu.","KEEP= and RENAME= cannot be combined in the same data set option list and would cause a syntax error":"Nhiều data set option, cách nhau bằng khoảng trắng, thường được kết hợp trong một danh sách trong ngoặc đúng như vậy — đây là cú pháp chuẩn, hợp lệ, không phải lỗi."},"given the following sas data set work.class (columns name, gender, age): - anna, f, 23 - ben, m, 25 - bob, m, 21 - brian, m, 27 - edward, m, 26 - emma, f, 32 - joe, m, 34 - sam, f, 32 - tom, m, 24 the following program is submitted: data work.males work.females(drop=age); set work.class; drop gender; if gender=\"m\" then output work.males; else if gender=\"f\" then output work.females; run; how many variables are in the data set work.males?":{"1":"Câu lệnh DROP gender chỉ loại Gender khỏi cả hai data set output — Name và Age vẫn còn trong WORK.MALES, tức 2 biến, không phải 1.","2":"Câu lệnh DROP gender áp dụng cho mọi data set tạo ra trong DATA step này, loại Gender khỏi WORK.MALES; option (drop=age) chỉ áp dụng cho WORK.FEMALES. Vì vậy WORK.MALES giữ Name và Age — 2 biến.","3":"Gender bị loại khỏi WORK.MALES bởi câu lệnh DROP trong DATA step, nên WORK.MALES chỉ có 2 biến (Name, Age), không phải cả 3 biến ban đầu.","The program does not execute due to a syntax error.":"Chương trình hợp lệ về cú pháp — câu lệnh DATA có thể đặt tên nhiều data set output kèm option riêng như (drop=age), và logic IF/ELSE IF phân dòng đúng; nó chạy không có syntax error."},"the variable name in the data set employee has a $char10. format. the variable name in the data set sales has a $char15. format. the following sas program is submitted: data both; merge employee sales; by name; run; what is the format for the variable name in the data set both?":{"$CHAR":"$CHAR đứng một mình (không có độ rộng) không phải là format được giữ lại ở đây; format đầy đủ $CHAR10. từ Employee, data set được liệt kê đầu tiên, mới là format được mang sang.","$CHAR10":"Khi MERGE gặp cùng một biến có thuộc tính khác nhau giữa các data set, thuộc tính từ data set được liệt kê đầu tiên (Employee) được ưu tiên, nên Name giữ format $CHAR10.","$CHAR15":"$CHAR15. là format của Sales, nhưng Employee được liệt kê trước trong câu lệnh MERGE, nên format $CHAR10. của Employee được giữ lại.","no format defined":"Cả hai data set nguồn đều định nghĩa format tường minh cho Name, và MERGE mang theo format từ data set đầu tiên mà biến xuất hiện."},"a coffee shop's raw sales extract stores the column unit_price as character data (for example, the text value \"3.50\") because it was imported from a point-of-sale export. a programmer submits the following data step: data work.receipts; set work.posraw; total_due = qty * unit_price; run; the sas log shows: note: character values have been converted to numeric values at the places given by: (line):(column). no error or warning appears anywhere else in the log. what does this note mean for the data step?":{"SAS silently dropped qty from the calculation and substituted a missing value.":"qty không bị ảnh hưởng bởi NOTE này — việc chuyển đổi áp dụng cho unit_price, và phép nhân vẫn dùng giá trị thực của qty.","SAS renamed unit_price to a brand-new temporary numeric variable, leaving the original character column completely unused in the calculation.":"Không có đổi tên nào — SAS chuyển đổi giá trị tại chỗ mỗi khi cần cho biểu thức; nó không tạo hay thay thế bằng một biến riêng.","SAS converted unit_price to numeric automatically and completed the calculation; the NOTE is only informational.":"SAS tự động chuyển đổi lúc thực thi và ghi nhận bằng NOTE vì step vẫn chạy thành công; nó cảnh báo một vấn đề thiết kế đáng kiểm tra mà không dừng việc xử lý.","The DATA step failed to compile, so work.receipts was never created.":"Chuyển đổi tự động từ ký tự sang số được báo bằng NOTE, không phải ERROR; step compile và thực thi, và work.receipts được tạo."},"two files list the same 200 employees in identical row order: one with base salary, one with a bonus percentage. a programmer wants a single file with both figures per employee. data payroll_full; merge base_salary bonus_pct; run; since there is no by statement, how does sas combine observations from base_salary and bonus_pct here?":{"The step fails immediately because MERGE always requires a BY statement to run":"BY statement là tùy chọn với MERGE — bỏ nó đi chỉ chuyển hành vi sang one-to-one merge theo vị trí chứ không gây lỗi.","SAS automatically matches rows on any common variable names between the two data sets, ignoring row order":"Việc tự động khớp theo giá trị biến chung chỉ xảy ra khi có BY statement (match-merge) — không có nó, MERGE không có khóa để khớp và chỉ đi theo vị trí dòng.","SAS produces every possible combination of a base_salary row with a bonus_pct row (a Cartesian product)":"Ghép chéo mọi dòng với mọi dòng khác không phải là cách MERGE hoạt động — MERGE luôn kết hợp tối đa một observation từ mỗi data set được liệt kê trong mỗi vòng lặp.","SAS pairs observations purely by position — obs 1 with obs 1, obs 2 with obs 2, and so on.":"MERGE không có BY statement là one-to-one merge: SAS kết hợp các observation hoàn toàn theo vị trí của chúng trong mỗi data set, không khớp theo khóa nào cả."},"a telecom billing data step computes: data telecom.contracts; set telecom.contract_raw; months_elapsed = intck('month', contract_start, contract_end); run; what does intck('month', contract_start, contract_end) calculate?":{"The number of month-boundary crossings between contract_start and contract_end, effectively how many calendar months apart the two dates are.":"INTCK đếm số lần ranh giới của interval được chỉ định (ở đây là đầu tháng dương lịch) bị vượt qua giữa hai ngày, bất kể ngày cụ thể trong mỗi tháng.","A value of 1 if the two dates fall in the same calendar year, and 0 otherwise.":"Kết quả của INTCK không phải là cờ cùng năm; nó trả về số ranh giới tháng bị vượt qua, có thể là bất kỳ số nguyên nào, không chỉ 0 hoặc 1.","The exact number of calendar days that separate contract_start from contract_end, counted one at a time regardless of month boundaries crossed.":"INTCK đếm ranh giới interval — ở đây là tháng dương lịch — không phải số ngày trôi qua; phép trừ trực tiếp hai giá trị ngày mới cho ra số ngày.","A brand-new date value that falls exactly one calendar month after contract_start, computed directly by the function itself.":"Tính một ngày mới đã dịch chuyển là việc của INTNX, không phải INTCK; INTCK chỉ trả về số ranh giới bị vượt qua, không bao giờ trả về giá trị ngày."},"the following sas program is submitted: proc means data=work.schools median; \u003cinsert statement(s) here> run; work.schools has two numeric variables, and the following proc means report is produced: which statement completes the program and creates this report?":{"class location;":"Báo cáo tách median theo location (school1, school2) và hiển thị cột N Obs bên cạnh mỗi cặp Variable/Median — đây là bố cục đặc trưng PROC MEANS tạo ra khi location được đặt trong câu lệnh CLASS, và CLASS không yêu cầu dữ liệu input phải được sort trước.","group by location;":"GROUP BY không phải cú pháp hợp lệ của PROC MEANS — việc nhóm trong PROC MEANS được thực hiện bằng câu lệnh CLASS hoặc BY.","by location;":"Câu lệnh BY sẽ yêu cầu WORK.SCHOOLS được sort theo location trước và tạo một báo cáo riêng cho mỗi BY group, không có bố cục N Obs/Variable gộp kiểu CLASS như ở đây.","by location; id location;":"ID là câu lệnh của PROC PRINT/REPORT, không phải câu lệnh hợp lệ của PROC MEANS, và riêng BY vẫn yêu cầu dữ liệu đã sort — không cái nào khớp với bố cục báo cáo dựa trên CLASS này."},"a fundraising data step maintains a running total across daily gift records: data charity.running_total; set charity.daily_gifts; retain campaign_total 0; campaign_total + gift_amount; run; what does the statement campaign_total + gift_amount; (the sum statement form) do?":{"It adds gift_amount to campaign_total's retained value, treating a missing gift_amount as 0, without resetting each iteration.":"Dạng sum statement tự động retain biến tích lũy qua các observation và coi giá trị cộng bị missing là 0, nên campaign_total cộng dồn gift_amount đúng mà không cần xử lý missing riêng.","It requires an explicit RETAIN statement to behave any differently from a plain assignment written as campaign_total = campaign_total + gift_amount;.":"Điều này ngược hoàn toàn — đặc điểm của dạng + gộp là nó tự retain biến tích lũy và tự coi phần cộng missing là 0, khác với phép gán thường, vốn cần RETAIN tường minh và xử lý missing riêng mới hoạt động giống vậy.","It replaces campaign_total with gift_amount each time the step runs, discarding whatever value had previously accumulated there.":"Vì campaign_total được retain ngầm bởi dạng sum statement này, giá trị trước đó được giữ lại và gift_amount được cộng vào, không ghi đè lên nó.","It compares campaign_total against gift_amount directly and assigns whichever of the two values happens to be larger to campaign_total.":"Dạng sum statement luôn cộng hai giá trị với nhau; nó không bao giờ so sánh để lấy giá trị lớn nhất — việc đó cần một hàm như MAX."},"two regional customer data sets are concatenated: data combined.customers; set region_east.customers region_west.customers; run; the log reports error: variable customer_id has been defined as both character and numeric. what causes this, and what must be done to fix it?":{"The two source data sets store customer_id with different types (character vs numeric); one must be converted before combining them with SET.":"SAS yêu cầu một biến cùng tên phải có kiểu thống nhất giữa các data set được nối bằng SET; sự không khớp ký tự-vs-số của customer_id phải được giải quyết (ví dụ bằng chuyển đổi tường minh) trước khi kết hợp.","The BY statement is missing from the SET statement, so SAS has no way to align observations between the two data sets correctly.":"SET nối đơn thuần không cần BY statement — BY chỉ cần khi interleave. Thiếu nó không gây ra lỗi xung đột kiểu này.","The two data sets simply have a different number of observations, which SAS reports here as an underlying type conflict error.":"Số observation khác nhau giữa các data set được nối là hoàn toàn bình thường và không gây ra ERROR như vậy; số dòng không liên quan đến kiểu của biến.","One of the two source data sets is missing the customer_id variable entirely, so SAS cannot reconcile or align any of its attributes between the two inputs.":"Nếu một data set thiếu biến này, SAS chỉ đơn giản mang biến từ data set có nó sang, không báo ERROR xung đột kiểu — thông báo đó có nghĩa cụ thể là kiểu không thống nhất, không phải thiếu biến."},"a company keeps separate sas data sets for three regional sales offices, each with the same variable structure, and wants one combined data set: data work.allregions; set work.north work.south work.east; run; what is the result of this data step?":{"work.allregions contains north's observations, then south's, then east's, stacked in listed order.":"Liệt kê nhiều data set trong câu lệnh SET sẽ nối chúng theo thứ tự cho trước, đọc mọi observation của data set đầu tiên, rồi mọi observation của data set tiếp theo, và cứ thế.","work.allregions contains only the observations that appear in all three input data sets, as if an intersection had been taken.":"Câu lệnh SET liệt kê nhiều data set sẽ nối chúng; nó không tính phần giao của các dòng khớp nhau giữa ba data set.","work.allregions contains one merged observation per matching key, combining variables from north, south, and east side by side.":"Kết hợp biến cạnh nhau theo khóa khớp là hành vi của MERGE với BY statement, không phải của câu lệnh SET đơn thuần liệt kê nhiều data set.","SAS only reads work.east, since the last data set named in a SET statement overrides the earlier ones listed.":"SET không bỏ các data set trước để ưu tiên data set cuối; cả ba đều được đọc và xếp chồng theo thứ tự xuất hiện."},"the sas log reports three general categories of messages while a program runs. which category indicates a condition that did not prevent the step from completing, but flags something the programmer should probably investigate — as opposed to a purely routine status message?":{"None of these — SAS does not distinguish between message severities.":"Thông báo trong log SAS được phân loại rõ ràng thành ERROR, WARNING và NOTE, mỗi mức có ý nghĩa và độ nghiêm trọng riêng.","WARNING":"WARNING báo một tình trạng mà SAS có thể xử lý vòng qua và vẫn hoàn tất step, như chuyển đổi kiểu tự động hay biến chưa khởi tạo — nhưng đây chính là loại thông báo lập trình viên nên xem xét, vì nó thường chỉ ra vấn đề ngoài ý muốn trong dữ liệu hoặc code.","ERROR":"ERROR cho thấy vấn đề nghiêm trọng hơn, thường khiến một câu lệnh, step hoặc một phần xử lý không hoàn tất đúng — không chỉ là thứ cần xem qua mà là một lỗi thực sự.","NOTE":"NOTE là mức thông báo thông thường, mang tính thông tin của SAS — nó báo trạng thái bình thường, như số observation đã đọc hay kích thước data set, và bản thân nó không báo hiệu tình trạng cần điều tra."},"to help diagnose a data-quality issue, a programmer adds the following line inside a data step that processes inventory counts: if units_on_hand \u003c 0 then putlog \"warning: negative units_on_hand for item=\" item_id units_on_hand=; for observations where units_on_hand is negative, what happens as a direct result of this statement?":{"The DATA step stops processing entirely as soon as any negative value is encountered in the data step.":"PUTLOG chỉ ghi thông báo ra log — nó không ảnh hưởng đến việc DATA step có tiếp tục xử lý các câu lệnh hay observation tiếp theo hay không.","A diagnostic message naming item_id and its value is written to the log; no data is changed.":"PUTLOG hoạt động như PUT nhưng ghi ra log thay vì đích thông thường của DATA step, nên đây là cách phổ biến để đưa ra thông báo chẩn đoán tùy chỉnh mà không thay đổi dữ liệu hay dừng thực thi.","The observation is excluded from the output data set.":"Ghi thông báo ra log bằng PUTLOG không lọc hay loại observation khỏi output — cần OUTPUT tường minh hoặc subsetting IF/WHERE cho việc đó, và ở đây không có cái nào.","SAS automatically resets units_on_hand to 0 for that observation.":"PUTLOG chỉ mang tính chẩn đoán; nó không thay đổi giá trị biến nào. units_on_hand giữ nguyên như khi đọc vào."},"assume that sasuser.one does not exist and that the following sas program is submitted at the beginning of a new sas session. data sasuser.one; x=1; y=27; output one; run; what happens when this program runs?":{"The data set Sasuser.One is created with 2 variables and 3 observations.":"Câu lệnh OUTPUT đặt tên 'one', không khớp với data set sasuser.one trong câu lệnh DATA, nên gây ra lỗi thay vì ghi 3 observation.","The data set Sasuser.One is created with 2 variables and 0 observations.":"SAS xác định 2 biến (x và y) lúc compile, nhưng OUTPUT one; không khớp với tên data set đã khai báo là sasuser.one, gây lỗi làm step không ghi được observation nào — Sasuser.One có 2 biến và 0 observation.","The data set Work.One is created with 2 variables and 1 observation.":"Câu lệnh DATA đặt tên tường minh là sasuser.one, không phải work.one, nên không có data set nào trong thư viện Work được tạo.","The data set Sasuser.One is created with 2 variables and 1 observation.":"Câu lệnh OUTPUT không khớp gây lỗi trước khi một observation được ghi thành công, nên data set có 0 observation, không phải 1."},"a hotel wants to see how room bookings break down by room type and season: proc freq data=work.bookings; tables roomtype*season; run; which of the following statements about this default two-way tables output are true? (choose two.)":{"A chi-square test of association between roomtype and season is automatically calculated and printed with no additional option requested.":"Kiểm định chi-square không được tạo bởi câu lệnh TABLES đơn thuần; cần thêm tường minh option CHISQ vào câu lệnh TABLES.","Listing roomtype*season builds a separate one-way table for each distinct roomtype value instead of a single combined two-way table.":"Cú pháp dấu sao roomtype*season tạo một bảng two-way cross-tabulation duy nhất, không phải chuỗi các bảng one-way riêng.","Observations with a missing roomtype or season value are excluded from the table by default, unless the MISSING option is added.":"PROC FREQ loại các observation có giá trị missing ở một trong hai biến được ghép khỏi bảng mặc định; phải thêm option MISSING để tính missing là một nhóm hợp lệ.","The TABLES statement automatically arranges roomtype and season into descending frequency order before building the crosstab.":"Thứ tự dòng và cột mặc định dựa trên thứ tự giá trị nội bộ hoặc giá trị đã format của biến, không phải tần số giảm dần; sắp theo tần số giảm dần cần option ORDER=FREQ.","The default cell shows the frequency count plus row, column, and overall percentages for each combination.":"Bố cục ô mặc định của bảng two-way trong PROC FREQ gồm tần số cùng phần trăm theo dòng, phần trăm theo cột và phần trăm trên tổng, cho mọi tổ hợp của hai biến."},"an annual craft fair wants its vendor report available as both a pdf and a word-compatible document from a single run: ods pdf file=\"/output/vendor_report.pdf\"; ods rtf file=\"/output/vendor_report.rtf\"; proc print data=work.vendors; run; ods pdf close; ods rtf close; what does this sequence of ods statements accomplish?":{"It sends the PROC PRINT output to only one destination, since ODS can only have one open destination active at a time.":"ODS hỗ trợ nhiều destination mở đồng thời; mở cả PDF và RTF trước khi procedure chạy giúp output của một step đến được cả hai destination.","It opens PDF and RTF before PROC PRINT runs, so one step's output reaches both, each closed separately after.":"Mở ODS PDF và ODS RTF trước khi procedure chạy nghĩa là một lần thực thi PROC PRINT được ghi nhận bởi cả hai destination đang mở, và mỗi destination sau đó được đóng riêng bằng câu lệnh ODS ... CLOSE của nó.","It requires a separate PROC PRINT step for each open destination, since a single procedure cannot feed multiple destinations at once.":"Output của một procedure step được tự động chuyển đến mọi ODS destination đang mở; không cần PROC PRINT riêng cho mỗi destination.","It writes the vendor report to a temporary WORK file first, then converts that file separately into PDF and RTF afterward.":"ODS ghi trực tiếp vào mỗi destination đang mở khi procedure chạy; không có bước chuyển đổi qua file WORK trung gian nào."},"work.quarterly has variables q1_sales q2_sales q3_sales q4_sales. a programmer wants to increase every quarter's value by 3% in place, using an array rather than four separate assignment statements. which code correctly does this?":{"array qsales{4} q1_sales q2_sales q3_sales q4_sales; do i = 1 to 4; qsales{i} = qsales{i} * 1.03; end;":"Array gom bốn biến theo quý dưới một tên, và DO loop từ 1 đến 4 lần lượt đi qua từng phần tử qsales{i}, nhân nó với 1.03 tại chỗ — xử lý đủ bốn quý đúng một lần.","array qsales{4} q1_sales q2_sales q3_sales q4_sales; do i = 1 to 4; qsales = qsales{i} * 1.03; end;":"Vế trái của phép gán phải là phần tử riêng qsales{i}, không phải tên array qsales — gán vào chính tên array là không hợp lệ theo cách câu lệnh được viết.","array qsales{4} q1_sales q2_sales q3_sales q4_sales; qsales = qsales * 1.03;":"Tên array tự nó không phải là giá trị có thể nhân — bạn phải tham chiếu một phần tử riêng như qsales{i} trong vòng lặp; câu lệnh này không hợp lệ như đã viết.","array qsales{4} q1_sales q2_sales q3_sales q4_sales; do i = 1 to 3; qsales{i} = qsales{i} * 1.03; end;":"Vòng lặp chỉ chạy i = 1 đến 3, cập nhật q1_sales đến q3_sales nhưng để nguyên q4_sales (chỉ số 4) ở giá trị ban đầu."},"a logistics manager wants a roster listing every warehouse location, even ones that currently have no staff assigned, alongside any assigned staff member's name. proc sql; select w.warehouse_id, w.city, s.staff_name from warehouses as w left join staff_assignments as s on w.warehouse_id = s.warehouse_id; quit; what happens to a warehouse_id in warehouses that has no matching row in staff_assignments?":{"It still appears exactly once in the result, with staff_name set to missing":"LEFT JOIN giữ mọi dòng của bảng bên trái (warehouses) dù staff_assignments có warehouse_id khớp hay không; khi không khớp, các cột lấy từ bảng bên phải, như staff_name, sẽ là missing.","It is silently dropped from the result set entirely":"Loại bỏ các dòng warehouse không khớp là hành vi của inner join — LEFT JOIN giữ lại mọi dòng của bảng bên trái (warehouses) bất kể có khớp hay không.","The query fails at run time because LEFT JOIN requires a match on both sides":"LEFT JOIN được thiết kế để chấp nhận dòng bên trái không khớp mà không lỗi — đó chính là hành vi phân biệt nó với inner join.","It appears once for every row in staff_assignments regardless of warehouse_id, producing a full cross join":"Cross join không giới hạn, bỏ qua điều kiện ON mới làm vậy — LEFT JOIN vẫn áp dụng điều kiện ON, nó chỉ thêm mỗi dòng bên trái không khớp một lần chứ không bỏ qua khóa join."},"several sas character functions can be used while searching text, but they don't all return the same kind of result. which of the following functions return the numeric starting position of a substring within a longer string, rather than returning the substring's text itself? (choose two.)":{"FIND":"FIND hoạt động như INDEX, có thêm option như khớp không phân biệt hoa thường và vị trí bắt đầu, nhưng cũng trả về vị trí dạng số của chỗ khớp, không phải đoạn text khớp.","TRANWRD":"TRANWRD trả về bản sao của chuỗi gốc với các lần xuất hiện của một chuỗi con được thay bằng chuỗi khác — nó trả về text, không phải vị trí.","SUBSTR":"SUBSTR trả về các ký tự tại vị trí và độ dài cho trước — một đoạn text, không phải số vị trí.","INDEX":"INDEX tìm một chuỗi con trong chuỗi và trả về vị trí dạng số nơi nó xuất hiện đầu tiên, hoặc 0 nếu không tìm thấy.","SCAN":"SCAN trả về text của từ thứ n trong chuỗi có delimiter — một chuỗi con, không phải vị trí."},"given the sas data set work.one: - x y z - 1 a 27 - 1 a 33 - 1 b 45 - 2 a 52 - 2 b 69 - 3 b 70 - 4 a 82 - 4 c 91 the following sas program is submitted: data work.two; set work.one; by x y; if first.y; run; proc print data=work.two noobs; run; select one option. which report is produced?":{"- 1 A 27\n- 1 B 45\n- 2 A 52\n- 2 B 69\n- 3 B 70\n- 4 A 82\n- 4 C 91":"Với BY X Y, First.Y đúng mỗi khi tổ hợp X-Y thay đổi — điều đó xảy ra ở mọi dòng ở đây: (1,A), (1,B), (2,A), (2,B), (3,B), (4,A), (4,C) — nên IF First.Y giữ đúng một dòng cho mỗi tổ hợp X-Y riêng biệt theo thứ tự đó.","- 1 B 45\n- 2 A 52\n- 2 B 69\n- 3 B 70\n- 4 A 82\n- 4 C 91":"Báo cáo này thiếu dòng X=1, Y=A (Z=27) — First.Y cũng đúng ở observation đầu tiên, vốn bắt đầu một nhóm X-Y mới, nên dòng đó phải có trong output.","- 1 A 33\n- 1 B 45\n- 2 A 52\n- 2 B 69\n- 3 B 70\n- 4 A 82\n- 4 C 91":"First.Y của nhóm (1,A) đúng ở dòng đầu của nhóm (Z=27), không phải dòng thứ hai (Z=33), nên báo cáo này giữ sai observation cho nhóm đó.","- 1 A 27\n- 1 B 45\n- 2 A 52\n- 2 B 69\n- 4 A 82\n- 4 C 91":"Báo cáo này bỏ sót dòng X=3, Y=B (Z=70) — tổ hợp đó cũng là một nhóm X-Y mới với First.Y đúng, nên phải xuất hiện trong output."},"which statement about sas libraries is true?":{"A SAS library is a collection of one or more SAS files that are referenced and stored as a unit.":"Đây là định nghĩa chuẩn của SAS library: một tập hợp các file SAS (data set, catalog, v.v.) được nhận diện và tham chiếu như một đơn vị thông qua libref.","A single SAS library must contain files that are stored in different physical locations.":"Các file của một SAS library được lưu cùng nhau tại một vị trí vật lý (ví dụ một thư mục hoặc một nguồn dữ liệu), không rải rác ở nhiều vị trí khác nhau.","At the end of each session, SAS deletes the contents of all SAS libraries.":"Chỉ thư viện WORK là tạm thời và bị xóa khi kết thúc session; các thư viện permanent giữ nguyên nội dung qua các session.","You refer to a SAS library by a logical name called a libname.":"Thuật ngữ chính xác cho tên logic gán cho library là \"libref\" — LIBNAME là tên của câu lệnh dùng để gán nó, không phải tên của tham chiếu."},"a coffee shop stores each transaction in work.cuptrans, with variables orderid, item, price, baristaid, and ordertime: proc print data=work.cuptrans; var item price ordertime; run; what effect does the var statement have in this proc print step?":{"It renames orderid and baristaid to item, price, and ordertime in the printed output.":"VAR chọn và sắp xếp các biến có sẵn để hiển thị; nó không đổi tên biến nào trong data set hay trong báo cáo.","It restricts the report to just item, price, and ordertime, in that order, omitting the rest.":"VAR vừa chọn biến nào xuất hiện trong báo cáo PROC PRINT vừa quyết định thứ tự hiển thị từ trái sang phải, nên orderid và baristaid đơn giản bị bỏ khỏi output.","It produces three separate reports, one for each of item, price, and ordertime listed on the statement.":"Một câu lệnh VAR tạo một báo cáo gộp chứa các biến được liệt kê dưới dạng cột, không phải báo cáo riêng cho mỗi biến.","It sorts the printed report first by item, then by price, then by ordertime, before displaying any rows.":"VAR chỉ quyết định biến nào được hiển thị và thứ tự cột; sort các dòng cần PROC SORT trước hoặc câu lệnh BY, không phải VAR."},"a print shop wants a report of only its urgent orders from a larger order queue: proc print data=work.orders; where rushorder = 'y'; var orderid customer duedate; run; what does the where statement do in this proc print step?":{"It prints all orders but sorts rush orders to appear at the top of the report.":"WHERE loại hoàn toàn các dòng không khớp khỏi báo cáo chứ không sắp xếp lại mọi dòng với các dòng khớp được đẩy lên đầu.","It permanently deletes every non-rush order from the work.orders data set once the step completes.":"WHERE trong PROC PRINT chỉ lọc những gì hiển thị trong báo cáo đó; nó không sửa, xóa hay ghi đè data set work.orders bên dưới.","It creates a new variable named rushorder in the report if one does not already exist in the data set.":"WHERE đánh giá giá trị của một biến có sẵn để lọc dòng; nó không tạo biến mới, và rushorder phải tồn tại sẵn trong work.orders thì điều kiện này mới hoạt động.","It restricts the report to rows where rushorder equals 'Y', without altering work.orders itself.":"WHERE lọc observation nào được đọc cho báo cáo ở giai đoạn chọn dòng; nó giữ nguyên hoàn toàn data set nguồn work.orders, chỉ ảnh hưởng đến những gì được hiển thị."},"an hr data step computes each employee's tenure: data hr.staff; set hr.staff_raw; tenure_days = today() - hire_date; run; what does the expression today() - hire_date calculate for each employee?":{"The number of days between hire_date and today, since subtracting two SAS date values yields a plain day count.":"Cả TODAY() và hire_date đều là giá trị ngày SAS, và trừ một giá trị ngày cho một giá trị ngày khác cho ra số ngày dương lịch giữa chúng.","The employee's precise age expressed in whole years, calculated directly as of today's current date.":"Tuổi tính bằng năm cần chia hiệu số ngày cho khoảng 365.25 hoặc tương tự; phép trừ đơn thuần hai giá trị ngày cho ra số ngày, không phải tuổi.","A brand-new SAS date value representing hire_date shifted forward by the current date's day-of-month component only.":"Trừ hai giá trị ngày SAS cho ra số ngày dạng numeric, không phải một giá trị ngày khác.","The number of business days only, excluding weekends and holidays entirely, counted between hire_date and today's date.":"Phép trừ đơn thuần đếm mọi ngày dương lịch kể cả cuối tuần; loại trừ cuối tuần cần thêm logic ngoài biểu thức này."}}
</script>

Review setup.","setupCode":""},{"id":"p2course","name":"SAS Programming 2 – lesson quizzes & activities","source":"raw/P2_L01..L07","note":"Activities use the SAS Programming 2 course data; quiz answers are derived.","setupCode":""}],"questions":[{"id":"mock1-q1","set":"mock1","number":1,"domain":"D1","topic":"","format":"Multiple choice","difficulty":"easy","type":"mc","stem":"Which statement best describes a DATA step?","code":"","options":["It generally reads data from an input source, processes it, and creates a SAS table.","It processes an existing SAS table in a predefined way, for example to produce a report.","It is a global statement that sets an option for the whole SAS session.","It must always end with a QUIT statement."],"answer":0,"accepted":[],"numeric":false,"explanation":"DATA step = đọc dữ liệu đầu vào, xử lý, tạo bảng SAS. PROC step = xử lý một bảng theo cách định sẵn.\n\nB: Đây là định nghĩa của PROC step trong khóa học, không phải DATA step.\nC: Global statement (TITLE, OPTIONS, LIBNAME) nằm ngoài các step; DATA step là một step.\nD: Hầu hết các step kết thúc bằng RUN; chỉ một số ít PROC step kết thúc bằng QUIT.","solution":"The course defines a DATA step as one that \"generally reads data from an input source, processes it, and creates a SAS table\" (it may also filter rows, compute columns, join tables).\nPass 2: re-read the PROC definition on the same page – PROCs process a SAS table in a predefined way – confirming A is the DATA step and B the PROC step.","solutionCode":"","courseSource":"P1_L01_essentials.md – Page 6/13 SAS Program Structure"},{"id":"mock1-q2","set":"mock1","number":2,"domain":"D2","topic":"","format":"Performance","difficulty":"medium","type":"sa","stem":"Run the program to create work.staff. Then write a DATA step that reads work.staff and creates work.itstaff containing only the rows where Dept is IT, and adds a column Total = Salary + Bonus.\n\nHow many rows are in work.itstaff?","code":"data staff;\n    input EmpID $ Dept $ Salary Bonus;\n    datalines;\nE01 Sales 52000 3000\nE02 Sales 48000 2000\nE03 IT 61000 4000\nE04 IT 57000 1000\nE05 HR 45000 2500\nE06 Sales 50000 5000\nE07 IT 65000 3000\nE08 HR 47000 1500\n;\nrun;","options":[],"answer":"3","accepted":["3"],"numeric":true,"explanation":"Các dòng IT là E03, E04, E07 → 3.","solution":"Pass 1 – scan Dept for \"IT\":\nRow  EmpID Dept   Salary Bonus  Salary+Bonus\n1    E01   Sales  52000  3000   55000\n2    E02   Sales  48000  2000   50000\n3    E03   IT     61000  4000   65000\n4    E04   IT     57000  1000   58000\n5    E05   HR     45000  2500   47500\n6    E06   Sales  50000  5000   55000\n7    E07   IT     65000  3000   68000\n8    E08   HR     47000  1500   48500\nRows with Dept=IT: E03, E04, E07 → 3 rows.\nPass 2 – count by department: Sales = E01,E02,E06 (3); HR = E05,E08 (2); IT = 8−3−2 = 3. ✔","solutionCode":"data itstaff;\n    set staff;\n    where Dept=\"IT\";\n    Total=Salary+Bonus;\nrun;","courseSource":"P1_L01_essentials.md – Page 6/13 (DATA step adds a column), Page 11/13 Activity (WHERE in a DATA step)"},{"id":"mock1-q3","set":"mock1","number":3,"domain":"D3","topic":"","format":"Multiple choice","difficulty":"easy","type":"mc","stem":"You submit the program above. What happens?","code":"daat work.cars2;\n    set sashelp.cars;\nrun;","options":["A WARNING says SAS assumed DATA was misspelled; the step runs and work.cars2 is created.","An ERROR is written and the step is not processed.","No message is written; SAS silently corrects the keyword.","An ERROR is written and every later step in the program is skipped."],"answer":0,"accepted":[],"numeric":false,"explanation":"DAAT → WARNING (SAS hiểu là DATA), DATA step vẫn chạy.\n\nB: Đó là điều xảy ra với trường hợp thiếu dấu chấm phẩy / option không hợp lệ, không phải với DAAT.\nC: WARNING được ghi vào log; không phải im lặng.\nD: Lỗi chỉ dừng step chứa nó, không dừng các step sau.","solution":"In the demo, DAAT produced a warning: SAS assumed DATA was simply misspelled and \"goes ahead and successfully runs the DATA step\".\nPass 2: the demo contrasts this with the missing-semicolon and invalid-option errors, where the step \"did not run\" – so only the misspelled DATA keyword is forgiven with a WARNING. ✔","solutionCode":"","courseSource":"P1_L01_essentials.md – Page 10/13 Demo: Finding and Resolving Syntax Errors"},{"id":"mock1-q4","set":"mock1","number":4,"domain":"D4","topic":"","format":"Multiple choice","difficulty":"medium","type":"mc","stem":"Which reports display the title \"Quarterly Report\"?","code":"title \"Quarterly Report\";\nproc print data=sashelp.class;\nrun;\nproc means data=sashelp.class;\n    var Height;\nrun;\ntitle;\nproc print data=sashelp.shoes;\nrun;","options":["Only the first PROC PRINT report","The first PROC PRINT report and the PROC MEANS report","All three reports","None, because the TITLE statement is not followed by RUN"],"answer":1,"accepted":[],"numeric":false,"explanation":"TITLE còn hiệu lực cho đến khi `title;` xóa nó → PRINT #1 và MEANS.\n\nA: Title không bị reset sau step đầu tiên; nó vẫn còn hiệu lực.\nC: `title;` xóa title trước PROC PRINT cuối cùng.\nD: Global statement không cần câu lệnh RUN.","solution":"TITLE is a global statement that defines a setting for the SAS session and needs no RUN, so it applies to every report until changed. The null statement `title;` clears it, as at the end of the demo programs.\nTrace: PRINT #1 → title on; MEANS → title still on; `title;` clears; PRINT #2 → no title.\nPass 2: count reports produced after TITLE and before `title;` = 2 (PRINT, MEANS). ✔","solutionCode":"","courseSource":"P1_L01_essentials.md – Page 6/13 (global statements define a setting for the session, no RUN), Page 9/13 (title; at end of program)"},{"id":"mock1-q5","set":"mock1","number":5,"domain":"D1","topic":"","format":"Short answer","difficulty":"medium","type":"sa","stem":"How many steps does this program contain? Enter a number.","code":"options nodate;\ndata work.temps;\n    set work.raw;\n    TempF=TempC*1.8+32;\nrun;\ntitle \"Temperatures\";\nproc print data=work.temps;\nproc means data=work.temps;\n    var TempF;\nrun;\ntitle;","options":[],"answer":"3","accepted":["3"],"numeric":true,"explanation":"DATA + PROC PRINT + PROC MEANS = 3 step (OPTIONS/TITLE là global).","solution":"Steps are DATA or PROC steps only: DATA work.temps, PROC PRINT, PROC MEANS = 3. OPTIONS and TITLE are global statements, not steps. PROC PRINT has no RUN, but \"the beginning of a new DATA or PROC step signals the end of the previous step\".\nPass 2: count the keywords that begin a step (DATA, PROC, PROC) = 3. ✔","solutionCode":"","courseSource":"P1_L01_essentials.md – Page 6/13 SAS Program Structure"},{"id":"mock1-q6","set":"mock1","number":6,"domain":"D2","topic":"","format":"Performance","difficulty":"medium","type":"sa","stem":"Run the program to create work.scores. Then create work.scores2 from work.scores that keeps only rows where Test1 is greater than 79, and adds:\n- Avg = the mean of Test1 and Test2 (use the MEAN function)\n- HeightCm = HeightIn * 2.54\n\nHow many rows are in work.scores2?","code":"data scores;\n    input Student $ Test1 Test2 HeightIn;\n    datalines;\nAna 80 90 60\nBen 72 75 65\nCy 95 88 70\nDee 60 71 62\nEli 88 88 68\nFay 79 84 55\n;\nrun;","options":[],"answer":"3","accepted":["3"],"numeric":true,"explanation":"Ana, Cy, Eli → 3 (Fay = 79 không > 79).","solution":"Pass 1 – test Test1 > 79 per row: Ana 80 yes; Ben 72 no; Cy 95 yes; Dee 60 no; Eli 88 yes; Fay 79 no (79 is not greater than 79) → 3.\nPass 2 – rows failing: Ben, Dee, Fay = 3 of 6 → 6−3 = 3. ✔\nTrap: using >= would include Fay (4 rows).","solutionCode":"data scores2;\n    set scores;\n    where Test1 > 79;\n    Avg=mean(Test1, Test2);\n    HeightCm=HeightIn*2.54;\nrun;","courseSource":"P1_L01_essentials.md – Page 9/13 (AvgMPG=mean(...)), Page 6/13 (heightcm=height*2.54), Page 8/13 (where Age\u003c13)"},{"id":"mock1-q7","set":"mock1","number":7,"domain":"D3","topic":"","format":"Multiple choice","difficulty":"hard","type":"mc","stem":"Submit this program exactly as written (do not fix it). Which statement describes the result?","code":"data orders;\n    input OrderID $ Region $ Qty Price;\n    datalines;\nO1 East 2 15\nO2 West 1 40\nO3 East 5 8\nO4 North 3 20\nO5 West 4 12\nO6 East 1 30\n;\nrun;\n\ndaat orders2;\n    set orders;\n    Amount=Qty*Price;\nrun;\n\ntitle \"East Orders\";\nproc print data=orders2\n    var OrderID Amount;\n    where Region=\"East\";\nrun;\n\nproc means data=orders2 average maxdec=1;\n    var Amount;\n    class Region;\nrun;\ntitle;","options":["Only WARNINGs are written; all steps run and both reports are produced.","The DATA step runs and work.orders2 is created, but neither PROC PRINT nor PROC MEANS produces a report.","Nothing after the first error runs, so work.orders2 is not created.","work.orders2 is created and the PROC PRINT report appears, but PROC MEANS fails."],"answer":1,"accepted":[],"numeric":false,"explanation":"DAAT = warning (step vẫn chạy); thiếu ; và AVERAGE = lỗi (các step đó không chạy).\n\nA: Thiếu dấu chấm phẩy và option không hợp lệ là ERROR, các step đó không chạy.\nC: Lỗi chỉ dừng step của chính nó; DATA step đã chạy (DAAT chỉ là warning).\nD: Thiếu dấu chấm phẩy sau data=orders2 cũng làm PROC PRINT dừng.","solution":"Three errors, each handled as in the demo:\n1. `daat` → WARNING, SAS assumes DATA and runs the step → orders2 created.\n2. PROC PRINT statement has no semicolon → VAR read as an invalid option → step not processed → no PRINT report.\n3. `average` is not a valid PROC MEANS option → ERROR → step does not run → no MEANS report.\nPass 2: map each step to the demo outcome (DATA: ran; PRINT: did not run; MEANS: did not run) → B. ✔","solutionCode":"","courseSource":"P1_L01_essentials.md – Page 10/13 Demo: Finding and Resolving Syntax Errors (same three error types)"},{"id":"mock1-q8","set":"mock1","number":8,"domain":"D2","topic":"","format":"Multiple choice","difficulty":"easy","type":"mc","stem":"Which statement in this DATA step creates a new column and does not begin with a SAS keyword?","code":"data trip;\n    set work.raw;\n    Miles=Km*0.621;\nrun;","options":["data trip;","set work.raw;","Miles=Km*0.621;","run;"],"answer":2,"accepted":[],"numeric":false,"explanation":"Câu lệnh gán (Miles=…) tạo cột và không có keyword đứng đầu.\n\nA: DATA là keyword; nó đặt tên bảng output.\nB: SET là keyword; nó đọc bảng input.\nD: RUN là keyword kết thúc step.","solution":"The course: \"The assignment statement creates a new column and it doesn't start with a keyword.\" DATA, SET, RUN are keywords.\nPass 2: of the four statements only one has the form column=expression → C. ✔","solutionCode":"","courseSource":"P1_L01_essentials.md – Page 6/13 SAS Program Structure"},{"id":"mock1-q9","set":"mock1","number":9,"domain":"D4","topic":"","format":"Performance","difficulty":"medium","type":"sa","stem":"Run the program to create work.staff. Then run:\n\nproc means data=staff mean;\n    var Salary;\n    class Dept;\nrun;\n\nWhat is the mean Salary for Dept = Sales? Enter the number without commas.","code":"data staff;\n    input EmpID $ Dept $ Salary Bonus;\n    datalines;\nE01 Sales 52000 3000\nE02 Sales 48000 2000\nE03 IT 61000 4000\nE04 IT 57000 1000\nE05 HR 45000 2500\nE06 Sales 50000 5000\nE07 IT 65000 3000\nE08 HR 47000 1500\n;\nrun;","options":[],"answer":"50000","accepted":["50000"],"numeric":true,"explanation":"(52000+48000+50000)/3 = 50000.","solution":"CLASS Dept computes the statistics separately for each Dept value.\nPass 1: Sales salaries = 52000, 48000, 50000 → sum 150000 / 3 = 50000.\nPass 2: deviations from 50000 are +2000, −2000, 0 → sum 0, so the mean is exactly 50000. ✔ (Output may show 50000.00 – same value.)","solutionCode":"proc means data=staff mean;\n    var Salary;\n    class Dept;\nrun;","courseSource":"P1_L01_essentials.md – Page 5/13 Practice (PROC MEANS … mean …; var; class region;), Page 9/13"},{"id":"mock1-q10","set":"mock1","number":10,"domain":"D1","topic":"","format":"Short answer","difficulty":"medium","type":"sa","stem":"How many statements are in the DATA step of this program? Enter a number.","code":"options nodate;\ndata work.temps;\n    set work.raw;\n    TempF=TempC*1.8+32;\nrun;\ntitle \"Temperatures\";\nproc print data=work.temps;\nproc means data=work.temps;\n    var TempF;\nrun;\ntitle;","options":[],"answer":"4","accepted":["4"],"numeric":true,"explanation":"DATA, SET, câu lệnh gán, RUN = 4.","solution":"DATA statement, SET statement, assignment statement (TempF=…), RUN statement = 4 – the same structure the course counts in its own example (\"This DATA step has four statements\").\nPass 2: count semicolons between `data work.temps;` and `run;` inclusive = 4. ✔","solutionCode":"","courseSource":"P1_L01_essentials.md – Page 6/13 SAS Program Structure"},{"id":"mock1-q11","set":"mock1","number":11,"domain":"D2","topic":"","format":"Performance","difficulty":"easy","type":"sa","stem":"Using work.staff, create work.itstaff with only Dept = IT rows and Total = Salary + Bonus (same as the earlier task if you already did it).\n\nWhat is the value of Total for EmpID E04?","code":"data staff;\n    input EmpID $ Dept $ Salary Bonus;\n    datalines;\nE01 Sales 52000 3000\nE02 Sales 48000 2000\nE03 IT 61000 4000\nE04 IT 57000 1000\nE05 HR 45000 2500\nE06 Sales 50000 5000\nE07 IT 65000 3000\nE08 HR 47000 1500\n;\nrun;","options":[],"answer":"58000","accepted":["58000"],"numeric":true,"explanation":"57000 + 1000 = 58000.","solution":"Pass 1: E04 Salary 57000 + Bonus 1000 = 58000.\nPass 2: E04 is Dept IT, so it is in itstaff; 58000 − 57000 = 1000 = Bonus. ✔","solutionCode":"data itstaff;\n    set staff;\n    where Dept=\"IT\";\n    Total=Salary+Bonus;\nrun;","courseSource":"P1_L01_essentials.md – Page 6/13 (assignment statement), Page 11/13 (Profit=Sales-Returns)"},{"id":"mock1-q12","set":"mock1","number":12,"domain":"D3","topic":"","format":"Multiple choice","difficulty":"medium","type":"mc","stem":"The log underlines the word VAR. Which explanation is correct?","code":"proc print data=sashelp.class\n    var Name Age;\nrun;","options":["VAR is not valid in PROC PRINT and must be deleted.","The problem is just before VAR: the PROC PRINT statement has no semicolon, so VAR is read as an invalid option and the step is not processed.","SAS adds the missing semicolon, prints Name and Age, and writes a WARNING.","The column names Name and Age must be enclosed in quotation marks."],"answer":1,"accepted":[],"numeric":false,"explanation":"Từ hợp lệ bị gạch chân → nhìn ngay phía trước nó: thiếu dấu chấm phẩy.\n\nA: VAR hợp lệ trong PROC PRINT (có dùng trong lời giải demo).\nC: SAS không tự chèn dấu chấm phẩy; step không được xử lý.\nD: Tên cột không đặt trong dấu nháy ở câu lệnh VAR.","solution":"Demo rule: when an underlined item is valid syntax, look immediately before it. Without the semicolon SAS treats VAR as a continuation of the PROC PRINT statement; VAR is not a valid option, and \"the SAS system did not process the step\".\nPass 2: VAR is used validly in the corrected demo code, so the defect must be elsewhere → the missing ; → B. ✔","solutionCode":"","courseSource":"P1_L01_essentials.md – Page 10/13 Demo: Finding and Resolving Syntax Errors"},{"id":"mock1-q13","set":"mock1","number":13,"domain":"D2","topic":"","format":"Performance","difficulty":"medium","type":"sa","stem":"Create work.scores2 from work.scores keeping rows where Test1 > 79, with Avg = mean of Test1 and Test2 and HeightCm = HeightIn * 2.54.\n\nWhat is HeightCm for Student Eli? Enter the value exactly as SAS displays it.","code":"data scores;\n    input Student $ Test1 Test2 HeightIn;\n    datalines;\nAna 80 90 60\nBen 72 75 65\nCy 95 88 70\nDee 60 71 62\nEli 88 88 68\nFay 79 84 55\n;\nrun;","options":[],"answer":"172.72","accepted":["172.72"],"numeric":true,"explanation":"68 × 2.54 = 172.72.","solution":"Eli: Test1 = 88 > 79 → kept. HeightCm = 68 × 2.54.\nPass 1: 68 × 2.54 = 68×2 + 68×0.54 = 136 + 36.72 = 172.72.\nPass 2: 70 × 2.54 = 177.8; minus 2 × 2.54 = 5.08 → 172.72. ✔","solutionCode":"data scores2;\n    set scores;\n    where Test1 > 79;\n    Avg=mean(Test1, Test2);\n    HeightCm=HeightIn*2.54;\nrun;\nproc print data=scores2;\nrun;","courseSource":"P1_L01_essentials.md – Page 6/13 (heightcm=height*2.54)"},{"id":"mock1-q14","set":"mock1","number":14,"domain":"D1","topic":"","format":"Multiple choice","difficulty":"easy","type":"mc","stem":"Which of these is NOT a global statement?","code":"","options":["TITLE","OPTIONS","LIBNAME","VAR"],"answer":3,"accepted":[],"numeric":false,"explanation":"VAR phải nằm trong một PROC step.\n\nA: TITLE được liệt kê là global statement.\nB: OPTIONS được liệt kê là global statement.\nC: LIBNAME được liệt kê là global statement.","solution":"The course lists TITLE, OPTIONS and LIBNAME as global statements that can sit outside steps. VAR is used inside PROC steps (PROC PRINT, PROC MEANS).\nPass 2: the Lesson Review shows exactly TITLE, OPTIONS, LIBNAME as the global examples. ✔","solutionCode":"","courseSource":"P1_L01_essentials.md – Page 6/13, Page 13/13 Lesson Review"},{"id":"mock1-q15","set":"mock1","number":15,"domain":"D4","topic":"","format":"Short answer","difficulty":"easy","type":"sa","stem":"Write the complete statement (including the semicolon) that clears all titles, as used at the end of the course demo programs.","code":"","options":[],"answer":"title;","accepted":["title;","title"],"numeric":false,"explanation":"title;","solution":"The demo solutions end with `title;` – a TITLE statement with no text, which removes the title for later output.\nPass 2: both Page 9 and Page 10 solution programs end with exactly this statement. ✔","solutionCode":"","courseSource":"P1_L01_essentials.md – Page 9/13 and 10/13 (solution code ends with title;)"},{"id":"mock1-q16","set":"mock1","number":16,"domain":"D2","topic":"","format":"Performance","difficulty":"hard","type":"sa","stem":"Using work.staff, create work.big that keeps only rows where Bonus is at least 3000 and adds Total = Salary + Bonus. Then run:\n\nproc means data=big mean maxdec=0;\n    var Total;\nrun;\n\nWhat mean Total is displayed?","code":"data staff;\n    input EmpID $ Dept $ Salary Bonus;\n    datalines;\nE01 Sales 52000 3000\nE02 Sales 48000 2000\nE03 IT 61000 4000\nE04 IT 57000 1000\nE05 HR 45000 2500\nE06 Sales 50000 5000\nE07 IT 65000 3000\nE08 HR 47000 1500\n;\nrun;","options":[],"answer":"60750","accepted":["60750"],"numeric":true,"explanation":"Bonus ≥ 3000 → E01,E03,E06,E07 → tổng 55000,65000,55000,68000 → trung bình 60750.","solution":"Pass 1 – Bonus >= 3000: E01 (3000), E03 (4000), E06 (5000), E07 (3000) → Totals 55000, 65000, 55000, 68000. Sum = 243000; 243000 / 4 = 60750.\nPass 2 – mean Salary of the 4 = (52000+61000+50000+65000)/4 = 228000/4 = 57000; mean Bonus = (3000+4000+5000+3000)/4 = 3750; 57000 + 3750 = 60750. ✔\nTrap: Bonus > 3000 drops E01 and E07 → (65000+55000)/2 = 60000.","solutionCode":"data big;\n    set staff;\n    where Bonus>=3000;\n    Total=Salary+Bonus;\nrun;\n\nproc means data=big mean maxdec=0;\n    var Total;\nrun;","courseSource":"P1_L01_essentials.md – Page 6/13, Page 8/13 (WHERE), Page 5/13 Practice (MAXDEC=)"},{"id":"mock1-q17","set":"mock1","number":17,"domain":"D3","topic":"","format":"Performance","difficulty":"hard","type":"sa","stem":"This program contains syntax errors. Fix every error so that all steps run, then run it.\n\nIn the PROC MEANS output, what is the mean Amount for Region = East? Enter the value as displayed (MAXDEC=1).","code":"data orders;\n    input OrderID $ Region $ Qty Price;\n    datalines;\nO1 East 2 15\nO2 West 1 40\nO3 East 5 8\nO4 North 3 20\nO5 West 4 12\nO6 East 1 30\n;\nrun;\n\ndaat orders2;\n    set orders;\n    Amount=Qty*Price;\nrun;\n\ntitle \"East Orders\";\nproc print data=orders2\n    var OrderID Amount;\n    where Region=\"East\";\nrun;\n\nproc means data=orders2 average maxdec=1;\n    var Amount;\n    class Region;\nrun;\ntitle;","options":[],"answer":"33.3","accepted":["33.3"],"numeric":true,"explanation":"Giá trị của East là 30, 40, 30 → 100/3 → 33.3.","solution":"Fixes (as in the demo): daat→data; add ; after `proc print data=orders2`; `average`→`mean`.\nPass 1 – Amount=Qty*Price:\nOrderID Region Qty Price  Amount=Qty*Price\nO1      East   2   15     30\nO2      West   1   40     40\nO3      East   5   8      40\nO4      North  3   20     60\nO5      West   4   12     48\nO6      East   1   30     30\nEast: 30, 40, 30 → 100/3 = 33.333… → MAXDEC=1 → 33.3.\nPass 2: East rows O1, O3, O6; 2×15=30, 5×8=40, 1×30=30; 100/3 = 33.33 → 33.3. ✔","solutionCode":"data orders2;\n    set orders;\n    Amount=Qty*Price;\nrun;\n\ntitle \"East Orders\";\nproc print data=orders2;\n    var OrderID Amount;\n    where Region=\"East\";\nrun;\n\nproc means data=orders2 mean maxdec=1;\n    var Amount;\n    class Region;\nrun;\ntitle;","courseSource":"P1_L01_essentials.md – Page 10/13 Demo: Finding and Resolving Syntax Errors"},{"id":"mock1-q18","set":"mock1","number":18,"domain":"D1","topic":"","format":"Short answer","difficulty":"medium","type":"sa","stem":"How many global statements does this program contain? Enter a number.","code":"options nodate;\ndata work.temps;\n    set work.raw;\n    TempF=TempC*1.8+32;\nrun;\ntitle \"Temperatures\";\nproc print data=work.temps;\nproc means data=work.temps;\n    var TempF;\nrun;\ntitle;","options":[],"answer":"3","accepted":["3"],"numeric":true,"explanation":"OPTIONS + TITLE + TITLE; = 3.","solution":"Global statements outside steps: `options nodate;`, `title \"Temperatures\";`, `title;` = 3.\nPass 2: every statement that is not part of the DATA/PRINT/MEANS steps: options, title, title = 3. ✔","solutionCode":"","courseSource":"P1_L01_essentials.md – Page 6/13, Page 7/13 Activity (counting global statements)"},{"id":"mock1-q19","set":"mock1","number":19,"domain":"D2","topic":"","format":"Multiple choice","difficulty":"medium","type":"mc","stem":"SASHELP.CLASS has 19 rows and 5 columns (Name, Sex, Age, Height, Weight). What does work.kids contain?","code":"data kids;\n    set sashelp.class;\n    /* where Age\u003c13;\n    Ratio=Weight/Height; */\n    *drop Height;\nrun;","options":["19 rows and 5 columns","Fewer than 19 rows and 6 columns","19 rows and 4 columns","Fewer than 19 rows and 5 columns"],"answer":0,"accepted":[],"numeric":false,"explanation":"Cả ba câu lệnh đều là comment → bản sao gồm 19 dòng × 5 cột.\n\nB: WHERE và phép gán Ratio nằm trong /* */ nên không chạy.\nC: *drop Height; là comment, nên Height vẫn được giữ.\nD: WHERE đã bị comment, nên đọc cả 19 dòng.","solution":"`/* … */` comments out both the WHERE and the Ratio statements; `*drop Height;` comments out the DROP statement. Only DATA, SET, RUN execute → an exact copy: 19 rows, 5 columns.\nPass 2: no active statement filters rows, adds a column, or removes a column → 19 × 5. ✔","solutionCode":"","courseSource":"P1_L01_essentials.md – Page 8/13 SAS Program Syntax (comments), Page 3/13 (SASHELP.CLASS 19 rows)"},{"id":"mock1-q20","set":"mock1","number":20,"domain":"D4","topic":"","format":"Performance","difficulty":"medium","type":"sa","stem":"Using work.staff, run:\n\nproc means data=staff mean maxdec=1;\n    var Bonus;\n    class Dept;\nrun;\n\nWhat mean Bonus is displayed for Dept = Sales?","code":"data staff;\n    input EmpID $ Dept $ Salary Bonus;\n    datalines;\nE01 Sales 52000 3000\nE02 Sales 48000 2000\nE03 IT 61000 4000\nE04 IT 57000 1000\nE05 HR 45000 2500\nE06 Sales 50000 5000\nE07 IT 65000 3000\nE08 HR 47000 1500\n;\nrun;","options":[],"answer":"3333.3","accepted":["3333.3"],"numeric":true,"explanation":"10000/3 = 3333.33 → MAXDEC=1 → 3333.3.","solution":"Pass 1: Sales bonuses 3000, 2000, 5000 → 10000/3 = 3333.333… → one decimal → 3333.3.\nPass 2: 3 × 3333.3 = 9999.9 ≈ 10000 ✔; second decimal is 3 (\u003c5), so it rounds down to 3333.3. ✔","solutionCode":"proc means data=staff mean maxdec=1;\n    var Bonus;\n    class Dept;\nrun;","courseSource":"P1_L01_essentials.md – Page 5/13 Practice (MAXDEC= rounds statistics), Page 9/13 (maxdec=1)"},{"id":"mock1-q21","set":"mock1","number":21,"domain":"D3","topic":"","format":"Multiple choice","difficulty":"medium","type":"mc","stem":"What happens when this step is submitted?","code":"proc means data=sashelp.class average max maxdec=1;\n    var Height;\nrun;","options":["An ERROR is written because AVERAGE is not a valid option; the step does not run. Use MEAN instead.","A WARNING is written; SAS assumes MEAN and the step runs.","The step runs, ignores AVERAGE, and displays only the maximum.","An ERROR is written because MAXDEC= must come before the statistic keywords."],"answer":0,"accepted":[],"numeric":false,"explanation":"AVERAGE không hợp lệ → ERROR, step không chạy → dùng MEAN.\n\nB: Trong demo, chỉ keyword DATA viết sai mới được xử lý kiểu warning-rồi-vẫn-chạy.\nC: Option không hợp lệ làm dừng toàn bộ step.\nD: Lời giải demo đặt MAXDEC= sau các thống kê; thứ tự không phải là vấn đề.","solution":"Demo: \"average is underlined, and the error message indicates what valid options there are for the PROC MEANS statement… must be corrected to use the proper option, MEAN. This step also did not run.\"\nPass 2: the corrected demo code uses `mean min max maxdec=1` – keyword order is free, confirming D is wrong and A right. ✔","solutionCode":"","courseSource":"P1_L01_essentials.md – Page 10/13 Demo: Finding and Resolving Syntax Errors"},{"id":"mock1-q22","set":"mock1","number":22,"domain":"D2","topic":"","format":"Performance","difficulty":"easy","type":"sa","stem":"Create work.scores2 from work.scores keeping rows where Test1 > 79, with Avg = mean of Test1 and Test2 and HeightCm = HeightIn * 2.54.\n\nWhat is Avg for Student Cy?","code":"data scores;\n    input Student $ Test1 Test2 HeightIn;\n    datalines;\nAna 80 90 60\nBen 72 75 65\nCy 95 88 70\nDee 60 71 62\nEli 88 88 68\nFay 79 84 55\n;\nrun;","options":[],"answer":"91.5","accepted":["91.5"],"numeric":true,"explanation":"(95+88)/2 = 91.5.","solution":"Cy: Test1 95 > 79 → kept. mean(95, 88) = 183/2 = 91.5.\nPass 2: midpoint of 88 and 95 = 88 + 7/2 = 91.5. ✔","solutionCode":"data scores2;\n    set scores;\n    where Test1 > 79;\n    Avg=mean(Test1, Test2);\n    HeightCm=HeightIn*2.54;\nrun;","courseSource":"P1_L01_essentials.md – Page 9/13 (mean function)"},{"id":"mock1-q23","set":"mock1","number":23,"domain":"D1","topic":"","format":"Multiple choice","difficulty":"easy","type":"mc","stem":"The PROC PRINT step has no RUN statement. What happens?","code":"proc print data=sashelp.class;\nproc means data=sashelp.class;\n    var Age;\nrun;","options":["The PROC MEANS statement ends the PROC PRINT step, and both steps run.","PROC PRINT is ignored because it has no RUN statement.","An ERROR is written and neither step runs.","The two procedures are combined into a single step."],"answer":0,"accepted":[],"numeric":false,"explanation":"Keyword PROC/DATA tiếp theo kết thúc step trước → cả hai đều chạy.\n\nB: Thiếu RUN không làm step bị bỏ qua.\nC: Thiếu RUN giữa các step không phải là lỗi.\nD: Mỗi keyword PROC bắt đầu một step mới.","solution":"Course rule: \"If you don't use a RUN statement at the end of a step, the beginning of a new DATA or PROC step signals the end of the previous step.\" So PRINT ends at PROC MEANS and runs; MEANS ends at its RUN.\nPass 2: two step keywords → two steps, each with a boundary → both run. ✔","solutionCode":"","courseSource":"P1_L01_essentials.md – Page 6/13 SAS Program Structure"},{"id":"mock1-q24","set":"mock1","number":24,"domain":"D2","topic":"","format":"Performance","difficulty":"hard","type":"sa","stem":"Using work.staff, run a PROC PRINT step that lists only rows where Dept is Sales and Salary is at least 50000.\n\nHow many rows are listed?","code":"data staff;\n    input EmpID $ Dept $ Salary Bonus;\n    datalines;\nE01 Sales 52000 3000\nE02 Sales 48000 2000\nE03 IT 61000 4000\nE04 IT 57000 1000\nE05 HR 45000 2500\nE06 Sales 50000 5000\nE07 IT 65000 3000\nE08 HR 47000 1500\n;\nrun;","options":[],"answer":"2","accepted":["2"],"numeric":true,"explanation":"E01 (52000) và E06 (50000, giá trị biên) → 2.","solution":"Pass 1 – Sales rows: E01 52000 (≥50000 yes), E02 48000 (no), E06 50000 (yes, boundary) → 2.\nPass 2 – rows with Salary ≥ 50000 overall: E01, E03, E04, E06, E07; of those, Sales = E01, E06 → 2. ✔\nTrap: Salary > 50000 gives 1.","solutionCode":"proc print data=staff;\n    where Dept=\"Sales\" and Salary>=50000;\nrun;","courseSource":"P1_L01_essentials.md – Page 13/13 quiz-code pattern (WHERE … and …), Page 9/13 (WHERE in PROC PRINT)"},{"id":"mock1-q25","set":"mock1","number":25,"domain":"D3","topic":"","format":"Performance","difficulty":"hard","type":"sa","stem":"This program contains several syntax errors after the first DATA step. Fix all of them (tip: fix before submitting), then run it.\n\nHow many rows are in work.seniors?","code":"data pets;\n    input Name $ Species $ Age Weight;\n    datalines;\nMax Dog 5 30\nBella Cat 3 9\nRocky Dog 8 35\nLuna Cat 10 11\nCoco Bird 2 1\nDuke Dog 1 20\nMilo Cat 6 12\n;\nrun;\n\ndata seniors set pets;\n    where Age>=6;\n    WeightLb=Weight*2.2;\nrun;\n\ntitle \"Senior Pets;\nprc print data=seniors;\nrun;\ntitle;","options":[],"answer":"3","accepted":["3"],"numeric":true,"explanation":"Age ≥ 6 → Rocky, Luna, Milo = 3.","solution":"Fixes (same three error types as the course activity): add ; after `data seniors`; close the quote in the TITLE; `prc`→`proc`.\nPass 1 – Age >= 6:\nName  Species Age Weight  Age>=6?  WeightLb=Weight*2.2\nMax   Dog     5   30      no\nBella Cat     3   9       no\nRocky Dog     8   35      yes      77\nLuna  Cat     10  11      yes      24.2\nCoco  Bird    2   1       no\nDuke  Dog     1   20      no\nMilo  Cat     6   12      yes      26.4\n→ Rocky, Luna, Milo = 3.\nPass 2 – rows failing (Age 5,3,2,1) = 4 of 7 → 7−4 = 3. ✔\nTrap: Age > 6 drops Milo → 2.","solutionCode":"data seniors;\n    set pets;\n    where Age>=6;\n    WeightLb=Weight*2.2;\nrun;\n\ntitle \"Senior Pets\";\nproc print data=seniors;\nrun;\ntitle;","courseSource":"P1_L01_essentials.md – Page 11/13 Activity (missing semicolon, unbalanced quote, misspelled PROC)"},{"id":"mock1-q26","set":"mock1","number":26,"domain":"D4","topic":"","format":"Multiple choice","difficulty":"easy","type":"mc","stem":"In SAS Studio you submit a program that contains only a DATA step that creates a table. Which tab stays empty?","code":"","options":["Log","Output Data","Results","Code"],"answer":2,"accepted":[],"numeric":false,"explanation":"Không có PROC tạo báo cáo → tab Results trống.\n\nA: Log luôn chứa chương trình và các note.\nB: Output Data hiển thị bảng mà DATA step đã tạo.\nD: Tab Code chứa chương trình của bạn.","solution":"Practice: \"The RESULTS tab is empty because the program did not create a report.\" The log has notes and Output Data shows the new table.\nPass 2: reports come from PROC steps such as PRINT/MEANS; none were submitted → Results empty. ✔","solutionCode":"","courseSource":"P1_L01_essentials.md – Page 5/13 Practice: Exploring SAS Studio, step 4"},{"id":"mock1-q27","set":"mock1","number":27,"domain":"D2","topic":"","format":"Performance","difficulty":"easy","type":"sa","stem":"Using work.staff, create work.staff2 that is a copy of work.staff with a new column Total = Salary + Bonus.\n\nWhat is Total for EmpID E06?","code":"data staff;\n    input EmpID $ Dept $ Salary Bonus;\n    datalines;\nE01 Sales 52000 3000\nE02 Sales 48000 2000\nE03 IT 61000 4000\nE04 IT 57000 1000\nE05 HR 45000 2500\nE06 Sales 50000 5000\nE07 IT 65000 3000\nE08 HR 47000 1500\n;\nrun;","options":[],"answer":"55000","accepted":["55000"],"numeric":true,"explanation":"50000 + 5000 = 55000.","solution":"Pass 1: E06 Salary 50000 + Bonus 5000 = 55000.\nPass 2: 55000 − 5000 = 50000 = Salary ✔.","solutionCode":"data staff2;\n    set staff;\n    Total=Salary+Bonus;\nrun;","courseSource":"P1_L01_essentials.md – Page 6/13 (assignment statement creates a column)"},{"id":"mock1-q28","set":"mock1","number":28,"domain":"D1","topic":"","format":"Multiple choice","difficulty":"medium","type":"mc","stem":"You submit a program, then submit it again. What happens to the log and results?","code":"","options":["In SAS Studio and Enterprise Guide they are replaced; in the SAS windowing environment they are appended.","They are appended in every interface.","SAS Studio appends; Enterprise Guide replaces.","They are replaced in every interface."],"answer":0,"accepted":[],"numeric":false,"explanation":"Studio/EG thay thế; windowing environment thì nối thêm.\n\nB: Studio và EG thay thế, không nối thêm.\nC: Studio thay thế (bước 10 của demo).\nD: Windowing environment nối thêm.","solution":"Lesson Review: resubmitting in EG or SAS Studio replaces the log, output data, and results; in the SAS windowing environment it appends the log and results.\nPass 2: the Studio and EG demos both state \"the log and results were replaced\". ✔","solutionCode":"","courseSource":"P1_L01_essentials.md – Page 13/13 Lesson Review (Running a SAS Program)"},{"id":"mock1-q29","set":"mock1","number":29,"domain":"D2","topic":"","format":"Performance","difficulty":"medium","type":"sa","stem":"Run this DATA step after creating work.scores:\n\ndata scores2;\n    set scores;\n    *where Test1 > 79;\n    Avg=mean(Test1, Test2);\n    HeightCm=HeightIn*2.54;\nrun;\n\nHow many rows are in work.scores2?","code":"data scores;\n    input Student $ Test1 Test2 HeightIn;\n    datalines;\nAna 80 90 60\nBen 72 75 65\nCy 95 88 70\nDee 60 71 62\nEli 88 88 68\nFay 79 84 55\n;\nrun;","options":[],"answer":"6","accepted":["6"],"numeric":true,"explanation":"*where là comment → cả 6 dòng.","solution":"The asterisk turns the WHERE statement into a comment, so no rows are filtered: all 6 input rows are written.\nPass 2: work.scores has 6 data lines (Ana…Fay); no active WHERE → 6. ✔","solutionCode":"data scores2;\n    set scores;\n    *where Test1 > 79;\n    Avg=mean(Test1, Test2);\n    HeightCm=HeightIn*2.54;\nrun;","courseSource":"P1_L01_essentials.md – Page 8/13 (asterisk comments out one statement), Page 9/13 (*where … commented out)"},{"id":"mock1-q30","set":"mock1","number":30,"domain":"D4","topic":"","format":"Performance","difficulty":"hard","type":"sa","stem":"Create work.scores2 (rows where Test1 > 79; Avg = mean of Test1 and Test2; HeightCm = HeightIn * 2.54). Then run:\n\nproc means data=scores2 mean maxdec=2;\n    var Avg;\nrun;\n\nWhat mean is displayed?","code":"data scores;\n    input Student $ Test1 Test2 HeightIn;\n    datalines;\nAna 80 90 60\nBen 72 75 65\nCy 95 88 70\nDee 60 71 62\nEli 88 88 68\nFay 79 84 55\n;\nrun;","options":[],"answer":"88.17","accepted":["88.17"],"numeric":true,"explanation":"Trung bình của Ana 85, Cy 91.5, Eli 88 → 88.1667 → 88.17.","solution":"Pass 1 – scores2 rows and Avg:\nStudent Test1 Test2 HeightIn  mean(T1,T2)  HeightIn*2.54\nAna     80    90    60        85           152.4\nBen     72    75    65        73.5         165.1\nCy      95    88    70        91.5         177.8\nDee     60    71    62        65.5         157.48\nEli     88    88    68        88           172.72\nFay     79    84    55        81.5         139.7\nKept: Ana 85, Cy 91.5, Eli 88 → 264.5/3 = 88.1666… → 2 decimals → 88.17.\nPass 2 – mean of all six Test values of the kept rows: (80+90+95+88+88+88)/6 = 529/6 = 88.1666… (same, since each Avg weights its two tests equally) → 88.17. ✔\nTrap: Test1 ≥ 79 adds Fay (81.5) → 346/4 = 86.5.","solutionCode":"data scores2;\n    set scores;\n    where Test1 > 79;\n    Avg=mean(Test1, Test2);\n    HeightCm=HeightIn*2.54;\nrun;\n\nproc means data=scores2 mean maxdec=2;\n    var Avg;\nrun;","courseSource":"P1_L01_essentials.md – Page 5/13 Practice (MAXDEC=2 rounds to two decimals), Page 9/13"},{"id":"mock1-q31","set":"mock1","number":31,"domain":"D3","topic":"","format":"Multiple choice","difficulty":"easy","type":"mc","stem":"What is wrong with this step, and what does the course suggest for spotting it before you run the code?","code":"data canada;\n    set sashelp.shoes;\n    where Region=\"Canada;\nrun;","options":["An unmatched quotation mark; the editor's color coding (or Format Code) shows the rest of the program being treated as a quoted string.","A missing RUN statement; check the Results tab.","Region must be written in uppercase; use Format Code to fix the case.","WHERE is not allowed in a DATA step; check the Output Data tab."],"answer":0,"accepted":[],"numeric":false,"explanation":"Thiếu dấu nháy đóng; màu cú pháp / Format Code sẽ làm lộ ra lỗi.\n\nB: Step có kết thúc bằng run;.\nC: Tên không đặt trong nháy không phân biệt hoa thường; vấn đề nằm ở dấu nháy.\nD: Khóa học có dùng WHERE trong DATA step.","solution":"The closing quote after Canada is missing. The course: unmatched quotation marks can be caught by color-coded syntax; in the activity, formatting the code identifies the missing quotation mark.\nPass 2: the step does have RUN; WHERE is used in DATA steps in the course (Page 8, Page 11) → A. ✔","solutionCode":"","courseSource":"P1_L01_essentials.md – Page 10/13 (color-coded syntax catches unmatched quotation marks), Page 11/13 Activity (Format Code identifies the missing quotation mark)"},{"id":"mock1-q32","set":"mock1","number":32,"domain":"D2","topic":"","format":"Performance","difficulty":"easy","type":"sa","stem":"Fix the syntax errors in this program and run it.\n\nIn work.orders2, what is Amount for OrderID O5?","code":"data orders;\n    input OrderID $ Region $ Qty Price;\n    datalines;\nO1 East 2 15\nO2 West 1 40\nO3 East 5 8\nO4 North 3 20\nO5 West 4 12\nO6 East 1 30\n;\nrun;\n\ndaat orders2;\n    set orders;\n    Amount=Qty*Price;\nrun;\n\ntitle \"East Orders\";\nproc print data=orders2\n    var OrderID Amount;\n    where Region=\"East\";\nrun;\n\nproc means data=orders2 average maxdec=1;\n    var Amount;\n    class Region;\nrun;\ntitle;","options":[],"answer":"48","accepted":["48"],"numeric":true,"explanation":"
