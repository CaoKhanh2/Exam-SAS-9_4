Code":"","courseSource":"raw/CR_03_L3_P2_review.md – Review Quiz: Summarizing Data Q5","answerSource":"derived","confidence":"high"},{"id":"cr3-3.2-q6","set":"crreview","number":125,"domain":"D2","topic":"FIRST. with IF vs WHERE","format":"Course quiz","difficulty":"","type":"mc","stem":"True or False: Each of the following statements perform the same action.","code":"if First.Make;\nif First.Make=1;\nwhere First.Make;\nwhere First.Make=1;","options":["True","False"],"answer":1,"accepted":[],"numeric":false,"explanation":"WHERE lọc row trước khi vào PDV và chỉ dùng được column có trong bảng input; FIRST.Make là biến tạm trong PDV nên WHERE báo lỗi. Hai IF thì tương đương nhau.","solution":"","solutionCode":"","courseSource":"raw/CR_03_L3_P2_review.md – Review Quiz: Summarizing Data Q6","answerSource":"derived","confidence":"high"},{"id":"cr3-3.2-q7","set":"crreview","number":126,"domain":"D2","topic":"FIRST./LAST. values","format":"Course quiz","difficulty":"","type":"mc","stem":"What is the value of First.Make and Last.Make for row 167 if sashelp.cars is sorted by Make?\n\nRows shown:\n```text\nRow  Make     Model                  Type\n165  Honda    Odyssey EX             Sedan\n166  Honda    S2000 convertible 2dr  Sports\n167  Hummer   H2                     SUV\n168  Hyundai  Santa Fe GLS           SUV\n169  Hyundai  Accent 2dr hatch       Sedan\n170  Hyundai  Accent GL 4dr          Sedan\n```","code":"data cars;\n    set sashelp.cars(keep=Model Make Type);\n    by Make;\nrun;","options":["First.Make=1 and Last.Make=1","First.Make=1 and Last.Make=0","First.Make=0 and Last.Make=1"],"answer":0,"accepted":[],"numeric":false,"explanation":"Hummer chỉ có một row (167), nằm giữa Honda và Hyundai, nên vừa là row đầu vừa là row cuối của BY group: cả hai bằng 1.","solution":"","solutionCode":"","courseSource":"raw/CR_03_L3_P2_review.md – Review Quiz: Summarizing Data Q7","answerSource":"derived","confidence":"high"},{"id":"cr3-3.2-q8","set":"crreview","number":127,"domain":"D2","topic":"FIRST./LAST. with two BY variables","format":"Course quiz","difficulty":"","type":"mc","stem":"What is the value of First.Type and Last.Type for row 168 if sashelp.cars is sorted by Make and Type? (same rows as Q7: 165 Honda Odyssey EX Sedan · 166 Honda S2000 convertible 2dr Sports · 167 Hummer H2 SUV · 168 Hyundai Santa Fe GLS SUV · 169 Hyundai Accent 2dr hatch Sedan · 170 Hyundai Accent GL 4dr Sedan)","code":"data cars;\n    set sashelp.cars(keep=Model Make Type);\n    by Make Type;\nrun;","options":["First.Type=1 and Last.Type=1","First.Type=1 and Last.Type=0","First.Type=0 and Last.Type=1"],"answer":0,"accepted":[],"numeric":false,"explanation":"Row 168 là row đầu của Make=Hyundai nên First.Type=1 (Make đổi thì Type group cũng bắt đầu lại). Row 169 có Type Sedan khác SUV nên 168 cũng là row cuối của nhóm Hyundai/SUV: Last.Type=1.","solution":"","solutionCode":"","courseSource":"raw/CR_03_L3_P2_review.md – Review Quiz: Summarizing Data Q8","answerSource":"derived","confidence":"medium"},{"id":"cr3-3.2-q9","set":"crreview","number":128,"domain":"D2","topic":"Resetting accumulator per BY group","format":"Course quiz","difficulty":"","type":"mc","stem":"Which statement must be added to this DATA step to reset the value of TotalSales for each new BY group?","code":"data shoetotal;\n    set sashelp.shoes;\n    by Region;\n    \u003cinsert statement>\n    TotalSales+Sales;\n    if last.Region;\nrun;","options":["TotalSales=0;","if First.Region=1 then TotalSales=0;","if Last.Region=0 then TotalSales=0;","if First.Region=1 and Last.Region=1 then TotalSales=0;"],"answer":1,"accepted":[],"numeric":false,"explanation":"Cần reset về 0 ở row đầu mỗi Region, tức khi First.Region=1. TotalSales=0 vô điều kiện sẽ reset mọi row; điều kiện Last.Region=0 hay First and Last đều sai nhóm.","solution":"","solutionCode":"","courseSource":"raw/CR_03_L3_P2_review.md – Review Quiz: Summarizing Data Q9","answerSource":"derived","confidence":"high"},{"id":"cr3-3.2-q10","set":"crreview","number":129,"domain":"D2","topic":"Subsetting IF with LAST.","format":"Course quiz","difficulty":"","type":"mc","stem":"Which statement creates the table carsMax that includes the highest MSRP for each value of Make and the calculated profit?","code":"proc sort data=sashelp.cars\n          out=carsPrice;\n    by Make MSRP;\nrun;\n\ndata carsMax;\n    set carsPrice;\n    by Make;\n    \u003cinsert statement>\n    Profit=MSRP-Invoice;\nrun;","options":["if first.Make;","if first.Make then output;","if last.Make;","if last.Make then output;"],"answer":2,"accepted":[],"numeric":false,"explanation":"Sort tăng dần theo MSRP nên row cuối mỗi Make có MSRP cao nhất → dùng last.Make. Subsetting IF cho phép phần còn lại chạy nên Profit được tính trước implicit output; \"if last.Make then output;\" ghi row trước khi tính Profit nên Profit bị missing.","solution":"","solutionCode":"","courseSource":"raw/CR_03_L3_P2_review.md – Review Quiz: Summarizing Data Q10","answerSource":"derived","confidence":"high"},{"id":"cr3-3.3-q1","set":"crreview","number":130,"domain":"D2","topic":"SUM function with column lists","format":"Course quiz","difficulty":"","type":"mc","stem":"Which statement calculates the sum of SalesQ1, SalesQ2, SalesQ3, and SalesQ4? (table columns in order: Office, SalesYear, SalesQ1, SalesQ2, SalesQ3, SalesQ4; e.g. San Francisco 2018 $8,850 $12,046 $8,695 $9,425)","code":"","options":["TotalSales=sum(of SalesQ1--SalesQ4);","TotalSales=sum(of Sales:);","TotalSales=sum(SalesQ1-SalesQ4);","all of the above"],"answer":0,"accepted":[],"numeric":false,"explanation":"SalesQ1--SalesQ4 là positional list, lấy đúng 4 column liền nhau. Sales: cũng gồm cả SalesYear nên sai; thiếu OF thì SalesQ1-SalesQ4 là phép trừ.","solution":"","solutionCode":"","courseSource":"raw/CR_03_L3_P2_review.md – Review Quiz: Manipulating Data with Functions Q1","answerSource":"derived","confidence":"high"},{"id":"cr3-3.3-q2","set":"crreview","number":131,"domain":"D2","topic":"SCAN function","format":"Course quiz","difficulty":"","type":"mc","stem":"Which assignment statement extracts 2019 from the Text variable?","code":"data Scan_Quiz;\n    Text=\"New Year's Day, January 1st, 2019\";\nrun;","options":["Year=scan(Text, -1);","Year=scan(Text, 6);","Year=scan(Text, 6, ', ');","all of the above"],"answer":3,"accepted":[],"numeric":false,"explanation":"Delimiter mặc định gồm space và dấu phẩy (không gồm dấu nháy đơn), nên các từ là New, Year's, Day, January, 1st, 2019: từ thứ 6 và từ cuối (-1) đều là 2019. Chỉ định delimiter \", \" cũng cho cùng kết quả.","solution":"","solutionCode":"","courseSource":"raw/CR_03_L3_P2_review.md – Review Quiz: Manipulating Data with Functions Q2","answerSource":"derived","confidence":"medium"},{"id":"cr3-3.3-q3","set":"crreview","number":132,"domain":"D2","topic":"ROUND function vs format","format":"Course quiz","difficulty":"","type":"mc","stem":"Which statement or statements store the rounded value of HeightCM with one decimal place? (Name, Height, HeightCM: Alfred 69 175.3 · Alice 56.5 143.5 · Barbara 65.3 165.9 · Carol 62.8 159.5 · Henry 63.5 161.3)","code":"","options":["HeightCM=round(Height*2.54, 1);","HeightCM=round(Height*2.54, .1);","HeightCM=Height*2.54; format HeightCM 5.1;","all of the above"],"answer":1,"accepted":[],"numeric":false,"explanation":"ROUND(x, .1) lưu giá trị đã làm tròn 1 chữ số thập phân. ROUND(x, 1) làm tròn thành số nguyên; FORMAT 5.1 chỉ đổi cách hiển thị, giá trị lưu vẫn đầy đủ.","solution":"","solutionCode":"","courseSource":"raw/CR_03_L3_P2_review.md – Review Quiz: Manipulating Data with Functions Q3","answerSource":"derived","confidence":"high"},{"id":"cr3-3.3-q4","set":"crreview","number":133,"domain":"D2","topic":"CATX function","format":"Course quiz","difficulty":"","type":"mc","stem":"In the program below, the assignment statement successfully concatenates Title, First, and Last to create FullName. Which statement produces the same result? (rows: Ms. Farr Sue → \"Ms. Sue Farr\"; Dr. Cox Kay B. → \"Dr. Kay B. Cox\"; Mr. Mason Ron; Ms. Ruth G. H.; Prof. Florentino Helen-Ash → \"Prof. Helen-Ash Florentino\")","code":"data names;\n    set customers;\n    FullName=trim(Title)||\" \"||trim(First)||\" \"||trim(Last);\nrun;","options":["FullName=catx(\" \", Title, First, Last);","FullName=cats(\" \", Title, First, Last);","FullName=cats(Title, First, Last);","FullName=cat(Title, \" \", First, \" \", Last);"],"answer":0,"accepted":[],"numeric":false,"explanation":"CATX bỏ khoảng trắng đầu/cuối mỗi giá trị và chèn delimiter (tham số đầu) giữa chúng, tương đương TRIM + \" \". CATS dính liền không có khoảng cách; CAT giữ trailing blanks.","solution":"","solutionCode":"","courseSource":"raw/CR_03_L3_P2_review.md – Review Quiz: Manipulating Data with Functions Q4","answerSource":"derived","confidence":"high"},{"id":"cr3-3.3-q5","set":"crreview","number":134,"domain":"D1","topic":"SAS date, time and datetime values","format":"Course quiz","difficulty":"","type":"mc","stem":"Based on the following program and results, which statement is false? (CurrentDate 21515; CurrentTime 42168.653; CurrentDateTime 1858938168.7)","code":"data current;\n    CurrentDate=today();\n    CurrentTime=time();\n    CurrentDateTime=datetime();\nrun;","options":["CurrentDate represents the number of days from January 1, 1960.","CurrentTime represents the number of seconds from 12pm (noon).","CurrentDateTime represents the number of seconds from 12am (midnight) on January 1, 1960."],"answer":1,"accepted":[],"numeric":false,"explanation":"SAS time value là số giây kể từ nửa đêm (midnight), không phải từ 12 giờ trưa. Date value tính số ngày từ 01JAN1960; datetime là số giây từ nửa đêm 01JAN1960.","solution":"","solutionCode":"","courseSource":"raw/CR_03_L3_P2_review.md – Review Quiz: Manipulating Data with Functions Q5","answerSource":"derived","confidence":"high"},{"id":"cr3-3.3-q6","set":"crreview","number":135,"domain":"D1","topic":"WHERE vs assignment timing","format":"Course quiz","difficulty":"","type":"mc","stem":"True or False: Based on the data below, the doctor1 and doctor2 tables have the same rows.\n\nData customers:\n```text\nTitle  Name\nMs.    Farr,Sue\nDr.    Cox,Kay B.\nMr.    Mason,Ron\nMs.    Ruth,G. H.\nMs.    Van Allsburg,Jan F.\nDR.    Mitchell,Marc J.\nMs.    Mills,Dorothy E.\nDr.    Webb,Jonathan W.\n```","code":"data doctor1;\n    set customers;\n    Title=upcase(Title);\n    where Title=\"DR.\";\nrun;\n\ndata doctor2;\n    set customers;\n    where upcase(Title)=\"DR.\";\nrun;","options":["True","False"],"answer":1,"accepted":[],"numeric":false,"explanation":"WHERE lọc trên giá trị gốc trước khi row vào PDV, nên assignment UPCASE không ảnh hưởng: doctor1 chỉ có row \"DR. Mitchell\". doctor2 dùng UPCASE trong WHERE nên lấy cả \"Dr.\" và \"DR.\" (3 rows).","solution":"","solutionCode":"","courseSource":"raw/CR_03_L3_P2_review.md – Review Quiz: Manipulating Data with Functions Q6","answerSource":"derived","confidence":"high"},{"id":"cr3-3.3-q7","set":"crreview","number":136,"domain":"D2","topic":"MDY function","format":"Course quiz","difficulty":"","type":"mc","stem":"Which of the following assignment statements returns the SAS date value for February 26, 2019?","code":"","options":["Date=mdy(\"FEB\", 26, 2019","Date=mdy(\"26FEB2019\"d);","Date=mdy(2, 26, 2019);","all of the above"],"answer":2,"accepted":[],"numeric":false,"explanation":"MDY nhận ba số month, day, year. Tháng dạng chữ \"FEB\" không hợp lệ (và option a còn thiếu ngoặc); date constant không phải tham số của MDY.","solution":"","solutionCode":"","courseSource":"raw/CR_03_L3_P2_review.md – Review Quiz: Manipulating Data with Functions Q7","answerSource":"derived","confidence":"high"},{"id":"cr3-3.3-q8","set":"crreview","number":137,"domain":"D2","topic":"PUT function numeric to character","format":"Course quiz","difficulty":"","type":"mc","stem":"Which expression correctly converts numeric ID values to character strings?","code":"","options":["put(ID, $5.)","put(ID, 5.)","input(ID, $5.)","input(ID, 5.)"],"answer":1,"accepted":[],"numeric":false,"explanation":"PUT(numeric, numeric-format) trả về chuỗi ký tự. Format phải cùng kiểu với giá trị nguồn nên $5. sai; INPUT dùng để chuyển character sang numeric.","solution":"","solutionCode":"","courseSource":"raw/CR_03_L3_P2_review.md – Review Quiz: Manipulating Data with Functions Q8","answerSource":"derived","confidence":"high"},{"id":"cr3-3.3-q9","set":"crreview","number":138,"domain":"D2","topic":"INPUT function with date informats","format":"Course quiz","difficulty":"","type":"mc","stem":"Which of the following statements converts the character values of Service to numeric SAS date values? (values 03JUN2018, 08MAR2018, 12SEP2018, 11JUN2018, 07SEP2018)","code":"","options":["ServiceDate=input(Service, date9.);","ServiceDate=input(Service, anydtdte.);","ServiceDate=input(Service, mmddyy9.);","a and b","all of the above"],"answer":3,"accepted":[],"numeric":false,"explanation":"Giá trị dạng ddMONyyyy đọc được bằng DATE9. và ANYDTDTE. MMDDYY9. đòi dạng số tháng/ngày/năm nên sẽ cho missing kèm note invalid data.","solution":"","solutionCode":"","courseSource":"raw/CR_03_L3_P2_review.md – Review Quiz: Manipulating Data with Functions Q9","answerSource":"derived","confidence":"high"},{"id":"cr3-3.3-q10","set":"crreview","number":139,"domain":"D2","topic":"Type conversion and existing columns","format":"Course quiz","difficulty":"","type":"mc","stem":"Assuming the ID column in the employees table is numeric, which statement is true?","code":"data convert;\n    set employees;\n    ID=put(ID, 5.);\nrun;","options":["ID is converted to a character column.","A syntax error is generated and the step fails.","The step runs, but ID is not converted to a character column."],"answer":2,"accepted":[],"numeric":false,"explanation":"Kiểu của ID đã cố định là numeric lúc compile (từ SET), không thể đổi. PUT trả về chuỗi rồi SAS tự chuyển ngược về numeric (note trong log), nên step chạy nhưng ID vẫn numeric.","solution":"","solutionCode":"","courseSource":"raw/CR_03_L3_P2_review.md – Review Quiz: Manipulating Data with Functions Q10","answerSource":"derived","confidence":"high"},{"id":"cr3-3.4-q1","set":"crreview","number":140,"domain":"D4","topic":"Format naming rules","format":"Course quiz","difficulty":"","type":"mc","stem":"Which of the following statements about the name of a format in the VALUE statement is false?","code":"","options":["The name cannot end with a number or include a period.","The name cannot be the name of a SAS format.","The name cannot be the name of a data set variable.","The name must begin with a dollar sign ($) if used with a character variable."],"answer":2,"accepted":[],"numeric":false,"explanation":"Tên format hoàn toàn có thể trùng tên một column, vì format và column nằm ở hai không gian tên khác nhau. Không kết thúc bằng số, không trùng format SAS, character format bắt đầu bằng $ đều là quy tắc đúng.","solution":"","solutionCode":"","courseSource":"raw/CR_03_L3_P2_review.md – Review Quiz: Creating Custom Formats Q1","answerSource":"derived","confidence":"high"},{"id":"cr3-3.4-q2","set":"crreview","number":141,"domain":"D4","topic":"PROC FORMAT VALUE syntax","format":"Course quiz","difficulty":"","type":"mc","stem":"Which of the following FORMAT procedures is written correctly?","code":"","options":["proc format value colorfmt;\n    1='Red'\n    2='Green'\n    3='Blue'\nrun;","proc format;\n    value colorfmt\n    1='Red'\n    2='Green'\n    3='Blue';\nrun;","proc format;\n    value colorfmt;\n    1='Red'\n    2='Green'\n    3='Blue';\nrun;","proc format;\n    value colorfmt\n    1='Red';\n    2='Green';\n    3='Blue';\nrun;"],"answer":1,"accepted":[],"numeric":false,"explanation":"PROC FORMAT kết thúc bằng \";\", rồi VALUE statement là một statement duy nhất gồm tên format và mọi cặp range=label, chỉ có một \";\" ở cuối. Đặt \";\" sau tên format hoặc sau từng label làm gãy statement.","solution":"","solutionCode":"","courseSource":"raw/CR_03_L3_P2_review.md – Review Quiz: Creating Custom Formats Q2","answerSource":"derived","confidence":"high"},{"id":"cr3-3.4-q3","set":"crreview","number":142,"domain":"D4","topic":"Format label length","format":"Course quiz","difficulty":"","type":"mc","stem":"How many characters can be used in a format label?","code":"","options":["96","200","256","32,767"],"answer":3,"accepted":[],"numeric":false,"explanation":"Label của custom format dài tối đa 32,767 ký tự. Các số khác là giới hạn của thứ khác (ví dụ 200 là độ dài mặc định trong một số ngữ cảnh) nên dễ nhầm.","solution":"","solutionCode":"","courseSource":"raw/CR_03_L3_P2_review.md – Review Quiz: Creating Custom Formats Q3","answerSource":"derived","confidence":"high"},{"id":"cr3-3.4-q4","set":"crreview","number":143,"domain":"D4","topic":"OTHER keyword","format":"Course quiz","difficulty":"","type":"mc","stem":"Which keyword can be used to label missing numeric values as well as any values that are not specified in a range?","code":"","options":["LOW","MISS","MISSING","OTHER"],"answer":3,"accepted":[],"numeric":false,"explanation":"OTHER bắt mọi giá trị không thuộc range nào, kể cả missing (nếu missing chưa được gán riêng). LOW không bao gồm missing với numeric format; MISS/MISSING không phải keyword range.","solution":"","solutionCode":"","courseSource":"raw/CR_03_L3_P2_review.md – Review Quiz: Creating Custom Formats Q4","answerSource":"derived","confidence":"high"},{"id":"cr3-3.4-q5","set":"crreview","number":144,"domain":"D4","topic":"VALUE statement ranges","format":"Course quiz","difficulty":"","type":"mc","stem":"In the VALUE statement, labels are assigned to a range of data values. Which statement about specifying a range is false?","code":"","options":["a range can include a single value, such as 24 or 'S'","a range can include numeric values, such as 0-1500","a range can include character values, such as 'A'-'M'","a range of values for a numeric format can include a list of numeric and character values separated by commas, such as 90,'135',180,'215',270"],"answer":3,"accepted":[],"numeric":false,"explanation":"Một format chỉ áp dụng cho một kiểu dữ liệu, nên range của numeric format không được trộn giá trị character như '135'. Giá trị đơn, range số và range ký tự đều hợp lệ.","solution":"","solutionCode":"","courseSource":"raw/CR_03_L3_P2_review.md – Review Quiz: Creating Custom Formats Q5","answerSource":"derived","confidence":"high"},{"id":"cr3-3.4-q6","set":"crreview","number":145,"domain":"D4","topic":"FORMAT statement in DATA step","format":"Course quiz","difficulty":"","type":"mc","stem":"You can place the FORMAT statement in either a DATA step or a PROC step. What happens when you place it in a DATA step?","code":"","options":["You temporarily associate the formats with variables.","You permanently associate the formats with variables.","You replace the original data with the format labels.","You make the formats available to other data sets."],"answer":1,"accepted":[],"numeric":false,"explanation":"FORMAT trong DATA step lưu format vào descriptor của bảng output, gắn vĩnh viễn với column. Dữ liệu gốc không bị thay; FORMAT trong PROC step mới là tạm thời.","solution":"","solutionCode":"","courseSource":"raw/CR_03_L3_P2_review.md – Review Quiz: Creating Custom Formats Q6","answerSource":"derived","confidence":"high"},{"id":"cr3-3.4-q7","set":"crreview","number":146,"domain":"D4","topic":"Applying a custom format","format":"Course quiz","difficulty":"","type":"mc","stem":"Suppose the format JOBFMT was created in a FORMAT procedure. Which FORMAT statement applies it to the variable JobTitle in the program output?","code":"","options":["format jobtitle jobfmt;","format jobtitle jobfmt.;","format jobtitle=jobfmt;","format jobtitle='jobfmt';"],"answer":1,"accepted":[],"numeric":false,"explanation":"Khi áp dụng, tên format phải có dấu chấm ở cuối (jobfmt.). Không dùng \"=\" hay dấu nháy; thiếu dấu chấm thì SAS hiểu jobfmt là tên column.","solution":"","solutionCode":"","courseSource":"raw/CR_03_L3_P2_review.md – Review Quiz: Creating Custom Formats Q7","answerSource":"derived","confidence":"high"},{"id":"cr3-3.4-q8","set":"crreview","number":147,"domain":"D4","topic":"Format catalog location","format":"Course quiz","difficulty":"","type":"mc","stem":"Suppose you do not specify the LIBRARY= option when creating a custom format. How long does the format exist?","code":"","options":["only for the current procedure","only for the current DATA step","only for the current SAS session","permanently"],"answer":2,"accepted":[],"numeric":false,"explanation":"Không có LIBRARY=, format được lưu vào catalog Work.Formats nên chỉ tồn tại trong session hiện tại. Nó vẫn dùng được ở mọi step sau trong session.","solution":"","solutionCode":"","courseSource":"raw/CR_03_L3_P2_review.md – Review Quiz: Creating Custom Formats Q8","answerSource":"derived","confidence":"high"},{"id":"cr3-3.4-q9","set":"crreview","number":148,"domain":"D4","topic":"Permanent formats with LIBRARY=","format":"Course quiz","difficulty":"","type":"mc","stem":"Which of the following statements store your formats in a permanent location?","code":"","options":["libname fmtlib 'c:\\formats';\nproc format lib=fmtlib;\n   ...;","libname fmtlib 'c:\\formats';\nformat lib=fmtlib;\n   ...;","fmtlib='c:\\formats';\nproc format fmtlib;\n   ...;","fmtlib='c:\\formats';\nproc format;\nlibrary=fmtlib;\n   ...;"],"answer":0,"accepted":[],"numeric":false,"explanation":"Cần LIBNAME tạo libref rồi option LIB=/LIBRARY= trong câu lệnh PROC FORMAT. Option b thiếu PROC; c và d không tạo libref và đặt option sai chỗ.","solution":"","solutionCode":"","courseSource":"raw/CR_03_L3_P2_review.md – Review Quiz: Creating Custom Formats Q9","answerSource":"derived","confidence":"high"},{"id":"cr3-3.4-q10","set":"crreview","number":149,"domain":"D4","topic":"CNTLIN= control data set","format":"Course quiz","difficulty":"","type":"mc","stem":"Which column is not required in the country table to build a custom format with the following program?","code":"proc format cntlin=country;\nrun;","options":["Fmtname","Start","Value","Label"],"answer":2,"accepted":[],"numeric":false,"explanation":"Bảng CNTLIN= cần FmtName, Start và Label (End tuỳ chọn). Không có column tên Value; \"VALUE\" chỉ là tên statement trong PROC FORMAT nên dễ nhầm.","solution":"","solutionCode":"","courseSource":"raw/CR_03_L3_P2_review.md – Review Quiz: Creating Custom Formats Q10","answerSource":"derived","confidence":"high"},{"id":"cr3-3.5-q1","set":"crreview","number":150,"domain":"D1","topic":"Concatenating tables with different columns","format":"Course quiz","difficulty":"","type":"mc","stem":"After this code runs, what is the order of the columns in the empsall table?\n\nempscn:\n```text\nName   Status  Country\nChang  M       China\nLi     M       China\nMing   S       China\n```\n\nempsjp:\n```text\nName  Status  Region\nCho   F       Japan\nTomi  M       Japan\n```","code":"data empsall;\n    set empscn empsjp;\nrun;","options":["Name, Status","Name, Status, Country","Name, Status, Country, Region","The program fails because the tables have different columns."],"answer":2,"accepted":[],"numeric":false,"explanation":"Concatenate với SET vẫn chạy khi column khác nhau: PDV lấy column của bảng đầu (Name, Status, Country) rồi thêm Region từ bảng sau. Giá trị thiếu sẽ là missing.","solution":"","solutionCode":"","courseSource":"raw/CR_03_L3_P2_review.md – Review Quiz: Combining Tables Q1","answerSource":"derived","confidence":"high"},{"id":"cr3-3.5-q2","set":"crreview","number":151,"domain":"D1","topic":"RENAME= when concatenating","format":"Course quiz","difficulty":"","type":"mc","stem":"Which statement creates the empsall table as shown?\n\nempscn:\n```text\nName   Status  Country\nChang  M       China\nLi     M       China\nMing   S       China\n```\n\nempsjp:\n```text\nName  Status  Region\nCho   O       Japan\nTomi  M       Japan\n```\n\nempsall:\n```text\nName   Status  Country\nChang  M       China\nLi     M       China\nMing   S       China\nCho    O       Japan\nTomi   M       Japan\n```","code":"","options":["set empscn(rename=(Country=Region)) empsjp;","set empscn rename=(Region=Country) empsjp;","set empscn empsjp(rename(Country=Region));","set empscn empsjp(rename=(Region=Country));"],"answer":3,"accepted":[],"numeric":false,"explanation":"Cần đổi Region của empsjp thành Country, dạng old=new, đặt trong ngoặc ngay sau tên bảng: empsjp(rename=(Region=Country)). Các option khác đổi sai chiều, sai bảng hoặc sai cú pháp.","solution":"","solutionCode":"","courseSource":"raw/CR_03_L3_P2_review.md – Review Quiz: Combining Tables Q2","answerSource":"derived","confidence":"high"},{"id":"cr3-3.5-q3","set":"crreview","number":152,"domain":"D1","topic":"Column length when concatenating","format":"Course quiz","difficulty":"","type":"mc","stem":"If the length of Name in the empscn table is 5, and the length of Name in the empsjp table is 6, what happens when the following code is submitted? (empsjp: Cho O Japan · Tomi M Japan · Himari S Japan; both tables have Country)","code":"data empsall;\n    set empscn empsjp;\nrun;","options":["A syntax error is generated and the step does not run.","The length of Name in empsall is 6 based on the maximum length of Name in the two input tables. All the values of Name are stored correctly.","The length of Name in empsall is 5 based on the first table listed in the SET statement. A warning is issued, and the values of Name in empsjp might be truncated to 5 characters."],"answer":2,"accepted":[],"numeric":false,"explanation":"Thuộc tính column lấy từ bảng đầu tiên trong SET, nên Name dài 5 và \"Himari\" có thể bị cắt; log có WARNING multiple lengths. SAS không tự lấy độ dài lớn nhất; cách sửa là LENGTH trước SET.","solution":"","solutionCode":"","courseSource":"raw/CR_03_L3_P2_review.md – Review Quiz: Combining Tables Q3","answerSource":"derived","confidence":"high"},{"id":"cr3-3.5-q4","set":"crreview","number":153,"domain":"D1","topic":"Match-merge basics","format":"Course quiz","difficulty":"","type":"mc","stem":"Which statement about merging with matching rows is true?","code":"","options":["The SET statement and the MERGE statement are used together in the DATA step to merge tables.","Two or more input tables can be merged in a DATA step.","The BY statement in the DATA step names a column to order the output table.","By default, the DATA step writes only matching rows to the output table."],"answer":1,"accepted":[],"numeric":false,"explanation":"MERGE nhận hai hay nhiều bảng. Không dùng chung SET với MERGE; BY chỉ định column để so khớp (input phải đã sort), và mặc định ghi cả row khớp lẫn không khớp.","solution":"","solutionCode":"","courseSource":"raw/CR_03_L3_P2_review.md – Review Quiz: Combining Tables Q4","answerSource":"derived","confidence":"high"},{"id":"cr3-3.5-q5","set":"crreview","number":154,"domain":"D3","topic":"Merge with unsorted input","format":"Course quiz","difficulty":"","type":"mc","stem":"What happens if you submit the following program to merge the donor1 and donor2 tables shown below? (As displayed, neither table appears sorted by ID.)\n\ndonor1:\n```text\nID    Type  Units\n2304  0     16\n1129  A     48\n1129  A     50\n1129  A     57\n2486  B     63\n```\n\ndonor2:\n```text\nID    Code  Units\n1129  63    32\n2304  61    45\n1287  64    67\n```","code":"data combine;\n    merge donor1 donor2;\n    by ID;\nrun;","options":["The merged data set contains some missing values because not all rows have matching rows in the other data set.","The merged data set contains eight observations.","The DATA step produces errors.","Values for Units in donor2 overwrite values of Units in donor1."],"answer":2,"accepted":[],"numeric":false,"explanation":"Hai bảng không được sort theo ID nên MERGE với BY ID báo ERROR \"BY variables are not properly sorted\" và dừng. Các hệ quả về missing hay ghi đè Units chỉ xảy ra nếu dữ liệu đã được sort.","solution":"","solutionCode":"","courseSource":"raw/CR_03_L3_P2_review.md – Review Quiz: Combining Tables Q5","answerSource":"derived","confidence":"high"},{"id":"cr3-3.5-q6","set":"crreview","number":155,"domain":"D1","topic":"Match-merge row count","format":"Course quiz","difficulty":"","type":"mc","stem":"If you merge the tables project and hours by ID and Name, how many rows does the new table contain?\n\nproject:\n```text\nID   Name     Dept  Project\n000  Miguel   A12   Document\n111  Fred     B45   Survey\n222  Diane    B45   Document\n888  Monique  A12   Document\n999  Vien     D03   Survey\n```\n\nhours:\n```text\nID   Name     Hours\n111  Fred     35\n222  Diane    40\n777  Steve    0\n888  Monique  37\n```","code":"","options":["three","five","six","nine"],"answer":2,"accepted":[],"numeric":false,"explanation":"Merge mặc định giữ cả row khớp và không khớp. Các ID khác nhau: 000, 111, 222, 777, 888, 999 → 6 rows (111, 222, 888 khớp nên mỗi ID chỉ một row).","solution":"","solutionCode":"","courseSource":"raw/CR_03_L3_P2_review.md – Review Quiz: Combining Tables Q6","answerSource":"derived","confidence":"high"},{"id":"cr3-3.5-q7","set":"crreview","number":156,"domain":"D1","topic":"One-to-many merge","format":"Course quiz","difficulty":"","type":"mc","stem":"If you merge the tables reps, close, and bonus by ID, what is the value of Bonus in the third observation in the new data set?\n\nreps:\n```text\nID  Name\n1   Nay Rong\n2   Kelly Windsor\n3   Julio Meraz\n```\n\nclose:\n```text\nID  Sale\n1   $28,000\n2   $30,000\n2   $40,000\n3   $15,000\n3   $20,000\n3   $25,000\n```\n\nbonus:\n```text\nID  Bonus\n1   $2,000\n2   $4,000\n3   $3,000\n```","code":"","options":["$4,000","$3,000","missing","You cannot tell from the information given."],"answer":0,"accepted":[],"numeric":false,"explanation":"Merge one-to-many: ID 1 cho 1 row, ID 2 cho 2 rows. Observation thứ 3 là row thứ hai của ID 2; Bonus của bảng chỉ có một row được giữ lại trong PDV cho cả BY group nên là $4,000.","solution":"","solutionCode":"","courseSource":"raw/CR_03_L3_P2_review.md – Review Quiz: Combining Tables Q7","answerSource":"derived","confidence":"high"},{"id":"cr3-3.5-q8","set":"crreview","number":157,"domain":"D1","topic":"IN= to select non-matches","format":"Course quiz","difficulty":"","type":"mc","stem":"Which statement best describes the rows in the output table combine?","code":"data combine;\n    merge project(in=p) hours(in=h);\n    by ID;\n    if p=1 and h=0;\nrun;","options":["all the matching rows from both project and hours","only the rows from project that have no match in hours","only the rows from hours that have no match in project","all the matching and nonmatching rows from both project and hours"],"answer":1,"accepted":[],"numeric":false,"explanation":"p=1 nghĩa là row có trong project, h=0 nghĩa là không có trong hours. Subsetting IF chỉ giữ row của project không khớp với hours.","solution":"","solutionCode":"","courseSource":"raw/CR_03_L3_P2_review.md – Review Quiz: Combining Tables Q8","answerSource":"derived","confidence":"high"},{"id":"cr3-3.5-q9","set":"crreview","number":158,"domain":"D1","topic":"Merge output to multiple tables","format":"Course quiz","difficulty":"","type":"mc","stem":"In this merge, how many rows are written to the output table other? (Same project and hours tables as Q6.)\n\nproject:\n```text\nID   Name     Dept  Project\n000  Miguel   A12   Document\n111  Fred     B45   Survey\n222  Diane    B45   Document\n888  Monique  A12   Document\n999  Vien     D03   Survey\n```\n\nhours:\n```text\nID   Name     Hours\n111  Fred     35\n222  Diane    40\n777  Steve    0\n888  Monique  37\n```","code":"data match other;\n    merge project(in=p) hours(in=h);\n    by ID;\n    if p=1 and h=1 then output match;\n    else output other;\nrun;","options":["unknown","one","two","three"],"answer":3,"accepted":[],"numeric":false,"explanation":"ID khớp cả hai (111, 222, 888) vào match. Các ID chỉ có ở một bảng là 000, 999 (project) và 777 (hours) → 3 rows vào other.","solution":"","solutionCode":"","courseSource":"raw/CR_03_L3_P2_review.md – Review Quiz: Combining Tables Q9","answerSource":"derived","confidence":"high"},{"id":"cr3-3.5-q10","set":"crreview","number":159,"domain":"D1","topic":"RENAME= to avoid overwriting in merge","format":"Course quiz","difficulty":"","type":"mc","stem":"The tables spring and summer both contain a variable named blue. Which step prevents the values of the column blue from being overwritten when the two tables are merged?","code":"","options":["data merged; merge spring(in=blue) summer; by fabric; run;","data merged; merge spring(out=blue) summer; by fabric; run;","data merged; merge spring(blue=navy) summer; by fabric; run;","data merged; merge spring(rename=(blue=navy)) summer; by fabric; run;"],"answer":3,"accepted":[],"numeric":false,"explanation":"Khi hai bảng có column trùng tên (không phải BY column), giá trị bảng sau ghi đè bảng trước. Đổi tên bằng RENAME=(blue=navy) giữ được cả hai; IN= chỉ tạo biến cờ, OUT= và blue=navy không phải cú pháp hợp lệ.","solution":"","solutionCode":"","courseSource":"raw/CR_03_L3_P2_review.md – Review Quiz: Combining Tables Q10","answerSource":"derived","confidence":"high"},{"id":"cr3-3.6-q1","set":"crreview","number":160,"domain":"D2","topic":"DO loop facts","format":"Course quiz","difficulty":"","type":"mc","stem":"Which statement about DO loops is false?","code":"","options":["They can contain conditional clauses.","They can generate multiple observations.","They can be used to combine DATA and PROC steps.","A DO loop can be nested inside another DO loop."],"answer":2,"accepted":[],"numeric":false,"explanation":"DO loop chỉ chạy trong một DATA step, không thể bao DATA và PROC step. Nó có thể có WHILE/UNTIL, dùng OUTPUT để tạo nhiều row, và lồng nhau được.","solution":"","solutionCode":"","courseSource":"raw/CR_03_L3_P2_review.md – Review Quiz: Processing Repetitive Code Q1","answerSource":"derived","confidence":"high"},{"id":"cr3-3.6-q2","set":"crreview","number":161,"domain":"D2","topic":"Iterative DO loop","format":"Course quiz","difficulty":"","type":"mc","stem":"Which statement about the iterative DO loop is true? (syntax shown: DO index-column = start TO stop \u003cBY increment> ;)","code":"","options":["The start and stop values can be character or numeric values.","If an increment value is not specified, the default increment is 1.","The index column is incremented at the start of each DO loop.","The index column is temporary and is not included in the output table."],"answer":1,"accepted":[],"numeric":false,"explanation":"Không có BY thì bước nhảy mặc định là 1. Start/stop trong dạng TO phải là số; index tăng ở cuối mỗi vòng; index column được ghi ra bảng trừ khi DROP.","solution":"","solutionCode":"","courseSource":"raw/CR_03_L3_P2_review.md – Review Quiz: Processing Repetitive Code Q2","answerSource":"derived","confidence":"high"},{"id":"cr3-3.6-q3","set":"crreview","number":162,"domain":"D2","topic":"DO loop iterations","format":"Course quiz","difficulty":"","type":"mc","stem":"How many times does the DO loop in this code execute?","code":"data earnings;\n    Amount=1000;\n    Rate=.075/12;\n    do Month=1 to 12;\n        Earned+(amount+earned)*rate;\n    end;\nrun;","options":["0","1","12","13"],"answer":2,"accepted":[],"numeric":false,"explanation":"do Month=1 to 12 chạy thân vòng lặp 12 lần. Month đạt 13 chỉ để kiểm tra điều kiện thoát, thân lặp không chạy lần thứ 13.","solution":"","solutionCode":"","courseSource":"raw/CR_03_L3_P2_review.md – Review Quiz: Processing Repetitive Code Q3","answerSource":"derived","confidence":"high"},{"id":"cr3-3.6-q4","set":"crreview","number":163,"domain":"D2","topic":"DO loop without OUTPUT","format":"Course quiz","difficulty":"","type":"mc","stem":"After this code runs, how many rows are in the earnings table?","code":"data earnings;\n    Amount=1000;\n    Rate=.075/12;\n    do Month=1 to 12;\n        Earned+(amount+earned)*rate;\n    end;\nrun;","options":["unknown","1","12","13"],"answer":1,"accepted":[],"numeric":false,"explanation":"Không có SET và không có OUTPUT trong vòng lặp, nên DATA step chạy một lần và chỉ implicit output ở RUN ghi 1 row.","solution":"","solutionCode":"","courseSource":"raw/CR_03_L3_P2_review.md – Review Quiz: Processing Repetitive Code Q4","answerSource":"derived","confidence":"high"},{"id":"cr3-3.6-q5","set":"crreview","number":164,"domain":"D2","topic":"Index value after DO loop","format":"Course quiz","difficulty":"","type":"mc","stem":"After this code runs, what is the value of Month in the earnings table?","code":"data earnings;\n    Amount=1000;\n    Rate=.075/12;\n    do Month=1 to 12;\n        Earned+(amount+earned)*rate;\n    end;\nrun;","options":["unknown","1","12","13"],"answer":3,"accepted":[],"numeric":false,"explanation":"Sau vòng 12, index tăng lên 13 rồi điều kiện 13 > 12 làm vòng lặp kết thúc. Implicit output xảy ra sau đó nên row ghi ra có Month=13.","solution":"","solutionCode":"","courseSource":"raw/CR_03_L3_P2_review.md – Review Quiz: Processing Repetitive Code Q5","answerSource":"derived","confidence":"high"},{"id":"cr3-3.6-q6","set":"crreview","number":165,"domain":"D2","topic":"OUTPUT inside DO loop","format":"Course quiz","difficulty":"","type":"mc","stem":"Which of the following statements about the program shown below is false?","code":"data work.invest;\n    do year=1990 to 2004;\n        Capital+5000;\n        capital+(capital*.10);\n        output;\n    end;\nrun;","options":["The OUTPUT statement writes the values in the PDV to the invest table at the end of each DO loop iteration.","The last value for Year in the new table is 2005.","The OUTPUT statement overrides the implicit OUTPUT at the end of the DATA step.","The DO loop performs 15 iterations."],"answer":1,"accepted":[],"numeric":false,"explanation":"OUTPUT nằm trong vòng lặp nên row cuối được ghi khi year=2004. year tăng lên 2005 sau đó nhưng không được ghi vì implicit output đã bị tắt. 1990–2004 là 15 vòng.","solution":"","solutionCode":"","courseSource":"raw/CR_03_L3_P2_review.md – Review Quiz: Processing Repetitive Code Q6","answerSource":"derived","confidence":"high"},{"id":"cr3-3.6-q7","set":"crreview","number":166,"domain":"D2","topic":"Nested DO loops","format":"Course quiz","difficulty":"","type":"mc","stem":"Which of the following would you use to compare the result of investing $4,000 a year for five years with interest compounded monthly?","code":"","options":["DO WHILE statement","nested DO loops","DO UNTIL statement","a DO group"],"answer":1,"accepted":[],"numeric":false,"explanation":"Cần vòng ngoài theo năm (5 năm) và vòng trong theo tháng (12 tháng) để tính lãi gộp hàng tháng, tức nested DO loops. WHILE/UNTIL chỉ là điều kiện, không tự tạo hai cấp lặp.","solution":"","solutionCode":"","courseSource":"raw/CR_03_L3_P2_review.md – Review Quiz: Processing Repetitive Code Q7","answerSource":"derived","confidence":"high"},{"id":"cr3-3.6-q8","set":"crreview","number":167,"domain":"D2","topic":"DO UNTIL loop","format":"Course quiz","difficulty":"","type":"mc","stem":"Which statement about DO UNTIL loops is false?","code":"","options":["The condition is evaluated at the top of the loop, before the enclosed statements are executed.","The enclosed statements are always executed at least once.","SAS statements in the DO loop are executed until the specified condition is true.","The DO loop must have a closing END statement."],"answer":0,"accepted":[],"numeric":false,"explanation":"DO UNTIL kiểm tra điều kiện ở cuối (bottom) vòng lặp, vì vậy luôn chạy ít nhất một lần. Kiểm tra ở đầu vòng là đặc điểm của DO WHILE.","solution":"","solutionCode":"","courseSource":"raw/CR_03_L3_P2_review.md – Review Quiz: Processing Repetitive Code Q8","answerSource":"derived","confidence":"high"},{"id":"cr3-3.6-q9","set":"crreview","number":168,"domain":"D2","topic":"DO UNTIL vs DO WHILE","format":"Course quiz","difficulty":"","type":"mc","stem":"True or False: These two programs generate the same result.","code":"data work.invest;\n    capital=100000;\n    do until(Capital gt 500000);\n        Year+1;\n        capital+(capital*.10);\n    end;\nrun;\n\ndata work.invest;\n    capital=100000;\n    do while(Capital le 500000);\n        Year+1;\n        capital+(capital*.10);\n    end;\nrun;","options":["True","False"],"answer":0,"accepted":[],"numeric":false,"explanation":"Hai điều kiện là phủ định của nhau (gt 500000 vs le 500000) và capital ban đầu 100000 nên DO WHILE cũng chạy vòng đầu. Cả hai dừng ở cùng năm với cùng capital.","solution":"","solutionCode":"","courseSource":"raw/CR_03_L3_P2_review.md – Review Quiz: Processing Repetitive Code Q9","answerSource":"derived","confidence":"high"},{"id":"cr3-3.6-q10","set":"crreview","number":169,"domain":"D2","topic":"Iterative DO with conditional clause","format":"Course quiz","difficulty":"","type":"mc","stem":"In the following program, complete the DO statement so that the program stops generating observations when Distance reaches 250 miles or when 10 gallons of fuel have been used.","code":"/* --- Bắt đầu: Dữ liệu mẫu tự động tạo --- */\noptions dlcreatedir;\nlibname cert \"%sysfunc(pathname(work))/cert\";\n\ndata cert.cars;\n    infile datalines dlm=\"|\" dsd;\n    length Make $ 10 Model $ 10 MPG 8;\n    input Make $ Model $ MPG;\n    datalines;\nToyota|Corolla|32\nFord|F-150|19\nHonda|Civic|36\n;\nrun;\n/* --- Kết thúc: Dữ liệu mẫu --- */\n\ndata work.go250;\n    set cert.cars;\n    do gallons=1 to 10 ... ;\n        Distance=gallons*mpg;\n        output;\n    end;\nrun;","options":["while(Distance\u003c250)","when(Distance>250)","until(Distance=250)","or until(Distance>=250)"],"answer":0,"accepted":[],"numeric":false,"explanation":"Kết hợp index với điều kiện: do gallons=1 to 10 while(Distance\u003c250); vòng dừng khi Distance đạt 250 hoặc hết 10 gallon. WHEN không phải keyword của DO; until(Distance=250) chỉ dừng khi bằng đúng 250; \"or\" trước UNTIL không hợp lệ cú pháp.","solution":"","solutionCode":"","courseSource":"raw/CR_03_L3_P2_review.md – Review Quiz: Processing Repetitive Code Q10","answerSource":"derived","confidence":"medium","courseOriginal":{"stem":"In the following program, complete the DO statement so that the program stops generating observations when Distance reaches 250 miles or when 10 gallons of fuel have been used.","code":"data work.go250;\n    set cert.cars;\n    do gallons=1 to 10 ... ;\n        Distance=gallons*mpg;\n        output;\n    end;\nrun;","answer":0,"accepted":[],"explanation":"Kết hợp index với điều kiện: do gallons=1 to 10 while(Distance\u003c250); vòng dừng khi Distance đạt 250 hoặc hết 10 gallon. WHEN không phải keyword của DO; until(Distance=250) chỉ dừng khi bằng đúng 250; \"or\" trước UNTIL không hợp lệ cú pháp."}},{"id":"cr3-3.7-q1","set":"crreview","number":170,"domain":"D2","topic":"Wide vs narrow tables","format":"Course quiz","difficulty":"","type":"mc","stem":"Which is the better description for the following table? (Employee_ID, Home, Work, Cell – one row per employee: 120106 (02) 2555 5993 · (02) 2555 3888 · 0461 555 555; 120107 … no Cell; 120108 …; 120109; 120110)","code":"","options":["wide table","narrow table"],"answer":0,"accepted":[],"numeric":false,"explanation":"Mỗi employee một row, mỗi loại phone một column riêng là cấu trúc wide. Narrow sẽ có một column Phone và một column định danh loại phone.","solution":"","solutionCode":"","courseSource":"raw/CR_03_L3_P2_review.md – Review Quiz: Restructuring Tables Q1","answerSource":"derived","confidence":"high"},{"id":"cr3-3.7-q2","set":"crreview","number":171,"domain":"D2","topic":"Narrow table for PROC FREQ","format":"Course quiz","difficulty":"","type":"mc","stem":"Which table structure is better to use as input in PROC FREQ to report the count of phone numbers for Home, Work, and Cell?","code":"","options":["table with Employee_ID, Phone_Type (Home/Work/Cell), Phone – one row per phone","table with Employee_ID, Hom k.future_expenses_annual: initial Wages = 12,874,000, initial Medical = 649,000; Wages increase 6% per year and Medical 9.5% per year, compounded quarterly (hint per quarter: `Wages = Wages * (1 + .06/4);` and `Medical = Medical * (1 + .095/4);`); forecast Wages and Medical for the next 10 years; output one row per year. What is Medical in row 9?","code":"","options":[],"answer":"1510865","accepted":["1510865","1,510,865"],"numeric":true,"explanation":"Với một dòng mỗi năm, dòng 9 là sau 36 quý: 649000*(1+.095/4)**36 ≈ 1,510,865. Lưu ý OUTPUT phải đặt giữa END của vòng Qtr và END của vòng Year; code hiển thị đặt OUTPUT trong vòng Qtr (mỗi quý một dòng), nhưng đáp án ứng với một dòng mỗi năm.","solution":"","solutionCode":"data future_expenses_annual;\n    Wages = 12874000;\n    Medical = 649000;\n    do Year = 1 to 10;\n        do Qtr = 1 to 4;\n                Wages = Wages * (1 + .06/4);\n                Medical = Medical * (1 + .095/4);\n                  output;\n        end;\n\n    end;\n    drop Qtr;\n    format Wages Medical comma20.;\nrun;","courseSource":"raw/CR_05_L5_challenging_topics.md – Programming Question 5.08 (1)","answerSource":"official","confidence":"high"},{"id":"crx-pq5.08-2","set":"crcase","number":40,"domain":"D2","topic":"Nested iterative DO loops","format":"Course programming question","difficulty":"","type":"sa","stem":"PQ 5.08: Create work.future_expenses_annual: initial Wages = 12,874,000, initial Medical = 649,000; Wages increase 6% per year and Medical 9.5% per year, compounded quarterly (hint per quarter: `Wages = Wages * (1 + .06/4);` and `Medical = Medical * (1 + .095/4);`); forecast Wages and Medical for the next 10 years; output one row per year. What is Wages in row 8?","code":"","options":[],"answer":"20731315","accepted":["20731315","20,731,315"],"numeric":true,"explanation":"Dòng 8 là sau 32 quý: 12874000*(1+.06/4)**32 ≈ 20,731,315 (một dòng mỗi năm, OUTPUT ở cuối vòng Year).","solution":"","solutionCode":"data future_expenses_annual;\n    Wages = 12874000;\n    Medical = 649000;\n    do Year = 1 to 10;\n        do Qtr = 1 to 4;\n                Wages = Wages * (1 + .06/4);\n                Medical = Medical * (1 + .095/4);\n                  output;\n        end;\n\n    end;\n    drop Qtr;\n    format Wages Medical comma20.;\nrun;","courseSource":"raw/CR_05_L5_challenging_topics.md – Programming Question 5.08 (2)","answerSource":"official","confidence":"high"},{"id":"crx-pq5.09-1","set":"crcase","number":41,"domain":"D2","topic":"DO UNTIL loop","format":"Course programming question","difficulty":"","type":"sa","stem":"PQ 5.09: Create work.rewards with two columns, Year and Reserve; Year starts at 1; Reserve starts at 1e6; each month 5000 is added to Reserve; 4% interest compounded monthly after the 5000 is added (hint: `Reserve = Reserve + (Reserve * .04 / 12);`); one row output per year; output continues until Reserve is greater than 1.5e6; COMMA20 format on Reserve. How many rows are written to output?","code":"","options":[],"answer":"5","accepted":["5","five"],"numeric":true,"explanation":"DO UNTIL kiểm tra điều kiện ở cuối vòng; mỗi vòng ngoài là một năm (12 tháng) rồi OUTPUT. Reserve vượt 1.5e6 sau năm thứ 5 nên có 5 dòng.","solution":"","solutionCode":"data rewards;\n    Year = 1;\n    Reserve = 1e6;\n    do until (Reserve > 1.5e6);\n       do month = 1 to 12;\n          Reserve = Reserve + 5000;\n          Reserve = Reserve + (Reserve * .04 / 12);\n       end;\n       output;\n       Year = Year + 1;\n    end;\n    format Reserve comma20.;\n    drop Month;\nrun;","courseSource":"raw/CR_05_L5_challenging_topics.md – Programming Question 5.09 (1)","answerSource":"official","confidence":"high"},{"id":"crx-pq5.09-2","set":"crcase","number":42,"domain":"D2","topic":"DO UNTIL loop","format":"Course programming question","difficulty":"","type":"sa","stem":"PQ 5.09: Create work.rewards with two columns, Year and Reserve; Year starts at 1; Reserve starts at 1e6; each month 5000 is added to Reserve; 4% interest compounded monthly after the 5000 is added (hint: `Reserve = Reserve + (Reserve * .04 / 12);`); one row output per year; output continues until Reserve is greater than 1.5e6; COMMA20 format on Reserve. What is the value of Reserve in the last row?","code":"","options":[],"answer":"1553596","accepted":["1553596","1,553,596"],"numeric":true,"explanation":"Dòng cuối là năm đầu tiên Reserve > 1,500,000: 1,553,596. Vòng dừng sau khi đã OUTPUT dòng này vì UNTIL kiểm tra ở cuối.","solution":"","solutionCode":"data rewards;\n    Year = 1;\n    Reserve = 1e6;\n    do until (Reserve > 1.5e6);\n       do month = 1 to 12;\n          Reserve = Reserve + 5000;\n          Reserve = Reserve + (Reserve * .04 / 12);\n       end;\n       output;\n       Year = Year + 1;\n    end;\n    format Reserve comma20.;\n    drop Month;\nrun;","courseSource":"raw/CR_05_L5_challenging_topics.md – Programming Question 5.09 (2)","answerSource":"official","confidence":"high"},{"id":"crx-pq5.10-1","set":"crcase","number":43,"domain":"D2","topic":"Iterative DO with UNTIL/WHILE","format":"Course programming question","difficulty":"","type":"sa","stem":"PQ 5.10: Create work.rewards to hold a forecast for Reserve: initial Reserve 1,000,000; 4% interest compounded monthly (hint: `Reserve = Reserve + Reserve * 0.04/12;` calculates one month of interest); write one row per forecast year; stop when either Reserve exceeds 2,000,000 or the forecast extends 30 years into the future. What is Reserve on the last row, rounded to the nearest whole number?","code":"","options":[],"answer":"2051975","accepted":["2051975","2,051,975"],"numeric":true,"explanation":"DO Year=1 TO 30 UNTIL(Reserve > 2e6) có hai điều kiện dừng; điều kiện tiền vượt 2,000,000 xảy ra trước năm 30, dòng cuối có Reserve = 2,051,975.","solution":"","solutionCode":"/* Using DO UNTIL technique */\ndata rewards_u;\n    Reserve = 1e6;\n    do Year = 1 to 30 until (Reserve > 2e6);\n       do month = 1 to 12;\n          Reserve = Reserve + (Reserve * .04/12);\n       end;\n       output;\n       /* condition check */\n    end; /* Year = Year + 1 */\n    format Reserve comma20.;\n    drop Month;\nrun;\n\n/* Using DO WHILE technique */\ndata rewards_w;\n    Reserve = 1e6;\n    do Year = 1 to 30 while (Reserve \u003c= 2e6);\n       /* condition check */\n       do month = 1 to 12;\n          Reserve = Reserve + (Reserve * .04/12);\n       end;\n       output;\n    end; /* Year = Year + 1 */\n    format Reserve comma20.;\n    drop Month;\nrun;","courseSource":"raw/CR_05_L5_challenging_topics.md – Programming Question 5.10 (1)","answerSource":"official","confidence":"high"},{"id":"crx-pq5.10-2","set":"crcase","number":44,"domain":"D2","topic":"Iterative DO with UNTIL/WHILE","format":"Course programming question","difficulty":"","type":"sa","stem":"PQ 5.10: Create work.rewards to hold a forecast for Reserve: initial Reserve 1,000,000; 4% interest compounded monthly (hint: `Reserve = Reserve + Reserve * 0.04/12;` calculates one month of interest); write one row per forecast year; stop when either Reserve exceeds 2,000,000 or the forecast extends 30 years into the future. How many rows are written to output?","code":"","options":[],"answer":"18","accepted":["18","eighteen"],"numeric":true,"explanation":"4% gộp hàng tháng thì tiền gấp đôi sau khoảng 17.4 năm, nên vòng dừng sau năm 18: 18 dòng. Bản DO WHILE (Reserve \u003c= 2e6) cho cùng kết quả.","solution":"","solutionCode":"/* Using DO UNTIL technique */\ndata rewards_u;\n    Reserve = 1e6;\n    do Year = 1 to 30 until (Reserve > 2e6);\n       do month = 1 to 12;\n          Reserve = Reserve + (Reserve * .04/12);\n       end;\n       output;\n       /* condition check */\n    end; /* Year = Year + 1 */\n    format Reserve comma20.;\n    drop Month;\nrun;\n\n/* Using DO WHILE technique */\ndata rewards_w;\n    Reserve = 1e6;\n    do Year = 1 to 30 while (Reserve \u003c= 2e6);\n       /* condition check */\n       do month = 1 to 12;\n          Re :"","solutionCode":"","courseSource":"raw/P2_L01_controlling_data_step.md – Quiz: Lesson 1 Q1","answerSource":"derived","confidence":"high"},{"id":"p2l1-quiz-q2","set":"p2course","number":2,"domain":"D1","topic":"Compile-time statements","format":"Course quiz","difficulty":"","type":"mc","stem":"Which statement is not a compile-time-only statement?","code":"","options":["KEEP","LENGTH","SET","WHERE"],"answer":2,"accepted":[],"numeric":false,"explanation":"KEEP, LENGTH, WHERE chỉ đặt quy tắc lúc compile. SET vừa dùng khi compile (lấy thuộc tính cột vào PDV) vừa thực thi mỗi vòng lặp để đọc dòng, nên không phải compile-time-only.","solution":"","solutionCode":"","courseSource":"raw/P2_L01_controlling_data_step.md – Quiz: Lesson 1 Q2","answerSource":"derived","confidence":"high"},{"id":"p2l1-quiz-q3","set":"p2course","number":3,"domain":"D1","topic":"DATA step execution phase","format":"Course quiz","difficulty":"","type":"mc","stem":"Which statement is true concerning the execution phase?","code":"","options":["Data is processed in the PDV.","An implied OUTPUT occurs at the top of the DATA step.","An implied REINITIALIZE occurs at the bottom of the DATA step.","Columns read from the input table are set to missing when SAS returns to the top of the DATA step."],"answer":0,"accepted":[],"numeric":false,"explanation":"Mọi xử lý dữ liệu diễn ra trong PDV. Implied OUTPUT xảy ra ở cuối step (không phải đầu), việc reset về missing xảy ra khi quay lại đầu step và chỉ áp dụng cho cột tính toán; cột đọc bằng SET được giữ giá trị.","solution":"","solutionCode":"","courseSource":"raw/P2_L01_controlling_data_step.md – Quiz: Lesson 1 Q3","answerSource":"derived","confidence":"high"},{"id":"p2l1-quiz-q4","set":"p2course","number":4,"domain":"D3","topic":"DATA step debugger","format":"Course quiz","difficulty":"","type":"mc","stem":"The DATA step debugger in SAS Enterprise Guide can be used with DATA and PROC steps.","code":"","options":["True","False"],"answer":1,"accepted":[],"numeric":false,"explanation":"Debugger của Enterprise Guide chỉ dùng cho DATA step (bật bằng DATA step markers), không dùng được cho PROC step.","solution":"","solutionCode":"","courseSource":"raw/P2_L01_controlling_data_step.md – Quiz: Lesson 1 Q4","answerSource":"derived","confidence":"high"},{"id":"p2l1-quiz-q5","set":"p2course","number":5,"domain":"D3","topic":"PUTLOG statement","format":"Course quiz","difficulty":"","type":"mc","stem":"Which PUTLOG statements create this log?\nName=Alfred Height=69 Weight=112.5 Ratio=0.61 _ERROR_=0 _N_=1\nRatio=0.61","code":"","options":["putlog all; putlog Ratio;","putlog all; putlog Ratio=;","putlog _all_; putlog Ratio;","putlog _all_; putlog Ratio=;"],"answer":3,"accepted":[],"numeric":false,"explanation":"Từ khóa ghi toàn bộ PDV là _ALL_ (có gạch dưới), và muốn in dạng \"Ratio=0.61\" thì phải viết Ratio= ; nếu chỉ viết Ratio thì log chỉ in giá trị 0.61.","solution":"","solutionCode":"","courseSource":"raw/P2_L01_controlling_data_step.md – Quiz: Lesson 1 Q5","answerSource":"derived","confidence":"high"},{"id":"p2l1-quiz-q6","set":"p2course","number":6,"domain":"D1","topic":"Explicit OUTPUT","format":"Course quiz","difficulty":"","type":"mc","stem":"Input table Shipping has 5 rows and 3 columns (Product, BoxSize, Rate). How many rows and columns are in ShippingZones?","code":"data ShippingZones;\n    set Shipping;\n    Zone=1;\n    output;\n    Zone=2;\n    Rate=(Rate*1.5);\nrun;","options":["5 rows and 3 columns","5 rows and 4 columns","10 rows and 3 columns","10 rows and 4 columns"],"answer":1,"accepted":[],"numeric":false,"explanation":"Có explicit OUTPUT nên implicit OUTPUT ở cuối bị tắt: mỗi dòng input chỉ ghi 1 lần (Zone=1) → 5 dòng. Cột Zone mới thêm vào → 4 cột. Các lệnh sau OUTPUT vẫn chạy nhưng không được ghi ra.","solution":"","solutionCode":"","courseSource":"raw/P2_L01_controlling_data_step.md – Quiz: Lesson 1 Q6","answerSource":"derived","confidence":"high"},{"id":"p2l1-quiz-q7","set":"p2course","number":7,"domain": op Sales Inventory;\n    Total=sum(Sales,Inventory);\nrun;","options":["Subsidiary","Subsidiary and Total","Product and Subsidiary","Product, Subsidiary, Sales, and Inventory"],"answer":1,"accepted":[],"numeric":false,"explanation":"Bốn cột được đọc vào PDV nên vẫn dùng được để tính Total. DROP= trên DATA bỏ Product, DROP statement bỏ Sales và Inventory khi output → còn Subsidiary và Total.","solution":"","solutionCode":"","courseSource":"raw/P2_L01_controlling_data_step.md – Quiz: Lesson 1 Q9","answerSource":"derived","confidence":"high"},{"id":"p2l1-quiz-q10","set":"p2course","number":10,"domain":"D1","topic":"KEEP= on SET statement","format":"Course quiz","difficulty":"","type":"mc","stem":"What is the result of the following program?","code":"data work.boots;\n    set sashelp.shoes(keep=Product Subsidiary);\n    where Product='Boot';\n    NewSales=Sales*1.25;\nrun;","options":["work.boots with three columns.","work.boots with four columns.","Error due to invalid syntax for the KEEP= option.","Error because the Sales column is not read in from sashelp.shoes."],"answer":1,"accepted":[],"numeric":false,"explanation":"Sales không được đọc vào nên SAS tạo Sales là cột numeric mới (missing, NOTE uninitialized) chứ không báo ERROR. Bảng có Product, Subsidiary, Sales, NewSales = 4 cột (NewSales toàn missing).","solution":"","solutionCode":"","courseSource":"raw/P2_L01_controlling_data_step.md – Quiz: Lesson 1 Q10","answerSource":"derived","confidence":"high"},{"id":"p2l1-act-p201a04-1","set":"p2course","number":11,"domain":"D3","topic":"PUTLOG and PDV","format":"Course activity","difficulty":"","type":"sa","stem":"Activity p201a04: Add `putlog \"PDV Before RUN statement\"; putlog _all_;` before RUN in the storm_complete step (SET reads pg2.storm_summary_small(obs=2)). What is the value of StormLength at the end of iteration 2?","code":"/* --- Bắt đầu: Dữ liệu mẫu tự động tạo --- */\noptions dlcreatedir;\nlibname pg2 \"%sysfunc(pathname(work))/pg2\";\n\ndata pg2.storm_summary_small;\n    infile datalines dlm=\"|\" dsd;\n    length Season 8 Name $ 10 Basin $ 2 MaxWindMPH 8 MaxWindKM 8 StartDate 8 EndDate 8;\n    format StartDate EndDate date9.;\n    input Season Name $ Basin $ MaxWindMPH MaxWindKM StartDate :date9. EndDate :date9.;\n    datalines;\n1980|AGATHA|EP|115|185|09JUN1980|15JUN1980\n1980|ALBINE|SI|80|129|27NOV1979|06DEC1979\n1980|ALLEN|NA|190|306|31JUL1980|11AUG1980\n2016|MATTHEW|NA|167|269|28SEP2016|09OCT2016\n2016|MERANTI|WP|190|306|08SEP2016|17SEP2016\n;\nrun;\n/* --- Kết thúc: Dữ liệu mẫu --- */\n\ndata storm_complete;\n    set pg2.storm_summary_small(obs=2);\n    putlog \"PDV After SET Statement\";\n    putlog _all_;\n    ...","options":[],"answer":"9","accepted":["9"],"numeric":true,"explanation":"Ở vòng 2, StormLength=EndDate-StartDate = 06DEC1979 - 27NOV1979 = 9 ngày; PUTLOG trước RUN cho thấy giá trị sau khi tính.","solution":"","solutionCode":"","courseSource":"raw/P2_L01_controlling_data_step.md – Activity (p201a04.sas)","answerSource":"official","confidence":"high","courseOriginal":{"stem":"Activity p201a04: Add `putlog \"PDV Before RUN statement\"; putlog _all_;` before RUN in the storm_complete step (SET reads pg2.storm_summary_small(obs=2)). What is the value of StormLength at the end of iteration 2?","code":"data storm_complete;\n    set pg2.storm_summary_small(obs=2);\n    putlog \"PDV After SET Statement\";\n    putlog _all_;\n    ...","answer":"9","accepted":["9"],"explanation":"Ở vòng 2, StormLength=EndDate-StartDate = 06DEC1979 - 27NOV1979 = 9 ngày; PUTLOG trước RUN cho thấy giá trị sau khi tính."}},{"id":"p2l1-act-p201a04-2","set":"p2course","number":12,"domain":"D3","topic":"PUTLOG messages","format":"Course activity","difficulty":"","type":"sa","stem":"Activity p201a04: What text, in uppercase followed by a colon, can you add at the start of a PUTLOG message (e.g. `putlog \"... PDV After SET Statement\";`) so that the text is color-coded as a note in the log?","code":"","options":[],"answer":"NOTE:", umeric Volume and Date, write the statement that drops all columns beginning with Char.","code":"/* --- Bắt đầu: Dữ liệu mẫu tự động tạo --- */\noptions dlcreatedir;\nlibname pg2 \"%sysfunc(pathname(work))/pg2\";\n\ndata pg2.stocks2;\n    infile datalines dlm=\"|\" dsd;\n    length Stock $ 4 Date $ 9 Volume $ 12;\n    input Stock $ Date $ Volume $;\n    datalines;\nIBM|03JAN2017|3,021,423\nIBM|10JAN2017|4,118,276\nMSFT|03JAN2017|20,694,101\nMSFT|10JAN2017|18,593,004\n;\nrun;\n/* --- Kết thúc: Dữ liệu mẫu --- */\n\ndata work.stocks2;\n    set pg2.stocks2(rename=(Volume=CharVolume Date=CharDate));\n    Volume=input(CharVolume,comma12.);\n    Date=input(CharDate,date9.);\n    ???\nrun;","options":[],"answer":"drop Char:;","accepted":["drop Char:;","drop char:","drop CharVolume CharDate;","drop charvolume chardate"],"numeric":false,"explanation":"Column list Char: chọn mọi cột bắt đầu bằng \"Char\"; trong statement như DROP không cần OF.","solution":"","solutionCode":"data work.stocks2;\n    set pg2.stocks2(rename=(Volume=CharVolume Date=CharDate));\n    Volume=input(CharVolume,comma12.);\n    Date=input(CharDate,date9.);\n    drop Char:;\nrun;","courseSource":"raw/P2_L03_functions.md – Activity (p203a13.sas)","answerSource":"official","confidence":"high","courseOriginal":{"stem":"Activity p203a13: After converting CharVolume and CharDate to numeric Volume and Date, write the statement that drops all columns beginning with Char.","code":"data work.stocks2;\n    set pg2.stocks2(rename=(Volume=CharVolume Date=CharDate));\n    Volume=input(CharVolume,comma12.);\n    Date=input(CharDate,date9.);\n    ???\nrun;","answer":"drop Char:;","accepted":["drop Char:;","drop char:","drop CharVolume CharDate;","drop charvolume chardate"],"explanation":"Column list Char: chọn mọi cột bắt đầu bằng \"Char\"; trong statement như DROP không cần OF."}},{"id":"p2l4-quiz-q1","set":"p2course","number":72,"domain":"D4","topic":"VALUE statement syntax","format":"Course quiz","difficulty":"","type":"mc","stem":"Which contains valid syntax?","code":"","options":["value grades 'A'='Excellent' 'B'='Good';","value qtrfmt 1,2,3='First' 4,5,6='Second';","value $grades. 'A'='Excellent' 'B'='Good';","value qtrfmt '1'-'3'='First' '4'-'6'='Second';"],"answer":1,"accepted":[],"numeric":false,"explanation":"qtrfmt là numeric format, giá trị numeric không cần nháy và liệt kê nhiều giá trị bằng dấu phẩy. a và d dùng giá trị có nháy (character) cho format không có $; c có dấu chấm sau tên format khi tạo.","solution":"","solutionCode":"","courseSource":"raw/P2_L04_custom_formats.md – Quiz: Lesson 4 Q1","answerSource":"derived","confidence":"high"},{"id":"p2l4-quiz-q2","set":"p2course","number":73,"domain":"D4","topic":"Ranges in custom formats","format":"Course quiz","difficulty":"","type":"mc","stem":"What is the formatted value for 100?","code":"proc format;\n    value rates 1-\u003c100='low'\n                100\u003c-\u003c200='medium'\n                200-300 ='high'\n                other ='out of range';\nrun;","options":["low","medium","high","out of range"],"answer":3,"accepted":[],"numeric":false,"explanation":"1-\u003c100 loại trừ 100 ở cuối, 100\u003c-\u003c200 loại trừ 100 ở đầu → 100 không thuộc range nào nên rơi vào OTHER = \"out of range\".","solution":"","solutionCode":"","courseSource":"raw/P2_L04_custom_formats.md – Quiz: Lesson 4 Q2","answerSource":"derived","confidence":"high"},{"id":"p2l4-quiz-q3","set":"p2course","number":74,"domain":"D4","topic":"PROC FORMAT","format":"Course quiz","difficulty":"","type":"mc","stem":"In the FORMAT procedure, you specify the name of the format and the name of the column that will use the custom format.","code":"","options":["True","False"],"answer":1,"accepted":[],"numeric":false,"explanation":"PROC FORMAT chỉ định tên format, không tham chiếu bảng hay cột; format được gán cho cột sau đó bằng FORMAT statement hoặc PUT.","solution":"","solutionCode":"","courseSource":"raw/P2_L04_custom_formats.md – Quiz: Lesson 4 Q3","answerSource":"derived","confidence":"high"},{"id":"p2l4-quiz-q4","set":"p2course","number":75,"domain":"D4","topic":"OTHER keyword","format":"Course quiz","difficulty":"","type":"mc","stem":"What is the correct formatted output for Code values 1, 2, 3?","code":"proc format;\n    value $answer '1'='Yes'\n                  '2'='No'\n                  'other'='Not Answered';\nrun;","options":["Yes / No / (blank)","Yes / No / Not","Yes / No / 3","Yes / No / Not Answered"],"answer":2,"accepted":[],"numeric":false,"explanation":"'other' trong nháy là giá trị literal \"other\", không phải keyword OTHER. Giá trị 3 không khớp gì nên hiển thị giá trị gốc 3.","solution":"","solutionCode":"","courseSource":"raw/P2_L04_custom_formats.md – Quiz: Lesson 4 Q4","answerSource":"derived","confidence":"high"},{"id":"p2l4-quiz-q5","set":"p2course","number":76,"domain":"D4","topic":"Ranges in custom formats","format":"Course quiz","difficulty":"","type":"mc","stem":"Which does not have proper syntax for specifying a range in the VALUE statement?","code":"","options":["500>-700","500-\u003c700","'A'-'C'","'Horse'-'Mouse'"],"answer":0,"accepted":[],"numeric":false,"explanation":"Ký hiệu loại trừ chỉ dùng dấu \u003c (start\u003c- hoặc -\u003cend); \">\" không hợp lệ. Range character như 'A'-'C' là hợp lệ.","solution":"","solutionCode":"","courseSource":"raw/P2_L04_custom_formats.md – Quiz: Lesson 4 Q5","answerSource":"derived","confidence":"high"},{"id":"p2l4-quiz-q6","set":"p2course","number":77,"domain":"D4","topic":"PROC FORMAT options","format":"Course quiz","difficulty":"","type":"mc","stem":"Which is true concerning options for the FORMAT procedure?","code":"","options":["FMTLIB goes in the SELECT statement.","CNTLIN= goes in the VALUE statement.","FMTLIB specifies the library to store the format.","CNTLIN= specifies a table from which formats are built."],"answer":3,"accepted":[],"numeric":false,"explanation":"CNTLIN= trên PROC FORMAT statement chỉ bảng dùng để tạo format. FMTLIB c "D4","topic":"PUT function with custom formats","format":"Course activity","difficulty":"","type":"sa","stem":"Activity p204a03: Replace the IF-THEN/ELSE statements that create BasinGroup with an assignment that uses the PUT function and the $REGION format.","code":"/* --- Bắt đầu: Dữ liệu mẫu tự động tạo --- */\noptions dlcreatedir;\nlibname pg2 \"%sysfunc(pathname(work))/pg2\";\n\ndata pg2.storm_summary;\n    infile datalines dlm=\"|\" dsd;\n    length Season 8 Name $ 10 Basin $ 2 MaxWindMPH 8 MaxWindKM 8 StartDate 8 EndDate 8;\n    format StartDate EndDate date9.;\n    input Season Name $ Basin $ MaxWindMPH MaxWindKM StartDate :date9. EndDate :date9.;\n    datalines;\n1980|AGATHA|EP|115|185|09JUN1980|15JUN1980\n1980|ALBINE|SI|80|129|27NOV1979|06DEC1979\n1980|ALLEN|NA|190|306|31JUL1980|11AUG1980\n2016|MATTHEW|NA|167|269|28SEP2016|09OCT2016\n2016|MERANTI|WP|190|306|08SEP2016|17SEP2016\n2016|WINSTON|SP|178|286|07FEB2016|03MAR2016\n2017|MORA|NI|69|111|28MAY2017|31MAY2017\n2017|HARVEY|na|132|212|17AUG2017|01SEP2017\n;\nrun;\n\nproc format;\n    value $region \"NA\"=\"Atlantic\"\n                  \"WP\",\"EP\",\"SP\"=\"Pacific\"\n                  \"NI\",\"SI\"=\"Indian\"\n                  other=\"Unknown\";\nrun;\n/* --- Kết thúc: Dữ liệu mẫu --- */","options":[],"answer":"BasinGroup=put(Basin, $region.);","accepted":["BasinGroup=put(Basin, $region.);","basingroup=put(basin,$region.)","BasinGroup=put(Basin,$region.);"],"numeric":false,"explanation":"PUT(source, format) trả về giá trị đã format dưới dạng character, nên custom format thay thế được chuỗi IF-THEN/ELSE để gom nhóm.","solution":"","solutionCode":"data storm_summary;\n    set pg2.storm_summary;\n    Basin=upcase(Basin);\n    BasinGroup=put(Basin, $region.);\nrun;","courseSource":"raw/P2_L04_custom_formats.md – Activity (p204a03.sas)","answerSource":"official","confidence":"high","courseOriginal":{"stem":"Activity p204a03: Replace the IF-THEN/ELSE statements that create BasinGroup with an assignment that uses the PUT function and the $REGION format.","code":"","answer":"BasinGroup=put(Basin, $region.);","accepted":["BasinGroup=put(Basin, $region.);","basingroup=put(basin,$region.)","BasinGroup=put(Basin,$region.);"],"explanation":"PUT(source, format) trả về giá trị đã format dưới dạng character, nên custom format thay thế được chuỗi IF-THEN/ELSE để gom nhóm."}},{"id":"p2l4-act-p204a03-2","set":"p2course","number":89,"domain":"D4","topic":"Grouping with custom formats","format":"Course activity","difficulty":"","type":"sa","stem":"Activity p204a03: How many BasinGroup values appear in the PROC MEANS summary report?","code":"","options":[],"answer":"3","accepted":["3","three"],"numeric":true,"explanation":"Sau UPCASE, mọi Basin đều thuộc NA/WP/EP/SP/NI/SI nên chỉ có 3 nhóm Atlantic, Pacific, Indian.","solution":"","solutionCode":"","courseSource":"raw/P2_L04_custom_formats.md – Activity (p204a03.sas)","answerSource":"official","confidence":"high"},{"id":"p2l4-act-p204a04-1","set":"p2course","number":90,"domain":"D4","topic":"FMTLIB and SELECT","format":"Course activity","difficulty":"","type":"sa","stem":"Activity p204a04: In the PROC FORMAT step with FMTLIB, which statement limits the report to the $SBFMT and CATFMT formats?","code":"","options":[],"answer":"select $sbfmt catfmt;","accepted":["select $sbfmt catfmt;","select $sbfmt catfmt"],"numeric":false,"explanation":"FMTLIB in nội dung mọi format trong catalog; SELECT giới hạn chỉ các format liệt kê.","solution":"","solutionCode":"","courseSource":"raw/P2_L04_custom_formats.md – Activity (p204a04.sas)","answerSource":"official","confidence":"high"},{"id":"p2l4-act-p204a04-2","set":"p2course","number":91,"domain":"D4","topic":"Default format length","format":"Course activity","difficulty":"","type":"sa","stem":"Activity p204a04: What is the default length of the $SBFMT format (created from pg2.storm_subbasincodes)?","code":"/* --- Bắt đầu: Dữ liệu mẫu tự động tạo --- */\noptions dlcreatedir;\nlibname pg2 \"%sysfunc(pathname(work))/pg2\";\n\ndata pg2.storm_subbasincodes;\n    infile datalines dlm=\"|\" dsd;\n    length Sub_Basin $ 2 SubBasin_Name $ 17;\n    input Sub_Basin $ SubBasin_Name $;\n    datalines;\nAS|Arabian Sea\nBB|Bay of Bengal\nEA|Eastern Australia\nWA|Western Australia\nCP|Central Pacific\nCS|Caribbean Sea\nGM|Gulf of Mexico\nNA|North Atlantic\nMM|Missing\n;\nrun;\n/* --- Kết thúc: Dữ liệu mẫu --- */","options":[],"answer":"17","accepted":["17"],"numeric":true,"explanation":"Độ dài mặc định của format bằng độ dài nhãn dài nhất; nhãn dài nhất là \"Eastern Australia\"/\"Western Australia\" = 17 ký tự.","solution":"","solutionCode":"","courseSource":"raw/P2_L04_custom_formats.md – Activity (p204a04.sas)","answerSource":"official","confidence":"high","courseOriginal":{"stem":"Activity p204a04: What is the default length of the $SBFMT format (created from pg2.storm_subbasincodes)?","code":"","answer":"17","accepted":["17"],"explanation":"Độ dài mặc định của format bằng độ dài nhãn dài nhất; nhãn dài nhất là \"Eastern Australia\"/\"Western Australia\" = 17 ký tự."}},{"id":"p2l4-act-p204a05-1","set":"p2course","number":92,"domain":"D4","topic":"Storing custom formats","format":"Course activity","difficulty":"","type":"sa","stem":"Activity p204a05: Modify the PROC FORMAT statement so the formats are stored permanently in the PG2 library.","code":"","options":[],"answer":"proc format library=pg2;","accepted":["proc format library=pg2;","proc format library=pg2","proc format library=pg2.formats;","proc format library=pg2.formats","proc format lib=pg2;","proc format lib=pg2.formats;"],"numeric":false,"explanation":"LIBRARY= (hoặc LIB=) chỉ thư viện; nếu chỉ ghi libref thì SAS dùng catalog mặc định tên Formats.","solution":"","solutionCode":"","courseSource":"raw/P2_L04_custom_formats.md – Activity (p204a05.sas)","answerSource":"official","confidence":"high"},{"id":"p2l4-act-p204a05-3","set":"p2course","number":93,"domain":"D4","topic":"FMTSEARCH= option","format":"Course activity","difficulty":"","type":"sa","stem":"Activity p204a05: Before PROC PRINT, write the OPTIONS statement that tells SAS to search the PG2 library for formats.","code":"","options":[],"answer":"options fmtsearch=(pg2);","accepted":["options fmtsearch=(pg2);","options fmtsearch=(pg2)","options fmtsearch=(pg2.formats);","options fmtsearch=(pg2.formats)"],"numeric":false,"explanation":"FMTSEARCH= thêm vị trí tìm format sau WORK.FORMATS và LIBRARY.FORMATS; chỉ ghi libref thì SAS tìm catalog Formats trong đó.","solution":"","solutionCode":"","courseSource":"raw/P2_L04_custom_formats.md – Activity (p204a05.sas)","answerSource":"official","confidence":"high"},{"id":"p2l4-act-p204a05-4","set":"p2course","number":94,"domain":"D4","topic":"Permanent custom formats","format":"Course activity","difficulty":"","type":"sa","stem":"Activity p204a05: After storing the formats in PG2 and setting FMTSEARCH=, are Registration and Height formatted in the PROC PRINT report? (Yes/No)","code":"","options":[],"answer":"Yes","accepted":["yes"],"numeric":false,"explanation":"Nhờ FMTSEARCH= SAS tìm thấy định nghĩa format trong catalog PG2.Formats nên vẫn áp dụng được.","solution":"","solutionCode":"","courseSource":"raw/P2_L04_custom_formats.md – Activity (p204a05.sas)","answerSource":"official","confidence":"high"},{"id":"p2b-p2l5-quiz-q1","set":"p2course","number":95,"domain":"D1","topic":"Concatenating tables","format":"Course quiz","difficulty":"","type":"mc","stem":"Which is true concerning concatenating tables?","code":"","options":["All tables must have the same number of columns.","Columns in all tables must have matching names and lengths.","Tables must be in the same library.","Missing values are generated for columns that exist in one input table and not in another."],"answer":3,"accepted":[],"numeric":false,"explanation":"Khi nối bảng bằng SET, cột chỉ có trong một bảng vẫn được đưa vào output và nhận giá trị missing cho các dòng đến từ bảng kia. Không yêu cầu số cột, tên/độ dài urse","number":98,"domain":"D1","topic":"One-to-many merge","format":"Course quiz","difficulty":"","type":"mc","stem":"How many rows are in the output table both? agetable: Bob 12; Sue 15. foodtable: Bob Pizza; Bob Cupcakes; Sue Burgers; Sue Grapes; Sue Brownies.","code":"data both; merge agetable foodtable; by Name; run;","options":["two","three","four","five"],"answer":3,"accepted":[],"numeric":false,"explanation":"Đây là merge one-to-many: mỗi dòng của foodtable tạo một dòng output, giá trị Age được retain trong BY group. Bob có 2 dòng, Sue có 3 dòng nên tổng là 5, không phải 2 (số dòng của agetable).","solution":"","solutionCode":"","courseSource":"raw/P2_L05_combining_tables.md – Quiz: Lesson 5 Q4","answerSource":"derived","confidence":"high"},{"id":"p2b-p2l5-quiz-q5","set":"p2course","number":99,"domain":"D1","topic":"Merge with nonmatching rows","format":"Course quiz","difficulty":"","type":"mc","stem":"How many rows are in empsauc? empsau: Togar E 121150; Kylie S 121151; Birin W 121152. phonec: 121150; 121152; 121153 (phones).","code":"data empsauc; merge empsau phonec; by EmpID; run;","options":["two","three","four","five"],"answer":2,"accepted":[],"numeric":false,"explanation":"Mặc định DATA step merge ghi cả dòng khớp và không khớp. Các EmpID khác nhau là 121150, 121151, 121152, 121153 nên output có 4 dòng; chỉ đếm dòng khớp (2) là nhầm với inner join.","solution":"","solutionCode":"","courseSource":"raw/P2_L05_combining_tables.md – Quiz: Lesson 5 Q5","answerSource":"derived","confidence":"high"},{"id":"p2b-p2l5-quiz-q6","set":"p2course","number":100,"domain":"D1","topic":"Merge – BY sort order","format":"Course quiz","difficulty":"","type":"mc","stem":"What is the result of the step?\n\ndonors1:\n```text\nID    Type  Units\n2304  O     16\n1129  A     48\n1129  A     50\n2486  B     63\n```\n\ndonors2:\n```text\nID    Code  Units\n1129  63    32\n2304  61    45\n1387  64    67\n```","code":"data combine; merge donors1 donors2; by ID; run;","options":["co
