kerton  43\nMasters   27\n```","code":"data client_amount; merge clients(in=C) amounts(in=A); by Name; run;","options":["C=0 and A=0","C=1 and A=0","C=0 and A=1","C=1 and A=1"],"answer":1,"accepted":[],"numeric":false,"explanation":"Lần lặp 1 và 2 xử lý BY group Ankerton (cả hai bảng đều có, C=1 A=1). Lần lặp 3 là Davis, chỉ có trong clients nên C=1 và A=0. Không chọn d vì Davis không có trong amounts.","solution":"","solutionCode":"","courseSource":"raw/P2_L05_combining_tables.md – Quiz: Lesson 5 Q8","answerSource":"derived","confidence":"high"},{"id":"p2b-p2l5-quiz-q9","set":"p2course","number":103,"domain":"D1","topic":"Merge – same-named columns","format":"Course quiz","difficulty":"","type":"mc","stem":"What is the value of Location in the output table?\n\nloc1:\n```text\nCode  Location\nA     France\n```\n\nloc2:\n```text\nCode  Location\nA     Belgium\n```\n\nloc3:\n```text\nCode  Location\nA     Italy\n```","code":"data locALL; merge loc1 loc2 loc3; by Code; run;","options":["Italy","France","Belgium","France Belgium Italy"],"answer":0,"accepted":[],"numeric":false,"explanation":"Khi nhiều bảng có cùng cột không phải BY, SAS đọc theo thứ tự liệt kê trên MERGE và giá trị sau ghi đè giá trị trước. loc3 được đọc cuối nên Location = Italy; SAS không nối chuỗi các giá trị lại.","solution":"","solutionCode":"","courseSource":"raw/P2_L05_combining_tables.md – Quiz: Lesson 5 Q9","answerSource":"derived","confidence":"high"},{"id":"p2b-p2l5-quiz-q10","set":"p2course","number":104,"domain":"D1","topic":"Merging without a common column","format":"Course quiz","difficulty":"","type":"mc","stem":"A single DATA step can be used to merge these three tables: dataset1 (Student, Test, Score), dataset2 (Subject, Test), dataset3 (Subject, AvgScore).","code":"","options":["True","False"],"answer":1,"accepted":[],"numeric":false,"explanation":"Một DATA step merge cần một cột BY chung cho tất cả bảng. dataset1 và dataset3 không có cột chung (Test chỉ chung với dataset2, Subject chỉ chung giữa dataset2 và dataset3), nên phải merge nhiều bước hoặc dùng PROC SQL.","solution":"","solutionCode":"","courseSource":"raw/P2_L05_combining_tables.md – Quiz: Lesson 5 Q10","answerSource":"derived","confidence":"high"},{"id":"p2b-p2l5-act-p205a01-1","set":"p2course","number":105,"domain":"D1","topic":"Concatenating tables","format":"Course activity","difficulty":"","type":"sa","stem":"Activity p205a01: You concatenate sashelp.class and pg2.class_new2 with a SET statement. In the last 3 rows the student names are not in the Name column. In which column of pg2.class_new2 are the student names stored?","code":"/* --- Bắt đầu: Dữ liệu mẫu tự động tạo --- */\noptions dlcreatedir;\nlibname pg2 \"%sysfunc(pathname(work))/pg2\";\n\ndata pg2.class_new2;\n    infile datalines dlm=\"|\" dsd;\n    length Student $ 9 Sex $ 1 Age 8;\n    input Student $ Sex $ Age;\n    datalines;\nElizabeth|F|12\nJonathan|M|13\nChristina|F|14\n;\nrun;\n/* --- Kết thúc: Dữ liệu mẫu --- */","options":[],"answer":"Student","accepted":["student"],"numeric":false,"explanation":"pg2.class_new2 lưu tên học sinh trong cột Student chứ không phải Name, nên khi nối bảng hai cột bị tách riêng (và Height, Weight bị missing ở 3 dòng cuối). Cần RENAME=(Student=Name) để căn chỉnh.","solution":"","solutionCode":"","courseSource":"raw/P2_L05_combining_tables.md – Activity (p205a01.sas) Q1","answerSource":"official","confidence":"high","courseOriginal":{"stem":"Activity p205a01: You concatenate sashelp.class and pg2.class_new2 with a SET statement. In the last 3 rows the student names are not in the Name column. In which column of pg2.class_new2 are the student names stored?","code":"","answer":"Student","accepted":["student"],"explanation":"pg2.class_new2 lưu tên học sinh trong cột Student chứ không phải Name, nên khi nối bảng hai cột bị tách riêng (và Height, Weight bị missing ở 3 dòng cuối). Cần RENAME=(Student=Name) để căn chỉnh."}},{"id":"p2b-p2l5-act-p205a01-2","set":"p2course","number":106,"domain":"D1","topic":"Concatenating tables – column lengths","format":"Course activity","difficulty":"","type":"sa","stem":"Activity p205a01: You run the step below. What type of log message (NOTE, WARNING or ERROR) is written about the variable Name?","code":"/* --- Bắt đầu: Dữ liệu mẫu tự động tạo --- */\noptions dlcreatedir;\nlibname pg2 \"%sysfunc(pathname(work))/pg2\";\n\ndata pg2.class_new2;\n    infile datalines dlm=\"|\" dsd;\n    length Student $ 9 Sex $ 1 Age 8;\n    input Student $ Sex $ Age;\n    datalines;\nElizabeth|F|12\nJonathan|M|13\nChristina|F|14\n;\nrun;\n/* --- Kết thúc: Dữ liệu mẫu --- */\n\ndata class_current; set sashelp.class pg2.class_new2(rename=(Student=Name)); run;","options":[],"answer":"WARNING","accepted":["warning","WARNING: Multiple lengths were specified for the variable Name by input data set(s). This can cause truncation of data."],"numeric":false,"explanation":"Name có độ dài khác nhau giữa hai bảng nên SAS ghi WARNING \"Multiple lengths were specified...\" và giá trị có thể bị cắt. Đây không phải ERROR: step vẫn chạy và tạo bảng.","solution":"","solutionCode":"","courseSource":"raw/P2_L05_combining_tables.md – Activity (p205a01.sas) Q2","answerSource":"official","confidence":"high","courseOriginal":{"stem":"Activity p205a01: You run the step below. What type of log message (NOTE, WARNING or ERROR) is written about the variable Name?","code":"data class_current; set sashelp.class pg2.class_new2(rename=(Student=Name)); run;","answer":"WARNING","accepted":["warning","WARNING: Multiple lengths were specified for the variable Name by input data set(s). This can cause truncation of data."],"explanation":"Name có độ dài khác nhau giữa hai bảng nên SAS ghi WARNING \"Multiple lengths were specified...\" và giá trị có thể bị cắt. Đây không phải ERROR: step vẫn chạy và tạo bảng."}},{"id":"p2b-p2l5-act-p205a01-3a","set":"p2course","number":107,"domain":"D1","topic":"Column attributes (PROC CONTENTS)","format":"Course activity","difficulty":"","t ost;\n    by Season Name;\n    if inDamage=1 and inFinal=1 then output damage_detail;\n    else output storm_other;\nrun;","options":[],"answer":"3054","accepted":["3054","3,054"],"numeric":true,"explanation":"Các dòng khớp ở cả hai bảng (38 cơn bão) vào damage_detail; mọi dòng không khớp đi vào storm_other, tổng cộng 3.054 dòng. Một DATA step có thể ghi cả hai bảng cùng lúc nhờ OUTPUT có điều kiện.","solution":"","solutionCode":"","courseSource":"raw/P2_L05_combining_tables.md – Activity (p205a04.sas)","answerSource":"official","confidence":"high"},{"id":"p2b-p2l6-quiz-q1","set":"p2course","number":114,"domain":"D2","topic":"Iterative DO loop – implicit output","format":"Course quiz","difficulty":"","type":"mc","stem":"Which output table does this step produce?","code":"data Earnings(keep=Qtr Earned);\n    Amount=1000; Rate=.075/4;\n    do Qtr=1 to 4;\n        Earned+(Amount+Earned)*Rate;\n    end;\nrun;","options":["Qtr 4, Earned 77.135865784 (one row)","Qtr 5, Earned 77.135865784 (one row)","Qtr 1–4, Earned 18.75, 37.8515625, 57.311279297, 77.135865784 (four rows)","Qtr 1–5, Earned 18.75, 37.8515625, 57.311279297, 77.135865784, 77.135865784 (five rows)"],"answer":1,"accepted":[],"numeric":false,"explanation":"Không có OUTPUT trong vòng lặp nên chỉ có implicit output ở cuối DATA step: một dòng. Sau lần lặp thứ 4, Qtr được tăng lên 5 rồi vòng lặp dừng, nên Qtr=5 chứ không phải 4.","solution":"","solutionCode":"","courseSource":"raw/P2_L06_do_loops.md – Quiz: Lesson 6 Q1","answerSource":"derived","confidence":"high"},{"id":"p2b-p2l6-quiz-q2","set":"p2course","number":115,"domain":"D2","topic":"Iterative DO loop rules","format":"Course quiz","difficulty":"","type":"mc","stem":"Which is true regarding the iterative DO loop? DO index-column = start TO stop \u003cBY increment>;","code":"","options":["The start and stop values can be character or numeric values.","If an increment value is not specified, the default increment is 0.","The index column is incremented at the bottom of each DO loop.","The index column is not in the final table unless specifically kept."],"answer":2,"accepted":[],"numeric":false,"explanation":"Index column được tăng ở cuối (END) mỗi lần lặp. Start/stop phải là số, increment mặc định là 1, và index column mặc định được ghi vào bảng output trừ khi DROP.","solution":"","solutionCode":"","courseSource":"raw/P2_L06_do_loops.md – Quiz: Lesson 6 Q2","answerSource":"derived","confidence":"high"},{"id":"p2b-p2l6-quiz-q3","set":"p2course","number":116,"domain":"D2","topic":"Nested DO loops – rows written","format":"Course quiz","difficulty":"","type":"mc","stem":"How many rows are in work.savings? pg2.savings: James 250; Linda 300; Mary 275; Robert 350.","code":"/* --- Bắt đầu: Dữ liệu mẫu tự động tạo --- */\noptions dlcreatedir;\nlibname pg2 \"%sysfunc(pathname(work))/pg2\";\n\ndata pg2.savings;\n    infile datalines dlm=\"|\" dsd;\n    length Name $ 8 Amount 8;\n    input Name $ Amount;\n    datalines;\nJames|250\nLinda|300\nMary|275\nRobert|350\n;\nrun;\n/* --- Kết thúc: Dữ liệu mẫu --- */\n\ndata work.savings;\n    set pg2.savings;\n    Savings=0;\n    do Year=1 to 5;\n        do qtr=1 to 4;\n            Savings+Amount;\n            Savings+(Savings*0.02/12);\n        end;\n    end;\nrun;","options":["1","4","5","20"],"answer":1,"accepted":[],"numeric":false,"explanation":"Không có OUTPUT tường minh nên mỗi lần lặp DATA step (mỗi dòng input) chỉ ghi một dòng ở cuối step: 4 dòng. 20 dòng chỉ xảy ra nếu đặt OUTPUT trong vòng lặp ngoài.","solution":"","solutionCode":"","courseSource":"raw/P2_L06_do_loops.md – Quiz: Lesson 6 Q3","answerSource":"derived","confidence":"high","courseOriginal":{"stem":"How many rows are in work.savings? pg2.savings: James 250; Linda 300; Mary 275; Robert 350.","code":"data work.savings;\n    set pg2.savings;\n    Savings=0;\n    do Year=1 to 5;\n        do qtr=1 to 4;\n            Savings+Amount;\n            Savings+(Savings*0.02/12);\n        end;\n    end;\nrun;","answer":1,"accepted":[],"explanation":"Không có OUTPUT tường minh nên mỗi lần lặp DATA step (mỗi dòng input) chỉ ghi một dòng ở cuối step: 4 dòng. 20 dòng chỉ xảy ra nếu đặt OUTPUT trong vòng lặp ngoài."}},{"id":"p2b-p2l6-quiz-q4","set":"p2course","number":117,"domain":"D2","topic":"Index value after the loop","format":"Course quiz","difficulty":"","type":"mc","stem":"What is the final value of Year?","code":"data invest; do Year=2010 to 2019; Capital+5000; Capital+(Capital*.03); end; run;","options":[". (missing)","2010","2019","2020"],"answer":3,"accepted":[],"numeric":false,"explanation":"Sau lần lặp cuối với Year=2019, Year được tăng lên 2020, vượt stop nên vòng lặp kết thúc. Giá trị cuối là 2020, một bước vượt quá stop.","solution":"","solutionCode":"","courseSource":"raw/P2_L06_do_loops.md – Quiz: Lesson 6 Q4","answerSource":"derived","confidence":"high"},{"id":"p2b-p2l6-quiz-q5","set":"p2course","number":118,"domain":"D2","topic":"DO loop syntax","format":"Course quiz","difficulty":"","type":"mc","stem":"Which of the following contains valid syntax?","code":"","options":["do 1 to 10 by 2;","do while (Year>2025);","do until Earnings\u003c=100000;","do date='01JAN2019' to '31JAN2019';"],"answer":1,"accepted":[],"numeric":false,"explanation":"DO WHILE với biểu thức trong ngoặc đơn là hợp lệ. a thiếu index column, c thiếu ngoặc quanh điều kiện UNTIL, d dùng chuỗi ký tự thay vì date constant (cần hậu tố d, ví dụ '01JAN2019'd).","solution":"","solutionCode":"","courseSource":"raw/P2_L06_do_loops.md – Quiz: Lesson 6 Q5","answerSource":"derived","confidence":"high"},{"id":"p2b-p2l6-quiz-q6","set":"p2course","number":119,"domain":"D2","topic":"Nested DO loops – OUTPUT placement","format":"Course quiz","difficulty":"","type":"mc","stem":"How many rows are in bikeinfo2? work.bikeinfo: Marco 12; Angela 10.","code":"data bikeinfo2;\n    set bikeinfo;\n    do month=1 to 3;\n        do week=1 to 4;\n            bike=bike+2;\n        end;\n        output;\n    end;\nrun;","options":["2","3","6","12","24"],"answer":2,"accepted":[],"numeric":false,"explanation":"OUTPUT nằm trong vòng lặp ngoài (month) nhưng ngoài vòng lặp trong, nên mỗi dòng input ghi 3 dòng; 2 dòng input x 3 = 6. 24 sẽ đúng nếu OUTPUT nằm trong vòng lặp week.","solution":"","solutionCode":"","courseSource":"raw/P2_L06_do_loops.md – Quiz: Lesson 6 Q6","answerSource":"derived","confidence":"high"},{"id":"p2b-p2l6-quiz-q7","set":"p2course","number":120,"domain":"D2","topic":"DO UNTIL – executes at least once","format":"Course quiz","difficulty":"","type":"mc","stem":"What is the value of x at the completion of the DATA step?","code":"data test; x=15; do until(x>12); x+1; end; run;","options":[". (missing)","13","15","16"],"answer":3,"accepted":[],"numeric":false,"explanation":"DO UNTIL kiểm tra điều kiện ở cuối vòng lặp nên luôn chạy ít nhất một lần: x tăng từ 15 lên 16, sau đó 16>12 là đúng nên dừng. Đáp án 15 là kết quả nếu dùng DO WHILE (kiểm tra ở đầu).","solution":"","solutionCode":"","courseSource":"raw/P2_L06_do_loops.md – Quiz: Lesson 6 Q7","answerSource":"derived","confidence":"high"},{"id":"p2b-p2l6-quiz-q8","set":"p2course","number":121,"domain":"D2","topic":"DO UNTIL vs DO WHILE","format":"Course quiz","difficulty":"","type":"mc","stem":"Which statement is false?","code":"","options":["The DO UNTIL loop executes until a condition is true.","The DO WHILE loop always executes at least one time.","The DO WHILE loop checks the condition at the top of the loop.","The DO UNTIL loop checks the condition at the bottom of the loop."],"answer":1,"accepted":[],"numeric":false,"explanation":"DO WHILE kiểm tra điều kiện ở đầu, nên nếu điều kiện sai ngay từ đầu thì không chạy lần nào; câu b là sai. Chính DO UNTIL mới luôn chạy ít nhất một lần.","solution":"","solutionCode":"","courseSource":"raw/P2_L06_do_loops.md – Quiz: Lesson 6 Q8","answerSource":"derived","confidence":"high"},{"id":"p2b-p2l6-quiz-q9","set":"p2course","number":122,"domain":"D2","topic":"Combined iterative and conditional DO","format":"Course quiz","difficulty":"","type":"mc","stem":"Which of the following contains valid syntax?","code":"","options":["do Age=10 to 14 and while (Weight\u003c150);","do week=1 to 52 do until (Mileage ge 2750);","do Increase=5 to 10 while (temperature lt 102);","do Year=2018 to 2028 or until (Earnings\u003c=100000);"],"answer":2,"accepted":[],"numeric":false,"explanation":"Cú pháp kết hợp là DO index=start TO stop WHILE|UNTIL (expression); và không có từ nối. Các phương án khác chèn AND, DO hoặc OR không hợp lệ giữa phần iterative và conditional.","solution":"","solutionCode":"","courseSource":"raw/P2_L06_do_loops.md – Quiz: Lesson 6 Q9","answerSource":"derived","confidence":"high"},{"id":"p2b-p2l6-quiz-q10","set":"p2course","number":123,"domain":"D2","topic":"Iterative DO with WHILE","format":"Course quiz","difficulty":"","type":"mc","stem":"Which output table is produced by this step?","code":"data test; bike=10; do day=1 to 7 while (bike lt 13); bike=bike+2; end; run;","options":["Bike 14, Day 2","Bike 14, Day 3","Bike 24, Day 7","Bike 24, Day 8"],"answer":1,"accepted":[],"numeric":false,"explanation":"day=1: 10\u003c13 nên bike=12, day tăng lên 2; day=2: 12\u003c13 nên bike=14, day tăng lên 3; day=3: 14\u003c13 sai nên thoát. Kết quả bike=14, day=3, vì index được tăng trước khi WHILE kiểm tra ở đầu vòng.","solution":"","solutionCode":"","courseSource":"raw/P2_L06_do_loops.md – Quiz: Lesson 6 Q10","answerSource":"derived","confidence":"high"},{"id":"p2b-p2l6-act-p206a01-2","set":"p2course","number":124,"domain":"D2","topic":"Iterative DO loop with sum statement","format":"Course activity","difficulty":"","type":"sa","stem":"Activity p206a01: After adding the interest statement Savings+(Savings*0.02/12); after the Savings sum statement, what is the value of Savings at month 12?","code":"data YearlySavings;\n    Amount=200;\n    do Month=1 to 12;\n        Savings+Amount;\n        output;\n    end;\n    format Savings 12.2;\nrun;","options":[],"answer":" ype":"mc","stem":"How many rows are in the final table if work.airwide has three rows?","code":"data work.airnarrow;\n    set work.airwide;\n    Month='Jan';\n    Air=Jan;\n    output;\n    Month='Feb';\n    Air=Feb;\n    output;\n    Month='Mar';\n    Air=Mar;\n    output;\n    keep Year Month Air;\nrun;","options":["3","6","9","12"],"answer":2,"accepted":[],"numeric":false,"explanation":"Mỗi lần lặp có 3 câu OUTPUT nên mỗi dòng input tạo 3 dòng: 3 x 3 = 9. Khi có OUTPUT tường minh thì không còn implicit output, nên không phải 12.","solution":"","solutionCode":"","courseSource":"raw/P2_L07_restructuring.md – Quiz: Lesson 7 Q3","answerSource":"derived","confidence":"high"},{"id":"p2b-p2l7-quiz-q4","set":"p2course","number":134,"domain":"D2","topic":"Narrow to wide with the DATA step","format":"Course quiz","difficulty":"","type":"mc","stem":"When going from a narrow to a wide table with the DATA step, the KEEP statement is needed to hold values in the PDV across multiple iterations of the DATA step.","code":"","options":["True","False"],"answer":1,"accepted":[],"numeric":false,"explanation":"Câu này sai: RETAIN mới giữ giá trị trong PDV qua các lần lặp. KEEP chỉ chọn cột được ghi ra bảng output.","solution":"","solutionCode":"","courseSource":"raw/P2_L07_restructuring.md – Quiz: Lesson 7 Q4","answerSource":"derived","confidence":"high"},{"id":"p2b-p2l7-quiz-q5","set":"p2course","number":135,"domain":"D2","topic":"LAST. variable – narrow to wide","format":"Course quiz","difficulty":"","type":"mc","stem":"Which statement must be added to the program to include only the last row per Year in the output table?","code":"data work.airwide2(keep=Year Jan Feb Mar);\n    set work.airnarrow;\n    by Year;\n    retain Jan Feb Mar;\n    if Month='Jan' then Jan=Air;\n    else if Month='Feb' then Feb=Air;\n    else if Month='Mar' then Mar=Air;\n    ... insert statement here ...\nrun;","options":["output;","if Last then output;","if Last.Year=1 then output;","if Last.Year=0 then output;"],"answer":2,"accepted":[],"numeric":false,"explanation":"Với BY Year, biến tạm Last.Year bằng 1 ở dòng cuối của mỗi nhóm Year, lúc đó Jan, Feb, Mar đã được retain đầy đủ. Last không có tên BY không tồn tại, còn Last.Year=0 sẽ ghi các dòng không phải dòng cuối.","solution":"","solutionCode":"","courseSource":"raw/P2_L07_restructuring.md – Quiz: Lesson 7 Q5","answerSource":"derived","confidence":"high"},{"id":"p2b-p2l7-quiz-q6","set":"p2course","number":136,"domain":"D2","topic":"PROC TRANSPOSE","format":"Course quiz","difficulty":"","type":"mc","stem":"Which statement is false concerning the TRANSPOSE procedure?","code":"","options":["Columns are transposed into rows.","By default, numeric columns are transposed.","Use a BY statement to sort the data while transposing.","Use a VAR statement to specify the character and numeric columns to transpose."],"answer":2,"accepted":[],"numeric":false,"explanation":"BY statement không sắp xếp dữ liệu; nó yêu cầu dữ liệu đã được sắp xếp trước theo các cột BY. Các câu còn lại đúng: mặc định chỉ transpose cột số, và VAR có thể liệt kê cả cột ký tự lẫn cột số.","solution":"","solutionCode":"","courseSource":"raw/P2_L07_restructuring.md – Quiz: Lesson 7 Q6","answerSource":"derived","confidence":"high"},{"id":"p2b-p2l7-quiz-q7","set":"p2course","number":137,"domain":"D2","topic":"PROC TRANSPOSE – narrow to wide","format":"Course quiz","difficulty":"","type":"mc","stem":"Which statements are needed in PROC TRANSPOSE to go from the narrow table to the wide table?\n\nNarrow:\n```text\nDay       Meal       Food\nSaturday  Breakfast  Yogurt\nSaturday  Lunch      Sandwich\nSaturday  Dinner     Steak\nSunday    Breakfast  Pancakes\nSunday    Lunch      Salad\nSunday    Dinner     Lasagna\n```\n\nWide columns: Day, Breakfast, Lunch, Dinner.","code":"","options":["by Day; var Meal Food;","id Day; var Food Meal;","by Day; id Food; var Meal;","by Day; id Meal; var Food;"],"answer":3,"accepted":[],"numeric":false,"explanation":"Mỗi Day là ố không nằm trong BY được transpose, tức Wind1 đến Wind4. Muốn giới hạn (ví dụ var Wind1 Wind2;) phải dùng VAR.","solution":"","solutionCode":"","courseSource":"raw/P2_L07_restructuring.md – Activity (p207a05.sas)","answerSource":"official","confidence":"high","courseOriginal":{"stem":"Activity p207a05: Running PROC TRANSPOSE on pg2.storm_top4_wide (BY Season Basin Name) without a VAR statement, which columns are transposed by default?","code":"","answer":"Wind1-Wind4","accepted":["wind1-wind4","wind1–wind4","wind1 wind2 wind3 wind4","wind1, wind2, wind3, wind4","all numeric columns","numeric columns"],"explanation":"Mặc định mọi cột số không nằm trong BY được transpose, tức Wind1 đến Wind4. Muốn giới hạn (ví dụ var Wind1 Wind2;) phải dùng VAR."}},{"id":"p2b-p2l7-act-p207a05-2","set":"p2course","number":147,"domain":"D2","topic":"PROC TRANSPOSE default column names","format":"Course activity","difficulty":"","type":"sa","stem":"Activity p207a05: What are the names of the columns that hold the transposed column names and the transposed values?","code":"","options":[],"answer":"_NAME_ and COL1","accepted":["_name_ and col1","_name_, col1","_name_ col1","_name_ & col1"],"numeric":false,"explanation":"Mặc định cột chứa tên cột nguồn là _NAME_ và cột giá trị là COL1 (COL2... nếu có nhiều dòng trong nhóm). Đổi bằng NAME=, PREFIX= hoặc RENAME=.","solution":"","solutionCode":"","courseSource":"raw/P2_L07_restructuring.md – Activity (p207a05.sas)","answerSource":"official","confidence":"high"}]}

  <script>
    // Sections follow the A00-231 exam content guide; WEIGHT = share of the real exam.
    const SECTIONS = {
      D1: "Access & Create Data Structures",
      D2: "Manage Data",
      D3: "Error Handling",
      D4: "Generate Reports & Output",
    };
    const WEIGHT = { D1: .23, D2: .38, D3: .18, D4: .21 };
    // Hand-checked sections for the analyticsexam questions; new harvested questions fall back to keywords.
    const SECTION_BY_ID = {
      1: "D4", 2: "D3", 3: "D2", 4: "D1", 5: "D2", 6: "D4", 7: "D3", 8: "D1", 9: "D1", 10: "D1",
      11: "D2", 12: "D1", 13: "D2", 14: "D4", 15: "D2", 16: "D1", 17: "D1", 18: "D3", 19: "D3", 20: "D3",
      21: "D4", 22: "D4", 23: "D2", 24: "D1", 25: "D2", 26: "D2", 27: "D1", 28: "D4", 29: "D4", 30: "D1",
    };
    // Mock exam: fixed questions per section, 135 minutes, pass mark 725/1000 like the real exam.
    const EXAM_PLAN = { D1: 10, D2: 17, D3: 9, D4: 9 };
    const EXAM_MINUTES = 135, PASS_SCORE = 725;
    const LETTERS = "ABCDEFGH";
    // Course librefs: the tables come from the course setup program, not from this bank (see raw/CR_00_course_overview.md, raw/P1_L00_setup.md).
    const COURSE_DATA = {
      cr: "khóa Certification Review – chạy <code>createdataCRB_oda.sas</code> trong thư mục <code>ECRBM6</code>",
      pg1: "khóa Programming 1 – chạy <code>createdataPG1v2_oda.sas</code> trong thư mục <code>EPG1V2</code>",
      pg2: "khóa Programming 2 – chạy chương trình setup trong thư mục <code>EPG2V2</code>",
      crb: "khóa Certification Review – chạy <code>createdataCRB_oda.sas</code> trong thư mục <code>ECRBM6</code>",
    };
    const RAW_SET = { id: "analyticsexam", name: "AnalyticsExam sample (đã thu thập)" };

    let rawData = null, practiceData = null, aeVietnamese = {};
    let bank = [], sets = [];   // normalized questions and the sets they belong to
    let run = null;             // { ids, cur, answers: {id: [idx] | "text"}, checked: {id: true}, title, exam: null | {endAt, done, auto, used} }
    let timer = null;

    // ---------- storage (wrong-answer list survives reloads) ----------
    const store = {
      get(k, d) { try { const v = localStorage.getItem("a00231sim_" + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
      set(k, v) { try { localStorage.setItem("a00231sim_" + k, JSON.stringify(v)); } catch (e) {} },
    };
    function recordResult(id, ok) {
      const w = store.get("wrong", []).filter(x => x !== id);
      if (!ok) w.push(id);
      store.set("wrong", w);
    }

    // ---------- rendering helpers ----------
    const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    const inline = t => esc(t).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    // Small markdown subset used by the bank: ```code``` blocks, `code`, **bold**, "- " lists, paragraphs.
    function md(src) {
      if (!src) return "";
      return String(src).split(/```(?:sas|text)?\n?([\s\S]*?)```/).map((p, i) => {
        if (i % 2) return "<pre>" + esc(p.replace(/\n$/, "")) + "</pre>";
        let html = "", list = false;
        for (const ln of p.split("\n")) {
          if (/^\s*[-*] /.test(ln)) { if (!list) { html += "<ul>"; list = true; } html += "<li>" + inline(ln.replace(/^\s*[-*] /, "")) + "</li>"; continue; }
          if (list) { html += "</ul>"; list = false; }
          if (ln.trim()) html += "<p>" + inline(ln) + "</p>";
        }
        return html + (list ? "</ul>" : "");
      }).join("");
    }
    const pre = c => c ? "<pre>" + esc(c) + "</pre>" : "";

    // ---------- analyticsexam raw data ----------
    function guessSection(text) {
      const t = text.toLowerCase();
      if (/_error_|\bthe log\b|putlog|error:|warning:|syntax error|debug/.test(t)) return "D3";
      if (/\bods\b|\btitle\d?\b|footnote|proc (print|freq|means|univariate|report|export)/.test(t)) return "D4";
      if (/librar|libname|proc (import|contents)|merge|concatenat|\bwhere\b|keep=|drop=|date value/.test(t)) return "D1";
      return "D2";
    }
    // A line is code/data when it ends with ";" or is a short line without sentence punctuation
    // (data listings, report output). Prose lines in this bank always end with . ? : or ,
    function isCodeLine(line) {
      if (/;\s*$/.test(line) || /^<\s*insert/i.test(line)) return true;
      if (/[.?!:,)]\s*$/.test(line)) return false;
      return line.split(/\s+/).length <= 8;
    }
    function splitStem(text) {
      const blocks = [];
      for (const raw of String(text || "").split("\n")) {
        const line = raw.trim();
        if (!line) continue;
        const kind = isCodeLine(line) ? "code" : "text";
        const last = blocks[blocks.length - 1];
        // one-line programs ("data x; set y; run;") read better one statement per line
        const value = kind === "code" ? line.replace(/^-\s+/, "").replace(/;\s+(?=\S)/g, ";\n") : line;
        if (last && last.kind === "code" && kind === "code") {
          if (/^(data|proc)\s/i.test(value)) last.lines.push(""); // blank line between steps
          last.lines.push(value);
        } else blocks.push({ kind, lines: [value] });
      }
      return blocks;
    }
    // "[Correct - option]: why\n\n[Incorrect - option]: why" -> { optionText: {correct, why} }
    function parseExplanation(text) {
      const out = {};
      String(text || "").split(/\n\n(?=\[(?:Correct|Incorrect) - )/).forEach(part => {
        const m = part.match(/^\[(Correct|Incorrect) - ([\s\S]*?)\]: ([\s\S]*)$/);
        if (m) out[m[2].trim()] = { correct: m[1] === "Correct", why: m[3].trim() };
      });
      return out;
    }
    function fromRaw(raw) {
      const options = raw.options || [];
      const expl = parseExplanation(raw.explanation);
      let correct = String(raw.correct_answer || "").split(" | ").map(s => options.indexOf(s));
      if (correct.some(i => i < 0)) // fall back to the [Correct - ...] labels
        correct = options.map((o, i) => (expl[o.trim()] || {}).correct ? i : -1).filter(i => i >= 0);
      const blocks = splitStem(raw.question_text);
      // Vietnamese text keyed by question text, so it survives the harvester re-numbering ids; English is the fallback
      const vi = aeVietnamese[String(raw.question_text || "").replace(/\s+/g, " ").trim().toLowerCase()] || {};
      const optionWhy = options.map(o => vi[o.trim()] || (expl[o.trim()] || {}).why || "");
      return {
        id: "ae-" + raw.id, set: RAW_SET.id, number: raw.id, type: "mc",
        section: SECTION_BY_ID[raw.id] || guessSection(raw.question_text + " " + options.join(" ")),
        questionText: blocks.filter(b => b.kind === "text").map(b => b.lines.join(" ")).join(" "),
        stemHtml: blocks.map(b => b.kind === "code" ? pre(b.lines.join("\n")) : b.lines.map(l => `<p>${esc(l)}</p>`).join("")).join("")
          + (raw.question_images || []).map(src => `<img src="${esc(src)}" alt="Hình minh họa của câu hỏi" loading="lazy">`).join(""),
        optionHtml: options.map(o => /;|\n/.test(o) ? `<span class="otext mono">${esc(o)}</span>` : `<span class="otext">${esc(o)}</span>`),
        optionWhy,
        correctAnswer: correct.sort((a, b) => a - b),
        // explanation lines that did not match an option are still shown in full
        explanationHtml: optionWhy.every(w => !w) && raw.explanation ? `<div class="otext">${esc(raw.explanation)}</div>` : "",
        solutionCode: "", derived: false, lowConfidence: false, source: "",
      };
    }

    // ---------- question_bank/questions.json ----------
    function fromBank(q) {
      const mc = q.type === "mc";
      return {
        id: q.id, set: q.set, number: q.number, type: q.type, section: q.domain,
        questionText: String(q.stem || "").replace(/[`*]/g, "").split("\n")[0],
        stemHtml: md(q.stem) + pre(q.code),
        optionHtml: mc ? q.options.map(md) : [],
        optionWhy: [],
        correctAnswer: mc ? [].concat(q.answer).sort((a, b) => a - b) : [],
        answerText: mc ? "" : String(q.answer),
        accepted: q.accepted || [], numeric: !!q.numeric,
        explanationHtml: md(q.explanation) + (q.solution ? `<details><summary>Lời giải chi tiết</summary><div class="md">${md(q.solution)}</div></details>` : ""),
        solutionCode: q.solutionCode || "",
        // sample DATA step injected by question_bank/inject_sample_data.js
        sampleData: (String(q.code || "").match(/\/\* --- Bắt đầu: Dữ liệu mẫu[\s\S]*?Kết thúc: Dữ liệu mẫu --- \*\//) || [""])[0],
        derived: q.answerSource === "derived",
        lowConfidence: q.confidence === "low",
        source: q.courseSource || "",
      };
    }

    function rebuild() {
      bank = [];
      sets = [];
      if (rawData) {
        const qs = (rawData.questions || []).map(fromRaw).filter(q => q.optionHtml.length && q.correctAnswer.length);
        if (qs.length) { bank.push(...qs); sets.push({ ...RAW_SET, setupCode: "" }); }
      }
      if (practiceData) {
        bank.push(...practiceData.questions.map(fromBank));
        sets.push(...practiceData.sets);
      }
      sets.forEach(s => (s.count = bank.filter(q => q.set === s.id).length));
      document.getElementById("bankInfo").textContent = `${bank.length} câu hỏi · ${sets.length} bộ nguồn`;
    }

    function importJson(ev) {
      const file = ev.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        try {
          const data = JSON.parse(e.target.result);
          if (!Array.isArray(data.questions)) throw new Error("thiếu mảng 'questions'");
          if (Array.isArray(data.sets)) practiceData = data; else rawData = data;
          rebuild();
          showStart("Đã nạp " + file.name);
        } catch (err) {
          showStart("Không đọc được file JSON: " + err.message);
        }
      };
      reader.readAsText(file, "utf-8");
      ev.target.value = "";
    }

    // ---------- grading ----------
    const byId = id => bank.find(q => q.id === id);
    const isMulti = q => q.correctAnswer.length > 1;
    const norm = s => String(s ?? "").trim().toLowerCase().replace(/\s+/g, "");
    const hasAnswer = a => Array.isArray(a) ? a.length > 0 : String(a ?? "").trim() !== "";
    function isRight(q, a) {
      if (!hasAnswer(a)) return false;
      if (q.type === "mc") {
        const p = [...a].sort((x, y) => x - y);
        return p.length === q.correctAnswer.length && p.every((v, i) => v === q.correctAnswer[i]);
      }
      if (q.numeric) {
        const t = String(a).trim().replace(/^\$/, "").replace(/%$/, "").replace(/,/g, "");
        return /^[-+]?\d*\.?\d+$/.test(t) && Math.abs(parseFloat(t) - parseFloat(String(q.accepted[0]).replace(/,/g, ""))) < 1e-9;
      }
      return q.accepted.some(k => norm(k) === norm(a));
    }
    const keyText = q => q.type === "mc" ? q.correctAnswer.map(i => LETTERS[i]).join(", ") : q.answerText;
    const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
    function shuffle(a) {
      for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
      return a;
    }
    // n questions spread over sections by the real exam's weights
    function pickWeighted(pool, n) {
      n = Math.min(n, pool.length);
      const by = {};
      pool.forEach(q => (by[q.section] = by[q.section] || []).push(q));
      const secs = Object.keys(by), want = {};
      let got = 0;
      secs.forEach(s => { want[s] = Math.min(by[s].length, Math.floor(n * WEIGHT[s])); got += want[s]; });
      while (got < n) { // hand out the remainder, largest weight first
        const s = secs.filter(s => want[s] < by[s].length).sort((a, b) => WEIGHT[b] - WEIGHT[a] || want[a] - want[b])[0];
        if (!s) break;
        want[s]++; got++;
      }
      return shuffle(secs.flatMap(s => shuffle(by[s]).slice(0, want[s])));
    }
    // exactly EXAM_PLAN questions per section, drawn from every source (bank + AnalyticsExam)
    const pickExam = () => shuffle(Object.keys(EXAM_PLAN).flatMap(s => shuffle(bank.filter(q => q.section === s)).slice(0, EXAM_PLAN[s]))).map(q => q.id);
    const fmtTime = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };

    // ---------- programming questions: data note + code check ----------
    // solutionCode too: stems often say "the employee table" without the library
    const dataRefs = q => [...new Set(((String(q.stemHtml).replace(/<[^>]+>/g, " ") + " " + (q.solutionCode || "")).match(/\b(crb?|pg1|pg2|sashelp)\.\w+/gi) || []).map(s => s.toLowerCase()))];
    const courseRefs = q => dataRefs(q).filter(r => COURSE_DATA[r.split(".")[0]]);
    function dataNote(q) {
      const refs = dataRefs(q), course = courseRefs(q), help = refs.filter(r => r.startsWith("sashelp."));
      const list = rs => rs.map(r => `<code>${esc(r)}</code>`).join(", ");
      if (q.sampleData) return `<div class="note">Dữ liệu mẫu đã có trong đề (khối <i>Dữ liệu mẫu tự động tạo</i>); đáp án được tính theo dữ liệu này, không theo dữ liệu khóa học.
          Nút <b>Chạy trên SAS Studio</b> tự chép khối dữ liệu đó trước code của bạn.</div>`;
      return (course.length ? `<div class="note">Câu này dùng bảng dữ liệu của khóa học: ${list(course)}. Bảng không có trong ngân hàng câu hỏi;
          tạo nó trên SAS OnDemand for Academics (SAS Studio) bằng chương trình setup của
          ${[...new Set(course.map(r => COURSE_DATA[r.split(".")[0]]))].join("; ")}, rồi chạy code của bạn ở đó.</div>` : "")
        + (help.length ? `<div class="note">${list(help)} có sẵn trong mọi phiên SAS, không cần setup.</div>` : "");
    }
    // SAS code -> statements of tokens. Comments dropped, case and quote style ignored, option order ignored.
    function statements(src) {
      return String(src || "").replace(/\/\*[\s\S]*?\*\//g, " ").split(";")
        .map(s => s.trim()).filter(s => s && !s.startsWith("*"))
        .map(s => ({ text: s, tokens: (s.toLowerCase().match(/"[^"]*"|'[^']*'|[\w.$%&]+|[=<>^~]+|\S/g) || []).map(t => t.replace(/^"(.*)"$/, "'$1'")) }));
    }
    // ponytail: token match against the model solution, not a real SAS run; a different but valid program can score low
    // statements -> steps keyed "data" / "proc sort" / ...; statements before the first step go to "global"
    function steps(sts) {
      const out = [];
      for (const s of sts) {
        const t = s.tokens;
        if (t[0] === "data" || t[0] === "proc" || !out.length) out.push({ key: t[0] === "proc" ? "proc " + t[1] : t[0] === "data" ? "data" : "global", sts: [] });
        out[out.length - 1].sts.push(s);
      }
      return out;
    }
    // which solution statements have a matching statement of yours; each of yours counts once (e.g. one RUN per step)
    function matchStatements(sol, mine) {
      const used = new Set();
      return sol.map(s => {
        const i = mine.findIndex((m, k) => !used.has(k) && m.tokens[0] === s.tokens[0] && s.tokens.every(t => m.tokens.includes(t)));
        if (i >= 0) used.add(i);
        return i >= 0;
      });
    }
    // ponytail: SAS ODA needs a login and blocks cross-site calls, so copy the code and open the ODA sign-in page; the user signs in, opens SAS Studio, pastes and presses F3.
    const SAS_STUDIO_URL = "https://welcome.oda.sas.com/";
    function runInSasStudio() {
      const q = byId(run.ids[run.cur]), code = document.getElementById("codeInput").value;
      const text = q.sampleData ? q.sampleData + "\n\n" + code : code;
      document.addEventListener("copy", e => { e.clipboardData.setData("text/plain", text); e.preventDefault(); }, { once: true });
      document.execCommand("copy");
      window.open(SAS_STUDIO_URL, "sasstudio");
    }
    function checkCode() {
      const q = byId(run.ids[run.cur]);
      const mine = steps(statements(run.code[q.id])), usedSteps = new Set();
      const rows = steps(statements(q.solutionCode)).flatMap(st => {
        // pair each solution step with your same-kind step that matches it best
        let best = -1, hits = null;
        mine.forEach((m, k) => {
          if (usedSteps.has(k) || m.key !== st.key) return;
          const h = matchStatements(st.sts, m.sts);
          if (!hits || h.filter(Boolean).length > hits.filter(Boolean).length) { best = k; hits = h; }
        });
        if (best >= 0) usedSteps.add(best);
        const name = st.key === "global" ? "" : st.key.toUpperCase();
        return st.sts.map((s, i) => ({
          hit: !!hits && hits[i],
          label: i === 0 && st.key !== "global" ? `${name} (câu lệnh mở đầu step)` : `${name ? name + " › " : ""}${s.tokens[0].toUpperCase()} …`,
        }));
      });
      const n = rows.filter(r => r.hit).length;
      document.getElementById("codeResult").innerHTML = `
        <div class="feedback ${n === rows.length ? "ok" : "bad"}">
          <div class="verdict">Khớp ${n}/${rows.length} câu lệnh của code mẫu</div>
          <ul class="codecheck">${rows.map(r => `<li class="${r.hit ? "y" : "n"}">${r.hit ? "✔" : "✘ thiếu hoặc khác:"} ${esc(r.label)}</li>`).join("")}</ul>
          <p class="muted small">So khớp từng câu lệnh với code mẫu (không phân biệt hoa thường, thứ tự option, comment) – không chạy SAS thật.
            Code mẫu có thể giải nhiều câu con cùng lúc nên có câu lệnh không cần cho câu này. Kết quả số vẫn chấm bằng nút <b>Kiểm tra</b>.</p>
        </div>`;
    }

    // ---------- start screen ----------
    const app = () => document.getElementById("app");
    const checkedValues = name => [...document.querySelectorAll(`input[name="${name}"]:checked`)].map(i => i.value);

    function showStart(message) {
      run = null;
      tickTimer();
      const wrong = store.get("wrong", []).filter(byId);
      const secCount = s => bank.filter(q => q.section === s).length;
      const mcCount = bank.filter(q => q.type === "mc").length;
      app().innerHTML = `
        ${message ? `<div class="card">${esc(message)}</div>` : ""}
        <div class="card">
          <h2>Bộ đề có sẵn</h2>
          <div class="presets">
            <button class="preset" type="button" onclick="startRun(pickExam(), 'Thi thử 45 câu', true)">
              <b>Thi thử 45 câu (Mock Exam)</b><span class="muted small">135 phút · D1 10, D2 17, D3 9, D4 9 · chấm cuối bài theo thang 1000, đậu ≥ 725</span></button>
            <button class="preset" type="button" onclick="startRun(pickWeighted(bank, 20).map(q => q.id), 'Luyện nhanh 20 câu')">
              <b>Luyện nhanh 20 câu</b><span class="muted small">Ngẫu nhiên, vẫn theo tỉ lệ domain</span></button>
            <button class="preset" type="button" onclick="startRun(shuffle(bank.filter(q => q.type === 'mc').map(q => q.id)).slice(0, 30), 'Trắc nghiệm 30 câu')">
              <b>Trắc nghiệm 30 câu</b><span class="muted small">Chỉ câu chọn đáp án</span></button>
            <button class="preset" type="button" onclick="startRun(shuffle(store.get('wrong', []).filter(byId)), 'Ôn các câu đã sai')" ${wrong.length ? "" : "disabled"}>
              <b>Ôn các câu đã sai – Review Incorrect Answers (${wrong.length})</b><span class="muted small">Câu làm sai ở mọi lần trước; làm đúng sẽ tự bỏ khỏi danh sách</span></button>
          </div>
        </div>
        <div class="card">
          <h2>Tự chọn</h2>
          <div class="cols">
            <div>
              <h3>Bộ nguồn</h3>
              ${sets.map(s => `<label class="chk"><input type="checkbox" name="set" value="${esc(s.id)}" checked>
                <span>${esc(s.name)} <span class="muted small">(${s.count})</span></span></label>`).join("")}
            </div>
            <div>
              <h3>Phần thi</h3>
              ${Object.keys(SECTIONS).map(k => `<label class="chk"><input type="checkbox" name="sec" value="${k}" checked>
                <span>${k} – ${SECTIONS[k]} <span class="muted small">(${secCount(k)})</span></span></label>`).join("")}
              <h3>Loại câu</h3>
              <label class="chk"><input type="checkbox" name="typ" value="mc" checked><span>Trắc nghiệm <span class="muted small">(${mcCount})</span></span></label>
              <label class="chk"><input type="checkbox" name="typ" value="sa" checked><span>Tự điền / thực hành trên SAS <span class="muted small">(${bank.length - mcCount})</span></span></label>
            </div>
          </div>
          <h3>Tùy chọn</h3>
          <div class="row">
            <label>Số câu <input type="number" id="optCount" min="1" value="${bank.length}"></label>
            <label class="chk"><input type="checkbox" id="optShuffle" checked> Xáo trộn</label>
            <label class="chk"><input type="checkbox" id="optOfficial"> Bỏ câu có đáp án tự suy ra</label>
          </div>
          <div class="row" style="margin-top:12px"><button class="primary" type="button" onclick="startFromForm()">Bắt đầu</button>
            <span class="muted small" id="poolInfo"></span></div>
        </div>
        <div class="card muted small">
          Chọn đáp án rồi bấm <b>Kiểm tra</b> để xem đúng/sai và giải thích ngay. Phím tắt: 1–5 chọn đáp án, Enter kiểm tra, ← → chuyển câu.
          Câu <span class="tag warn">đáp án suy ra</span> lấy từ quiz khóa học chưa có đáp án chính thức; đáp án được suy ra từ nội dung khóa học và kiểm tra chéo.
          Câu tự điền cần chạy code trên SAS (SAS OnDemand / SAS Studio); một số câu cần dữ liệu của khóa học.
        </div>`;
      document.querySelectorAll("#app input").forEach(i => (i.onchange = updatePool));
      updatePool();
    }

    function pool() {
      const s = checkedValues("set"), d = checkedValues("sec"), t = checkedValues("typ");
      const official = document.getElementById("optOfficial").checked;
      return bank.filter(q => s.includes(q.set) && d.includes(q.section) && t.includes(q.type) && !(official && q.derived));
    }
    function updatePool() { document.getElementById("poolInfo").textContent = `${pool().length} câu phù hợp`; }

    function startFromForm() {
      let ids = pool().map(q => q.id);
      if (document.getElementById("optShuffle").checked) shuffle(ids);
      ids = ids.slice(0, Math.max(1, +document.getElementById("optCount").value || ids.length));
      startRun(ids, "Bài tự chọn");
    }

    function startRun(ids, title, exam) {
      if (!ids.length) return;
      run = { ids, cur: 0, answers: {}, checked: {}, code: {}, title: title || (run && run.title) || "",
              exam: exam ? { endAt: Date.now() + EXAM_MINUTES * 60000, done: false } : null };
      clearInterval(timer);
      if (exam) timer = setInterval(tickTimer, 500);
      tickTimer();
      showQuestion();
    }

    // ---------- mock exam ----------
    const examLive = () => !!(run && run.exam && !run.exam.done);
    const locked = id => !!run.checked[id] || !!(run.exam && run.exam.done);
    function tickTimer() {
      const el = document.getElementById("timer");
      if (!examLive()) { clearInterval(timer); el.textContent = ""; return; }
      const left = run.exam.endAt - Date.now();
      el.textContent = "⏱ " + fmtTime(left);
      el.classList.toggle("low", left < 10 * 60000);
      if (left <= 0) submitExam(true);
    }
    function submitExam(auto) {
      if (!examLive()) return;
      if (!auto) {
        const blank = run.ids.filter(id => !hasAnswer(run.answers[id])).length;
        if (!confirm(blank ? `Nộp bài? Còn ${blank} câu bỏ trống (tính là sai).` : "Nộp bài?")) return;
      }
      Object.assign(run.exam, { done: true, auto, used: fmtTime(Date.now() - (run.exam.endAt - EXAM_MINUTES * 60000)) });
      // grade every answered question; blanks score 0 but are not added to the wrong list
      run.ids.filter(id => hasAnswer(run.answers[id])).forEach(id => {
        run.checked[id] = true;
        recordResult(id, isRight(byId(id), run.answers[id]));
      });
      tickTimer();
      showResults();
    }

    // ---------- question screen ----------
    function showQuestion() {
      const q = byId(run.ids[run.cur]);
      const a = run.answers[q.id];
      const done = locked(q.id);
      const n = run.ids.length;
      const checkedCount = run.ids.filter(id => run.checked[id]).length;
      const set = sets.find(s => s.id === q.set) || {};

      let answerArea;
      if (q.type === "mc") {
        const picked = a || [];
        answerArea = (isMulti(q) ? `<p class="muted">Chọn ${q.correctAnswer.length} đáp án.</p>` : "") + q.optionHtml.map((html, i) => {
          const sel = picked.includes(i), good = q.correctAnswer.includes(i);
          let cls = "opt" + (done ? " locked" : "");
          if (done && good) cls += " right";
          else if (done && sel) cls += " wrong";
          const why = done && (good || sel) && q.optionWhy[i] ? `<div class="why">${esc(q.optionWhy[i])}</div>` : "";
          return `<label class="${cls}">
            <input type="${isMulti(q) ? "checkbox" : "radio"}" name="opt" ${sel ? "checked" : ""} ${done ? "disabled" : ""} onchange="pick(${i})">
            <span class="letter">${LETTERS[i]}.</span><span class="body md">${html}${why}</span></label>`;
        }).join("");
      } else {
        answerArea = `${dataNote(q)}
          <label class="muted small" for="codeInput">Code SAS của bạn (viết ở đây, chạy trên SAS để lấy kết quả)</label>
          <textarea class="code" id="codeInput" spellcheck="false" autocomplete="off"
            oninput="run.code[run.ids[run.cur]] = this.value"
            onkeydown="if (event.key === 'Tab') { event.preventDefault(); this.setRangeText('    ', this.selectionStart, this.selectionEnd, 'end'); run.code[run.ids[run.cur]] = this.value; }">${esc(run.code[q.id] || "")}</textarea>
          <div class="row" style="margin:6px 0 12px"><button type="button" onclick="runInSasStudio()">Chạy trên SAS Studio</button>
            ${q.solutionCode && !examLive() ? `<button type="button" onclick="checkCode()">Kiểm tra code</button>
            <span class="muted small">So với code mẫu, chỉ ra câu lệnh còn thiếu</span>` : ""}</div>
          ${q.solutionCode && !examLive() ? `<div id="codeResult"></div>` : ""}
          <label class="muted small" for="saInput">Kết quả của bạn (giá trị đề hỏi)</label>
          <input type="text" id="saInput" autocomplete="off" value="${esc(a || "")}" ${done ? "disabled" : ""}
            oninput="run.answers[run.ids[run.cur]] = this.value; document.getElementById('btnCheck').disabled = !this.value.trim()">`;
      }

      let feedback = "";
      if (done) {
        const ok = isRight(q, a);
        feedback = `<div class="feedback ${ok ? "ok" : "bad"}">
          <div class="verdict">${ok ? "Chính xác!" : "Chưa đúng."} Đáp án: <span class="mono">${esc(keyText(q))}</span></div>
          ${q.derived ? `<p><span class="tag warn">đáp án suy ra</span> ${q.lowConfidence ? "Độ tin cậy thấp, nên tự kiểm tra lại." : ""}</p>` : ""}
          <div class="md">${q.explanationHtml}</div>
          ${q.solutionCode ? `<details><summary>Code lời giải</summary>${pre(q.solutionCode)}</details>` : ""}
          ${q.source ? `<p class="muted small">Nguồn: ${esc(q.source)}</p>` : ""}
        </div>`;
      }

      const palette = run.ids.map((id, i) => {
        let cls = i === run.cur ? "cur" : "";
        if (run.checked[id]) cls += isRight(byId(id), run.answers[id]) ? " p-ok" : " p-bad";
        else if (hasAnswer(run.answers[id])) cls += " p-sel";
        return `<button type="button" class="${cls}" onclick="go(${i})">${i + 1}</button>`;
      }).join("");

      app().innerHTML = `
        <div class="card">
          <div class="row spread">
            <b>Câu ${run.cur + 1}/${n}</b>
            <span class="row">
              <span class="tag">${q.section} – ${SECTIONS[q.section]}</span>
              <span class="tag" title="Bộ nguồn">${esc(set.name || q.set)}${q.number ? " · #" + q.number : ""}</span>
            </span>
          </div>
          <div class="progress" title="Đã kiểm tra ${checkedCount}/${n}"><div style="width:${pct(checkedCount, n)}%"></div></div>
          <div class="stem md">${q.stemHtml}</div>
          ${set.setupCode ? `<details><summary>Code setup dùng chung của bộ này (chạy trước trên SAS)</summary>${pre(set.setupCode)}</details>` : ""}
          <div style="margin-top:10px">${answerArea}</div>
          ${feedback}
          <div class="row spread" style="margin-top:14px">
            <button type="button" onclick="go(run.cur - 1)" ${run.cur === 0 ? "disabled" : ""}>← Câu trước</button>
            <button class="primary" type="button" id="btnCheck" onclick="check()" ${done || !hasAnswer(a) ? "disabled" : ""} ${examLive() ? "hidden" : ""}>Kiểm tra</button>
            <button type="button" onclick="go(run.cur + 1)" ${run.cur === n - 1 ? "disabled" : ""}>Câu sau →</button>
          </div>
        </div>
        <div class="card">
          <div class="row spread" style="margin-bottom:10px">
            <span class="muted">${esc(run.title)} · ${examLive() ? `đã trả lời ${run.ids.filter(id => hasAnswer(run.answers[id])).length}` : `đã kiểm tra ${checkedCount}`}/${n} câu</span>
            <span class="row"><button type="button" class="small" onclick="showStart()">Thoát</button>
              ${examLive() ? `<button class="primary" type="button" onclick="submitExam(false)">Nộp bài</button>`
                           : `<button type="button" onclick="showResults()">Xem kết quả</button>`}</span>
          </div>
          <div class="palette">${palette}</div>
        </div>`;
      const inp = document.getElementById("saInput");
      if (inp && !done) inp.focus();
    }

    function pick(i) {
      const q = byId(run.ids[run.cur]);
      if (locked(q.id) || q.type !== "mc") return;
      let p = run.answers[q.id] || [];
      p = isMulti(q) ? (p.includes(i) ? p.filter(x => x !== i) : [...p, i]) : [i];
      run.answers[q.id] = p;
      showQuestion();
    }

    function check() {
      const id = run.ids[run.cur];
      if (locked(id) || examLive() || !hasAnswer(run.answers[id])) return;
      run.checked[id] = true;
      recordResult(id, isRight(byId(id), run.answers[id]));
      showQuestion();
    }

    function go(i) {
      if (i < 0 || i >= run.ids.length) return;
      run.cur = i;
      showQuestion();
      window.scrollTo(0, 0);
    }

    // ---------- results ----------
    function statRows(ids, rightIds, keyOf, label) {
      const stats = {};
      ids.forEach(id => {
        const k = keyOf(byId(id));
        stats[k] = stats[k] || { right: 0, total: 0 };
        stats[k].total++;
        if (rightIds.includes(id)) stats[k].right++;
      });
      return Object.keys(stats)
        .sort((a, b) => stats[a].right / stats[a].total - stats[b].right / stats[b].total)
        .map(k => {
          const p = pct(stats[k].right, stats[k].total);
          const color = p >= 80 ? "var(--ok)" : p >= 60 ? "var(--accent)" : "var(--bad)";
          return `<div class="bar-row"><span>${esc(label(k))}</span>
            <div class="bar"><div style="width:${p}%;background:${color}"></div></div>
            <b>${p}% <span class="muted">(${stats[k].right}/${stats[k].total})</span></b></div>`;
        }).join("");
    }

    function showResults() {
      const ids = run.ids;
      const rightIds = ids.filter(id => run.checked[id] && isRight(byId(id), run.answers[id]));
      const wrongIds = ids.filter(id => !rightIds.includes(id));
      const unchecked = ids.filter(id => !run.checked[id]).length;
      const setName = id => (sets.find(s => s.id === id) || {}).name || id;
      const ex = run.exam && run.exam.done ? run.exam : null;
      const scaled = Math.round((1000 * rightIds.length) / ids.length);

      const wrongList = wrongIds.map(id => {
        const q = byId(id), a = run.answers[id];
        const yours = !hasAnswer(a) ? "chưa trả lời" : q.type === "mc" ? a.map(i => LETTERS[i]).join(", ") : a;
        return `<details class="wrongq">
          <summary>Câu ${ids.indexOf(id) + 1} <span class="tag">${q.section}</span> ${esc(q.questionText.slice(0, 110))}</summary>
          <p>Bạn trả lời: <b class="mono">${esc(yours)}</b>${run.checked[id] ? "" : " (chưa kiểm tra)"} · Đáp án: <b class="mono">${esc(keyText(q))}</b></p>
          <div class="md">${q.explanationHtml}</div>
          <button class="small" type="button" onclick="go(${ids.indexOf(id)})">Xem lại câu này</button>
        </details>`;
      }).join("");

      app().innerHTML = `
        <div class="card">
          <h2>Kết quả – ${esc(run.title)}${ex && ex.auto ? " (hết giờ – tự động nộp)" : ""}</h2>
          ${ex ? `<div class="score ${scaled >= PASS_SCORE ? "pass" : "fail"}">${scaled}/1000 – ${scaled >= PASS_SCORE ? "ĐẬU" : "CHƯA ĐẬU"}</div>
            <p>${rightIds.length}/${ids.length} câu đúng · điểm đậu ${PASS_SCORE} · thời gian làm bài ${ex.used}</p>
            ${unchecked ? `<p>${unchecked} câu bỏ trống, được tính là sai.</p>` : ""}
            <p class="muted small">Điểm quy đổi tuyến tính: số câu đúng / tổng số câu × 1000.</p>`
          : `<div class="score">${rightIds.length}/${ids.length} <span class="muted" style="font-size:20px">(${pct(rightIds.length, ids.length)}%)</span></div>
            ${unchecked ? `<p>Còn ${unchecked} câu chưa kiểm tra, được tính là sai.</p>
              <button type="button" onclick="go(run.cur)">← Quay lại bài làm</button>` : ""}
            <p class="muted">Đề thật cần khoảng 72.5% (725/1000) để đậu.</p>`}
        </div>
        <div class="card">
          <h2>Độ chính xác theo phần thi (yếu nhất ở trên)</h2>
          ${statRows(ids, rightIds, q => q.section, k => k + " – " + SECTIONS[k])}
          <h3>Theo bộ nguồn</h3>
          ${statRows(ids, rightIds, q => q.set, setName)}
        </div>
        <div class="card">
          <h2>Câu làm sai (${wrongIds.length})</h2>
          ${wrongList || '<p class="muted">Không có câu sai.</p>'}
          <div class="row" style="margin-top:12px">
            <button class="primary" type="button" onclick="startRun(${esc(JSON.stringify(wrongIds))}, 'Làm lại các câu sai')" ${wrongIds.length ? "" : "disabled"}>Làm lại các câu sai</button>
            <button type="button" onclick="startRun(${esc(JSON.stringify(ids))})">Làm lại toàn bộ</button>
            <button type="button" onclick="showStart()">Về trang đầu</button>
          </div>
        </div>`;
      window.scrollTo(0, 0);
    }

    // ---------- keyboard ----------
    document.addEventListener("keydown", e => {
      if (!run || !document.getElementById("btnCheck") || e.ctrlKey || e.altKey || e.metaKey) return;
      if (document.activeElement && /^(BUTTON|TEXTAREA)$/.test(document.activeElement.tagName)) return; // let the button / code box handle it
      const typing = document.activeElement && document.activeElement.id === "saInput";
      const q = byId(run.ids[run.cur]);
      if (!typing && /^[1-8]$/.test(e.key) && q.type === "mc" && +e.key <= q.optionHtml.length) pick(+e.key - 1);
      else if (e.key === "Enter") check();
      else if (!typing && e.key === "ArrowLeft") go(run.cur - 1);
      else if (!typing && e.key === "ArrowRight") go(run.cur + 1);
    });

    const readBlock = id => { try { return JSON.parse(document.getElementById(id).textContent); } catch (e) { return null; } };
    rawData = readBlock("embeddedQuestionBank");
    practiceData = readBlock("practiceBank");
    aeVietnamese = readBlock("aeVietnamese") || {};    rebuild();
    showStart();
  </script>
</body>
</html>
