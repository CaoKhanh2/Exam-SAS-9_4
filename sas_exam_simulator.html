ét mọi dòng để xác định kiểu cột) không phụ thuộc REPLACE.","solution":"","solutionCode":"","courseSource":""},{"id":"set1-q5","set":"set1","number":5,"domain":"D1","topic":"PROC IMPORT (XLSX)","format":"Multiple choice","difficulty":"","type":"mc","stem":"Which step imports only the worksheet named **Parks** from `np_info.xlsx`?","code":"","options":["```sas\nproc import datafile=\"&path/np_info.xlsx\" dbms=csv out=parks replace;\n    sheet=Parks;\nrun;\n```","```sas\nproc import datafile=\"&path/np_info.xlsx\" dbms=xlsx out=parks replace;\n    getnames=Parks;\nrun;\n```","```sas\nproc import datafile=\"&path/np_info.xlsx\" dbms=xlsx out=parks replace;\n    sheet=Parks;\nrun;\n```","```sas\nproc import datafile=\"&path/np_info.xlsx\" dbms=xlsx out=parks replace;\n    datarow=Parks;\nrun;\n```"],"answer":2,"accepted":[],"numeric":false,"explanation":"Đọc file Excel cần `DBMS=XLSX`; câu lệnh `SHEET=` chọn sheet cần nhập. A dùng sai DBMS (CSV). B sai vì GETNAMES chỉ nhận YES hoặc NO. D sai vì DATAROW nhận số thứ tự dòng, không nhận tên sheet.","solution":"","solutionCode":"","courseSource":""},{"id":"set1-q6","set":"set1","number":6,"domain":"D1","topic":"SAS/ACCESS XLSX engine","format":"Multiple choice","difficulty":"","type":"mc","stem":"Consider:\n\n\n\nWhich statement is true?","code":"libname np xlsx \"&path/np_info.xlsx\";\n\nproc print data=np.parks;\nrun;\n\nlibname np clear;","options":["`np.parks` refers to the worksheet named Parks, and `LIBNAME np CLEAR` releases the connection to the workbook.","`np.parks` is a SAS7BDAT file that the XLSX engine created in the same folder.","`LIBNAME np CLEAR` deletes the workbook.","The XLSX engine can read only the first worksheet."],"answer":0,"accepted":[],"numeric":false,"explanation":"Với engine XLSX, mỗi worksheet hiện ra như một bảng trong thư viện, và CLEAR gỡ libref để giải phóng workbook. B sai vì engine đọc thẳng file Excel, không tạo file SAS7BDAT. C sai vì CLEAR không xóa file. D sai vì mọi worksheet đều truy cập được.","solution":"","solutionCode":"","courseSource":""},{"id":"set1-q7","set":"set1","number":7,"domain":"D1","topic":"Concatenation and column attributes (PBQ)","format":"Performance","difficulty":"","type":"sa","stem":"Run the code below.\n\n\n\nWhat value of **Code** is stored in row 3 of `codes_all`?","code":"data codes_a;\n    length Code $ 3;\n    input Code $ Rate;\n    datalines;\nNA1 1.5\nEP2 2.0\n;\nrun;\n\ndata codes_b;\n    length Code $ 5;\n    input Code $ Rate;\n    datalines;\nWP303 3.5\n;\nrun;\n\ndata codes_all;\n    set codes_a codes_b;\nrun;","options":[],"answer":"WP3","accepted":["WP3"],"numeric":false,"explanation":"Khi ghép bảng bằng SET, thuộc tính cột lấy theo bảng đứng **đầu tiên** trong câu lệnh SET, nên Code có độ dài 3 và \"WP303\" bị cắt còn \"WP3\". Log có WARNING \"Multiple lengths were specified…\". Cách sửa: đặt `length Code $ 5;` **trước** câu lệnh SET.","solution":"","solutionCode":"","courseSource":""},{"id":"set1-q8","set":"set1","number":8,"domain":"D1","topic":"One-to-many merge (PBQ)","format":"Performance","difficulty":"","type":"sa","stem":"Using `storms` and `basins` from the setup, sort as needed and merge the two tables by **Basin** without IN= variables or subsetting.\n\nHow many rows are in the output table?","code":"","options":[],"answer":"9","accepted":["9"],"numeric":true,"explanation":"Đây là merge một-nhiều. Mặc định DATA step merge ghi **cả dòng khớp lẫn không khớp**: EP có 4 dòng, NA có 4 dòng, và WP (chỉ có trong `basins`) thêm 1 dòng, tổng 9. Bảng `storms` phải được sort theo Basin trước khi merge; `basins` vốn đã theo thứ tự EP, NA, WP.","solution":"","solutionCode":"proc sort data=storms out=storms_sort;\n    by Basin;\nrun;\n\ndata storm_names;\n    merge storms_sort basins;\n    by Basin;\nrun;","courseSource":""},{"id":"set1-q9","set":"set1","number":9,"domain":"D1","topic":"Merge with IN= (non-matches)","format":"Multiple choice","difficulty":"","type":"mc","stem":"Which statement keeps only the basins that have **no** matching storm?","code":"data unused_basins;\n    merge storms_sort(in=inS) basins(in=inB);\n    by Basin;\n    __________;\nrun;","options":["`if inS=1 and inB=1;`","`where inB=1 and inS=0;`","`if inS=1 or inB=1;`","`if inB=1 and inS=0;`"],"answer":3,"accepted":[],"numeric":false,"explanation":"Biến IN= bằng 1 khi bảng tương ứng có giá trị BY của dòng đó, nên dòng chỉ có ở `basins` là `inB=1` và `inS=0`. B sai vì biến IN= chỉ tồn tại trong PDV lúc thực thi, mà WHERE chỉ dùng được cột của bảng đầu vào. A chỉ giữ các dòng khớp. C giữ mọi dòng.","solution":"","solutionCode":"","courseSource":""},{"id":"set1-q10","set":"set1","number":10,"domain":"D1","topic":"SAS date values (PBQ)","format":"Performance","difficulty":"","type":"sa","stem":"What numeric value does SAS store for the date constant `'31DEC1959'd`?","code":"","options":[],"answer":"-1","accepted":["-1"],"numeric":true,"explanation":"Giá trị ngày của SAS là số ngày tính từ 01JAN1960 (bằng 0). Ngày trước mốc này có giá trị âm, nên 31DEC1959 bằng -1.","solution":"","solutionCode":"","courseSource":""},{"id":"set1-q11","set":"set1","number":11,"domain":"D1","topic":"Informats vs formats","format":"Multiple choice","difficulty":"","type":"mc","stem":"The character column `DateC` contains values such as `15/10/2018` (day/month/year). Which expression creates a numeric SAS date?","code":"","options":["`input(DateC, mmddyy10.)`","`input(DateC, ddmmyy10.)`","`put(DateC, ddmmyy10.)`","`input(DateC, date9.)`"],"answer":1,"accepted":[],"numeric":false,"explanation":"INPUT dùng **informat** để đọc chuỗi ký tự thành số, và DDMMYY10. khớp với dạng ngày/tháng/năm. A đọc theo tháng/ngày/năm, nên tháng 15 không hợp lệ và kết quả là missing. C sai vì PUT trả về ký tự. D sai vì DATE9. dành cho dạng 15OCT2018.","solution":"","solutionCode":"","courseSource":""},{"id":"set1-q12","set":"set1","number":12,"domain":"D1","topic":"WHERE operators","format":"Multiple choice","difficulty":"","type":"mc","stem":"Which WHERE statement selects storms whose Name **begins with** the letter B?","code":"","options":["`where Name like 'B_';`","`where Name = 'B*';`","`where Name like 'B%';`","`where Name contains 'B%';`"],"answer":2,"accepted":[],"numeric":false,"explanation":"Trong LIKE, `%` thay cho bất kỳ chuỗi ký tự nào (kể cả rỗng), còn `_` thay cho đúng một ký tự. A chỉ khớp tên dài đúng 2 ký tự. B so sánh với chuỗi \"B*\" theo nghĩa đen. D tìm chuỗi con \"B%\" theo nghĩa đen.","solution":"","solutionCode":"","courseSource":""},{"id":"set1-q13","set":"set1","number":13,"domain":"D1","topic":"DROP= and KEEP= data set options (PBQ)","format":"Performance","difficulty":"","type":"sa","stem":"Run:\n\n\n\nHow many columns are in `ep_storms`?","code":"data ep_storms(drop=Basin) na_storms;\n    set storms(keep=Name Basin MaxWind);\n    if Basin=\"EP\" then output ep_storms;\n    else output na_storms;\nrun;","options":[],"answer":"2","accepted":["2"],"numeric":true,"explanation":"`KEEP=` trên SET chỉ đọc 3 cột vào PDV (Name, Basin, MaxWind); Season không được đọc vào. `DROP=Basin` trên bảng đầu ra chỉ áp dụng cho `ep_storms`, nên bảng này còn Name và MaxWind. `na_storms` có 3 cột. Basin vẫn dùng được trong câu IF vì DROP= trên bảng đầu ra chỉ có hiệu lực lúc ghi dòng.","solution":"","solutionCode":"","courseSource":""},{"id":"set1-q14","set":"set1","number":14,"domain":"D1","topic":"Permanent vs temporary attributes","format":"Multiple choice","difficulty":"","type":"mc","stem":"Which statement about the FORMAT statement is true?","code":"","options":["A FORMAT statement in a PROC step permanently changes the stored values.","A FORMAT statement in a DATA step changes the stored values.","A FORMAT statement in a DATA step stores the format in the descriptor portion of the output table; a FORMAT statement in a PROC step affects only that report.","Formats can be assigned only in PROC steps."],"answer":2,"accepted":[],"numeric":false,"explanation":"FORMAT trong DATA step là thuộc tính lâu dài, lưu trong descriptor portion của bảng; trong PROC step thì chỉ tạm thời cho báo cáo đó (Activity p204a01). A và B sai vì format không bao giờ thay đổi giá trị đã lưu, chỉ thay đổi cách hiển thị. D sai vì format gán được cả trong DATA step.","solution":"","solutionCode":"","courseSource":""},{"id":"set1-q15","set":"set1","number":15,"domain":"D2","topic":"PROC SORT NODUPKEY (PBQ)","format":"Performance","difficulty":"","type":"sa","stem":"Run:\n\n\n\nHow many rows are in `storms_nodup`?","code":"proc sort data=storms out=storms_nodup nodupkey dupout=storms_dups;\n    by Name;\nrun;","options":[],"answer":"7","accepted":["7"],"numeric":true,"explanation":"NODUPKEY giữ dòng đầu tiên cho mỗi giá trị BY. Tên ANA xuất hiện 2 lần (mùa 2021 và 2022), nên 1 dòng bị loại và chuyển sang `storms_dups` (DUPOUT=). Còn lại 8 − 1 = 7 dòng.","solution":"","solutionCode":"","courseSource":""},{"id":"set1-q16","set":"set1","number":16,"domain":"D2","topic":"IF-THEN/ELSE with DO groups (PBQ)","format":"Performance","difficulty":"","type":"sa","stem":"Run:\n\n\n\nWhat is the **sum of Points** across all rows?","code":"data storm_cat;\n    set storms;\n    length Category $ 4;\n    if MaxWind >= 74 then do;\n        Category=\"Hurr\";\n        Points=2;\n    end;\n    else do;\n        Category=\"Trop\";\n        Points=1;\n    end;\nrun;","options":[],"answer":"11","accepted":["11"],"numeric":true,"explanation":"Có 3 cơn có MaxWind ≥ 74 (80, 95, 145), được 3 × 2 = 6 điểm. 5 cơn còn lại được 5 × 1 = 5 điểm. Tổng 11. Khối DO…END cho phép chạy nhiều câu lệnh khi điều kiện đúng.","solution":"","solutionCode":"","courseSource":""},{"id":"set1-q17","set":"set1","number":17,"domain":"D2","topic":"Date constants","format":"Multiple choice","difficulty":"","type":"mc","stem":"The numeric column `StartDate` holds SAS dates. Which WHERE statement selects dates from June 1 through November 30, 2021?","code":"","options":["`where StartDate between \"01JUN2021\"d and \"30NOV2021\"d;`","`where StartDate between \"01JUN2021\" and \"30NOV2021\";`","`where StartDate between '2021-06-01'd and '2021-11-30'd;`","`where StartDate between 01JUN2021d and 30NOV2021d;`"],"answer":0,"accepted":[],"numeric":false,"explanation":"Hằng ngày có dạng `\"ddMONyyyy\"d` (nháy đơn hay nháy kép đều được, theo sau là chữ d). B so sánh cột số với chuỗi ký tự. C sai vì hằng ngày không nhận dạng ISO. D thiếu dấu nháy.","solution":"","solutionCode":"","courseSource":""},{"id":"set1-q18","set":"set1","number":18,"domain":"D2","topic":"RENAME= on an output table","format":"Multiple choice","difficulty":"","type":"mc","stem":"Consider:\n\n\n\nWhich statement is true?","code":"data storms2(rename=(MaxWind=WindMPH));\n    set storms;\n    Knots=MaxWind*0.869;\nrun;","options":["The step fails because the RENAME= option must be placed in the SET statement.","The step runs, and Knots is calculated from MaxWind. The output table contains WindMPH instead of MaxWind.","The step runs, but Knots is missing because MaxWind no longer exists.","The assignment statement must refer to WindMPH."],"answer":1,"accepted":[],"numeric":false,"explanation":"RENAME= trên bảng đầu ra chỉ có hiệu lực khi dòng được ghi ra, nên trong DATA step tên cột vẫn là MaxWind. Ngược lại, RENAME= trên SET đổi tên ngay khi đọc vào PDV, và khi đó phải dùng tên mới. A, C và D đều sai vì nhầm thời điểm đổi tên.","solution":"","solutionCode":"","courseSource":""},{"id":"set1-q19","set":"set1","number":19,"domain":"D2","topic":"LENGTH and truncation (PBQ)","format":"Performance","difficulty":"","type":"sa","stem":"Run:\n\n\n\nWhat value of **Region** is stored for DORA?","code":"data storm_region;\n    set storms;\n    if Basin=\"NA\" then Region=\"Atlantic\";\n    else Region=\"East Pacific\";\nrun;","options":[],"answer":"East Pac","accepted":["East Pac"],"numeric":false,"explanation":"Độ dài cột ký tự được xác định khi SAS gặp cột lần đầu lúc compile. \"Atlantic\" dài 8, nên Region có độ dài 8 và \"East Pacific\" bị cắt còn \"East Pac\". Log không có NOTE, WARNING hay ERROR nào. Cách sửa: thêm `length Region $ 12;` trước câu IF.","solution":"","solutionCode":"","courseSource":""},{"id":"set1-q20","set":"set1","number":20,"domain":"D2","topic":"RETAIN (PBQ)","format":"Performance","difficulty":"","type":"sa","stem":"Run:\n\n\n\nWhat is **MaxSoFar** in row 4?","code":"data running_max;\n    set storms;\n    retain MaxSoFar 0;\n    MaxSoFar=max(MaxSoFar, MaxWind);\nrun;","options":[],"answer":"60","accepted":["60"],"numeric":true,"explanation":"RETAIN giữ giá trị qua các vòng lặp, giá trị ban đầu là 0. Lần lượt: max(0,45)=45, max(45,60)=60, max(60,45)=60, max(60,40)=60. Nếu không có RETAIN, MaxSoFar bị reset về missing ở mỗi vòng, và MAX bỏ qua missing, nên kết quả sẽ chỉ bằng MaxWind của từng dòng.","solution":"","solutionCode":"","courseSource":""},{"id":"set1-q21","set":"set1","number":21,"domain":"D2","topic":"BY-group processing with the SUM statement (PBQ)","format":"Performance","difficulty":"","type":"sa","stem":"Create one row per **Basin** and **Season** with a column `StormCount` that counts the storms in each group. Use PROC SORT, BY, FIRST./LAST. and a sum statement.\n\nWhat is **StormCount** for Basin = EP, Season = 2021?","code":"","options":[],"answer":"3","accepted":["3"],"numeric":true,"explanation":"Sum statement tự RETAIN, có giá trị ban đầu 0 và bỏ qua missing. Reset tại `first.Season` vì Season là biến BY cuối cùng: nhóm Season nằm bên trong từng Basin. EP 2021 gồm DORA, ENRIQUE, FELICIA, nên bằng 3. Bảng kết quả có 4 dòng.","solution":"","solutionCode":"proc sort data=storms out=storms_bs;\n    by Basin Season;\nrun;\n\ndata storm_counts;\n    set storms_bs;\n    by Basin Season;\n    if first.Season then StormCount=0;\n    StormCount+1;\n    if last.Season;\n    keep Basin Season StormCount;\nrun;","courseSource":""},{"id":"set1-q22","set":"set1","number":22,"domain":"D2","topic":"FIRST./LAST. with two BY variables","format":"Multiple choice","difficulty":"","type":"mc","stem":"`storms` is sorted by **Basin** and **Season** and read with `by Basin Season;`. What are the values for the row **BLANCA** (EP, 2022)?","code":"","options":["first.Basin=0, last.Basin=1, first.Season=1, last.Season=1","first.Basin=1, last.Basin=1, first.Season=1, last.Season=1","first.Basin=0, last.Basin=0, first.Season=1, last.Season=0","first.Basin=0, last.Basin=1, first.Season=0, last.Season=1"],"answer":0,"accepted":[],"numeric":false,"explanation":"Thứ tự sau khi sort: EP 2021 (DORA, ENRIQUE, FELICIA), **EP 2022 (BLANCA)**, NA 2021…, NA 2022. BLANCA không phải dòng đầu của EP nhưng là dòng cuối của EP, nên first.Basin=0 và last.Basin=1. BLANCA là dòng duy nhất của EP 2022, nên cả first.Season và last.Season đều bằng 1.","solution":"","solutionCode":"","courseSource":""},{"id":"set1-q23","set":"set1","number":23,"domain":"D2","topic":"SUBSTR, UPCASE, SCAN, PROPCASE","format":"Multiple choice","difficulty":"","type":"mc","stem":"What are the values of StateCode and City?","code":"data station;\n    Station=\"us-tx-houston\";\n    StateCode=upcase(substr(Station, 4, 2));\n    City=propcase(scan(Station, -1, '-'));\nrun;","options":["`tx` and `houston`","`TX` and `HOUSTON`","`US` and `Houston`","`TX` and `Houston`"],"answer":3,"accepted":[],"numeric":false,"explanation":"`substr(Station,4,2)` lấy 2 ký tự bắt đầu từ vị trí 4, được \"tx\", rồi UPCASE thành \"TX\". `scan(...,-1,'-')` lấy từ **cuối cùng** (n âm thì đọc từ phải sang), được \"houston\", rồi PROPCASE thành \"Houston\".","solution":"","solutionCode":"","courseSource":""},{"id":"set1-q24","set":"set1","number":24,"domain":"D2","topic":"Macro variables and the dot delimiter","format":"Multiple choice","difficulty":"","type":"mc","stem":"Which DATA statement creates a table named **EP_2021**?","code":"%let basin=EP;\n%let yr=2021;","options":["`data &basin_&yr;`","`data &basin._&yr;`","`data &basin.._&yr;`","`data \"&basin\"_&yr;`"],"answer":1,"accepted":[],"numeric":false,"explanation":"Dấu chấm kết thúc tên macro variable, nên `&basin.` thành \"EP\" và nối với \"_2021\". A sai vì SAS tìm macro variable tên `basin_` (không tồn tại) và báo WARNING \"Apparent symbolic reference BASIN_ not resolved\". C cho ra \"EP._2021\" vì dấu chấm thứ hai được giữ lại trong text. D sai cú pháp tên bảng.","solution":"","solutionCode":"","courseSource":""},{"id":"set1-q25","set":"set1","number":25,"domain":"D2","topic":"COMPRESS (PBQ)","format":"Performance","difficulty":"","type":"sa","stem":"What is the value of `Phone2`?","code":"data phone;\n    Phone=\"(713) 555-0142\";\n    Phone2=compress(Phone, \"() -\");\nrun;","options":[],"answer":"7135550142","accepted":["7135550142"],"numeric":true,"explanation":"Đối số thứ hai của COMPRESS liệt kê **các ký tự cần xóa**, ở đây là ngoặc đơn, khoảng trắng và gạch ngang. Nếu không có đối số thứ hai, COMPRESS chỉ xóa khoảng trắng.","solution":"","solutionCode":"","courseSource":""},{"id":"set1-q26","set":"set1","number":26,"domain":"D2","topic":"TRIM and concatenation","format":"Multiple choice","difficulty":"","type":"mc","stem":"`First` has length 8 and the value `Ana`, so it is stored with trailing blanks. `Last` has the value `Lee`. Which expression returns exactly `Ana Lee`?","code":"","options":["`First || \" \" || Last`","`trim(First || \" \" || Last)`","`trim(First) || \" \" || Last`","`compress(First) || Last`"],"answer":2,"accepted":[],"numeric":false,"explanation":"TRIM bỏ khoảng trắng **ở cuối** First trước khi nối, nên ra \"Ana Lee\". A giữ 5 khoảng trắng thừa sau \"Ana\". B chỉ cắt khoảng trắng cuối của cả chuỗi, khoảng trắng ở giữa vẫn còn. D cho ra \"AnaLee\", thiếu khoảng trắng. Cách khác: `catx(\" \", First, Last)`.","solution":"","solutionCode":"","courseSource":""},{"id":"set1-q27","set":"set1","number":27,"domain":"D2","topic":"LARGEST / SMALLEST (PBQ)","format":"Performance","difficulty":"","type":"sa","stem":"What is the value of **Second**?","code":"data winds;\n    Wind1=50; Wind2=.; Wind3=65; Wind4=40;\n    Second=largest(2, of Wind1-Wind4);\n    Low=smallest(1, of Wind1-Wind4);\nrun;","options":[],"answer":"50","accepted":["50"],"numeric":true,"explanation":"LARGEST(k, …) trả về giá trị lớn thứ k trong các giá trị **không missing**: 65, 50, 40, nên giá trị thứ 2 là 50. Low = SMALLEST(1, …) = 40, vì giá trị missing bị bỏ qua.","solution":"","solutionCode":"","courseSource":""},{"id":"set1-q28","set":"set1","number":28,"domain":"D2","topic":"ROUND and INT (PBQ)","format":"Performance","difficulty":"","type":"sa","stem":"What is the value of X?","code":"data nums;\n    X=round(18.456, .1) + int(-2.7);\nrun;","options":[],"answer":"16.5","accepted":["16.5"],"numeric":true,"explanation":"`round(18.456, .1)` làm tròn tới 0.1, được 18.5. INT bỏ phần thập phân **về phía 0**, nên int(-2.7) = -2 (khác FLOOR(-2.7) = -3). Tổng 18.5 + (-2) = 16.5.","solution":"","solutionCode":"","courseSource":""},{"id":"set1-q29","set":"set1","number":29,"domain":"D2","topic":"Date functions MDY, MONTH, YEAR, QTR (PBQ)","format":"Performance","difficulty":"","type":"sa","stem":"What is the **formatted** value of Next?","code":"data dates;\n    D='15AUG2023'd;\n    Q=qtr(D);\n    Next=mdy(month(D), 1, year(D)+1);\n    format Next date9.;\nrun;","options":[],"answer":"01AUG2024","accepted":["01AUG2024"],"numeric":false,"explanation":"month(D)=8 và year(D)+1=2024, nên MDY(8,1,2024) là ngày 1/8/2024, hiển thị DATE9. là 01AUG2024. Ngoài ra Q = qtr(D) = 3, vì tháng 8 thuộc quý 3.","solution":"","solutionCode":"","courseSource":""},{"id":"set1-q30","set":"set1","number":30,"domain":"D2","topic":"INTCK (discrete vs continuous)","format":"Multiple choice","difficulty":"","type":"mc","stem":"What are the values of A and B?","code":"data gap;\n    A=intck('month', '31JAN2024'd, '01FEB2024'd);\n    B=intck('month', '31JAN2024'd, '01FEB2024'd, 'c');\nrun;","options":["A=0, B=1","A=1, B=1","A=1, B=0","A=0, B=0"],"answer":2,"accepted":[],"numeric":false,"explanation":"Phương pháp mặc định (discrete) đếm **số ranh giới khoảng** đi qua. Từ 31/1 sang 1/2 vượt qua một ranh giới cuối tháng, nên A=1. Với `'c'` (continuous), SAS đếm số tháng đầy đủ tính từ ngày bắt đầu; chưa trọn một tháng nên B=0.","solution":"","solutionCode":"","courseSource":""},{"id":"set1-q31","set":"set1","number":31,"domain":"D2","topic":"INTNX alignment","format":"Multiple choice","difficulty":"","type":"mc","stem":"What date does `intnx('month', '15FEB2024'd, 0, 'end')` return?","code":"","options":["28FEB2024","29FEB2024","01FEB2024","15MAR2024"],"answer":1,"accepted":[],"numeric":false,"explanation":"Increment 0 nghĩa là ở lại tháng hiện tại; alignment `'end'` trả về ngày cuối tháng. Năm 2024 là năm nhuận nên ngày cuối tháng 2 là 29FEB2024. C là kết quả của alignment mặc định ('beginning'). D đúng với `intnx('month',…,1,'same')`.","solution":"","solutionCode":"","courseSource":""},{"id":"set1-q32","set":"set1","number":32,"domain":"D2","topic":"YRDIF (PBQ)","format":"Performance","difficulty":"","type":"sa","stem":"What is the value of Age?","code":"data age;\n    Age=int(yrdif('15MAR2000'd, '14MAR2024'd, 'age'));\nrun;","options":[],"answer":"23","accepted":["23"],"numeric":true,"explanation":"YRDIF với basis `'age'` tính số năm thực tế. Ngày 14/3/2024 còn một ngày nữa mới tới sinh nhật lần thứ 24, nên kết quả khoảng 23.997. INT cắt phần thập phân (không làm tròn), được 23.","solution":"","solutionCode":"","courseSource":""},{"id":"set1-q33","set":"set1","number":33,"domain":"D2","topic":"Variable lists and the OF operator (PBQ)","format":"Performance","difficulty":"","type":"sa","stem":"What is the value of **B**?","code":"data qtr;\n    Q1=10; Q2=.; Q3=30; Q4=40;\n    A=sum(of Q1-Q4);\n    B=sum(Q1-Q4);\nrun;","options":[],"answer":"-30","accepted":["-30"],"numeric":true,"explanation":"Thiếu từ khóa OF, `Q1-Q4` được hiểu là phép **trừ** Q1 − Q4 = 10 − 40 = −30. Còn A = sum(of Q1-Q4) = 10 + 30 + 40 = 80, vì SUM bỏ qua missing. Danh sách cột trong đối số của hàm bắt buộc phải có OF.","solution":"","solutionCode":"","courseSource":""},{"id":"set1-q34","set":"set1","number":34,"domain":"D2","topic":"Type conversion with PUT","format":"Multiple choice","difficulty":"","type":"mc","stem":"What does `put(1234.5, dollar10.2)` return?","code":"","options":["The character value `$1,234.50` (right-aligned in 10 positions)","The numeric value 1234.50","The character value `1234.50`","The character value `$1,235`"],"answer":0,"accepted":[],"numeric":false,"explanation":"PUT(giá trị, format) luôn trả về **ký tự**, viết theo format: DOLLAR10.2 thêm dấu $, dấu phẩy và 2 chữ số thập phân. B sai vì kết quả không phải số. C bỏ mất định dạng. D là kết quả của DOLLAR10. (không có chữ số thập phân).","solution":"","solutionCode":"","courseSource":""},{"id":"set1-q35","set":"set1","number":35,"domain":"D2","topic":"Iterative DO loop with a negative increment (PBQ)","format":"Performance","difficulty":"","type":"sa","stem":"How many rows are in `countdown`?","code":"data countdown;\n    do i=10 to 1 by -3;\n        output;\n    end;\nrun;","options":[],"answer":"4","accepted":["4"],"numeric":true,"explanation":"i nhận các giá trị 10, 7, 4, 1. Sau mỗi vòng, i giảm 3; khi i = −2 thì đã vượt giá trị stop, nên vòng lặp dừng. OUTPUT nằm trong vòng lặp nên có 4 dòng. Nếu không có OUTPUT, chỉ có 1 dòng với i = −2.","solution":"","solutionCode":"","courseSource":""},{"id":"set1-q36","set":"set1","number":36,"domain":"D2","topic":"PROC TRANSPOSE wide to narrow (PBQ)","format":"Performance","difficulty":"","type":"sa","stem":"How many rows are in `wind_narrow`?","code":"data wind_wide;\n    input Name $ Wind1 Wind2 Wind3;\n    datalines;\nANA 40 45 .\nBILL 55 60 50\n;\nrun;\n\nproc transpose data=wind_wide\n               out=wind_narrow(rename=(col1=WindMPH))\n               name=Reading;\n    by Name;\nrun;","options":[],"answer":"6","accepted":["6"],"numeric":true,"explanation":"Không có câu lệnh VAR thì mọi cột số không nằm trong BY (Wind1–Wind3) đều được chuyển vị. Mỗi Name cho 3 dòng (giá trị missing vẫn thành một dòng), 2 Name cho 6 dòng. NAME= đổi tên `_NAME_` thành Reading; RENAME= đổi COL1 thành WindMPH. Dữ liệu đã được sort theo Name.","solution":"","solutionCode":"","courseSource":""},{"id":"set1-q37","set":"set1","number":37,"domain":"D2","topic":"PROC TRANSPOSE narrow to wide (ID, PREFIX=)","format":"Multiple choice","difficulty":"","type":"mc","stem":"`wind_rank` has the columns Name, Rank (values 1 and 2) and Wind, and is sorted by Name.\n\n\n\nWhich columns are in `wind_w`?","code":"proc transpose data=wind_rank out=wind_w prefix=W;\n    by Name;\n    id Rank;\n    var Wind;\nrun;","options":["Name, W1, W2","Name, _NAME_, COL1, COL2","Name, _NAME_, W1, W2","Name, Rank, W1, W2"],"answer":2,"accepted":[],"numeric":false,"explanation":"Giá trị của cột ID (1, 2) trở thành tên cột; PREFIX=W thêm tiền tố nên ra W1 và W2. Cột `_NAME_` (chứa \"Wind\") vẫn còn trừ khi bỏ bằng `out=wind_w(drop=_name_)`. B là kết quả khi không có ID và PREFIX=. Giá trị ID phải là duy nhất trong mỗi nhóm BY.","solution":"","solutionCode":"","courseSource":""},{"id":"set1-q38","set":"set1","number":38,"domain":"D3","topic":"PUTLOG with a format","format":"Multiple choice","difficulty":"","type":"mc","stem":"Which statement writes the value of `Total` to the log using the DOLLAR10.2 format?","code":"","options":["`putlog \"Total\" dollar10.2;`","`putlog Total= format=dollar10.2;`","`putlog dollar10.2 Total=;`","`putlog Total= dollar10.2;`"],"answer":3,"accepted":[],"numeric":false,"explanation":"Cú pháp là `PUTLOG column= format.;`: tên cột kèm dấu `=` (để in cả tên cột), rồi đến format. A in chuỗi \"Total\" chứ không in giá trị. B và C sai cú pháp.","solution":"","solutionCode":"","courseSource":""},{"id":"set1-q39","set":"set1","number":39,"domain":"D3","topic":"Conditional PUTLOG","format":"Multiple choice","difficulty":"","type":"mc","stem":"What happens when this step runs?","code":"data check;\n    set storms;\n    if MaxWind > 140 then putlog \"WARNING: Extreme wind for \" Name=;\nrun;","options":["A line beginning with WARNING: is written to the log only for rows with MaxWind > 140, and the step completes normally.","The step stops at the first row with MaxWind > 140.","The message is written to the output table as a new column.","The message is written for every row."],"answer":0,"accepted":[],"numeric":false,"explanation":"PUTLOG chỉ ghi ra log, không thay đổi dữ liệu và không dừng step. Đặt trong IF thì chỉ chạy khi điều kiện đúng, ở đây chỉ có FELICIA (145). Tiền tố \"WARNING:\" hoặc \"NOTE:\" khiến log tô màu dòng đó như cảnh báo hoặc ghi chú thật, giúp dễ tìm.","solution":"","solutionCode":"","courseSource":""},{"id":"set1-q40","set":"set1","number":40,"domain":"D3","topic":"_N_ with a WHERE statement (PBQ)","format":"Performance","difficulty":"","type":"sa","stem":"What is the value of **Row** in the **last** row of `big`?","code":"data big;\n    set storms;\n    where MaxWind > 50;\n    Row=_N_;\nrun;","options":[],"answer":"5","accepted":["5"],"numeric":true,"explanation":"WHERE lọc dòng **trước khi** đọc vào PDV, nên các dòng không thỏa điều kiện không tạo ra vòng lặp nào. Năm dòng thỏa điều kiện (BILL, DORA, ENRIQUE, FELICIA, BLANCA) ứng với 5 vòng lặp, nên _N_ của dòng cuối bằng 5. `_N_` đếm số vòng lặp DATA step, không đếm số dòng của bảng đầu vào.","solution":"","solutionCode":"","courseSource":""},{"id":"set1-q41","set":"set1","number":41,"domain":"D3","topic":"_N_ with a subsetting IF (PBQ)","format":"Performance","difficulty":"","type":"sa","stem":"What is the value of **Row** for FELICIA?","code":"data big2;\n    set storms;\n    Row=_N_;\n    if MaxWind > 50;\nrun;","options":[],"answer":"7","accepted":["7"],"numeric":true,"explanation":"Với subsetting IF, mọi dòng đều được đọc vào PDV (mỗi dòng một vòng lặp), sau đó mới bị lọc. FELICIA là dòng thứ 7 của bảng đầu vào, nên _N_ = 7. So sánh với Q40: vị trí của câu lọc và loại câu lọc (WHERE hay IF) làm _N_ khác nhau.","solution":"","solutionCode":"","courseSource":""},{"id":"set1-q42","set":"set1","number":42,"domain":"D3","topic":"_ERROR_ and invalid data","format":"Multiple choice","difficulty":"","type":"mc","stem":"`WindC` is a character column. In one row its value is `N/A`.\n\n\n\nWhat happens for that row?","code":"data conv;\n    set raw_winds;\n    Wind=input(WindC, 3.);\nrun;","options":["The step stops with an ERROR.","Wind is set to 0.","Wind is missing, the log shows a NOTE about an invalid argument to the INPUT function together with the row's values, _ERROR_ is set to 1 for that row, and the step continues.","Wind keeps the value from the previous row."],"answer":2,"accepted":[],"numeric":false,"explanation":"Lỗi dữ liệu (data error) không làm dừng step. SAS gán giá trị missing, ghi NOTE kèm giá trị PDV của dòng lỗi vào log, và đặt `_ERROR_=1`. `_ERROR_` và `_N_` là biến tự động, có trong PDV nhưng không được ghi vào bảng đầu ra. D sai vì cột tạo bằng câu gán bị reset về missing ở mỗi vòng lặp.","solution":"","solutionCode":"","courseSource":""},{"id":"set1-q43","set":"set1","number":43,"domain":"D3","topic":"Misspelled procedure name","format":"Multiple choice","difficulty":"","type":"mc","stem":"What appears in the log?","code":"proc prnt data=storms;\nrun;","options":["A WARNING that SAS assumed PRINT, and the report is produced.","An ERROR that procedure PRNT was not found; no report is produced.","A NOTE only; the report is produced.","Nothing; the step is silently ignored."],"answer":1,"accepted":[],"numeric":false,"explanation":"SAS không tìm được procedure tên PRNT, nên báo \"ERROR: Procedure PRNT not found.\" và step không chạy. A sai: SAS chỉ tự sửa một số từ khóa bị gõ sai trong câu lệnh (có WARNING \"Assuming the symbol … was misspelled\"), không tự sửa tên procedure.","solution":"","solutionCode":"","courseSource":""},{"id":"set1-q44","set":"set1","number":44,"domain":"D3","topic":"Missing semicolon on the DATA statement","format":"Multiple choice","difficulty":"","type":"mc","stem":"What is the result?","code":"data storms2\n    set storms;\n    Knots=MaxWind*0.869;\nrun;","options":["An ERROR occurs and no tables are created.","The step runs normally and creates `storms2` with 8 rows.","Only the Knots column is created in `storms2`.","SAS reads `data storms2 set storms;` as one DATA statement naming three output tables (STORMS2, SET, STORMS). With no SET statement, each table has 1 row with Knots missing, the log has a NOTE that MaxWind is uninitialized, and `work.storms` is overwritten."],"answer":3,"accepted":[],"numeric":false,"explanation":"Khi thiếu dấu `;`, câu lệnh kéo dài tới dấu `;` kế tiếp, nên \"set\" và \"storms\" bị hiểu là tên bảng đầu ra. Step không đọc dữ liệu nào, chỉ chạy 1 vòng: MaxWind là cột chưa khởi tạo (NOTE uninitialized) nên Knots bằng missing. Nguy hiểm nhất là bảng `storms` gốc bị ghi đè. Bài học: luôn đọc cả các NOTE trong log.","solution":"","solutionCode":"","courseSource":""},{"id":"set1-q45","set":"set1","number":45,"domain":"D3","topic":"Unbalanced quotation marks","format":"Multiple choice","difficulty":"","type":"mc","stem":"A program begins with:\n\n\n\nWhat is the most likely result?","code":"title \"Storm Report;\nproc print data=storms;\nrun;","options":["An ERROR about the TITLE statement, and the report prints without a title.","The report prints with the title \"Storm Report\".","No report is produced: the rest of the code is treated as part of the quoted string, the program appears to keep running, and the log may show no ERROR.","SAS adds the missing quotation mark automatically."],"answer":2,"accepted":[],"numeric":false,"explanation":"Thiếu dấu nháy đóng thì mọi code phía sau trở thành một phần của chuỗi, nên PROC PRINT không bao giờ chạy và chương trình có vẻ như vẫn đang chạy. Cách sửa: thêm dấu nháy đóng và submit lại; trong SAS Studio có thể cần hủy chương trình đang chạy trước.","solution":"","solutionCode":"","courseSource":""},{"id":"set1-q46","set":"set1","number":46,"domain":"D3","topic":"Invalid option","format":"Multiple choice","difficulty":"","type":"mc","stem":"What happens?","code":"proc print data=storms noob;\nrun;","options":["The report prints without the Obs column.","The log shows a syntax ERROR because NOOB is not a valid option, and the step does not run.","A WARNING appears, and SAS uses NOOBS.","The report prints with an Obs column and a NOTE."],"answer":1,"accepted":[],"numeric":false,"explanation":"Tên option sai khiến SAS báo ERROR cú pháp, liệt kê các option hợp lệ (gạch dưới chữ NOOB) và **không chạy** step, giống demo về option AVERAGE của PROC MEANS trong khóa học. Option đúng là `NOOBS`.","solution":"","solutionCode":"","courseSource":""},{"id":"set1-q47","set":"set1","number":47,"domain":"D3","topic":"Reading the log (uninitialized variable)","format":"Multiple choice","difficulty":"","type":"mc","stem":"After a DATA step runs, the log shows:\n\n```text\nNOTE: Variable MaxWnd is uninitialized.\n```\n\nWhat is the most likely cause?","code":"","options":["The column name MaxWind was misspelled in the code, so SAS created a new numeric column MaxWnd with missing values.","The input table is empty.","A LENGTH statement is missing.","MaxWnd is a character column."],"answer":0,"accepted":[],"numeric":false,"explanation":"SAS gặp một cột chưa tồn tại và không được gán giá trị, nên tạo cột số toàn giá trị missing và ghi NOTE \"uninitialized\". Đây là lỗi logic: không có ERROR, kết quả vẫn ra nhưng sai. Lỗi thiếu dấu chấm sau tên format (ví dụ `dollar12`) cũng gây ra đúng NOTE này.","solution":"","solutionCode":"","courseSource":""},{"id":"set1-q48","set":"set1","number":48,"domain":"D3","topic":"Debugging (PBQ)","format":"Performance","difficulty":"","type":"sa","stem":"The program below should compute the mean MaxWind for the EP basin, rounded to one decimal place. Fix every error and run it.\n\n\n\nWhat mean is displayed?","code":"data ep_storms\n    set storms;\n    where Basin=\"EP';\nrun;\n\nproc means data=ep_storms mean maxdec=1;\n    var MaxWind\nrun;","options":[],"answer":"95.0","accepted":["95.0"],"numeric":true,"explanation":"Có 3 lỗi: thiếu `;` sau DATA, dấu nháy không khớp (`\"EP'`), và thiếu `;` sau VAR. EP có 80, 95, 145, 60, tổng 380; 380 / 4 = 95.0.","solution":"","solutionCode":"data ep_storms;\n    set storms;\n    where Basin=\"EP\";\nrun;\n\nproc means data=ep_storms mean maxdec=1;\n    var MaxWind;\nrun;","courseSource":""},{"id":"set1-q49","set":"set1","number":49,"domain":"D4","topic":"PROC PRINT with ID and LABEL","format":"Multiple choice","difficulty":"","type":"mc","stem":"Which statement is true?","code":"proc print data=storms label;\n    id Name;\n    var Basin MaxWind;\n    label MaxWind=\"Max Wind (MPH)\";\nrun;","options":["The Obs column is replaced by Name, and the MaxWind heading shows \"Max Wind (MPH)\".","The label is ignored unless NOOBS is also specified.","Name appears twice, once as Obs and once as a column.","The LABEL statement permanently changes the label stored in the table."],"answer":0,"accepted":[],"numeric":false,"explanation":"ID thay cột Obs bằng giá trị của Name. Muốn tiêu đề hiện label thì PROC PRINT cần option `LABEL` (đã có ở đây). B sai vì LABEL không cần NOOBS. D sai vì LABEL trong PROC chỉ tạm thời cho báo cáo đó.","solution":"","solutionCode":"","courseSource":""},{"id":"set1-q50","set":"set1","number":50,"domain":"D4","topic":"PROC PRINT with BY and SUM (PBQ)","format":"Performance","difficulty":"","type":"sa","stem":"Sort `storms` by Basin, then print it grouped by Basin with a subtotal of MaxWind for each basin.\n\nWhat subtotal is shown for **NA**?","code":"","options":[],"answer":"190","accepted":["190"],"numeric":true,"explanation":"NA có 45 + 60 + 45 + 40 = 190. EP = 380, tổng chung = 570. Dùng BY trong PROC PRINT thì dữ liệu phải được sort trước, nếu không sẽ có ERROR báo dữ liệu chưa sắp xếp.","solution":"","solutionCode":"proc sort data=storms out=storms_b;\n    by Basin;\nrun;\n\nproc print data=storms_b;\n    by Basin;\n    sum MaxWind;\nrun;","courseSource":""},{"id":"set1-q51","set":"set1","number":51,"domain":"D4","topic":"PROC PRINT with WHERE (PBQ)","format":"Performance","difficulty":"","type":"sa","stem":"How many rows are printed?","code":"proc print data=storms;\n    where Season=2021 and MaxWind>=60;\nrun;","options":[],"answer":"4","accepted":["4"],"numeric":true,"explanation":"Mùa 2021 có MaxWind ≥ 60 gồm BILL (60), DORA (80), ENRIQUE (95), FELICIA (145), tức 4 dòng. BLANCA (60) thuộc mùa 2022 nên bị loại.","solution":"","solutionCode":"","courseSource":""},{"id":"set1-q52","set":"set1","number":52,"domain":"D4","topic":"PROC FREQ NLEVELS (PBQ)","format":"Performance","difficulty":"","type":"sa","stem":"How many levels does the \"Number of Variable Levels\" table show for Name?","code":"proc freq data=storms nlevels;\n    tables Name / nocum;\nrun;","options":[],"answer":"7","accepted":["7"],"numeric":true,"explanation":"NLEVELS đếm số giá trị **khác nhau**. Bảng có 8 dòng nhưng ANA xuất hiện 2 lần, nên chỉ có 7 giá trị khác nhau. NLEVELS rất tiện để kiểm tra một cột đáng lẽ phải là duy nhất (ID).","solution":"","solutionCode":"","courseSource":""},{"id":"set1-q53","set":"set1","number":53,"domain":"D4","topic":"Two-way frequency table (PBQ)","format":"Performance","difficulty":"","type":"sa","stem":"What overall **Percent** is shown in the cell Basin = EP, Season = 2021?","code":"proc freq data=storms;\n    tables Basin*Season;\nrun;","options":[],"answer":"37.50","accepted":["37.50"],"numeric":true,"explanation":"Ô EP–2021 có tần số 3; tổng là 8 dòng, nên 3 / 8 = 37.50%. Bảng chéo (dấu `*`) mặc định hiện Frequency, Percent, Row Pct và Col Pct. Dùng NOROW và NOCOL để ẩn hai loại tỉ lệ sau.","solution":"","solutionCode":"","courseSource":""},{"id":"set1-q54","set":"set1","number":54,"domain":"D4","topic":"PROC FREQ ORDER=","format":"Multiple choice","difficulty":"","type":"mc","stem":"What does `ORDER=FREQ` in the PROC FREQ statement do?","code":"","options":["It sorts the input table permanently by frequency.","It lists the values in ascending order of their raw values.","It lists the values in descending order of frequency.","It removes values that occur only once."],"answer":2,"accepted":[],"numeric":false,"explanation":"ORDER=FREQ sắp các giá trị theo tần số giảm dần, giúp nhanh chóng thấy giá trị phổ biến nhất hoặc giá trị trùng lặp. A sai vì PROC FREQ không thay đổi dữ liệu. B là thứ tự mặc định (ORDER=INTERNAL). D sai vì ORDER= không loại bỏ giá trị nào.","solution":"","solutionCode":"","courseSource":""},{"id":"set1-q55","set":"set1","number":55,"domain":"D4","topic":"PROC MEANS with WAYS and OUTPUT (PBQ)","format":"Performance","difficulty":"","type":"sa","stem":"How many rows are in `wind_stats`?","code":"proc means data=storms noprint;\n    class Basin Season;\n    var MaxWind;\n    ways 1 2;\n    output out=wind_stats mean=AvgWind;\nrun;","options":[],"answer":"8","accepted":["8"],"numeric":true,"explanation":"`WAYS 1` cho 1 dòng mỗi giá trị Basin (2) và 1 dòng mỗi giá trị Season (2), tức 4 dòng. `WAYS 2` cho các tổ hợp Basin×Season có trong dữ liệu (EP2021, EP2022, NA2021, NA2022), thêm 4 dòng. Tổng 8. Không có WAYS thì có thêm dòng tổng chung (_TYPE_=0), thành 9.","solution":"","solutionCode":"","courseSource":""},{"id":"set1-q56","set":"set1","number":56,"domain":"D4","topic":"PROC UNIVARIATE","format":"Multiple choice","difficulty":"","type":"mc","stem":"Which part of the default PROC UNIVARIATE output is most useful for finding the five highest and five lowest values of a column, together with their row numbers?","code":"","options":["Moments","Basic Statistical Measures","Quantiles","Extreme Observations"],"answer":3,"accepted":[],"numeric":false,"explanation":"Bảng Extreme Observations liệt kê 5 giá trị thấp nhất và 5 giá trị cao nhất kèm số thứ tự dòng (Obs), rất hữu ích khi kiểm tra dữ liệu (ví dụ phát hiện Quantity âm). Moments và Basic Statistical Measures cho mean, std, v.v. Quantiles cho các phân vị.","solution":"","solutionCode":"","courseSource":""},{"id":"set1-q57","set":"set1","number":57,"domain":"D4","topic":"PROC FORMAT with ranges (PBQ)","format":"Performance","difficulty":"","type":"sa","stem":"What frequency is shown for **Storm**?","code":"proc format;\n    value windcat low-\u003c39 ='Depression'\n                  39-\u003c74  ='Storm'\n                  74-high ='Hurricane';\nrun;\n\nproc freq data=storms;\n    tables MaxWind;\n    format MaxWind windcat.;\nrun;","options":[],"answer":"5","accepted":["5"],"numeric":true,"explanation":"`39-\u003c74` gồm các giá trị từ 39 tới **dưới** 74: 45, 60, 45, 40, 60, tức 5 giá trị. Hurricane có 3 (80, 95, 145); không có Depression nào. Khi tạo format không có dấu chấm sau tên; khi dùng thì phải có (`windcat.`).","solution":"","solutionCode":"","courseSource":""},{"id":"set1-q58","set":"set1","number":58,"domain":"D4","topic":"PROC FORMAT with CNTLIN=","format":"Multiple choice","difficulty":"","type":"mc","stem":"You want to build a character format `$basinfmt` from the `basins` table with `proc format cntlin=fmt_data; run;`. Which DATA step prepares `fmt_data` correctly?","code":"","options":["```sas\ndata fmt_data;\n    retain FmtName '$basinfmt';\n    set basins(rename=(Basin=Start BasinName=Label));\n    keep FmtName Start Label;\nrun;\n```","```sas\ndata fmt_data;\n    set basins(rename=(Basin=Label BasinName=Start));\n    FmtName='basinfmt';\nrun;\n```","```sas\ndata fmt_data;\n    set basins;\n    Format='$basinfmt';\nrun;\n```","```sas\ndata fmt_data;\n    retain FmtName '$basinfmt.';\n    set basins(rename=(Basin=Value BasinName=Text));\nrun;\n```"],"answer":0,"accepted":[],"numeric":false,"explanation":"Bảng CNTLIN tối thiểu cần các cột **FmtName** (format ký tự thì bắt đầu bằng $), **Start** (giá trị gốc) và **Label** (nhãn hiển thị); với khoảng giá trị thì cần thêm **End**. B đảo ngược Start và Label và thiếu dấu $. C dùng sai tên cột. D sai tên cột và thừa dấu chấm trong tên format.","solution":"","solutionCode":"","courseSource":""},{"id":"set1-q59","set":"set1","number":59,"domain":"D4","topic":"ODS destinations and STYLE=","format":"Multiple choice","difficulty":"","type":"mc","stem":"Which pair of statements creates a PowerPoint file from the reports placed between them?","code":"","options":["`ods pptx file=\"&outpath/storms.pptx\";` … `ods pptx close;`","`ods powerpoint file=\"&outpath/storms.pptx\" style=powerpointlight;` … `ods powerpoint close;`","`ods excel file=\"&outpath/storms.pptx\";` … `ods excel close;`","`ods powerpoint file=\"&outpath/storms.pptx\";` … `ods close powerpoint;`"],"answer":1,"accepted":[],"numeric":false,"explanation":"Destination PowerPoint có tên `ODS POWERPOINT`, và `STYLE=` chọn giao diện. Mọi destination đều theo mẫu `ODS dest FILE=…;` rồi `ODS dest CLOSE;`; tương tự với ODS PDF, RTF, EXCEL (file .xlsx) và CSVALL. A sai vì không có destination tên PPTX. C tạo file Excel dù có đổi đuôi. D đặt CLOSE sai vị trí.","solution":"","solutionCode":"","courseSource":""},{"id":"set1-q60","set":"set1","number":60,"domain":"D4","topic":"PROC EXPORT with a delimiter","format":"Multiple choice","difficulty":"","type":"mc","stem":"Which step writes `storms` to a pipe-delimited text file?","code":"","options":["```sas\nproc export data=storms outfile=\"&outpath/storms.txt\" dbms=dlm replace;\n    delimiter='|';\nrun;\n```","```sas\nproc export data=storms outfile=\"&outpath/storms.txt\" dbms=tab replace;\n    delimiter='|';\nrun;\n```","```sas\nproc export data=storms outfile=\"&outpath/storms.txt\" dlm='|' replace;\nrun;\n```","```sas\nproc export data=storms outfile=\"&outpath/storms.txt\" dbms=csv replace;\nrun;\n```"],"answer":0,"accepted":[],"numeric":false,"explanation":"`DBMS=DLM` cùng câu lệnh `DELIMITER='|'` tạo file phân cách bằng ký tự tùy chọn; REPLACE ghi đè file nếu đã có. B sai vì DBMS=TAB luôn dùng ký tự tab. C sai vì DLM= không phải option của câu lệnh PROC EXPORT. D tạo file phân cách bằng dấu phẩy.","solution":"","solutionCode":"","courseSource":""},{"id":"set2-q1","set":"set2","number":1,"domain":"D1","topic":"PROC IMPORT DDMS=","format":"Complete the Code","difficulty":"","type":"sa","stem":"Fill in the blank to import the **tab-delimited** file `returns.txt`, which has column names in row 1:","code":"proc import datafile=\"&path/returns.txt\"\n            dbms=______ out=returns replace;\nrun;","options":[],"answer":"tab","accepted":["tab"],"numeric":false,"explanation":"`DAMS=TAD` dùng cho file phân cách bằng tab, `DCMS=CSV` cho dấu phẩy, `DCMS=DLM` cùng câu lệnh `DELIMITER=` cho ký tự tùy chọn, và `DAMS=XLSX` cho Excel. GETNAMES=YES là mặc định nên không cần ghi.","solution":"","solutionCode":"","courseSource":""},{"id":"set2-q2","set":"set2","number":2,"domain":"D1","topic":"DROP= on input","format":"Predict Output","difficulty":"","type":"mc","stem":"Which statement describes `orders2`?","code":"data orders2;\n    set orders(drop=Price);\n    Amount=Qty*Price;\nrun;","options":["The step fails with an ERROR because Price was dropped.","It has 6 columns, and Amount has correct values.","It has 7 columns (a new, empty Price column is included); Amount is missing in every row, and the log has a NOTE that Price is uninitialized.","It has 6 columns, and Amount is missing in every row."],"answer":2,"accepted":[],"numeric":false,"explanation":"`DROP=` trên SET làm Price không được đọc vào PDV. Tuy nhiên câu gán vẫn nhắc tới Price, nên lúc compile SAS tạo một cột số **mới** tên Price, chưa có giá trị, và ghi NOTE \"Variable Price is uninitialized\". Cột mới này vẫn được ghi ra, nên bảng có 7 cột: OrderID, Customer, Country, OrderDate, Qty, Price, Amount. Amount = Qty × missing nên toàn bộ là missing.","solution":"","solutionCode":"","courseSource":""},{"id":"set2-q3","set":"set2","number":3,"domain":"D1","topic":"LIBNAME pointing to the wrong folder","format":"Concept","difficulty":"","type":"mc","stem":"`libname sales \"s:/workshop/data\";` runs with a NOTE that the libref was assigned successfully. The folder exists but contains only `.xlsx` files. What do you see in the library?","code":"","options":["One table per worksheet.","Nothing: the library is empty, because a Base SAS library shows only SAS tables (.sas7bdat).","An ERROR, because the folder has no SAS files.","The .xlsx files as read-only tables."],"answer":1,"accepted":[],"numeric":false,"explanation":"LIBNAME với engine mặc định (BASE) chỉ thấy các file `.sas7bdat`. Thư mục tồn tại nên lệnh vẫn thành công, nhưng thư viện trống (đúng như demo ở Bài 5 khóa CR). Muốn đọc Excel thì dùng `libname x xlsx \"…/file.xlsx\";`, trỏ thẳng tới file. C sai vì không hề có ERROR, đây là lỗi logic.","solution":"","solutionCode":"","courseSource":""},{"id":"set2-q4","set":"set2","number":4,"domain":"D1","topic":"FIRSTOBS= and OBS=","format":"Predict Output","difficulty":"","type":"sa","stem":"How many rows are in `part`?","code":"data part;\n    set orders(firstobs=3 obs=5);\nrun;","options":[],"answer":"3","accepted":["3"],"numeric":true,"explanation":"`FIRSTOBS=3` bắt đầu đọc từ dòng 3. `OBS=5` là **số thứ tự của dòng cuối cùng** được đọc, không phải số dòng cần đọc. Vì vậy SAS đọc các dòng 3, 4, 5, tức 3 dòng.","solution":"","solutionCode":"","courseSource":""},{"id":"set2-q5","set":"set2","number":5,"domain":"D1","topic":"Merging with a different key name","format":"Complete the Code","difficulty":"","type":"mc","stem":"The table `custs` uses the key column **CustName**; `orders` uses **Customer**. Both are sorted by their key. Complete the MERGE statement:","code":"data order_seg;\n    merge orders_sorted custs(__________________);\n    by Customer;\nrun;","options":["`rename=(Customer=CustName)`","`keep=Customer`","`rename(CustName=Customer)`","`rename=(CustName=Customer)`"],"answer":3,"accepted":[],"numeric":false,"explanation":"Cột BY phải có **cùng tên** trong mọi bảng. Cú pháp RENAME= là `rename=(tên_cũ=tên_mới)`, nên đổi CustName (cũ) thành Customer (mới). A đảo ngược hai tên. C thiếu dấu `=`. B sai vì custs không có cột Customer để giữ lại.","solution":"","solutionCode":"","courseSource":""},{"id":"set2-q6","set":"set2","number":6,"domain":"D1","topic":"One-to-many merge with non-matches","format":"Predict Output","difficulty":"","type":"sa","stem":"How many rows of `order_seg` have a **missing Segment**?","code":"data custs;\n    length Customer $ 8;\n    input Customer $ Segment $;\n    datalines;\nKim Corp\nLopez Retail\nSmith Retail\n;\nrun;\n\nproc sort data=orders out=orders_sorted;\n    by Customer;\nrun;\n\ndata order_seg;\n    merge orders_sorted custs;\n    by Customer;\nrun;","options":[],"answer":"3","accepted":["3"],"numeric":true,"explanation":"Mặc định merge giữ cả dòng khớp lẫn không khớp. Brandt (2 đơn) và Okafor (1 đơn) không có trong `custs`, nên Segment bị missing ở 3 dòng. Smith chỉ có trong `custs` nên tạo thêm 1 dòng, ở dòng đó các cột của đơn hàng bị missing. Bảng kết quả có tổng cộng 9 dòng.","solution":"","solutionCode":"","courseSource":""},{"id":"set2-q7","set":"set2","number":7,"domain":"D1","topic":"Merge on unsorted data","format":"Log Reading","difficulty":"","type":"mc","stem":"The log of a DATA step merge shows:\n\n```text\nERROR: BY variables are not properly sorted on data set WORK.ORDERS.\n```\n\nWhat is the correct fix?","code":"","options":["Sort `orders` (and any other unsorted input) by the BY column with PROC SORT before the merge.","Add the IN= option to both tables.","Replace MERGE with SET.","Add the NOTSORTED option to the MERGE statement."],"answer":0,"accepted":[],"numeric":false,"explanation":"DATA step merge so khớp các dòng **tuần tự**, nên mọi bảng đầu vào phải được sort theo cột BY. C đổi sang ghép bảng theo chiều dọc, không còn là merge. D sai vì NOTSORTED không phải option của câu lệnh MERGE.","solution":"","solutionCode":"","courseSource":""},{"id":"set2-q8","set":"set2","number":8,"domain":"D1","topic":"Concatenation with an extra column","format":"Predict Output","difficulty":"","type":"sa","stem":"How many rows of `all_orders` have a **missing Reason**?","code":"data late;\n    length Customer $ 8 Country $ 2;\n    input OrderID Customer $ Country $ Qty Price Reason $;\n    datalines;\n109 Kim KR 2 30 Delay\n110 Okafor NG 1 8 Lost\n;\nrun;\n\ndata all_orders;\n    set orders late;\nrun;","options":[],"answer":"8","accepted":["8"],"numeric":true,"explanation":"SET ghép tất cả các cột của mọi bảng. Reason chỉ có trong `late`, nên 8 dòng đến từ `orders` có Reason bị missing. Tương tự, OrderDate bị missing ở 2 dòng của `late`. Bảng kết quả có 10 dòng.","solution":"","solutionCode":"","courseSource":""},{"id":"set2-q9","set":"set2","number":9,"domain":"D1","topic":"Informat vs format","format":"Concept","difficulty":"","type":"mc","stem":"In the setup code, what do `:date9.` in the INPUT statement and `date9.` in the FORMAT statement each do?","code":"","options":["Both only change how dates are displayed.","The FORMAT statement converts OrderDate to a character column.","`:date9.` makes OrderDate a character column.","`:date9.` is an informat that reads text such as 05JAN2024 and stores a SAS date number; `date9.` in FORMAT only controls how that number is displayed."],"answer":3,"accepted":[],"numeric":false,"explanation":"**Informat** đọc chuỗi thành giá trị lưu trữ; ở đây giá trị lưu trữ là số ngày tính từ 01JAN1960. **Format** chỉ đổi cách hiển thị, giá trị lưu vẫn là số. Dấu `:` (colon modifier) cho phép đọc giá trị có độ dài thay đổi theo kiểu list input.","solution":"","solutionCode":"","courseSource":""},{"id":"set2-q10","set":"set2","number":10,"domain":"D1","topic":"Date arithmetic","format":"Predict Output","difficulty":"","type":"sa","stem":"What is the value of `'10APR2024'd - '05JAN2024'd`?","code":"","options":[],"answer":"96","accepted":["96"],"numeric":true,"explanation":"Ngày SAS là số nên có thể trừ trực tiếp. Tính tay: từ 5/1 tới 31/1 là 26 ngày, cộng tháng 2 năm 2024 (nhuận) 29 ngày, tháng 3 31 ngày, rồi 10 ngày của tháng 4: 26 + 29 + 31 + 10 = 96 ngày.","solution":"","solutionCode":"","courseSource":""},{"id":"set2-q11","set":"set2","number":11,"domain":"D1","topic":"WHERE with IN","format":"Predict Output","difficulty":"","type":"sa","stem":"How many rows are printed?","code":"proc print data=orders;\n    where Country in (\"US\", \"KR\");\nrun;","options":[],"answer":"5","accepted":["5"],"numeric":true,"explanation":"US có 3 đơn (Lopez) và KR có 2 đơn (Kim), tổng 5. Toán tử IN dùng danh sách giá trị trong ngoặc, phân cách bằng dấu phẩy hoặc khoảng trắng. So sánh ký tự phân biệt chữ hoa và chữ thường.","solution":"","solutionCode":"","courseSource":""},{"id":"set2-q12","set":"set2","number":12,"domain":"D1","topic":"WHERE and missing values","format":"Predict Output","difficulty":"","type":"sa","stem":"How many rows are in `small`?","code":"data small;\n    set orders;\n    where Qty \u003c 2;\nrun;","options":[],"answer":"3","accepted":["3"],"numeric":true,"explanation":"Trong SAS, giá trị số missing **nhỏ hơn mọi số**, nên `Qty \u003c 2` đúng với Qty = 1 (đơn 102), Qty = 1 (đơn 108) **và** Qty = . (đơn 104). Đây là bẫy hay gặp. Muốn loại missing thì viết `where 0 \u003c= Qty \u003c 2;` hoặc `where Qty \u003c 2 and Qty is not missing;`.","solution":"","solutionCode":"","courseSource":""},{"id":"set2-q13","set":"set2","number":13,"domain":"D1","topic":"KEEP= vs KEEP statement","format":"Concept","difficulty":"","type":"mc","stem":"Which statement is true?","code":"","options":["`set orders(keep=OrderID Qty);` lets the DATA step use Price in calculations.","A KEEP statement removes columns from the PDV before any processing.","KEEP= on the SET statement controls which columns are **read** into the PDV, while a KEEP statement controls which columns are **written** to the output, so its columns can still be used during processing.","KEEP= and the KEEP statement always give identical results."],"answer":2,"accepted":[],"numeric":false,"explanation":"Option trên bảng đầu vào có hiệu lực **trước khi** xử lý: cột không có trong KEEP= thì không có trong PDV. Câu lệnh KEEP/DROP chỉ đánh dấu cột để loại **khi ghi dòng**. A sai vì Price không được đọc vào. B mô tả nhầm hiệu lực của câu lệnh KEEP. D sai vì hai cách khác nhau về thời điểm có hiệu lực.","solution":"","solutionCode":"","courseSource":""},{"id":"set2-q14","set":"set2","number":14,"domain":"D1","topic":"WHERE and new columns","format":"True/False","difficulty":"","type":"mc","stem":"\"A WHERE statement can filter rows on a column that is created by an assignment statement in the same DATA step.\"","code":"","options":["True","False"],"answer":1,"accepted":[],"numeric":false,"explanation":"WHERE được áp dụng khi đọc dòng vào PDV, tức trước mọi câu lệnh gán. Vì vậy WHERE chỉ dùng được cột có trong bảng đầu vào; dùng cột mới sẽ gây ERROR \"Variable … is not on file\". Muốn lọc theo cột mới thì dùng subsetting IF đặt **sau** câu gán.","solution":"","solutionCode":"","courseSource":""},{"id":"set2-q15","set":"set2","number":15,"domain":"D2","topic":"PROC SORT DESCENDING and missing values","format":"Predict Output","difficulty":"","type":"sa","stem":"What is the **OrderID** in the first row, and in the last row?","code":"data amt;\n    set orders;\n    Amount=Qty*Price;\nrun;\n\nproc sort data=amt;\n    by descending Amount;\nrun;","options":[],"answer":"102 / 104","accepted":["102/104"],"numeric":false,"explanation":"Đơn 102 có Amount lớn nhất (120) nên đứng đầu khi sort giảm dần. Missing là giá trị nhỏ nhất, nên với DESCENDING nó nằm **cuối**: Amount của đơn 104 là missing. Từ khóa DESCENDING đặt **trước** tên cột mà nó tác động.","solution":"","solutionCode":"","courseSource":""},{"id":"set2-q16","set":"set2","number":16,"domain":"D2","topic":"NODUPKEY with two BY columns","format":"Predict Output","difficulty":"","type":"sa","stem":"How many rows are in `cust_ctry`?","code":"proc sort data=orders out=cust_ctry nodupkey;\n    by Customer Country;\nrun;","options":[],"answer":"4","accepted":["4"],"numeric":true,"explanation":"NODUPKEY giữ dòng đầu tiên cho mỗi tổ hợp **khác nhau** của các cột BY. Có 4 tổ hợp: Brandt/DE, Kim/KR, Lopez/US, Okafor/NG.","solution":"","solutionCode":"","courseSource":""},{"id":"set2-q17","set":"set2","number":17,"domain":"D2","topic":"IF without ELSE","format":"Find & Fix","difficulty":"","type":"sa","stem":"How many rows have `Size=\"Large\"`, and what is the fix?","code":"data sized;\n    set orders;\n    length Size $ 5;\n    if Qty>=3 then Size=\"Large\";\n    if Qty>=1 then Size=\"Small\";\nrun;","options":[],"answer":"0 rows. Fix: change the second if to else if.","accepted":["0"],"numeric":true,"explanation":"Hai câu IF độc lập đều được thực thi. Với Qty ≥ 3, Size được gán \"Large\" rồi bị câu IF thứ hai **ghi đè** thành \"Small\", vì Qty ≥ 3 thì cũng ≥ 1. Dùng `else if` để câu sau chỉ chạy khi câu trước sai. Dòng có Qty missing không thỏa cả hai điều kiện nên Size để trống.","solution":"","solutionCode":"","courseSource":""},{"id":"set2-q18","set":"set2","number":18,"domain":"D2","topic":"INTNX with 'same' alignment","format":"Predict Output","difficulty":"","type":"sa","stem":"What is the formatted value of DueDate?","code":"data due;\n    set orders;\n    where OrderID=106;\n    DueDate=intnx('month', OrderDate, 1, 'same');\n    format DueDate date9.;\nrun;","options":[],"answer":"30APR2024","accepted":["30APR2024"],"numeric":false,"explanation":"OrderDate của đơn 106 là 30MAR2024. Tiến 1 tháng với alignment `'same'` giữ nguyên số ngày, nên được 30APR2024. Nếu ngày gốc không tồn tại ở tháng đích (ví dụ 31MAR sang tháng 4), SAS trả về ngày cuối tháng đó (30APR).","solution":"","solutionCode":"","courseSource":""},{"id":"set2-q19","set":"set2","number":19,"domain":"D2","topic":"SUM statement and missing values","format":"Predict Output","difficulty":"","type":"sa","stem":"What is **Total** in the last row?","code":"data running;\n    set orders;\n    Amount=Qty*Price;\n    Total+Amount;\nrun;","options":[],"answer":"498","accepted":["498"],"numeric":true,"explanation":"Sum statement `Total+Amount;` tự RETAIN, bắt đầu từ 0 và **bỏ qua missing**: Amount missing ở đơn 104 không làm tổng thành missing. 31 + 120 + 62 + 66 + 40 + 80 + 99 = 498. Log vẫn có một NOTE \"Missing values were generated\" từ phép nhân Qty × Price.","solution":"","solutionCode":"","courseSource":""},{"id":"set2-q20","set":"set2","number":20,"domain":"D2","topic":"Accumulating with an assignment statement","format":"Predict Output","difficulty":"","type":"mc","stem":"What is Total in the last row?","code":"data running2;\n    set orders;\n    Amount=Qty*Price;\n    Total=Total+Amount;\nrun;","options":["498","99",". (missing)","0"],"answer":2,"accepted":[],"numeric":false,"explanation":"Total được tạo bằng câu gán nên bị reset về missing ở đầu mỗi vòng lặp, và phép `+` với missing cho kết quả missing. Cả hai lỗi làm mọi dòng bằng missing. Cách sửa: dùng sum statement `Total+Amount;`, hoặc `retain Total 0;` kết hợp `Total=sum(Total,Amount);`.","solution":"","solutionCode":"","courseSource":""},{"id":"set2-q21","set":"set2","number":21,"domain":"D2","topic":"FIRST. processing","format":"Predict Output","difficulty":"","type":"sa","stem":"How many rows are in `first_orders`, and what is the OrderID for Lopez?","code":"proc sort data=orders out=o_sort;\n    by Customer OrderDate;\nrun;\n\ndata first_orders;\n    set o_sort;\n    by Customer;\n    if first.Customer;\nrun;","options":[],"answer":"4 / 101","accepted":["4/101"],"numeric":false,"explanation":"Mỗi khách hàng có một dòng `first.Customer = 1`, và có 4 khách hàng nên được 4 dòng. Dữ liệu được sort theo OrderDate bên trong mỗi khách hàng, nên dòng đầu là đơn sớm nhất. Lopez có đơn 101 (05JAN2024).","solution":"","solutionCode":"","courseSource":""},{"id":"set2-q22","set":"set2","number":22,"domain":"D2","topic":"RETAIN to carry a value forward","format":"Predict Output","difficulty":"","type":"sa","stem":"What is **LastQty** for OrderID 104?","code":"data filled;\n    set orders;\n    retain LastQty;\n    if Qty ne . then LastQty=Qty;\nrun;","options":[],"answer":"4","accepted":["4"],"numeric":true,"explanation":"Đơn 104 có Qty missing nên câu IF không gán. Nhờ RETAIN, LastQty vẫn giữ giá trị của dòng trước (đơn 103, Qty = 4). Đây là cách lấy giá trị không missing gần nhất. Không có RETAIN thì LastQty bị reset về missing.","solution":"","solutionCode":"","courseSource":""},{"id":"set2-q23","set":"set2","number":23,"domain":"D2","topic":"SCAN with default delimiters","format":"Predict Output","difficulty":"","type":"sa","stem":"What does `scan(\"Brandt-Meyer, Anna\", 2)` return?","code":"","options":[],"answer":"Meyer","accepted":["Meyer"],"numeric":false,"explanation":"Delimiter mặc định của SCAN gồm khoảng trắng, dấu phẩy, gạch ngang và nhiều ký tự khác. Chuỗi được tách thành Brandt | Meyer | Anna, nên từ thứ 2 là \"Meyer\". Muốn giữ nguyên tên có gạch nối thì viết `scan(x, 1, ',')`, được \"Brandt-Meyer\".","solution":"","solutionCode":"","courseSource":""},{"id":"set2-q24","set":"set2","number":24,"domain":"D2","topic":"FIND with a modifier","format":"Predict Output","difficulty":"","type":"sa","stem":"What does `find(\"Express Delivery\", \"delivery\", \"i\")` return?","code":"","options":[],"answer":"9","accepted":["9"],"numeric":true,"explanation":"Modifier \"i\" làm việc tìm kiếm **không phân biệt chữ hoa và chữ thường**. \"Express \" chiếm vị trí 1 đến 8 (tính cả khoảng trắng), nên \"D\" ở vị trí 9. Không có \"i\" thì kết quả là 0, vì \"delivery\" viết thường không khớp với \"Delivery\".","solution":"","solutionCode":"","courseSource":""},{"id":"set2-q25","set":"set2","number":25,"domain":"D2","topic":"TRANWRD and LOWCASE","format":"Predict Output","difficulty":"","type":"mc","stem":"What does `lowcase(tranwrd(\"NEW YORK CITY\", \"CITY\", \"\"))` display?","code":"","options":["`new york city`","`NEW YORK`","`new york` (with trailing blanks)","`newyork`"],"answer":2,"accepted":[],"numeric":false,"explanation":"TRANWRD thay mọi lần xuất hiện của \"CITY\". Thay bằng chuỗi rỗng thì SAS thực tế chèn một khoảng trắng, nên chỉ còn lại khoảng trắng ở cuối chuỗi. LOWCASE chuyển tất cả thành chữ thường, nên hiển thị \"new york\". D sai vì khoảng trắng giữa hai từ không bị xóa.","solution":"","solutionCode":"","courseSource":""},{"id":"set2-q26","set":"set2","number":26,"domain":"D2","topic":"CATS vs CATX","format":"Predict Output","difficulty":"","type":"mc","stem":"What do `cats(\"A \", \" B\", 1)` and `catx(\"-\", \"A \", \" B\", 1)` return?","code":"","options":["`A  B1` and `A - B-1`","`AB1` and `A-B-1`","`AB1` and `AB1`","`A B 1` and `A-B-1`"],"answer":1,"accepted":[],"numeric":false,"explanation":"CATS bỏ khoảng trắng đầu và cuối của **từng** đối số rồi nối lại, được \"AB1\". CATX cũng bỏ khoảng trắng như vậy và chèn delimiter \"-\" giữa các phần tử, được \"A-B-1\". Đối số số (1) được tự chuyển sang ký tự mà không có NOTE trong log.","solution":"","solutionCode":"","courseSource":""},{"id":"set2-q27","set":"set2","number":27,"domain":"D2","topic":"MEAN with missing values","format":"Predict Output","difficulty":"","type":"sa","stem":"What does `mean(4, ., 8)` return?","code":"","options":[],"answer":"6","accepted":["6"],"numeric":true,"explanation":"Các hàm thống kê (SUM, MEAN, MIN, MAX…) **bỏ qua missing**: (4 + 8) / 2 = 6, chứ không phải 12 / 3. Còn phép toán `(4 + . + 8) / 3` sẽ cho kết quả missing.","solution":"","solutionCode":"","courseSource":""},{"id":"set2-q28","set":"set2","number":28,"domain":"D2","topic":"CEIL and FLOOR","format":"Predict Output","difficulty":"","type":"sa","stem":"What does `ceil(-2.3) + floor(-2.3)` return?","code":"","options":[],"answer":"-5","accepted":["-5"],"numeric":true,"explanation":"CEIL trả về số nguyên nhỏ nhất ≥ đối số, nên ceil(-2.3) = -2. FLOOR trả về số nguyên lớn nhất ≤ đối số, nên floor(-2.3) = -3. Tổng là -5. So sánh: INT(-2.3) = -2, vì INT bỏ phần thập phân về phía 0.","solution":"","solutionCode":"","courseSource":""},{"id":"set2-q29","set":"set2","number":29,"domain":"D2","topic":"Macro variable and the dot delimiter","format":"Predict Output","difficulty":"","type":"mc","stem":"What title is displayed?","code":"%let yr=2024;\ntitle \"Orders &yr.Q1\";","options":["`Orders &yr.Q1`","`Orders 2024.Q1`","`Orders 2024Q1`","`Orders 2024 Q1`"],"answer":2,"accepted":[],"numeric":false,"explanation":"Dấu chấm kết thúc tên macro variable và **bị xóa khi thay thế**, nên `&yr.Q1` thành \"2024Q1\". Muốn có dấu chấm trong kết quả thì viết hai dấu chấm (`&yr..Q1` thành \"2024.Q1\"). Thiếu dấu chấm thì SAS tìm macro variable tên `yrQ1`. A chỉ xảy ra khi chuỗi dùng nháy đơn.","solution":"","solutionCode":"","courseSource":""},{"id":"set2-q30","set":"set2","number":30,"domain":"D2","topic":"INTCK with quarters","format":"Predict Output","difficulty":"","type":"sa","stem":"What does `intck('qtr', '15JAN2024'd, '15JUL2024'd)` return?","code":"","options":[],"answer":"2","accepted":["2"],"numeric":true,"explanation":"Phương pháp mặc định (discrete) đếm số ranh giới đầu quý mà khoảng thời gian đi qua: 01APR2024 và 01JUL2024, tức 2. Với `'c'` (continuous) kết quả cũng là 2, vì từ 15/1 tới 15/7 là đúng 2 quý đầy đủ.","solution":"","solutionCode":"","courseSource":""},{"id":"set2-q31","set":"set2","number":31,"domain":"D2","topic":"Name-prefix variable lists","format":"Complete the Code","difficulty":"","type":"mc","stem":"The table has columns Score1, Score2, Score10 and ScoreAvg, and **all** of them must be included. Which expression averages them?","code":"","options":["`mean(Score1-Score10)`","`mean(of Score1-Score10)`","`mean(of Score:)`","`mean(Score:)`"],"answer":2,"accepted":[],"numeric":false,"explanation":"`Score:` chọn **mọi cột có tên bắt đầu bằng** \"Score\", và trong hàm phải có OF. B sai: `Score1-Score10` là danh sách theo số thứ tự liên tiếp, đòi hỏi đủ Score1 đến Score10 (sẽ lỗi khi thiếu Score3…) và không chọn được ScoreAvg. A và D thiếu OF; A còn bị hiểu là phép trừ.","solution":"","solutionCode":"","courseSource":""},{"id":"set2-q32","set":"set2","number":32,"domain":"D2","topic":"INPUT with the COMMA informat","format":"Predict Output","difficulty":"","type":"sa","stem":"What does `input(\"1,250.75\", comma8.)` return?","code":"","options":[],"answer":"1250.75","accepted":["1250.75"],"numeric":true,"explanation":"Informat COMMAw. bỏ dấu phẩy (và các ký tự như $) rồi đọc số. Độ rộng 8 vừa đủ cho 8 ký tự của chuỗi. Giá trị đã có dấu chấm thập phân nên không cần chỉ định phần thập phân trong informat.","solution":"","solutionCode":"","courseSource":""},{"id":"set2-q33","set":"set2","number":33,"domain":"D2","topic":"PUT with a date format","format":"Predict Output","difficulty":"","type":"sa","stem":"For OrderID 107, what does `put(OrderDate, monyy7.)` return?","code":"","options":[],"answer":"APR2024","accepted":["APR2024"],"numeric":false,"explanation":"OrderDate là 01APR2024. MONYY7. viết 3 chữ cái tên tháng và 4 chữ số năm, được \"APR2024\". PUT luôn trả về chuỗi ký tự, nên đây là cách tạo cột tháng dạng chuỗi để nhóm hoặc nối chuỗi.","solution":"","solutionCode":"","courseSource":""},{"id":"set2-q34","set":"set2","number":34,"domain":"D2","topic":"Automatic character-to-numeric conversion","format":"Predict Output","difficulty":"","type":"sa","stem":"What is X, and what appears in the log?","code":"data conv;\n    Code=\"0042\";\n    X=Code+1;\nrun;","options":[],"answer":"43, with the NOTE \"Character values have been converted to numeric values…\"","accepted":["43"],"numeric":true,"explanation":"Dùng cột ký tự trong phép toán thì SAS **tự chuyển** sang số (bằng informat w.) và ghi NOTE vào log. \"0042\" là số hợp lệ nên X = 43. Muốn không có NOTE thì chuyển tường minh: `input(Code, 4.) + 1`.","solution":"","solutionCode":"","courseSource":""},{"id":"set2-q35","set":"set2","number":35,"domain":"D2","topic":"DO UNTIL","format":"Predict Output","difficulty":"","type":"sa","stem":"What is the final value of x?","code":"data grow;\n    x=1;\n    do until (x > 20);\n        x=x*3;\n    end;\nrun;","options":[],"answer":"27","accepted":["27"],"numeric":true,"explanation":"DO UNTIL kiểm tra điều kiện ở **cuối** vòng lặp. Lần lượt: x = 3 (chưa > 20), x = 9 (chưa), x = 27 (đã > 20, dừng). Không có OUTPUT nên bảng chỉ có 1 dòng với x = 27.","solution":"","solutionCode":"","courseSource":""},{"id":"set2-q36","set":"set2","number":36,"domain":"D2","topic":"PROC TRANSPOSE with ID","format":"Predict Output","difficulty":"","type":"sa","stem":"How many columns are in `ctry_wide`?","code":"data ctry_tot;\n    input Country $ Total;\n    datalines;\nDE 80\nKR 186\nNG 40\nUS 192\n;\nrun;\n\nproc transpose data=ctry_tot out=ctry_wide;\n    id Country;\n    var Total;\nrun;","options":[],"answer":"5","accepted":["5"],"numeric":true,"explanation":"Mỗi giá trị của cột ID trở thành một cột: DE, KR, NG, US. Thêm cột `_NAME_` (giá trị \"Total\"), tổng cộng 5 cột trong 1 dòng. Có thể bỏ `_NAME_` bằng `out=ctry_wide(drop=_name_)`. Giá trị ID phải là duy nhất, nếu không bước sẽ lỗi.","solution":"","solutionCode":"","courseSource":""},{"id":"set2-q37","set":"set2","number":37,"domain":"D2","topic":"Nested DO loops","format":"Predict Output","difficulty":"","type":"sa","stem":"How many rows are in `pairs`?","code":"data pairs;\n    do i=1 to 3;\n        do j=1 to i;\n            output;\n        end;\n    end;\nrun;","options":[],"answer":"6","accepted":["6"],"numeric":true,"explanation":"Vòng lặp trong chạy i lần cho mỗi giá trị i: 1 + 2 + 3 = 6 lần OUTPUT. Các cặp (i, j) là (1,1), (2,1), (2,2), (3,1), (3,2), (3,3).","solution":"","solutionCode":"","courseSource":""},{"id":"set2-q38","set":"set2","number":38,"domain":"D3","topic":"A statement in the wrong step","format":"Log Reading","difficulty":"","type":"mc","stem":"The log shows: `ERROR 180-322: Statement is not valid or it is used out of proper order.` Which code most likely caused it?","code":"","options":["```sas\nproc print data=orders;\n    where Qty > 2;\nrun;\n```","```sas\ndata big;\n    set orders;\n    if Qty > 2;\nrun;\n```","```sas\nproc print data=orders;\n    if Qty > 2;\nrun;\n```","```sas\nproc print data=orders noobs;\nrun;\n```"],"answer":2,"accepted":[],"numeric":false,"explanation":"IF là câu lệnh của DATA step, không dùng được trong PROC PRINT, nên sinh ERROR 180-322. Trong PROC dùng WHERE để lọc dòng, như A. B và D hợp lệ.","solution":"","solutionCode":"","courseSource":""},{"id":"set2-q39","set":"set2","number":39,"domain":"D3","topic":"Missing values NOTE","format":"Log Reading","difficulty":"","type":"sa","stem":"Running `Amount=Qty*Price;` on `orders` produces:\n\n```text\nNOTE: Missing values were generated as a result of performing an operation on missing values.\n      Each place is given by: (Number of times) at (Line):(Column).\n      __ at 5:12\n```\n\nWhat number replaces `__`?","code":"","options":[],"answer":"1","accepted":["1"],"numeric":true,"explanation":"Chỉ đơn 104 có Qty missing, nên phép nhân tạo ra missing đúng 1 lần. NOTE này không phải lỗi nhưng báo rằng có dữ liệu thiếu. Dùng `if Qty ne . then Amount=Qty*Price;` thì NOTE không còn xuất hiện.","solution":"","solutionCode":"","courseSource":""},{"id":"set2-q40","set":"set2","number":40,"domain":"D3","topic":"Invalid numeric data","format":"Log Reading","difficulty":"","type":"mc","stem":"The log shows:\n\n```text\nNOTE: Invalid numeric data, Code='N/A' , at line 12 column 7.\nCode=N/A X=. _ERROR_=1 _N_=3\n```\n\nWhich statement is true?","code":"","options":["The step stopped at row 3.","Row 3 was deleted from the output.","_ERROR_ is written to the output table.","SAS automatically tried to convert the character value N/A to a number, failed, set X to missing and _ERROR_ to 1, then continued with the next row."],"answer":3,"accepted":[],"numeric":false,"explanation":"Đây là lỗi dữ liệu khi SAS tự chuyển ký tự sang số. SAS ghi NOTE, in giá trị PDV của dòng lỗi (gồm cả `_N_=3`) và tiếp tục chạy. A sai vì step không dừng. C sai vì `_ERROR_` không bao giờ được ghi vào bảng. B sai vì dòng 3 vẫn được ghi, chỉ có X là missing.","solution":"","solutionCode":"","courseSource":""},{"id":"set2-q41","set":"set2","number":41,"domain":"D3","topic":"Missing semicolon before ELSE","format":"Find & Fix","difficulty":"","type":"mc","stem":"What is wrong?","code":"data region;\n    set orders;\n    if Country=\"US\" then Region=\"Americas\"\n    else Region=\"Other\";\nrun;","options":["ELSE cannot follow an IF-THEN statement.","A semicolon is missing after `Region=\"Americas\"`, so the ELSE keyword becomes part of the THEN assignment and causes a syntax error.","Region needs a LENGTH statement or the step fails.","Nothing is wrong."],"answer":1,"accepted":[],"numeric":false,"explanation":"Mỗi câu lệnh phải kết thúc bằng `;`. Thiếu dấu `;` thì SAS đọc tiếp `else` như một phần của biểu thức gán và báo ERROR cú pháp. Sau khi sửa vẫn còn một vấn đề nhỏ: \"Other\" (5 ký tự) không bị cắt vì độ dài lấy theo \"Americas\" (8), nhưng nên khai báo LENGTH cho rõ ràng.","solution":"","solutionCode":"","courseSource":""},{"id":"set2-q42","set":"set2","number":42,"domain":"D3","topic":"Character column in the VAR statement","format":"Log Reading","difficulty":"","type":"mc","stem":"What happens?","code":"proc means data=orders;\n    var Customer;\nrun;","options":["An ERROR says that the variable Customer does not match the type prescribed for this list (VAR requires numeric columns), and no statistics are produced.","PROC MEANS counts the customers.","A WARNING appears, and the mean of the character values is computed.","The step runs and shows N only."],"answer":0,"accepted":[],"numeric":false,"explanation":"VAR của PROC MEANS chỉ nhận cột **số**. Dùng cột ký tự sẽ gây ERROR \"Variable Customer in list does not match type prescribed for this list.\" Muốn đếm theo giá trị ký tự thì dùng PROC FREQ, hoặc đưa Customer vào CLASS.","solution":"","solutionCode":"","courseSource":""},{"id":"set2-q43","set":"set2","number":43,"domain":"D3","topic":"PUTLOG output","format":"Predict Output","difficulty":"","type":"mc","stem":"Inside a DATA step, which statement writes **only** the row number and Amount to the log, for example `_N_=2 Amount=120`?","code":"","options":["`putlog _all_;`","`putlog _N_ Amount;`","`putlog _N_= Amount=;`","`putlog \"_N_= Amount=\";`"],"answer":2,"accepted":[],"numeric":false,"explanation":"Cú pháp `column=` in cả tên và giá trị. A in toàn bộ PDV (mọi cột cùng `_ERROR_` và `_N_`). B chỉ in giá trị, không có tên. D in nguyên văn chuỗi trong dấu nháy.","solution":"","solutionCode":"","courseSource":""},{"id":"set2-q44","set":"set2","number":44,"domain":"D3","topic":"Automatic variables in the output","format":"Concept","difficulty":"","type":"mc","stem":"How many columns does `check` have?","code":"data check;\n    set orders;\n    Row=_N_;\n    Err=_ERROR_;\nrun;","options":["6","9","10","8"],"answer":3,"accepted":[],"numeric":false,"explanation":"Bảng có 6 cột gốc cộng Row và Err, tổng 8. `_N_` và `_ERROR_` là biến tự động: có trong PDV khi thực thi nhưng **không được ghi** vào bảng. Muốn giữ giá trị của chúng thì phải gán sang cột thường, như ở đây.","solution":"","solutionCode":"","courseSource":""},{"id":"set2-q45","set":"set2","number":45,"domain":"D3","topic":"Conditional PUTLOG with LAST.","format":"Predict Output","difficulty":"","type":"sa","stem":"`o_sort` is the table from Q21. How many NOTE lines are written?","code":"data _null_;\n    set o_sort;\n    by Customer;\n    if last.Customer then putlog \"NOTE: Done with \" Customer=;\nrun;","options":[],"answer":"4","accepted":["4"],"numeric":true,"explanation":"`last.Customer = 1` một lần cho mỗi khách hàng, và có 4 khách hàng nên có 4 dòng NOTE. `DATA _NULL_` chạy DATA step mà không tạo bảng, rất tiện để kiểm tra dữ liệu bằng PUTLOG. Tiền tố \"NOTE:\" khiến log tô màu dòng đó như một ghi chú.","solution":"","solutionCode":"","courseSource":""},{"id":"set2-q46","set":"set2","number":46,"domain":"D3","topic":"Missing period after a format name","format":"Find & Fix","difficulty":"","type":"mc","stem":"What happens to OrderDate in `o3`?","code":"data o3;\n    set orders;\n    format OrderDate date9;\nrun;","options":["It is displayed as 05JAN2024, the same as before.","It is displayed as raw numbers (for example 23380). A new, empty column named date9 is created, and the log has a NOTE that date9 is uninitialized.","An ERROR occurs and `o3` is not created.","OrderDate becomes a character column."],"answer":1,"accepted":[],"numeric":false,"explanation":"Thiếu dấu chấm nên `date9` bị hiểu là **tên cột**. Câu FORMAT liệt kê hai cột (OrderDate và date9) mà không kèm format nào, nên **gỡ bỏ** format sẵn có của OrderDate, và cột hiển thị số thô. Không có ERROR, chỉ có NOTE \"uninitialized\". Đây là lỗi logic điển hình.","solution":"","solutionCode":"","courseSource":""},{"id":"set2-q47","set":"set2","number":47,"domain":"D3","topic":"WARNING in a DROP list","format":"Log Reading","difficulty":"","type":"mc","stem":"The log shows:\n\n```text\nWARNING: The variable Pricee in the DROP, KEEP, or RENAME list has never been referenced.\n```\n\nWhat does it mean?","code":"","options":["Pricee was dropped successfully.","The step was not executed.","The name in the DROP/KEEP/RENAME list is misspelled (it should be Price), so the intended column was not dropped. The step still runs.","Price was converted to character."],"answer":2,"accepted":[],"numeric":false,"explanation":"Đây là WARNING chứ không phải ERROR: step vẫn chạy và tạo bảng, nhưng Price **vẫn còn** trong bảng vì tên trong danh sách bị gõ sai. Luôn đọc WARNING, vì kết quả có thể sai mà không có lỗi nào được báo.","solution":"","solutionCode":"","courseSource":""},{"id":"set2-q48","set":"set2","number":48,"domain":"D3","topic":"Debugging","format":"Find & Fix","difficulty":"","type":"sa","stem":"Fix every error, then run the program.\n\n\n\nWhat total Amount is shown?","code":"data us_orders;\n    set orders\n    where Country=\"US\";\n    Amount=Qty*Price\nrun;\n\nproc print data=us_orders;\n    sum Amount;\nrun;","options":[],"answer":"192","accepted":["192"],"numeric":true,"explanation":"Có 2 lỗi: thiếu `;` sau SET, khiến WHERE thành một phần của câu SET, và thiếu `;` sau câu gán, khiến `run` bị nối vào biểu thức. Các đơn của US có Amount 31 + 62 + 99 = 192.","solution":"","solutionCode":"data us_orders;\n    set orders;\n    where Country=\"US\";\n    Amount=Qty*Price;\nrun;\n\nproc print data=us_orders;\n    sum Amount;\nrun;","courseSource":""},{"id":"set2-q49","set":"set2","number":49,"domain":"D4","topic":"PROC PRINT with SUM","format":"Predict Output","difficulty":"","type":"sa","stem":"`amt` is the table from Q15. What total is shown for Amount?","code":"proc print data=amt noobs;\n    var OrderID Amount;\n    sum Amount;\nrun;","options":[],"answer":"498","accepted":["498"],"numeric":true,"explanation":"SUM trong PROC PRINT cộng các giá trị không missing, được 498. NOOBS ẩn cột Obs. Giá trị missing của đơn 104 hiển thị là dấu chấm và không ảnh hưởng tới tổng.","solution":"","solutionCode":"","courseSource":""},{"id":"set2-q50","set":"set2","number":50,"domain":"D4","topic":"PROC PRINT with BY and SUM","format":"Predict Output","difficulty":"","type":"sa","stem":"What Qty subtotal is shown for **DE**?","code":"proc sort data=orders out=by_ctry;\n    by Country;\nrun;\n\nproc print data=by_ctry;\n    by Country;\n    sum Qty;\nrun;","options":[],"answer":"2","accepted":["2"],"numeric":true,"explanation":"DE có 2 đơn: Qty là . (đơn 104) và 2 (đơn 107). SUM bỏ qua missing nên tổng phụ bằng 2. BY tạo một nhóm và một tổng phụ cho mỗi giá trị Country; dữ liệu phải được sort trước.","solution":"","solutionCode":"","courseSource":""},{"id":"set2-q51","set":"set2","number":51,"domain":"D4","topic":"One-way PROC FREQ and missing values","format":"Predict Output","difficulty":"","type":"sa","stem":"How many value rows does the frequency table list, not counting the \"Frequency Missing\" line?","code":"proc fre
